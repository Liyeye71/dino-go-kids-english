  <script>
/* ============================================================
   DinoGo · 恐龙英语 — 通用路线图抽屉（RouteSheet）
   适用于所有带路线图海报的场景主题（如动物乐园 · 神奇动物园）
   - 支持 100% / 150% / 200% / 250% 缩放，打开时自动定位当前关
   - 节点按坐标落在底图上；每 STAGE_SIZE 关为 BOSS 关；满星关卡只读
   ============================================================ */

const ROUTE_ZOOM_STEPS = [1, 1.5, 2, 2.5];
let routeZoom = 1;

function routeBoardEls() {
  const viewport = document.querySelector(".zoo-board-viewport");
  const inner = viewport && viewport.querySelector(".zoo-board-inner");
  const label = document.querySelector(".zoo-zoom-val");
  return { viewport, inner, label };
}

/* 以当前关为锚点缩放，放大后始终把当前关留在视口中央 */
function routeApplyZoom() {
  const { viewport, inner, label } = routeBoardEls();
  if (!viewport || !inner) return;
  inner.style.width = (routeZoom * 100) + "%";
  if (label) label.textContent = Math.round(routeZoom * 100) + "%";
  requestAnimationFrame(routeFocusCurrent);
}

/* 把当前关节点滚到视口中央 */
function routeFocusCurrent() {
  const { viewport } = routeBoardEls();
  const node = viewport && viewport.querySelector(".zoo-step.current");
  if (!viewport || !node) return;
  const vr = viewport.getBoundingClientRect();
  const nr = node.getBoundingClientRect();
  viewport.scrollLeft += nr.left - vr.left - (vr.width - nr.width) / 2;
  viewport.scrollTop += nr.top - vr.top - (vr.height - nr.height) / 2;
}

window.RouteSheetView = {
  focusCurrent: routeFocusCurrent,
  zoomIn() {
    const i = ROUTE_ZOOM_STEPS.indexOf(routeZoom);
    routeZoom = ROUTE_ZOOM_STEPS[Math.min(ROUTE_ZOOM_STEPS.length - 1, (i < 0 ? 0 : i) + 1)];
    routeApplyZoom();
  },
  zoomOut() {
    const i = ROUTE_ZOOM_STEPS.indexOf(routeZoom);
    routeZoom = ROUTE_ZOOM_STEPS[Math.max(0, (i < 0 ? 0 : i) - 1)];
    routeApplyZoom();
  },
  resetZoom() {
    routeZoom = 1;
    routeApplyZoom();
    routeFocusCurrent();
  },
};
/* 兼容旧别名 */
window.ZooRouteView = window.RouteSheetView;

function renderRouteSheet(theme, scene, prog) {
  routeZoom = 1;
  const themeId = (theme && theme.id) || state.theme;
  const total = scene.levelCount || (scene.levels || []).length;
  const level = Math.min(total, Math.max(1, prog.level || 1));
  const stars = themeStars(prog);
  const starMax = themeStarMax(themeId, total);
  const emoji = scene.emoji || (theme && theme.emoji) || "🗺️";
  const ratio = scene.mapRatio || "1505/1045";
  const sheetCls = scene.sheetClass || "zoo-route-sheet";
  const mapCls = scene.mapClass || scene.id || "zoo";

  const nodes = (scene.levels || []).map((s) => {
    const locked = s.level > level;
    const done = s.level < level || Boolean(prog.cleared && prog.cleared[s.level]);
    const best = (prog.stars && prog.stars[s.level]) || 0;
    const isCurrent = s.level === level && !done;
    /* 满星关卡只读：不再允许点击重玩 */
    const full = done && best >= 3;
    const cls = [
      "animal-route-node", "zoo-step",
      isAssessmentLevel(s.level) ? "boss" : "",
      done ? "done" : "",
      full ? "stars-3" : "",
      isCurrent ? "current" : "",
      locked ? "locked" : "",
    ].filter(Boolean).join(" ");
    const stateText = done
      ? (full ? "，已通关，已满星" : `，已通关，${best} 星，可复习`)
      : (isCurrent ? "，当前关卡" : "，未解锁");
    return `<button type="button" class="${cls}" style="left:${s.x}%;top:${s.y}%"
        data-action="route-node" data-theme="${esc(themeId)}" data-scene="${esc(scene.id)}" data-level="${s.level}"
        title="第 ${s.level} 关${done ? ` · ★${best}${full ? " · 已满星" : ""}` : ""}"
        aria-label="第 ${s.level} 关${stateText}"
        ${(locked || full) ? "disabled" : ""}></button>`;
  }).join("");
  /* 完成结算即视为通关，最后一关也不再要求满星 */
  const allDone = Boolean(prog.cleared && prog.cleared[level]);

  return `<div class="overlay">
    <section class="sheet animal-route-sheet ${sheetCls}" role="dialog" aria-modal="true" aria-label="${esc(scene.name)}闯关路线">
      <div class="grab"></div>
      <div class="zoo-route-head">
        <div class="zoo-route-title">
          <strong>${emoji} ${esc(scene.name)}</strong>
          <small>${allDone ? "全部通关" : `第 ${level} 关`} · ★ ${stars} / ${starMax}</small>
        </div>
        <button type="button" class="zoo-route-close" data-action="close-overlay" aria-label="关闭路线图">×</button>
      </div>
      <div class="zoo-board-frame">
        <div class="zoo-board-viewport">
          <div class="zoo-board-inner">
            <div class="animal-route-map has-map ${mapCls}" style="--arm-ratio:${ratio}">
              <img class="arm-bg" src="${scene.mapImage}" alt="${esc(scene.name)}闯关路线图">
              ${nodes}
            </div>
          </div>
        </div>
        <div class="zoo-zoom-bar" role="group" aria-label="路线图缩放">
          <button type="button" data-action="route-zoom-out" aria-label="缩小路线图">−</button>
          <button type="button" class="zoo-zoom-val" data-action="route-zoom-reset" title="恢复 100%">100%</button>
          <button type="button" data-action="route-zoom-in" aria-label="放大路线图">＋</button>
        </div>
      </div>
    </section>
  </div>`;
}

/* 打开任意带路线图的主题场景抽屉，并自动定位到当前关 */
function openThemeScene(themeId, sceneId) {
  const theme = THEME_BY_ID.get(themeId) || currentTheme();
  const scenes = (theme && theme.scenes) || [];
  if (!scenes.length) return false;
  const scene = scenes.find((s) => s.id === sceneId) || scenes[0];
  state.theme = theme.id;
  state.scene = scene.id;
  save();
  openOverlay(renderRouteSheet(theme, scene, sceneProgress(theme.id, scene.id)));
  /* 抽屉插入 DOM 后把当前关滚到视口中央 */
  setTimeout(() => RouteSheetView.focusCurrent(), 60);
  return true;
}

let wordsLetter = "all";

/* ------------------------------------------------ dex */
const DEX_FILTERS = [["all", "全部"], ["baby", "幼年期"], ["teen", "成长期"], ["adult", "成熟期"], ["super", "完全体"], ["ultra", "究极体"]];
const DEX_FILTER_PHASES = { baby: "幼年期", teen: "成长期", adult: "成熟期", super: "完全体", ultra: "究极体" };

function dexRewardInfo() {
  if (state.dex.length >= 6) return { title: "图鉴全收集 · 珊瑚海湾", note: "所有形态都已收录，小诺为你骄傲", cur: 6, max: 6, reward: "全部完成" };
  if (state.dex.length >= 4) return { title: "收集奖励 · 珊瑚海湾", note: `再发现 ${6 - state.dex.length} 种形态，解锁「珊瑚海湾」背景`, cur: state.dex.length, max: 6, reward: "珊瑚海湾" };
  return { title: "收集奖励 · 静谧湖畔", note: `再发现 ${4 - state.dex.length} 种形态，解锁「静谧湖畔」背景`, cur: state.dex.length, max: 4, reward: "静谧湖畔" };
}

/* 图鉴正文：收藏 Tab 内嵌使用（不含 .scroll 与底部 Tab） */
function dexBody() {
  /* 究极体筛选下，超级霸王龙统一在下方「究极体图鉴」里展示，避免重复 */
  const list = STAGES.filter((d) => (dexFilter === "all" || d.phase === DEX_FILTER_PHASES[dexFilter])
    && !(dexFilter === "ultra" && d.key === "ultra"));
  const reward = dexRewardInfo();
  const pct = Math.round((state.dex.length / STAGES.length) * 100);
  const ultraOpen = ultraExchangeOpen();
  const ultraOwned = ultraBaseOwned();
  return `<div class="dex-sum card">
      <div class="ds-main">
        <div class="ds-row"><b>图鉴收集度</b><span class="num">${pct}%</span></div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="ds-foot">${spark(10, "#F0B53B")} 已收录 ${state.dex.length} / ${STAGES.length} 种形态 · 继续成长解锁传说</div>
      </div>
      <div class="ds-badge">${I.book(26)}</div>
    </div>

    <div class="dex-filters">${DEX_FILTERS.map(([id, label]) => `<button class="f ${dexFilter === id ? "on" : ""}" data-action="filter-dex" data-filter="${id}">${label}</button>`).join("")}</div>

    ${list.length ? `<div class="dex-grid">
      ${list.map((d) => {
        const isUltra = d.key === "ultra";
        const found = isUltra ? ultraOwned : state.dex.includes(d.key);
        const isNow = d.key === state.stage && (!isUltra || state.ultraSkin <= 4);
        const bgT = (stageIndex(d.key) % 5) + 1;
        const ultraHint = ultraOpen ? `${ULTRA_PRICE}★ 兑换` : `${ULTRA_MIN} 成长值开放`;
        const nm = found || isUltra ? d.name : "未发现";
        const stg = found ? d.phase : isUltra ? ultraHint : "???";
        const inner = `${found ? `<span class="rare r${d.rarity}">★</span>` : isUltra && ultraOpen ? "" : `<span class="lock-ic">${I.lock(13)}</span>`}
          ${!found && isUltra && ultraOpen ? `<span class="buy-tag">${star(10)}${ULTRA_PRICE}</span>` : ""}
          ${isNow ? `<span class="now-tag">当前</span>` : ""}
          <div class="pic t${bgT}">${dino(d.key)}</div>
          <div class="nm">${nm}</div>
          <div class="stg">${stg}</div>`;
        const cls = `dex-card ${found ? "" : "locked"} ${isNow ? "current" : ""}`;
        if (isUltra) {
          const action = found ? "pick-ultra" : "buy-ultra";
          return `<button class="${cls}" data-action="${action}" data-id="1" data-skin="${state.ultraSkin <= 4 ? state.ultraSkin : 1}" aria-label="${found ? d.name : `${d.name} 兑换`}">${inner}</button>`;
        }
        return `<div class="${cls}" aria-label="${found ? d.name : "未发现"}">${inner}</div>`;
      }).join("")}
    </div>` : ""}

    ${dexFilter === "ultra" ? ultraDexSection() : ""}

    <div class="dex-reward">
      <div class="dr-ic"><div class="bg-thumb ${state.dex.length >= 4 ? "sunset" : "jungle"}" style="width:100%;height:100%;border-radius:0"></div></div>
      <div class="dr-main">
        <div class="dr-row"><b>${reward.title}</b><span>${reward.cur} / ${reward.max}</span></div>
        <div class="bar"><i style="width:${Math.round((reward.cur / reward.max) * 100)}%"></i></div>
        <div class="dr-note">${reward.note}</div>
      </div>
      <div class="dr-lock">${reward.cur >= reward.max ? I.check(14, "#B4811C") : I.lock(14, "#B4811C")}</div>
    </div>`;
}

/* 究极体图鉴：超级霸王龙的 4 种形态 + 10 种机甲恐龙，合并成一个板块展示 */
function ultraDexSection() {
  const open = ultraExchangeOpen();
  const baseOwned = ultraBaseOwned();
  const total = ULTRA_SKINS.length + ULTRA_DINOS.length;
  const ownedCount = (baseOwned ? ULTRA_SKINS.length : 0)
    + ULTRA_DINOS.filter((d) => ultraSkinOwned(d.id)).length;
  const head = open
    ? `${ULTRA_PRICE}★/只 · 已兑换 ${ownedCount}/${total}`
    : `成长值达到 ${ULTRA_MIN} 后开放 · 还差 ${Math.max(0, ULTRA_MIN - state.growth)}`;
  const skinCards = ULTRA_SKINS.map((s) => {
    const owned = baseOwned;
    const on = state.ultraSkin === s.id;
    return `<button class="skin-card form-card ${owned ? "" : "locked"} ${on && owned ? "on" : ""}" data-action="${owned ? "pick-ultra" : "buy-ultra"}" data-id="1" data-skin="${s.id}">
      <div class="pic">${dino("ultra", { skin: s.id })}</div>
      <div class="nm">${s.name}</div>
      <div class="sub">${owned ? s.sub : open ? "兑换超级霸王龙后解锁" : "未解锁"}</div>
      ${owned && on ? `<span class="cur">使用中</span>` : ""}
      ${owned ? "" : `<span class="lock-ic">${I.lock(13)}</span>`}
    </button>`;
  }).join("");
  const dinoCards = ULTRA_DINOS.map((d) => {
    const owned = ultraSkinOwned(d.id);
    const on = state.ultraSkin === d.id;
    return `<button class="skin-card form-card ${owned ? "" : "locked"} ${on && owned ? "on" : ""}" data-action="${owned ? "pick-ultra" : "buy-ultra"}" data-id="${d.id}" data-skin="${d.id}">
      <div class="pic">${dino("ultra", { skin: d.id })}</div>
      <div class="nm">${d.name}</div>
      <div class="sub">${owned ? d.sub : open ? `${ULTRA_PRICE}★ 兑换` : "未解锁"}</div>
      ${owned && on ? `<span class="cur">使用中</span>` : ""}
      ${owned ? "" : open ? `<span class="buy-tag">${star(10)}${ULTRA_PRICE}</span>` : `<span class="lock-ic">${I.lock(13)}</span>`}
    </button>`;
  }).join("");
  return `<div class="skin-head"><b>究极体图鉴</b><span>${head}</span></div>
    <div class="skin-grid">${skinCards}${dinoCards}</div>`;
}

/* ------------------------------------------------ words */
/* 词汇本：只展示闯关答对后解锁的单词，未解锁的灰化占位 */
function allWordsAlpha() {
  const byWord = new Map();
  allThemeWords().forEach((w) => {
    const unlocked = isWordUnlocked(w.word, w.themeId, w.sceneId);
    const exist = byWord.get(w.word);
    /* 同一拼写只保留一条，优先展示已解锁的那条 */
    if (!exist || (!exist.unlocked && unlocked)) {
      byWord.set(w.word, { wordObj: w, unlocked });
    }
  });
  const groupMap = new Map();
  let total = 0;
  let learned = 0;
  [...byWord.values()]
    .sort((a, b) => a.wordObj.word.localeCompare(b.wordObj.word, "en"))
    .forEach(({ wordObj: w, unlocked }) => {
      total += 1;
      if (unlocked) learned += 1;
      const L = w.word[0].toUpperCase();
      let g = groupMap.get(L);
      if (!g) groupMap.set(L, (g = { letter: L, words: [] }));
      g.words.push({ w, unlocked });
    });
  return { groups: [...groupMap.values()], letterSet: new Set(groupMap.keys()), total, learned };
}

function screenWords() {
  const { groups, letterSet, total, learned } = allWordsAlpha();
  const shown = wordsLetter === "all" ? groups : groups.filter((g) => g.letter === wordsLetter);
  const index = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("")
    .map((L) => `<button class="wl ${wordsLetter === L ? "on" : ""} ${letterSet.has(L) ? "" : "off"}" data-action="filter-word" data-letter="${L}">${L}</button>`).join("");
  return `<section class="screen has-tab" data-screen="words">
    <div class="scroll">
      <div class="words-head">
        <div class="t"><h1>单词本</h1><p>闯关答对就能解锁新单词</p></div>
        <div class="words-count"><b class="num">${learned}</b><span>/ ${total} 词</span></div>
      </div>

      <div class="wl-bar">
        <button class="wl all ${wordsLetter === "all" ? "on" : ""}" data-action="filter-word" data-letter="all">ALL</button>
        ${index}
      </div>

      ${shown.map((g) => `<div class="word-group">
        <div class="wg-letter">${g.letter}<span>${g.words.length}</span></div>
        <div class="wg-list">
          ${g.words.map(({ w, unlocked }) => {
            if (!unlocked) {
              return `<div class="word-row locked" aria-label="未解锁单词">
                <span class="wr-pic">${I.lock(16, "#B9AE99")}</span>
                <span class="wr-main">
                  <span class="wr-line"><b>???</b><i>待解锁</i></span>
                  <span class="wr-line sub"><em>闯关答对后解锁</em>${categoryZh(w) ? `<span class="wr-tag pos">${categoryZh(w)}</span>` : ""}</span>
                </span>
              </div>`;
            }
            return `<button class="word-row" data-action="speak-word" data-word="${esc(w.word)}" aria-label="${w.word} ${w.zh}">
              <span class="wr-pic">${w.art()}</span>
              <span class="wr-main">
                <span class="wr-line"><b>${w.word}</b><i>${w.zh}</i></span>
                <span class="wr-line sub"><em>${w.phon || ""}</em>${categoryZh(w) ? `<span class="wr-tag pos">${categoryZh(w)}</span>` : ""}</span>
              </span>
            </button>`;
          }).join("")}
        </div>
      </div>`).join("")}

      <div class="words-foot">${I.leaf(12)} 点单词可以听发音，闯关答对后新词会自动解锁</div>
    </div>
    ${tabbar("words")}
  </section>`;
}

</script>
  <script>
/* ============================================================
   DinoGo · 恐龙英语 — 收藏（collect）
   底部 Tab 4：背景 / 图鉴，含背景购买与切换
   ============================================================ */

let collectTab = "bg";
let pendingBuy = null;

/* ------------------------------------------------ collect */
function screenCollect() {
  const dinoCls = state.stage === "ultra" ? "ultra" : "";
  const stars = starBalance();
  const purchasableBgCount = BACKGROUNDS.filter((bg) => bg.price > 0 && stars >= bg.price && !state.bgOwned.includes(bg.id) && state.bg !== bg.id).length;
  const tabs = `<div class="collect-tabs">
    <button class="tab ${collectTab === "bg" ? "on" : ""}" data-action="collect-tab" data-tab="bg">背景${purchasableBgCount ? `<span class="tb">${purchasableBgCount}</span>` : ""}</button>
    <button class="tab ${collectTab === "dex" ? "on" : ""}" data-action="collect-tab" data-tab="dex">图鉴</button>
    <span class="all">全部 ${I.chevron(9)}</span>
  </div>`;
  let panel = "";
  if (collectTab === "bg") {
    panel = `<div class="bg-grid">${BACKGROUNDS.map((bg) => {
      const owned = state.bgOwned.includes(bg.id) || state.bg === bg.id;
      const using = state.bg === bg.id;
      const price = using ? `<span class="price owned">使用中</span>` : owned ? `<span class="price owned">已拥有</span>` : `<span class="price">${star(13)}${bg.price}</span>`;
      return `<button class="bg-item ${using ? "using" : ""}" data-action="${owned ? "equip-bg" : "buy-bg"}" data-id="${bg.id}">
        <div class="bg-thumb ${bg.cls}"></div>
        <div class="bg-info"><b>${bg.name}</b><span>${bg.sub}</span>${price}</div>
        ${using ? `<span class="check-ico">${I.check(12)}</span>` : `<span class="action" style="width:1.625rem;height:1.625rem;border-radius:0.5625rem;background:${owned ? "#2E8B57" : "#F4EFE3"};color:${owned ? "#fff" : "#B4811C"};display:grid;place-items:center">${owned ? I.arrow(12) : I.lock(12)}</span>`}
      </button>`;
    }).join("")}</div>`;
  } else {
    panel = `<div class="collect-dex">${dexBody()}</div>`;
  }
  const head = collectTab === "dex"
    ? `<div class="t"><h1>恐龙图鉴</h1><p>每一次进化，都会被记录在这里</p></div><div class="dex-count"><b class="num">${state.dex.length}</b><span>/ ${STAGES.length}</span></div>`
    : `<div class="t"><h1>我的收藏</h1><p>用星星给恐龙乐园换个背景</p></div>${starPill()}`;
  return `<section class="screen has-tab" data-screen="collect">
    <div class="scroll">
      <div class="collect-head">
        ${head}
      </div>
      ${collectTab === "dex" ? "" : `<div class="collect-preview ${bgClass(state.bg)}">
        ${skyFx()}
        <div class="wearing">${I.check(9, "#2E8B57")} 今日造型</div>
        <div class="dino ${dinoCls}">${dino(state.stage)}</div>
        <div class="pet">${I.crownMini(12, "#C98B25")} 小诺 · LV.${stageIndex(state.stage) + 1}</div>
      </div>`}
      ${tabs}
      ${panel}
    </div>
    ${tabbar("collect")}
  </section>`;
}


function openBuyBg(id) {
  const bg = bgMeta(id);
  if (!bg || bg.price === 0) return;
  if (starBalance() < bg.price) { toast("星星不够啦，再去闯一关吧"); return; }
  pendingBuy = id;
  openOverlay(`<div class="overlay dialog-wrap">
    <div class="dialog">
      <div class="bg-thumb ${bg.cls}" style="width:100%;height:6rem;border-radius:1rem"></div>
      <h3>解锁「${bg.name}」？</h3>
      <p>将花费 ${bg.price} 星星，解锁后会立即应用到恐龙乐园和收藏页。</p>
      <div class="d-actions">
        <button class="btn ghost" data-action="close-overlay">再想想</button>
        <button class="btn" data-action="confirm-buy">花 ${bg.price} 星星解锁</button>
      </div>
    </div>
  </div>`);
}
function confirmBuy() {
  if (!pendingBuy) return;
  const bg = bgMeta(pendingBuy);
  if (state.bgOwned.includes(bg.id)) { state.bg = bg.id; pendingBuy = null; closeOverlay(); render(); return; }
  if (starBalance() < bg.price) { toast("星星不够啦"); return; }
  state.stars = starBalance() - bg.price;
  state.bgOwned.push(bg.id);
  state.bg = bg.id;
  sfx("coin");
  toast(`已解锁「${bg.name}」背景`);
  pendingBuy = null;
  closeOverlay();
  save();
  render();
}
function equipBg(id) {
  if (!state.bgOwned.includes(id)) return;
  state.bg = id;
  sfx("tap");
  save();
  render();
  toast(`场景已切换为「${bgMeta(id).name}」`);
}

/* ------------------------------------------------ ultra exchange */
let pendingUltraId = 0;

function openBuyUltra(id) {
  const n = Number(id);
  const meta = ultraFormMeta(n);
  if (ultraSkinOwned(n)) { equipUltra(n); return; }
  if (!ultraExchangeOpen()) { toast(`成长值达到 ${ULTRA_MIN} 后开放究极体兑换`); return; }
  if (starBalance() < ULTRA_PRICE) { toast("星星不够啦，再去闯一关吧"); return; }
  pendingUltraId = n;
  openOverlay(`<div class="overlay dialog-wrap">
    <div class="dialog">
      <div class="dlg-dino">${dino("ultra", { skin: n })}</div>
      <h3>兑换「${meta.name}」？</h3>
      <p>将花费 ${ULTRA_PRICE} 星星，兑换后立即成为小诺的新形象，并收录进究极体图鉴。</p>
      <div class="d-actions">
        <button class="btn ghost" data-action="close-overlay">再想想</button>
        <button class="btn" data-action="confirm-ultra">花 ${ULTRA_PRICE} 星星兑换</button>
      </div>
    </div>
  </div>`);
}

function confirmBuyUltra() {
  const n = pendingUltraId;
  if (!n) return;
  const meta = ultraFormMeta(n);
  if (ultraSkinOwned(n)) { pendingUltraId = 0; closeOverlay(); equipUltra(n); return; }
  if (!ultraExchangeOpen()) { toast(`成长值达到 ${ULTRA_MIN} 后开放究极体兑换`); return; }
  if (starBalance() < ULTRA_PRICE) { toast("星星不够啦"); return; }
  state.stars = starBalance() - ULTRA_PRICE;
  state.ultraOwned = [...new Set([...(state.ultraOwned || []), n])];
  let gift = "";
  /* 兑换超级霸王龙同样计入图鉴收录，补齐珊瑚海湾奖励 */
  if (n === 1 && !state.dex.includes("ultra")) state.dex = [...state.dex, "ultra"];
  if (state.dex.length >= 6 && !state.bgOwned.includes("night")) {
    state.bgOwned.push("night");
    gift = "，解锁「珊瑚海湾」背景";
  }
  state.stage = "ultra";
  state.ultraSkin = n;
  setUltraSkin(n);
  sfx("coin");
  toast(`已兑换「${meta.name}」${gift}`);
  pendingUltraId = 0;
  closeOverlay();
  save();
  render();
}

function equipUltra(id) {
  const n = Number(id);
  if (!ultraSkinOwned(n)) return;
  state.stage = "ultra";
  state.ultraSkin = n;
  setUltraSkin(n);
  sfx("tap");
  toast(`已切换为「${ultraFormMeta(n).name}」`);
  save();
  render();
}

</script>
  <script>boot();</script>
</body>
