  <script>
/* ============================================================
   DinoGo · 恐龙英语 — 答题页视图层交互
   由 main.js 拆出：单词连线画线、拖拽手势、渲染后绑定
   ============================================================ */

/* 六题型的视图层交互，不参与题目生成与判分 */
window.QuizView = {
  abort: null,
  observer: null,
  drag: null,

  afterRender() {
    this.cleanup();
    const root = document.querySelector(".quiz-ref-page");
    if (!root || !quiz) return;
    const q = quiz.order[quiz.index];
    this.abort = new AbortController();
    if (q.type === "match") this.setupMatch(root);
    if (q.type === "word_puzzle" || q.type === "feed_animal") this.setupDragging(root);
  },

  cleanup() {
    if (this.abort) this.abort.abort();
    if (this.observer) this.observer.disconnect();
    this.abort = null;
    this.observer = null;
    this.clearDragVisual();
    this.drag = null;
  },

  clearDragVisual() {
    document.querySelectorAll(".ref-drag-ghost").forEach((el) => el.remove());
    document.querySelectorAll(".drop-ready").forEach((el) => el.classList.remove("drop-ready"));
  },

  point(board, el, boardRect) {
    const b = boardRect || board.getBoundingClientRect();
    const r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2 - b.left, y: r.top + r.height / 2 - b.top };
  },

  curve(a, b) {
    const direction = b.x >= a.x ? 1 : -1;
    const bend = Math.max(2.5 * 16, Math.abs(b.x - a.x) * 0.45);
    return `M ${a.x} ${a.y} C ${a.x + bend * direction} ${a.y}, ${b.x - bend * direction} ${b.y}, ${b.x} ${b.y}`;
  },

  /* 重绘已配对的连线 */
  drawMatch() {
    const area = document.querySelector("[data-match-area]");
    if (!area || !quiz) return;
    const svg = area.querySelector(".ref-match-svg");
    const rect = area.getBoundingClientRect();
    if (!svg || !rect.width || !rect.height) return;
    svg.setAttribute("viewBox", `0 0 ${rect.width} ${rect.height}`);
    svg.innerHTML = "";
    const dots = [...area.querySelectorAll("[data-match-dot]")];
    const findDot = (side, word) => dots.find((d) => d.dataset.matchSide === side && d.dataset.word === word);
    (quiz.matched || []).forEach((word) => {
      const left = findDot("art", word);
      const right = findDot("word", word);
      if (!left || !right) return;
      svg.appendChild(this.makeCurvedPath(this.point(area, left, rect), this.point(area, right, rect)));
    });
  },

  makeCurvedPath(p1, p2, cls = "ref-match-path") {
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    const midX = (p1.x + p2.x) / 2;
    const d = `M ${p1.x} ${p1.y} C ${midX} ${p1.y}, ${midX} ${p2.y}, ${p2.x} ${p2.y}`;
    path.setAttribute("d", d);
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", "#8A76A8");
    path.setAttribute("stroke-width", "0.375rem");
    path.setAttribute("stroke-dasharray", "0.625rem 0.5rem");
    path.setAttribute("stroke-linecap", "round");
    path.setAttribute("class", cls);
    return path;
  },

  setupMatch(root) {
    const area = root.querySelector("[data-match-area]");
    if (!area) return;
    this.drawMatch();
    if (window.ResizeObserver) {
      this.observer = new ResizeObserver(() => this.drawMatch());
      this.observer.observe(area);
    }
    const options = { signal: this.abort.signal };
    area.querySelectorAll("[data-match-dot]").forEach((dot) => {
      dot.addEventListener("pointerdown", (e) => this.startMatchDrag(e, dot), options);
    });
  },

  /* 圆点按下：支持点击配对 + 拖拽连线两种模式 */
  startMatchDrag(e, dot) {
    if (!quiz || quiz.revealed || e.button !== 0) return;
    const word = dot.dataset.word;
    const side = dot.dataset.matchSide;
    const area = dot.closest("[data-match-area]");
    if (!area || quiz.matched.includes(word)) return;
    e.preventDefault();
    e.stopPropagation();

    const svg = area.querySelector(".ref-match-svg");
    const start = this.point(area, dot);
    const path = this.makeCurvedPath(start, start, "ref-match-path temp");
    svg.appendChild(path);

    const drag = { pointerId: e.pointerId, dot, area, path, startedAt: Date.now(), moved: false, start };
    this.drag = drag;
    try { dot.setPointerCapture(e.pointerId); } catch {}

    const move = (ev) => {
      if (ev.pointerId !== drag.pointerId) return;
      const dx = ev.clientX - e.clientX;
      const dy = ev.clientY - e.clientY;
      if (!drag.moved && Math.hypot(dx, dy) > 6) drag.moved = true;
      if (!drag.moved) return;
      ev.preventDefault();
      const rect = area.getBoundingClientRect();
      const end = { x: ev.clientX - rect.left, y: ev.clientY - rect.top };
      const midX = (start.x + end.x) / 2;
      path.setAttribute("d", `M ${start.x} ${start.y} C ${midX} ${start.y}, ${midX} ${end.y}, ${end.x} ${end.y}`);
    };
    const finish = (ev, cancelled) => {
      if (ev.pointerId !== drag.pointerId) return;
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", up);
      document.removeEventListener("pointercancel", cancel);
      if (!cancelled) {
        try { if (dot.hasPointerCapture(ev.pointerId)) dot.releasePointerCapture(ev.pointerId); } catch {}
      }
      path.remove();
      this.drag = null;

      if (cancelled) return;

      if (drag.moved) {
        /* 拖拽模式：找释放位置的另一个侧圆点 */
        const target = document.elementFromPoint(ev.clientX, ev.clientY);
        const targetDot = target && target.closest("[data-match-dot]");
        if (targetDot && targetDot !== dot && targetDot.dataset.matchSide !== side) {
          this.tryConnect(dot, targetDot);
        }
      } else {
        /* 点击模式：切换选中点，若已有另一个侧的选中点则配对 */
        this.trySelectOrPair(dot);
      }
    };
    const up = (ev) => finish(ev, false);
    const cancel = (ev) => finish(ev, true);
    document.addEventListener("pointermove", move, { signal: this.abort.signal });
    document.addEventListener("pointerup", up, { signal: this.abort.signal });
    document.addEventListener("pointercancel", cancel, { signal: this.abort.signal });
  },

  /* 点击配对：参考 temp 的 tryConnect 逻辑 — 同侧切换、异侧配对 */
  trySelectOrPair(dot) {
    if (!quiz || quiz.revealed) return;
    const word = dot.dataset.word;
    const side = dot.dataset.matchSide;

    /* 如果 quiz.pickWord 已有值，表示另一侧已选中 */
    if (quiz.pickWord && quiz.pickWordSide && quiz.pickWordSide !== side) {
      /* 另一侧已选中 — 尝试配对 */
      const pickedWord = quiz.pickWord;
      if (side === "art") {
        /* 当前点是 art（左），之前 pickWord 是 word（右） */
        matchPickWord(pickedWord);
        matchPickArt(word);
      } else {
        /* 当前点是 word（右），之前 pickWord 是 art（左） */
        matchPickWord(word);
        matchPickArt(pickedWord);
      }
      return;
    }

    /* 同侧或首次点击 — 设置当前选中点 */
    matchPickWord(word);
    quiz.pickWordSide = side;
    render();
  },

  /* 拖拽到另一个圆点：直接配对 */
  tryConnect(dotA, dotB) {
    if (!quiz || quiz.revealed) return;
    const a = { word: dotA.dataset.word, side: dotA.dataset.matchSide };
    const b = { word: dotB.dataset.word, side: dotB.dataset.matchSide };
    if (a.side === b.side) return;

    quiz.pickWordSide = a.side;
    quiz.pickWord = a.word;

    if (a.side === "art") {
      matchPickWord(b.word);
      matchPickArt(a.word);
    } else {
      matchPickWord(a.word);
      matchPickArt(b.word);
    }
  },

  setupDragging(root) {
    const options = { signal: this.abort.signal };
    root.querySelectorAll("[data-drag]").forEach((source) => {
      source.addEventListener("pointerdown", (e) => this.startDrag(e, source), options);
    });
  },

  startDrag(e, source) {
    if (!quiz || quiz.revealed || e.button !== 0 || source.disabled) return;
    const drag = {
      pointerId: e.pointerId, source, kind: source.dataset.drag,
      value: source.dataset.drag === "puzzle" ? Number(source.dataset.letter) : source.dataset.food,
      x: e.clientX, y: e.clientY, moved: false, ghost: null,
    };
    this.drag = drag;
    try { source.setPointerCapture(e.pointerId); } catch {}
    const options = { signal: this.abort.signal };
    const move = (ev) => {
      if (ev.pointerId !== drag.pointerId) return;
      if (!drag.moved && Math.hypot(ev.clientX - drag.x, ev.clientY - drag.y) <= 6) return;
      ev.preventDefault();
      if (!drag.moved) {
        drag.moved = true;
        drag.ghost = document.createElement("span");
        drag.ghost.className = "ref-drag-ghost";
        const art = source.querySelector(".ref-food-art");
        if (drag.kind === "food" && art) drag.ghost.innerHTML = art.innerHTML;
        else drag.ghost.textContent = source.textContent.trim();
        document.body.appendChild(drag.ghost);
      }
      drag.ghost.style.left = `${ev.clientX}px`;
      drag.ghost.style.top = `${ev.clientY}px`;
      document.querySelectorAll(".drop-ready").forEach((el) => el.classList.remove("drop-ready"));
      const hit = document.elementFromPoint(ev.clientX, ev.clientY);
      const target = hit && (drag.kind === "food" ? hit.closest("[data-feed-drop]") : hit.closest(".pz-slot"));
      if (target) target.classList.add("drop-ready");
    };
    const finish = (ev, cancelled) => {
      if (ev.pointerId !== drag.pointerId) return;
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", up);
      document.removeEventListener("pointercancel", cancel);
      const hit = document.elementFromPoint(ev.clientX, ev.clientY);
      this.clearDragVisual();
      this.drag = null;
      try { if (source.hasPointerCapture(ev.pointerId)) source.releasePointerCapture(ev.pointerId); } catch {}
      if (cancelled || !drag.moved) return;
      this.suppressClick(source);
      if (drag.kind === "puzzle") {
        const slot = hit && hit.closest(".pz-slot");
        if (slot) puzzlePlace(drag.value, Number(slot.dataset.slot));
      } else {
        const target = hit && hit.closest("[data-feed-drop]");
        if (target) {
          feedPick(drag.value, false);
          feedCheck();
        }
      }
    };
    const up = (ev) => finish(ev, false);
    const cancel = (ev) => finish(ev, true);
    document.addEventListener("pointermove", move, options);
    document.addEventListener("pointerup", up, options);
    document.addEventListener("pointercancel", cancel, options);
  },

  suppressClick(source) {
    const stop = (e) => { e.preventDefault(); e.stopPropagation(); };
    source.addEventListener("click", stop, { capture: true, once: true });
    setTimeout(() => source.removeEventListener("click", stop, true), 350);
  },
};

  <script>
/* ============================================================
   DinoGo · 恐龙英语 — 乐园（home）
   底部 Tab 1：首页 + 成长档案 + 随机记单词弹层
   ============================================================ */

/* ------------------------------------------------ home */
let reviewWord = null;
let voiceRec = null;
let voiceChunks = [];
let voiceUrl = "";
let voiceTimer = null;

/* 头像图标：直接用恐龙大图 + CSS 裁切头部，与 hero 完全一致 */
function avatarArtSrc() {
  if (state.stage === "ultra") {
    const skin = Math.min(4, Math.max(1, Number(state.ultraSkin) || 1));
    return `images/dino/ultra-${skin}.webp`;
  }
  return `images/dino/${state.stage}.webp`;
}

function resetVoice() {
  if (voiceTimer) { clearInterval(voiceTimer); voiceTimer = null; }
  if (voiceRec && voiceRec.state !== "inactive") {
    try { voiceRec.stop(); } catch (e) {}
  }
  voiceRec = null;
  voiceChunks = [];
  if (voiceUrl) { URL.revokeObjectURL(voiceUrl); voiceUrl = ""; }
}

function setRecBtn(label, recording) {
  const btn = $('[data-action="record-say"]');
  if (!btn) return;
  btn.classList.toggle("recording", !!recording);
  btn.innerHTML = recording ? `<span class="rec-dot"></span>${label}` : `${I.speaker(18)} ${label}`;
}

async function recordSay() {
  if (voiceRec && voiceRec.state === "recording") {
    if (voiceTimer) { clearInterval(voiceTimer); voiceTimer = null; }
    voiceRec.stop();
    return;
  }
  if (!navigator.mediaDevices || !window.MediaRecorder) { toast("当前浏览器不支持录音"); return; }
  setRecBtn("准备录音…", true);
  let released = false;
  const release = () => {
    if (released) return;
    released = true;
  };
  setTimeout(release, 12000);
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    voiceChunks = [];
    voiceRec = new MediaRecorder(stream);
    voiceRec.ondataavailable = (e) => { if (e.data && e.data.size) voiceChunks.push(e.data); };
    voiceRec.onstop = () => {
      stream.getTracks().forEach((t) => t.stop());
      if (voiceUrl) URL.revokeObjectURL(voiceUrl);
      const blob = new Blob(voiceChunks, voiceRec.mimeType ? { type: voiceRec.mimeType } : {});
      voiceUrl = URL.createObjectURL(blob);
      setRecBtn("重新跟读", false);
      if (voiceTimer) { clearInterval(voiceTimer); voiceTimer = null; }
      toast("录好啦，点「回放声音」听一听");
      release();
    };
    voiceRec.start();
    let left = 5;
    setRecBtn(`录音中 ${left}s · 点击结束`, true);
    voiceTimer = setInterval(() => {
      left -= 1;
      if (left <= 0) {
        clearInterval(voiceTimer); voiceTimer = null;
        if (voiceRec && voiceRec.state === "recording") voiceRec.stop();
        return;
      }
      setRecBtn(`录音中 ${left}s · 点击结束`, true);
    }, 1000);
  } catch (e) {
    setRecBtn("跟着读", false);
    release();
    toast("无法使用麦克风，请允许录音权限");
  }
}

function playVoice() {
  if (!voiceUrl) { toast("还没有录音，先跟着读一次吧"); return; }
  const audio = new Audio(voiceUrl);
  let released = false;
  const release = () => {
    if (released) return;
    released = true;
  };
  audio.addEventListener("ended", release, { once: true });
  audio.addEventListener("error", release, { once: true });
  setTimeout(release, 12000);
  audio.play().catch(() => { release(); toast("播放失败，请再试一次"); });
}

/* 每日随机学单词按当前恐龙时期的词汇难度抽取：蛋/幼龙/少年龙 basic，成年龙/霸王龙 advance，超级霸王龙 pro */
function randomWord() {
  const level = stageMeta(state.stage).vocab || "basic";
  const pool = REVIEW_WORDS.filter((w) => (w.attrs || []).includes(level));
  const list = pool.length ? pool : REVIEW_WORDS;
  return list[Math.floor(Math.random() * list.length)];
}
function wordPosLabel(w) { return w.pos === "verb" ? "phr." : "n."; }

/* -------- 例句直接从单词自带的 example 字段取 --------
   REVIEW_WORDS 里的单词全部有人工 example（noun.js / verb.js） */
function generateExample(word) {
  const en = (word.example || "").replace(/\{word\}/gi, word.word);
  return { en, zh: "" };
}


function todayLevels() {
  return (state.log[dateKey()] || {}).levels || 0;
}
function streakDays() {
  let n = 0;
  const d = new Date();
  if (!(state.log[dateKey(d)] || {}).levels) d.setDate(d.getDate() - 1);
  while ((state.log[dateKey(d)] || {}).levels) {
    n++;
    d.setDate(d.getDate() - 1);
  }
  return n;
}
function tasksData(lv, streak) {
  return [
    { done: !!state.tasks.level, color: "orange", icon: I.flag, title: "完成 1 次闯关", sub: state.tasks.level ? "今日目标已达成" : "还差 1 次，约 3 分钟", reward: "+60 成长值" },
    { done: lv >= 1, color: "blue", icon: I.book, title: "学会 5 个新单词", sub: `已掌握 ${Math.min(5, lv * 5)} / 5 个`, reward: "+40 成长值" },
    { done: streak >= 7, color: "coral", icon: I.flame, title: "连续学习 7 天", sub: streak ? `已连续 ${streak} 天` : "今天开始计数", reward: "+20 星星" },
  ];
}

/* 长单词自适应缩放，避免文案溢出卡片 */
function fitHomeWord() {
  const el = document.querySelector(".w-word");
  if (!el) return;
  const box = el.closest(".w-main");
  el.style.fontSize = "";
  const base = parseFloat(getComputedStyle(el).fontSize) || 36;
  const avail = box.clientWidth;
  const need = el.scrollWidth;
  if (avail > 0 && need > avail) {
    el.style.fontSize = `${Math.max(18, Math.floor((base * avail) / need) - 1)}px`;
  }
}

function screenHome() {

  const doneCount = tasks.filter((t) => t.done).length;
  const word = reviewWord = randomWord();
  const example = generateExample(word);
  const remain = next ? Math.max(0, next.min - state.growth) : 0;
  const dinoCls = state.stage === "ultra" ? "ultra" : "";
  return `<section class="screen has-tab" data-screen="home">

        </div>

      <section class="hero ${heroSkyClass()}">

      </section>

      <div class="growth-panel">
        <div class="g-main">
          <div class="g-row"><span class="lb">成长值</span><span class="val num">${state.growth} <em>/ ${next ? next.min : "MAX"}</em></span></div>
          <div class="bar g-bar"><i style="width:${Math.round(pct * 100)}%"></i></div>
          <div class="g-next">
            <span>${!next ? "已达成最高形态" : pending ? "成长值已满，可以进化" : `距${next.name}还差 <b>${remain}</b>`}</span>
            <span>${Math.round(pct * 100)}%</span>

    </div>

  return `<section class="screen" data-screen="profile">

        <div class="ch-head">

          <div class="goal">目标 10 分钟 ${weekMin >= 10 ? "✓" : ""}</div>

        <div class="chart">

            ${today ? `<span class="tip">${mins}′</span>` : ""}

      <div class="card ach-card">

        <div class="ach-list">${ach.map((a) => `<div class="ach">
          <div class="medal ${a.cls}">${a.icon}${a.done ? `<span class="dot">${I.check(8)}</span>` : ""}</div>
          <b>${a.name}</b><span>${a.sub}</span>

      </div>

      <div class="quote-card">

        <div class="q">小诺说：「今天也一起学 10 分钟吧，我离超级霸王龙又近了一步！」</div>

    </div>
  </section>`;
}

  <script>
/* ============================================================
   DinoGo · 恐龙英语 — 闯关地图（map）
   底部 Tab 2：闯关
   - 只负责统计本主题进度、切换主题、渲染主题地图
   - 具体的路径、节点、宝箱由各主题自行实现
   ============================================================ */

/* 当前主题对应的地图配置，缺省回落到第一个主题 */
function mapTheme() {
  return currentTheme().map || WORD_SETS[0].map;
}

function screenMap() {
  const prog = themeProgress();
  const theme = currentTheme();
  const cfg = mapTheme();
  const level = prog.level;
  const starTotal = themeStars(prog);
  const starMax = levelsPerTheme() * 3;
  const head = cfg.title.slice(0, -2);
  const tail = cfg.title.slice(-2);

  /* 主题地图渲染，返回场景、路线 SVG、节点与宝箱的完整 HTML */
  const mapHtml = cfg.render
    ? cfg.render({ prog, theme, cfg, level, LEVELS_PER_THEME, levels: levelsPerTheme(), starTotal })
    : "";
  const mapSection = cfg.sceneSelector ? mapHtml : `<section class="map-card" style="background:${cfg.bg};border-color:${cfg.border};box-shadow:0 0.375rem 0 ${cfg.border}48">
    ${mapHtml}
    <span class="map-tag">${theme.emoji} ${theme.name}</span>
    <div class="caption">
      <b>第 ${level} 关 · ${theme.name}</b>
      <span>${QUIZ_SIZE} 道题 · ★×${PASS_STARS} 解锁下一关</span>
    </div>
  </section>`;
  /* 占位主题（playable: false + 空词表）不显示"开始闯关"按钮 */
  const hasPlayableContent = themeWords().length > 0;
  const nextSection = cfg.sceneSelector || !hasPlayableContent ? "" : `<section class="next-card">
    <div class="nc-l">
      <div class="nc-kicker">UP NEXT ${I.chevron(8)} 第 ${level} 关</div>
      <h3>${theme.name}</h3>
      <div class="nc-meta">${themeWords().length} 个词 · ${QUIZ_SIZE} 道题 · ★×${PASS_STARS} 解锁下一关</div>
    </div>
    <button class="nc-btn" data-action="start-quiz">开始闯关${I.arrow(14)}</button>
  </section>`;

  return `<section class="screen has-tab" data-screen="map">
    <div class="scroll">
      <div class="theme-tabs">
        ${WORD_SETS.map((t) => `<button class="tt ${t.id === theme.id ? "on" : ""}" data-action="theme" data-theme="${t.id}">
          <b>${t.emoji}</b>${t.name}
        </button>`).join("")}
      </div>

      <section class="map-hero">
        <div class="eyebrow"><i></i>${theme.unit}</div>
        <h1>${head}<span>${tail}</span></h1>
        <p>${cfg.intro || `沿着地图一路向前，把${theme.name}里的单词都变成星星。`}</p>
      </section>

      <div class="journey">
        <span class="j-lb">我们的旅程</span>
        <span class="j-val num">${starTotal}<em>/ ${starMax} 颗星</em></span>
        <span class="j-track">
          <span class="track"><i style="width:${Math.round((starTotal / starMax) * 100)}%"></i></span>
          ${window.ChestManager ? ChestManager.renderJourneyChests(activeProgressKey(), starTotal, starMax) : ""}
        </span>
        ${window.ChestManager && ChestManager.available() > 0
          ? `<button type="button" class="j-chest bonus" data-action="chest-open" aria-label="开启额外宝箱，剩 ${ChestManager.available()} 个">🎁<b>${ChestManager.available()}</b></button>`
          : ""}
      </div>

      ${mapSection}
      ${nextSection}
    </div>
    ${tabbar("map")}
  </section>`;
}

/* 动物乐园：点场景入口 → 记录场景后弹出路线抽屉 */
function openAnimalScene(sceneId) {
  const theme = currentTheme();
  const scenes = theme.scenes || [];
  if (!scenes.length) return;
  const scene = scenes.find((s) => s.id === sceneId) || scenes[0];
  if (!scene.playable) { openAnimalPreview(scene); return; }

  state.scene = scene.id;
  save();
  openOverlay(renderZooRouteSheet(scene, sceneProgress("animal", scene.id)));
  /* 抽屉插入 DOM 后把当前关滚到视口中央 */
  if (window.ZooRouteView) setTimeout(() => ZooRouteView.focusCurrent(), 60);
}

/* 触屏左右滑动切换主题：左滑下一个，右滑上一个 */
function stepTheme(step) {
  const idx = WORD_SETS.findIndex((t) => t.id === currentTheme().id);
  const next = WORD_SETS[idx + step];
  if (!next) return;
  state.theme = next.id;
  save();
  sfx("tap");
  render();
}

(function bindThemeSwipe() {
  const EDGE = 24;   /* 两侧边缘留给 iOS 返回手势 */
  const DIST = 60;   /* 最小横向位移 */
  let fromX = 0, fromY = 0, fromAt = 0, active = false;

  document.addEventListener("touchstart", (e) => {
    active = false;
    if (e.touches.length !== 1) return;
    const target = e.target;
    if (!target.closest || !target.closest('.screen[data-screen="map"]')) return;
    /* 主题栏本身可横向滚动时，把手势让给滚动 */
    const tabs = target.closest(".theme-tabs");
    if (tabs && tabs.scrollWidth > tabs.clientWidth + 2) return;
    const t = e.touches[0];
    if (t.clientX < EDGE || t.clientX > window.innerWidth - EDGE) return;
    fromX = t.clientX;
    fromY = t.clientY;
    fromAt = Date.now();
    active = true;
  }, { passive: true });

  document.addEventListener("touchend", (e) => {
    if (!active) return;
    active = false;
    const t = e.changedTouches[0];
    if (!t || Date.now() - fromAt > 800) return;
    const dx = t.clientX - fromX;
    const dy = t.clientY - fromY;
    /* 横向位移足够大且明显大于纵向，才判定为切主题，避免误伤上下滚动 */
    if (Math.abs(dx) < DIST || Math.abs(dx) < Math.abs(dy) * 1.4) return;
    stepTheme(dx < 0 ? 1 : -1);
  }, { passive: true });

  document.addEventListener("touchcancel", () => { active = false; }, { passive: true });
})();

/* 未接入关卡逻辑的场景：保留静态路线预览 */
function openAnimalPreview(scene) {
  const points = [[48, 249], [144, 231], [115, 180], [218, 159], [262, 102], [198, 48]];
  const nodes = points.map(([x, y], index) => {
    const number = index + 1;
    const status = number <= 2 ? "done" : number === 3 ? "current" : "";
    return `<span class="animal-route-node ${status}" style="left:${(x / 320) * 100}%;top:${(y / 300) * 100}%">${number <= 2 ? "✓" : number}</span>`;
  }).join("");

  openOverlay(`<div class="overlay">
    <section class="sheet animal-route-sheet" role="dialog" aria-modal="true" aria-label="${scene.name}关卡路线">
      <div class="grab"></div>
      <div class="animal-route-map ${scene.id}" aria-hidden="true">
        <svg class="animal-route-path" viewBox="0 0 320 300" preserveAspectRatio="none">
          <path d="M48 249 L144 231 L115 180 L218 159 L262 102 L198 48" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 13"/>
        </svg>
        ${nodes}
        <button type="button" class="arm-close" data-action="close-overlay" aria-label="关闭路线预览">×</button>
      </div>
      <button type="button" class="btn animal-route-start" disabled aria-disabled="true">开始闯关</button>
    </section>
  </div>`);
}

</script>
  <script>
/* ============================================================
   DinoGo · 恐龙英语 — 词汇（words）+ 恐龙图鉴（dex）
   底部 Tab 3：词汇本（按 A–Z 分组）
   恐龙图鉴并入「收藏 → 图鉴」，用 dexBody() 渲染
   ============================================================ */

let dexFilter = "all";
let wordsLetter = "all";
let wordsAlphaCache = null;

/* ------------------------------------------------ dex */
function dexRewardInfo() {
  if (state.dex.length >= 6) return { title: "图鉴全收集 · 星空营地", note: "所有形态都已收录，小诺为你骄傲", cur: 6, max: 6, reward: "全部完成" };
  if (state.dex.length >= 4) return { title: "收集奖励 · 星空营地", note: `再发现 ${6 - state.dex.length} 种形态，解锁「星空营地」背景`, cur: state.dex.length, max: 6, reward: "星空营地" };
  return { title: "收集奖励 · 落日山谷", note: `再发现 ${4 - state.dex.length} 种形态，解锁「落日山谷」背景`, cur: state.dex.length, max: 4, reward: "落日山谷" };
}

/* 图鉴正文：收藏 Tab 内嵌使用（不含 .scroll 与底部 Tab） */
function dexBody() {
  const filters = [["all", "全部"], ["baby", "幼年期"], ["teen", "成长期"], ["adult", "成熟期"], ["super", "完全体"], ["ultra", "究极体"]];
  const filterPhases = { baby: "幼年期", teen: "成长期", adult: "成熟期", super: "完全体", ultra: "究极体" };
  const list = STAGES.filter((d) => dexFilter === "all" || d.phase === filterPhases[dexFilter]);
  const reward = dexRewardInfo();
  const pct = Math.round((state.dex.length / STAGES.length) * 100);
  return `<div class="dex-sum card">
      <div class="ds-main">
        <div class="ds-row"><b>图鉴收集度</b><span class="num">${pct}%</span></div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="ds-foot">${spark(10, "#F0B53B")} 已收录 ${state.dex.length} / ${STAGES.length} 种形态 · 继续成长解锁传说</div>
      </div>
      <div class="ds-badge">${I.book(26)}</div>
    </div>

    <div class="dex-filters">${filters.map(([id, label]) => `<button class="f ${dexFilter === id ? "on" : ""}" data-action="filter-dex" data-filter="${id}">${label}</button>`).join("")}</div>

    <div class="dex-grid">
      ${list.map((d) => {
        const found = state.dex.includes(d.key);
        const isNow = d.key === state.stage;
        const bgT = (STAGES.findIndex((x) => x.key === d.key) % 5) + 1;
        return `<button class="dex-card ${found ? "" : "locked"} ${isNow ? "current" : ""}" data-action="dex-detail" data-key="${d.key}" aria-label="${found ? d.name : "未发现"}">
          ${found ? `<span class="rare r${d.rarity}">★</span>` : `<span class="lock-ic">${I.lock(13)}</span>`}
          ${isNow ? `<span class="now-tag">当前</span>` : ""}
          <div class="pic t${bgT}">${dino(d.key)}</div>
          <div class="nm">${found ? d.name : "未发现"}</div>
          <div class="stg">${found ? d.phase : "???"}</div>
        </button>`;
      }).join("")}
    </div>

    ${dexFilter === "ultra" ? ultraSkinSection() : ""}

    <div class="dex-reward">
      <div class="dr-ic"><div class="bg-thumb ${state.dex.length >= 4 ? "sunset" : "jungle"}" style="width:100%;height:100%;border-radius:0"></div></div>
      <div class="dr-main">
        <div class="dr-row"><b>${reward.title}</b><span>${reward.cur} / ${reward.max}</span></div>
        <div class="bar"><i style="width:${Math.round((reward.cur / reward.max) * 100)}%"></i></div>
        <div class="dr-note">${reward.note}</div>
      </div>
      <div class="dr-lock">${reward.cur >= reward.max ? I.check(14, "#B4811C") : I.lock(14, "#B4811C")}</div>
    </div>`;
}

/* 超级霸王龙的机甲形态：进化到究极体后可自由切换形象 */
function ultraSkinSection() {
  const unlocked = state.dex.includes("ultra");
  return `<div class="skin-head">
      <b>超级霸王龙形态</b><span>${unlocked ? "已解锁 · 点击切换" : "进化到究极体后解锁"}</span>
    </div>
    <div class="skin-grid">
      ${ULTRA_SKINS.map((s) => {
        const on = state.ultraSkin === s.id;
        return `<button class="skin-card ${unlocked ? "" : "locked"} ${on && unlocked ? "on" : ""}" data-action="${unlocked ? "pick-ultra" : "locked-ultra"}" data-skin="${s.id}">
          <div class="pic">${dino("ultra", { skin: s.id })}</div>
          <div class="nm">${unlocked ? s.name : "???"}</div>
          <div class="sub">${unlocked ? s.sub : "未解锁"}</div>
          ${unlocked && on ? `<span class="cur">使用中</span>` : ""}
          ${unlocked ? "" : `<span class="lock-ic">${I.lock(13)}</span>`}
        </button>`;
      }).join("")}
    </div>`;
}

/* ------------------------------------------------ words */
/* 词库单词按首字母 A–Z 分组：单词本只展示词库，不掺入各主题馆的闯关词 */
function allWordsAlpha() {
  if (wordsAlphaCache) return wordsAlphaCache;
  const seen = new Set();
  const all = POS_POOL.filter((w) => {
    if (seen.has(w.word)) return false;
    seen.add(w.word);
    return true;
  });
  all.sort((a, b) => a.word.localeCompare(b.word, "en"));
  const groups = [];
  all.forEach((w) => {
    const L = w.word[0].toUpperCase();
    let g = groups.find((x) => x.letter === L);
    if (!g) groups.push((g = { letter: L, words: [] }));
    g.words.push(w);
  });
  return (wordsAlphaCache = groups);
}

function screenWords() {
  const groups = allWordsAlpha();
  const total = groups.reduce((n, g) => n + g.words.length, 0);
  const letters = groups.map((g) => g.letter);
  const shown = wordsLetter === "all" ? groups : groups.filter((g) => g.letter === wordsLetter);
  const index = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("")
    .map((L) => `<button class="wl ${wordsLetter === L ? "on" : ""} ${letters.includes(L) ? "" : "off"}" data-action="filter-word" data-letter="${L}">${L}</button>`).join("");
  return `<section class="screen has-tab" data-screen="words">
    <div class="scroll">
      <div class="words-head">
        <div class="t"><h1>单词本</h1><p>词库里的单词，按 A–Z 排好队</p></div>
        <div class="words-count"><b class="num">${total}</b><span>词</span></div>
      </div>

      <div class="wl-bar">
        <button class="wl all ${wordsLetter === "all" ? "on" : ""}" data-action="filter-word" data-letter="all">ALL</button>
        ${index}
      </div>

      ${shown.map((g) => `<div class="word-group">
        <div class="wg-letter">${g.letter}<span>${g.words.length}</span></div>
        <div class="wg-list">
          ${g.words.map((w) => `<button class="word-row" data-action="speak-word" data-word="${esc(w.word)}" aria-label="${w.word} ${w.zh}">
            <span class="wr-pic">${w.art()}</span>
            <span class="wr-main">
              <span class="wr-line"><b>${w.word}</b><i>${w.zh}</i></span>
              <span class="wr-line sub"><em>${w.phon || ""}</em>${posZh(w) ? `<span class="wr-tag pos">${posZh(w)}</span>` : ""}</span>
            </span>
          </button>`).join("")}
        </div>
      </div>`).join("")}

      <div class="words-foot">${I.leaf(12)} 点单词可以听发音，词库会持续补充新词</div>
    </div>
    ${tabbar("words")}
  </section>`;
}

</script>
  <script>
/* ============================================================
   DinoGo · 恐龙英语 — 收藏（collect）
   底部 Tab 4：背景 / 图鉴，含背景购买与切换
   ============================================================ */

let collectTab = "bg";
let pendingBuy = null;

/* ------------------------------------------------ collect */
function screenCollect() {
  const dinoCls = state.stage === "ultra" ? "ultra" : "";
  const purchasableBgCount = BACKGROUNDS.filter((bg) => bg.price > 0 && state.stars >= bg.price && !state.bgOwned.includes(bg.id) && state.bg !== bg.id).length;
  const tabs = `<div class="collect-tabs">
    <button class="tab ${collectTab === "bg" ? "on" : ""}" data-action="collect-tab" data-tab="bg">背景${purchasableBgCount ? `<span class="tb">${purchasableBgCount}</span>` : ""}</button>
    <button class="tab ${collectTab === "dex" ? "on" : ""}" data-action="collect-tab" data-tab="dex">图鉴</button>
    <span class="all">全部 ${I.chevron(9)}</span>
  </div>`;
  let panel = "";
  if (collectTab === "bg") {
    panel = `<div class="bg-grid">${BACKGROUNDS.map((bg) => {
      const owned = state.bgOwned.includes(bg.id) || state.bg === bg.id;
      const using = state.bg === bg.id;
      const price = using ? `<span class="price owned">使用中</span>` : owned ? `<span class="price owned">已拥有</span>` : `<span class="price">${star(13)}${bg.price}</span>`;
      return `<button class="bg-item ${using ? "using" : ""}" data-action="${owned ? "equip-bg" : "buy-bg"}" data-id="${bg.id}">
        <div class="bg-thumb ${bg.cls}"></div>
        <div class="bg-info"><b>${bg.name}</b><span>${bg.sub}</span>${price}</div>
        ${using ? `<span class="check-ico">${I.check(12)}</span>` : `<span class="action" style="width:1.625rem;height:1.625rem;border-radius:0.5625rem;background:${owned ? "#2E8B57" : "#F4EFE3"};color:${owned ? "#fff" : "#B4811C"};display:grid;place-items:center">${owned ? I.arrow(12) : I.lock(12)}</span>`}
      </button>`;
    }).join("")}</div>`;
  } else {
    panel = `<div class="collect-dex">${dexBody()}</div>`;
  }
  const head = collectTab === "dex"
    ? `<div class="t"><h1>恐龙图鉴</h1><p>每一次进化，都会被记录在这里</p></div><div class="dex-count"><b class="num">${state.dex.length}</b><span>/ ${STAGES.length}</span></div>`
    : `<div class="t"><h1>我的收藏</h1><p>用星星给恐龙乐园换个背景</p></div>${starPill()}`;
  return `<section class="screen has-tab" data-screen="collect">
    <div class="scroll">
      <div class="collect-head">
        ${head}
      </div>
      ${collectTab === "dex" ? "" : `<div class="collect-preview ${bgClass(state.bg)}">
        ${skyFx()}
        <div class="wearing">${I.check(9, "#2E8B57")} 今日造型</div>
        <div class="dino ${dinoCls}">${dino(state.stage)}</div>
        <div class="pet">${I.crownMini(12, "#C98B25")} 小诺 · LV.${stageIndex(state.stage) + 1}</div>
      </div>`}
      ${tabs}
      ${panel}
    </div>
    ${tabbar("collect")}
  </section>`;
}


function openBuyBg(id) {
  const bg = bgMeta(id);
  if (!bg || bg.price === 0) return;
  if (state.stars < bg.price) { toast("星星不够啦，再去闯一关吧"); return; }
  pendingBuy = id;
  openOverlay(`<div class="overlay dialog-wrap">
    <div class="dialog">
      <div class="bg-thumb ${bg.cls}" style="width:100%;height:6rem;border-radius:1rem"></div>
      <h3>解锁「${bg.name}」？</h3>
      <p>将花费 ${bg.price} 星星，解锁后会立即应用到恐龙乐园和收藏页。</p>
      <div class="d-actions">
        <button class="btn ghost" data-action="close-overlay">再想想</button>
        <button class="btn" data-action="confirm-buy">花 ${bg.price} 星星解锁</button>
      </div>
    </div>
  </div>`);
}
function confirmBuy() {
  if (!pendingBuy) return;
  const bg = bgMeta(pendingBuy);
  if (state.bgOwned.includes(bg.id)) { state.bg = bg.id; pendingBuy = null; closeOverlay(); render(); return; }
  if (state.stars < bg.price) { toast("星星不够啦"); return; }
  state.stars -= bg.price;
  state.bgOwned.push(bg.id);
  state.bg = bg.id;
  sfx("coin");
  toast(`已解锁「${bg.name}」背景`);
  pendingBuy = null;
  closeOverlay();
  save();
  render();
}
function equipBg(id) {
  if (!state.bgOwned.includes(id)) return;
  state.bg = id;
  sfx("tap");
  save();
  render();
  toast(`场景已切换为「${bgMeta(id).name}」`);
}

</script>
