.ach .medal.tone-blue{--tone:#5B9FE0;--tone-soft:#B7DCF8;--face:linear-gradient(160deg,#D6ECFF,#8EC7F2)}
.ach .medal.tone-green{--tone:#4FA96F;--tone-soft:#B4E0B4;--face:linear-gradient(160deg,#DDF4CF,#94D68C)}
.ach .medal.tone-purple{--tone:#9A7BEA;--tone-soft:#CDBEF7;--face:linear-gradient(160deg,#E8DEFF,#B49AF8)}
.ach-face{position:absolute;inset:0.21875rem;border-radius:50%;display:grid;place-items:center;
  background:var(--face);box-shadow:inset 0 0.125rem 0 rgba(255,255,255,.55)}
.ach.is-done .ach-face{box-shadow:0 0.25rem 0.625rem -0.125rem var(--tone-soft),inset 0 0.125rem 0 rgba(255,255,255,.6)}
.ach.is-locked .ach-face{background:#F5EFE2;border:0.09375rem dashed #DCCFB8;box-shadow:none}
.ach .medal .dot{position:absolute;right:-0.0625rem;bottom:0;width:0.875rem;height:0.875rem;border-radius:50%;
  background:var(--green);border:0.125rem solid var(--ach-gap,#fff);display:grid;place-items:center;color:#fff;z-index:2}
.ach b{max-width:100%;font-size:0.625rem;font-weight:var(--w-bold);color:#5E7263;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ach .ach-sub{max-width:100%;font-size:0.59375rem;font-weight:var(--w-read);color:#AAB4A8;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ach.is-done .ach-sub{color:#7C9A83}
.ach-all{width:100%;min-height:2.25rem;margin-top:0.75rem;border-radius:0.75rem;background:#F8F2E5;
  border:0.0625rem dashed #E4D6BC;display:flex;align-items:center;justify-content:center;gap:0.25rem;
  font-size:0.6875rem;font-weight:var(--w-bold);color:#8A7A5C;transition:transform .14s ease,background .14s ease}
.ach-all:active{transform:scale(.98);background:#F3EAD8}
.ach-all svg{opacity:.7}

/* 全部成就抽屉 */
.achv-sheet{position:relative;max-width:32rem;scrollbar-width:none}
.achv-sheet::-webkit-scrollbar{display:none}
.achv-close{position:absolute;right:1rem;top:1rem;z-index:2;width:2rem;height:2rem;border-radius:50%;
  display:grid;place-items:center;background:#F5EFE3;color:#8A7A5C}
.achv-close:active{transform:scale(.92)}
.achv-hero{display:flex;align-items:center;gap:0.875rem;padding-right:2.25rem}
.achv-ring{width:4.125rem;height:4.125rem;border-radius:50%;flex:none;position:relative;display:grid;place-items:center;
  background:conic-gradient(#F2A93B calc(var(--p,0) * 1%), #EDE1C9 0)}
.achv-ring::before{content:"";position:absolute;inset:0.34375rem;border-radius:50%;background:#FFFBF3}
.achv-ring span{position:relative;z-index:1;font-size:1.125rem;font-weight:var(--w-black);color:#8A6415;line-height:1}
.achv-ring span em{font-style:normal;font-size:0.625rem;font-weight:var(--w-mid);color:#A3927A}
.achv-hero-txt{min-width:0}
.achv-hero-txt h2{font-size:1.25rem;font-weight:var(--w-black);letter-spacing:-0.01875rem}
.achv-hero-txt p{font-size:0.6875rem;line-height:1.55;color:var(--muted);font-weight:var(--w-read);margin-top:0.1875rem}
.achv-tip{display:flex;align-items:center;gap:0.3125rem;margin-top:0.75rem;padding:0.5rem 0.625rem;border-radius:0.75rem;
  background:#F7F1E2;font-size:0.65625rem;font-weight:var(--w-read);color:#8B7C60;line-height:1.4}
.achv-tip svg{flex:none}
.achv-cat{--ach-gap:#FFFDF8;margin-top:0.625rem;padding:0.5625rem 0.625rem 0.6875rem;border-radius:1.125rem;
  background:#FFFDF8;border:0.0625rem solid #F0E5D2}
.achv-groups > .achv-cat:first-child{margin-top:0.875rem}
.achv-cat-head{display:flex;align-items:center;gap:0.375rem;padding:0 0.125rem}
.achv-dot{width:0.4375rem;height:0.4375rem;border-radius:50%;flex:none}
.achv-dot.tone-gold{background:#F2A93B}
.achv-dot.tone-blue{background:#5B9FE0}
.achv-dot.tone-green{background:#4FA96F}
.achv-dot.tone-purple{background:#9A7BEA}
.achv-cat-head b{font-size:0.71875rem;font-weight:var(--w-black);color:#4F665A}
.achv-cat-head em{font-style:normal;margin-left:auto;font-size:0.625rem;font-weight:var(--w-mid);color:#B3A78E}
.achv-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0.375rem;margin-top:0.5rem}
.achv-grid .ach{padding:0.25rem 0.125rem 0.375rem}
.achv-grid .ach .medal{width:clamp(2.875rem,9.5vw,3.375rem);height:clamp(2.875rem,9.5vw,3.375rem)}

.quote-card{min-height:4rem;border-radius:1.25rem;margin-top:0.75rem;background:linear-gradient(120deg,#EAF7D9,#F7FBE9);border:0.09375rem solid #D8E9C4;
  display:flex;align-items:center;gap:0.625rem;padding:0.625rem 0.875rem}
.quote-card .q{font-size:0.6875rem;font-weight:var(--w-mid);color:#6D8464;line-height:1.5}
.quote-card .qi{width:2rem;height:2rem;border-radius:0.6875rem;background:#fff;display:grid;place-items:center;color:#E2A62E;flex:none}
.profile-cta{margin-top:0.75rem}
.profile-scroll{display:flex;flex-direction:column}
.profile-scroll > *{flex:none}
/* 语录卡吸附底部时 auto 外边距会归零，用前一卡的下间距兜底保证最小间距 */
.profile-scroll .ach-card{margin-bottom:0.75rem}
.profile-scroll .quote-card{margin-top:auto}

/* ============================================================
   🔊 喇叭按钮：圆形底色 + 点击抖动特效
   ============================================================ */

.zoo-audio-btn{flex:none;width:2.5rem;height:2.5rem;padding:0;border-radius:50%;
  background:#FFF8E7;border:0.125rem solid #EFE1C8;
  display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent;
  box-shadow:0 0.25rem 0.5rem rgba(155,118,32,.14);transition:transform .12s}
.zoo-audio-btn:active{transform:scale(.9)}
.zoo-audio-btn svg{width:62%;height:62%;display:block}

/* 抖动特效：播放发音时的按钮反馈（左右位移 + 旋转 + 弹性缩放 + 暖光波纹，圆形按钮也能一眼看出抖动） */
@keyframes shakeAudio{
  0%   {transform:translateX(0) rotate(0deg) scale(1)}
  15%  {transform:translateX(-0.22rem) rotate(-14deg) scale(1.14);box-shadow:0 0 0 0.35rem rgba(244,185,66,.35)}
  30%  {transform:translateX(0.22rem) rotate(14deg) scale(1.12)}
  45%  {transform:translateX(-0.16rem) rotate(-10deg) scale(1.08);box-shadow:0 0 0 0.5rem rgba(244,185,66,0)}
  60%  {transform:translateX(0.14rem) rotate(8deg) scale(1.05)}
  78%  {transform:translateX(-0.06rem) rotate(-4deg) scale(1.02)}
  100% {transform:translateX(0) rotate(0deg) scale(1)}
}
.listen.is-shaking,
.zoo-audio-btn.is-shaking,
.listen-bubble-replay.is-shaking,
.bc-sign-mini-btn.is-shaking,
.ref-listen-speaker.is-shaking,
.ref-dialog-ask.is-shaking{animation:shakeAudio .58s cubic-bezier(.36,.07,.19,.97) both !important;will-change:transform}
.listen.is-shaking svg,
.zoo-audio-btn.is-shaking svg,
.listen-bubble-replay.is-shaking svg,
.bc-sign-mini-btn.is-shaking svg,
.ref-listen-speaker.is-shaking svg{filter:drop-shadow(0 0 0 currentColor)}

/* ============================================================
   🍎 动物喂食 Feed Animal
   ============================================================ */

.fd-wrap{display:flex;flex-direction:column;align-items:center;gap:0.75rem}
.fd-animal{display:flex;flex-direction:column;align-items:center;gap:0.125rem}
.fd-art{font-size:3.125rem;line-height:1}
.fd-foods{display:flex;gap:0.5rem;margin-top:0.5rem}
.fd-food{width:3.5rem;height:3.5rem;border:0.1875rem solid #E7DAC3;border-radius:50%;background:#FFF8E7;font-size:1.75rem;cursor:pointer;transition:transform .12s,box-shadow .15s}
.fd-food:active{transform:scale(.92)}
.fd-food.selected{border-color:#FFB64D;box-shadow:0 0 0 0.1875rem rgba(255,182,77,.35),0 0.1875rem 0.5rem rgba(255,152,0,.2)}
.fd-food.correct{border-color:#43A047;background:#E8F5E9}

/* ============================================================
   🏃 动作猜猜 Action（进阶题：中央动态动物 + 纯文字选项）
   图片框统一由 quiz-types.css 的 .ref-picture-frame 模板控制
   ============================================================ */

.ref-action-wrap{display:flex;flex-direction:column;flex:1;min-height:0;gap:0.625rem;justify-content:center}
/* 动作猜猜：舞台只展示一张动作图片，装饰与音效已移除 */
.ref-action-img{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:contain;
  padding:0.375rem;border-radius:inherit;pointer-events:none}

/* 动作题选项统一 3 列 grid */
.ref-action-options{display:grid;grid-template-columns:repeat(3,1fr);gap:0.5rem}

/* ============================================================
   🖼 看图识词：暖黄底 + 白色粗描边 + 贴纸卡片
   ============================================================ */

.quiz-page.pic-page{background:linear-gradient(180deg,#FCE8B0 0%,#F8DA8C 62%,#F4CF77 100%)}
.quiz-page.pic-page::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(155,105,20,.16) 0.0625rem,transparent 0.0625rem);background-size:1.5rem 1.5rem}
.pic-page .quiz-top{position:relative;z-index:2}
.pic-page .qbar{background:rgba(255,255,255,.62);box-shadow:inset 0 0.125rem 0.25rem rgba(140,95,25,.12)}
.pic-page .circle-btn{background:#fff;border-color:#fff;box-shadow:0 0.25rem 0 rgba(140,95,25,.18)}
.pic-page .quiz-body{position:relative;z-index:2;padding-top:0.25rem}
.pic-page .quiz-prompt{align-items:center;text-align:center;gap:0.3125rem}
.pic-page .quiz-prompt .chip{align-self:center;background:#fff;border:0.125rem solid #fff;color:#8A6415;
  box-shadow:0 0.1875rem 0 rgba(140,95,25,.18);letter-spacing:0.05rem}
.pic-page .quiz-prompt .chip.boss-chip{background:linear-gradient(135deg,#FF6B35,#FF3D00);color:#fff}
.pic-page .quiz-prompt h2{font-size:clamp(1.125rem,3vw,1.375rem);color:#2C4A32}

.pic-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;
  filter:drop-shadow(0 0.375rem 0.5rem rgba(50,45,20,.18))}
.pic-emoji{font-size:clamp(3.25rem,16vh,7rem);line-height:1;
  filter:drop-shadow(0 0.375rem 0 rgba(70,60,25,.16))}
.pic-page .listen{position:absolute;right:0.875rem;bottom:0.875rem;background:#fff;color:#8A6415;
  border:0.09375rem solid #fff;box-shadow:0 0.25rem 0 rgba(140,95,25,.18)}

/* 选项：贴纸卡片 */
.pic-page .option{min-height:3.75rem;border-radius:1.125rem;background:#fff;border:0.1875rem solid #fff;
  padding:0 0.625rem;gap:0.5rem;box-shadow:0 0.3125rem 0 rgba(150,100,20,.22),0 0.5rem 0.875rem rgba(120,80,20,.14);
  transition:transform .12s ease,box-shadow .12s ease,background .15s ease}
.pic-page .option:active{transform:translateY(0.125rem);box-shadow:0 0.1875rem 0 rgba(150,100,20,.22)}
.pic-page .option .key{width:1.75rem;height:1.75rem;border-radius:50%;background:#FBE7A6;color:#8A6415;font-size:0.75rem}
.pic-page .option .word{font-size:clamp(0.8125rem,3.2vw,1rem);font-weight:var(--w-black);color:#33502F;letter-spacing:-0.0125rem;min-width:0;white-space:normal;overflow-wrap:anywhere;word-break:break-word}
.pic-page .option .mark{width:1.375rem;height:1.375rem;background:#4FA55E}
.pic-page .option .mark.bad{background:#E8604A}
.pic-page .option .mark.radio{border-color:#4FA55E}
.pic-page .option .mark.radio i{background:#4FA55E}
.pic-page .option.sel{border-color:#4FA55E;background:#F4FBEA;
  box-shadow:0 0.3125rem 0 #BFE3AE,0 0.5rem 0.875rem rgba(79,165,94,.18)}
.pic-page .option.sel .key{background:#4FA55E;color:#fff}
.pic-page .option.correct{border-color:#4FA55E;background:#EAF9DD;box-shadow:0 0.3125rem 0 #BFE3AE}
.pic-page .option.correct .key{background:#4FA55E;color:#fff}
.pic-page .option.wrong{border-color:#F07A6A;background:#FFF2EE;box-shadow:0 0.3125rem 0 #F5C4B7;animation:shake .4s ease}
.pic-page .option.wrong .key{background:#F07A6A;color:#fff}
.pic-page .option.dim{opacity:.5}

/* 底部 */
.pic-page .quiz-foot{position:relative;z-index:2;background:transparent}

/* ============================================================
   DinoGo · 恐龙英语 — 扩展题型（动物喂食 / 进阶题）与 BOSS 关
   ============================================================ */

/* ============================================================
   🔥 BOSS 关专属样式
   ============================================================ */

.chip.boss-chip{background:linear-gradient(135deg,#FF6B35,#FF3D00);color:#fff;
  box-shadow:0 0.25rem 0.625rem rgba(255,61,0,.35);animation:boss-chip-pulse 1.4s ease-in-out infinite}
@keyframes boss-chip-pulse{0%,100%{box-shadow:0 0.25rem 0.625rem rgba(255,61,0,.35)}50%{box-shadow:0 0.375rem 1rem rgba(255,61,0,.55)}}

.result-head .boss-banner{display:inline-flex;align-items:center;gap:0.5rem;margin-bottom:0.375rem;padding:0.375rem 0.875rem;
  border-radius:6.1875rem;background:linear-gradient(135deg,#FF6B35,#FFB64D);color:#fff;font-size:0.8125rem;font-weight:var(--w-black);
  letter-spacing:0.0375rem;box-shadow:0 0.25rem 0.75rem rgba(255,107,53,.4);
  animation:boss-banner-pop .6s cubic-bezier(.2,1.5,.4,1) both}
@keyframes boss-banner-pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}

.result-head .boss-chest-reward{display:flex;align-items:center;justify-content:center;gap:0.375rem;margin-top:0.5rem;padding:0.375rem 0.75rem;
  border-radius:0.625rem;background:linear-gradient(135deg,#FFE477,#FFC84D);color:var(--sticker-ink);font-size:0.75rem;font-weight:var(--w-bold);
  box-shadow:0 0.125rem 0.375rem rgba(255,152,0,.25);
  animation:chest-reward-pop .8s cubic-bezier(.2,1.5,.4,1) .3s both}
.result-head .boss-chest-reward b{font-size:1rem;color:#8A3D00}
@keyframes chest-reward-pop{0%{transform:translateY(-0.5rem);opacity:0}100%{transform:translateY(0);opacity:1}}

/* ============================================================
   DinoGo · 恐龙英语 — 参考题型：动物园贴纸风（看图 / 听音 / 对话 / 喂食）
   ============================================================ */

/* ============================================================
   参考题型：场景背景 + 独立 UI + HTML 交互层
   ============================================================ */

.quiz-ref-page{position:relative;isolation:isolate;background:#FFF7E4;color:#4B3626;
  /* 主题可切换变量：背景素材 + 选项框风格 */
  --ref-frame-image:none;
  --ref-frame-size:1.5rem 1.5rem;
  --ref-frame-pos:0 0;
  --opt-line:#E4CFA9;--opt-line-w:0.125rem;
  --opt-rim:transparent;--opt-rim-w:0rem;
  --opt-base:#D9C39B;--opt-base-h:0.25rem;
  --opt-hi:none;
  --opt-fill:linear-gradient(180deg,#FFFDF7 0%,#FFFDF7 100%);
  --opt-radius:1rem;
  --opt-shadow:transparent;
  --opt-key-bg:#FFF0C9;--opt-key-line:transparent;--opt-key-w:0rem;--opt-key-ink:#8D6835;
  --opt-ok-line:#68A873;--opt-ok-rim:transparent;--opt-ok-hi:none;
  --opt-ok-fill:linear-gradient(180deg,#EAF7E3 0%,#EAF7E3 100%);--opt-ok-base:#9AC78B;
  --opt-bad-line:#D87B68;--opt-bad-rim:transparent;--opt-bad-hi:none;
  --opt-bad-fill:linear-gradient(180deg,#FFF0EA 0%,#FFF0EA 100%);--opt-bad-base:#E5AA9B}
.quiz-ref-page[data-scene="school"]{background:#FFF2E7}
.ref-scene-bg{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background-image:var(--ref-frame-image),radial-gradient(rgba(92,65,29,.1) 0.0625rem,transparent 0.0625rem);
  background-size:var(--ref-frame-size),1.5rem 1.5rem;
  background-position:var(--ref-frame-pos),0 0;
  background-repeat:no-repeat,repeat}
.ref-scene-svg{position:absolute;inset:0;width:100%;height:100%}
.quiz-ref-page .quiz-top,.quiz-ref-page .quiz-body,.quiz-ref-page .quiz-foot{position:relative;z-index:1}
.quiz-ref-page .quiz-top{padding-top:0.5rem}
.quiz-ref-page .qbar{background:rgba(255,255,255,.75);border:0.09375rem solid #E8D5AE}
.quiz-ref-page .circle-btn{background:#FFFDF6;border-color:#E8D5AE;box-shadow:0 0.1875rem 0 #D9C49C;color:var(--sticker-ink)}
.quiz-ref-page .qcount{color:#6A4C2D}
.ref-quiz-body{padding:0.75rem 1.25rem 0.25rem;overflow-x:hidden;overflow-y:auto;scrollbar-width:none;overscroll-behavior-y:contain;touch-action:pan-y}
.ref-stage-head{display:flex;align-items:center;justify-content:center;gap:0.75rem;flex:none;margin:0.875rem auto 0.75rem;text-align:left}
.ref-stage-head h2{font-size:clamp(1.125rem,4vw,1.5rem);font-weight:var(--w-black);line-height:1.2;color:#4B3626}
.ref-stage-badge{width:3rem;height:3rem;display:grid;place-items:center;flex:none;border:0.1875rem solid var(--sticker-ink);border-radius:1rem;
  background:#FFE49A;box-shadow:0 0.25rem 0 #D7B66E;transform:rotate(-3deg)}
.ref-stage-kicker{display:block;margin-bottom:0.1875rem;color:#A3793D;font-size:0.625rem;font-weight:var(--w-black);letter-spacing:0.0625rem}
.quiz-ref-page .quiz-foot{padding-top:0.5rem;background:transparent}

.quiz-ref-page .quiz-foot .btn{border:0.125rem solid var(--sticker-ink);background:#68BE83;color:#243F2B;box-shadow:0 0.25rem 0 #3F8155;font-weight:var(--w-black)}
.quiz-ref-page .quiz-foot .btn:active{transform:translateY(0.125rem);box-shadow:0 0.125rem 0 #3F8155}
.quiz-ref-page .quiz-foot .btn:disabled{background:#E5DCCB;border-color:#A49379;color:#93846D;box-shadow:0 0.1875rem 0 #BCAE96}
.quiz-ref-page .option{border:var(--opt-line-w) solid var(--opt-line);border-radius:var(--opt-radius);
  background:var(--opt-hi),var(--opt-fill);color:#4B3626;
  box-shadow:inset 0 0 0 var(--opt-rim-w) var(--opt-rim),0 var(--opt-base-h) 0 var(--opt-base),0 0.5rem 0.75rem var(--opt-shadow)}
.quiz-ref-page .option .key{background:var(--opt-key-bg);border:var(--opt-key-w) solid var(--opt-key-line);color:var(--opt-key-ink)}
.quiz-ref-page .option.correct{border-color:var(--opt-ok-line);background:var(--opt-ok-hi),var(--opt-ok-fill);
  box-shadow:inset 0 0 0 var(--opt-rim-w) var(--opt-ok-rim),0 var(--opt-base-h) 0 var(--opt-ok-base),0 0.5rem 0.75rem var(--opt-shadow)}
.quiz-ref-page .option.wrong{border-color:var(--opt-bad-line);background:var(--opt-bad-hi),var(--opt-bad-fill);
  box-shadow:inset 0 0 0 var(--opt-rim-w) var(--opt-bad-rim),0 var(--opt-base-h) 0 var(--opt-bad-base),0 0.5rem 0.75rem var(--opt-shadow)}
.quiz-ref-page .option.dim{opacity:.55}
.ref-drag-ghost{position:fixed;z-index:1000;pointer-events:none;display:grid;place-items:center;min-width:3rem;min-height:3rem;padding:0.5rem;
  border:0.125rem solid var(--sticker-ink);border-radius:1rem;background:#FFF3C9;color:#4B3626;box-shadow:0 0.5rem 1.25rem rgba(75,54,38,.22);
  font-size:1.25rem;font-weight:var(--w-black);transform:translate(-50%,-50%)}
.ref-drag-ghost svg{width:3.5rem;height:3.5rem;display:block}

/* 统一图片框模板：看图 / 听音 / 喂食 / 进阶题共用同一外框 */
.ref-picture-frame,
.ref-listen-speaker,
.ref-feed-animal,
.ref-action-stage{
  position:relative;width:min(100%,28rem);aspect-ratio:16/10;margin:0 auto;display:grid;place-items:center;
  overflow:hidden;border:0.25rem solid var(--sticker-ink);border-radius:2rem;
  background:linear-gradient(180deg,#DDF3F5 0%,#F6F4D9 62%,#C9DFA1 62%,#B5D18C 100%);
  box-shadow:0 0.375rem 0 #D3B984,0 0.75rem 1.5rem rgba(92,65,29,.14)
}

/* 看图识词 */
.ref-pic-wrap{display:flex;flex-direction:column;flex:1;min-height:0}
.ref-picture-art{position:absolute;inset:0;display:grid;place-items:center;padding:0.5rem}
.ref-picture-art .pic-emoji{font-size:clamp(5rem,20vh,9rem)}
.quiz-ref-page .ref-pic-options{grid-template-columns:repeat(3,1fr);gap:0.75rem;margin-top:0.875rem;flex:none}
.quiz-ref-page .ref-pic-options .option{min-height:4.5rem}
.quiz-ref-page .ref-pic-options .option .word{font-size:clamp(0.85rem,2.8cqh,1.05rem);color:#4B3626;font-weight:var(--w-black);line-height:1.25;overflow-wrap:anywhere;word-break:break-word}

/* 听音戳泡泡 */
.ref-listen-wrap{display:flex;flex-direction:column;flex:1;min-height:0;justify-content:center}
.ref-listen-speaker{flex:none;align-self:center;padding:0;cursor:pointer;
  /* 覆盖统一模板里的 place-items，改用 flex 居中 speaker 图标 */
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.5rem;
  background:linear-gradient(180deg,#FFF8DC 0%,#F6E4B5 100%)}
.ref-listen-speaker:active{transform:scale(.94)}
.ref-listen-speaker .ref-toast-art{width:4rem;height:4rem;filter:drop-shadow(0 0.375rem 0 rgba(92,65,29,.15))}
.ref-listen-speaker>span{position:relative;bottom:auto;padding:0.375rem 0.875rem;border:0.09375rem solid var(--sticker-line);border-radius:6.1875rem;
  background:#FFFDF6;color:#765733;font-size:0.6875rem;font-weight:var(--w-bold);white-space:nowrap;box-shadow:0 0.125rem 0 var(--sticker-shade)}
.ref-listen-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0.625rem;width:min(100%,30rem);margin:0.75rem auto 0;flex:none;
  height:var(--q-opt-h,clamp(4.25rem,11cqh,5.75rem));min-height:0}
.ref-listen-card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.25rem;
  border:0.1875rem solid var(--sticker-line);border-radius:1.25rem;background:var(--sticker-paper);box-shadow:0 0.25rem 0 var(--sticker-shade);cursor:pointer;
  padding:0.375rem 0.375rem;transition:transform .12s ease,box-shadow .12s ease}
.ref-listen-card:active{transform:translateY(0.125rem);box-shadow:0 0.125rem 0 var(--sticker-shade)}
.ref-listen-card.sel{border-color:#D8A646;box-shadow:0 0 0 0.1875rem rgba(216,166,70,.25),0 0.25rem 0 var(--sticker-shade);background:#FFF9E8}
.ref-listen-card.ok{border-color:#68A873;background:#EAF7E3;box-shadow:0 0.25rem 0 #9AC78B}
.ref-listen-card.wrong{border-color:#D87B68;background:#FFF0EA;box-shadow:0 0.25rem 0 #E5AA9B}
.ref-listen-card-art{width:clamp(2.25rem,7cqh,3.25rem);height:clamp(2.25rem,7cqh,3.25rem);display:grid;place-items:center}
.ref-listen-card-art .listen-card-img{width:100%;height:100%;object-fit:contain;display:block}
.ref-listen-card-art .listen-card-emoji{width:100%;height:100%;place-items:center}
.ref-listen-mark{position:absolute;top:-0.5rem;right:-0.5rem;width:1.375rem;height:1.375rem;display:grid;place-items:center;
  border-radius:50%;background:#4FA55E;color:#fff;font-style:normal;font-weight:var(--w-black);font-size:0.8125rem;line-height:1;
  box-shadow:0 0.0625rem 0.25rem rgba(60,40,10,.2);z-index:2}
.ref-listen-mark.bad{background:#E8604A;color:#fff}

/* 情景对话：动物园贴纸对话框（角色头像 + 名字牌 + 气泡尾巴 + 场景小装饰） */
.ref-dialog-card{position:relative;display:flex;flex-direction:column;gap:0.75rem;flex:none}
/* 角落藤叶 / 草地 / 脚印：只在动物园场景渲染，放在气泡下层 */
.ref-dialog-zoo{position:absolute;inset:0;pointer-events:none;z-index:0}
.ref-dialog-zoo svg{position:absolute;display:block}
.ref-dialog-zoo .zd-vine{top:-0.75rem;right:-0.5rem;width:5.25rem}
.ref-dialog-zoo .zd-paws{bottom:-0.5rem;left:-0.375rem;width:4.25rem;opacity:.9}
.ref-dialog-zoo .zd-grass{bottom:-0.375rem;right:0.5rem;width:3.25rem;opacity:.9}
.ref-dialog-row{position:relative;z-index:1;display:flex;align-items:flex-end;gap:0.75rem}
.ref-dialog-row.reply{justify-content:flex-end}
.ref-dialog-person{width:4.5rem;height:5.75rem;flex:none;display:grid;place-items:end center}
.ref-dialog-person .ref-keeper-art{width:100%;height:100%;display:block}
/* 动物朋友头像：方形贴纸框，和小朋友头像区分 */
.ref-dialog-person.person--animal{width:4.25rem;height:4.25rem;margin-bottom:0.25rem;padding:0.2rem;place-items:center;
  border:0.125rem solid var(--sticker-ink);border-radius:1.25rem;background:#F3FBE6;box-shadow:0 0.25rem 0 #B9D3A2}
.ref-dialog-person.person--animal .ref-zoo-art{width:100%;height:100%;display:block}
.ref-dialog-bubble{position:relative;display:flex;align-items:center;gap:0.5rem;flex:1;max-width:calc(100% - 5.5rem);min-height:4rem;padding:0.95rem 0.75rem 0.7rem;
  border:0.125rem solid var(--sticker-ink);border-radius:1.25rem 1.25rem 1.25rem 0.25rem;background:var(--sticker-paper);box-shadow:0 0.25rem 0 var(--sticker-shade)}
/* 气泡小尾巴，指向说话的角色 */
.ref-dialog-bubble::after{content:"";position:absolute;left:-0.4rem;bottom:0.5rem;width:0.65rem;height:0.65rem;background:var(--sticker-paper);
  border-left:0.125rem solid var(--sticker-ink);border-bottom:0.125rem solid var(--sticker-ink);border-bottom-left-radius:0.2rem;transform:rotate(45deg)}
.ref-dialog-row.reply .ref-dialog-bubble{border-radius:1.25rem 1.25rem 0.25rem 1.25rem;background:#FFF0F3}
.ref-dialog-row.reply .ref-dialog-bubble::after{left:auto;right:-0.4rem;border-left:0;border-bottom:0;
  border-right:0.125rem solid var(--sticker-ink);border-bottom:0.125rem solid var(--sticker-ink);border-bottom-left-radius:0;border-bottom-right-radius:0.2rem}
.ref-dialog-bubble p{flex:1;min-width:0;font-size:0.9375rem;font-weight:var(--w-bold);line-height:1.4;color:#4B3626}
/* A 的提问气泡：点击即可朗读整句，右下角附迷你喇叭角标提示可点读 */
.ref-dialog-ask{cursor:pointer;-webkit-tap-highlight-color:transparent;padding-right:2rem}
.ref-dialog-ask-say{position:absolute;right:0.45rem;bottom:0.35rem;width:1.35rem;height:1.35rem;border-radius:50%;
  display:grid;place-items:center;background:#FFF3C9;border:0.09375rem solid #D9B773;pointer-events:none;opacity:.9}
.ref-dialog-bubble .blank{color:#6B8D46;border-bottom:0.125rem dashed #9DB97B;padding:0 0.125rem}
/* 对话中的动物/食物单词：暖棕色 + 虚线底，帮助小朋友认读 */
.ref-dialog-word{color:#B5651D;font-weight:var(--w-black);
  text-decoration:underline dashed #E0A458;text-underline-offset:0.22em;text-decoration-thickness:0.09em}
/* 名字牌：压在气泡上边缘的小贴纸 */
.ref-dialog-name{position:absolute;top:-0.65rem;left:0.75rem;z-index:2;display:inline-flex;align-items:center;width:auto;height:auto;
  padding:0.0625rem 0.5rem;border:0.09375rem solid var(--sticker-ink);border-radius:999px;background:#FFE49A;color:var(--sticker-ink);
  font-size:0.6875rem;font-weight:var(--w-black);line-height:1.5;white-space:nowrap;box-shadow:0 0.125rem 0 rgba(92,65,29,.28)}
.ref-dialog-row.reply .ref-dialog-name{left:auto;right:0.75rem;background:#FFD9E3}
/* 气泡里的动物照片：小相框 + 轻微倾斜 */
.ref-dialog-pic{width:3rem;height:3rem;flex:none;margin-left:auto;display:grid;place-items:center;padding:0.125rem;
  border:0.09375rem solid var(--sticker-line);border-radius:0.75rem;background:#FFFDF6;box-shadow:0 0.125rem 0 rgba(92,65,29,.16);transform:rotate(3deg)}
.ref-dialog-pic img{width:100%;height:100%;object-fit:contain;display:block}
.ref-dialog-pic svg{width:100%;height:100%}
.quiz-ref-page .ref-dialog-options{flex:1;min-height:9rem}
.quiz-ref-page .ref-dialog-options .option{min-height:3.25rem}
/* 情景对话：整句选项（英文整句，允许换行） */
.quiz-ref-page .ref-dialog-sentences{min-height:0;gap:clamp(0.375rem,1.4cqh,0.625rem)}
.quiz-ref-page .ref-dialog-sentences .option{justify-content:flex-start;text-align:left;padding:0.625rem 0.875rem}
.quiz-ref-page .ref-dialog-sentences .option .dlg-sentence{font-size:clamp(0.8125rem,3vw,1rem);line-height:1.35;font-weight:var(--w-bold);white-space:normal;overflow-wrap:anywhere}
/* 整句选项关键词提示：暖橙色的虚线下划线，帮助低龄用户抓住重点词 */
.quiz-ref-page .ref-dialog-sentences .dlg-key{color:#C1652F;text-decoration-line:underline;text-decoration-style:dashed;
  text-decoration-thickness:0.1em;text-underline-offset:0.2em;text-decoration-color:rgba(193,101,47,.55)}
/* 情景对话：图片选项（复用通用图片卡片样式） */
.ref-dialog-image-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0.625rem;width:100%;flex:1;min-height:0;align-content:center}
.ref-dialog-image-grid .ref-listen-card{min-height:clamp(4.5rem,15cqh,6.5rem);padding:0.5rem}
.ref-dialog-reply.pending{color:#9C8666;letter-spacing:0.08em}
/* 结算卡：整句正确答案换行展示，右侧喇叭保持垂直居中 */
.zoo-answer-box.is-sentence{align-items:center}
.zoo-answer-box.is-sentence .zoo-answer-label{padding-top:0.1875rem}
.zoo-answer-box.is-sentence .zoo-answer-word{flex:0 1 auto;min-width:0;font-size:clamp(1rem,3.6vw,1.25rem);line-height:1.35;white-space:normal;overflow-wrap:anywhere}
/* 整句答案：英文与中文分列两行展示 */
.zoo-answer-box.is-sentence .zoo-meaning-text{padding-top:0.125rem;font-size:0.9375rem;line-height:1.35}

/* 动物喂食 */
.quiz-ref-page .ref-feed-wrap{flex:1;min-height:0;justify-content:center;gap:1rem}
.ref-feed-animal{flex:none;padding:1rem 1.5rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.5rem;
  cursor:pointer;transition:background .15s ease,transform .15s ease}
.ref-feed-animal.drop-ready{background:#FFF0C9;transform:scale(1.03)}
.ref-hint{flex:none;margin:0;min-height:3.4rem;display:flex;align-items:center;justify-content:center;color:#806039;text-align:center;line-height:1.35;font-size:clamp(1.22rem,4.2vw,1.41rem);font-weight:var(--w-bold)}
.quiz-ref-page .fd-foods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0.75rem;width:min(100%,24rem);margin-top:0}
.quiz-ref-page .fd-food{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.125rem;width:auto;height:7.2rem;padding:0.375rem;
  border:0.125rem solid var(--sticker-line);border-radius:1.25rem;background:var(--sticker-paper);box-shadow:0 0.25rem 0 var(--sticker-shade);touch-action:none;user-select:none}
.quiz-ref-page .fd-food.selected{border-color:#D8A646;background:#FFF5D9;box-shadow:0 0 0 0.1875rem rgba(216,166,70,.2),0 0.25rem 0 var(--sticker-shade)}
.quiz-ref-page .fd-food.correct{border-color:#68A873;background:#EAF7E3;box-shadow:0 0.25rem 0 #9AC78B}
.ref-food-art{width:5.4rem;height:5.4rem;display:grid;place-items:center}
.fd-food small{max-width:100%;color:#6A4C2D;font-size:0.75rem;font-weight:var(--w-bold);line-height:1.2;overflow-wrap:anywhere;word-break:break-word;text-align:center}

@media (min-width:48rem){
  .ref-quiz-body{padding-left:2rem;padding-right:2rem}
  .ref-pic-options,.ref-listen-grid,.ref-dialog-options{width:min(100%,38rem);align-self:center}
  .ref-dialog-card{width:min(100%,38rem);align-self:center}
}
@media (max-height:45rem){
  .ref-stage-head{margin-top:0.5rem;margin-bottom:0.375rem}
  .ref-stage-badge{width:2.5rem;height:2.5rem}
  .ref-stage-head h2{font-size:1.0625rem}
  .ref-picture-art{padding:0.25rem}
  .ref-listen-speaker .ref-toast-art{width:3rem;height:3rem}
  .quiz-ref-page .fd-food{height:6rem}
  .ref-food-art{width:4.5rem;height:4.5rem}
}

/* ===== 情景对话 A：整句选项外的独立点读喇叭 ===== */
.quiz-ref-page .ref-dialog-opt-row{display:flex;align-items:stretch;gap:0.5rem}
.quiz-ref-page .ref-dialog-opt-row .option{flex:1 1 auto;min-width:0}
.dlg-opt-say{
  flex:0 0 auto;align-self:center;
  display:inline-flex;align-items:center;justify-content:center;
  width:2.6rem;height:2.6rem;border-radius:50%;
  background:#FFE9A8;border:0.125rem solid #5C411D;
  box-shadow:0 0.2rem 0 #C9A24A;
  cursor:pointer;transition:transform .12s ease,box-shadow .12s ease;
}
.dlg-opt-say:active{transform:translateY(0.14rem);box-shadow:0 0.06rem 0 #C9A24A}
.dlg-opt-say.is-shaking{animation:dlgSayShake .5s ease-in-out}
@keyframes dlgSayShake{
  0%,100%{transform:rotate(0)}
  25%{transform:rotate(-12deg)}
  75%{transform:rotate(12deg)}
}
/* ===== 情景对话 B：玩家小恐龙（纯展示） ===== */
.ref-dialog-person.person--player .ref-dialog-dino{
  width:100%;height:100%;display:block;
  object-fit:contain;object-position:center bottom;
}
/* ===== 提示行原地变身「选好了」确认按钮（零高度变化、不破坏底部托盘） ===== */
.ref-hint.has-confirm{padding:0}
.ref-confirm-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:0.35rem;
  height:3.15rem;width:min(82%,20rem);min-width:14rem;padding:0 2.5rem;border-radius:999px;
  border:0.16rem solid #246E43;border-bottom-width:0.38rem;
  background:linear-gradient(180deg,#52C37B 0%,#339D5B 100%);
  color:#FFFFFF;font-size:1.15rem;font-weight:var(--w-black);letter-spacing:0.06em;white-space:nowrap;
  box-shadow:0 0.3rem 0.75rem rgba(36,110,67,.24),inset 0 0.14rem 0 rgba(255,255,255,.45);
  cursor:pointer;flex:none;
  transition:transform .12s cubic-bezier(.34,1.56,.64,1),border-bottom-width .08s ease;
  animation:confirmPopIn .26s cubic-bezier(.22,1.4,.42,1) both;
}
.ref-confirm-btn:active{transform:translateY(0.18rem) scale(.96,.94);border-bottom-width:0.16rem}
.ref-confirm-btn.is-inline{
  width:auto;height:2.75rem;min-width:6.8rem;padding:0 1.65rem;font-size:0.98rem;margin-left:auto;
}
@keyframes confirmPopIn{
  0%{opacity:0;transform:scale(.78)}
  100%{opacity:1;transform:scale(1)}
}
/* ===== 新题入场视觉提醒（替代非听力题自动读题，仅未揭晓时播放一次） ===== */
.quiz-ref-page[data-revealed="0"]:not([data-type="listen"]) .ref-hint{
  animation:hintCueIn .38s ease both;
}
.quiz-ref-page[data-revealed="0"]:not([data-type="listen"]) .ref-dialog-ask-say{
  animation:speakerCuePulse 1.05s ease-out .16s 1;
}
@keyframes hintCueIn{
  0%{opacity:0;transform:translateY(0.25rem)}
  100%{opacity:1;transform:translateY(0)}
}
@keyframes speakerCuePulse{
  0%{transform:scale(1);box-shadow:0 0 0 0 rgba(244,185,66,.55)}
  40%{transform:scale(1.1);box-shadow:0 0 0 0.55rem rgba(244,185,66,0)}
  100%{transform:scale(1);box-shadow:0 0 0 0 rgba(244,185,66,0)}
}
/* ===== 情景对话 C：食物飞入提问动物 + 动物开吃 ===== */
.dialog-food{
  position:fixed;z-index:70;width:2.2rem;height:2.2rem;object-fit:contain;
  transform:translate(-50%,-50%);
  transition:transform .5s cubic-bezier(.4,0,.2,1),opacity .5s ease;
  pointer-events:none;
}
.ref-dialog-ask.is-eating img{animation:dialogEatNod .45s ease-in-out 2}
@keyframes dialogEatNod{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-.18rem) scale(1.05)}
}

/* ============================================================
   DinoGo · 恐龙英语 — dex：恐龙图鉴
   ============================================================ */

/* ------------------------------------------------ dex */
.dex-count{display:flex;align-items:baseline;gap:0.125rem;font-size:0.875rem;font-weight:var(--w-black);color:var(--green-d);
  background:#fff;border:0.09375rem solid var(--line);border-radius:0.8125rem;padding:0.375rem 0.625rem;box-shadow:0 0.25rem 0.625rem rgba(94,70,30,.06);flex:none}
.dex-count span{font-size:0.6875rem;color:var(--muted);font-weight:var(--w-mid)}
.dex-sum{border-radius:1.375rem;padding:0.8125rem 0.9375rem;display:flex;align-items:center;gap:0.8125rem}
.dex-sum .ds-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:0.4375rem}
.dex-sum .ds-row b{font-size:0.75rem;font-weight:var(--w-bold)}
.dex-sum .ds-row span{font-size:0.6875rem;font-weight:var(--w-black);color:var(--green-d)}
.dex-sum .ds-foot{display:flex;align-items:center;gap:0.25rem;margin-top:0.4375rem;font-size:0.65625rem;font-weight:var(--w-mid);color:#A19278}
.dex-sum .ds-badge{width:2.875rem;height:2.875rem;border-radius:0.9375rem;background:#FFF4CE;display:grid;place-items:center;flex:none;color:#B4811C}
.dex-filters{display:flex;gap:0.375rem;margin-top:0.75rem;overflow-x:auto;scrollbar-width:none;padding-bottom:0.125rem}
.dex-filters .f{height:1.875rem;padding:0 0.6875rem;border-radius:0.5625rem;background:#fff;border:0.09375rem solid #EEE2CD;
  font-size:0.71875rem;font-weight:var(--w-mid);color:#8C9B8C;display:flex;align-items:center;white-space:nowrap;flex:none}
.dex-filters .f.on{background:var(--ink);border-color:var(--ink);color:#FFF6DF}

.dex-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0.5625rem;margin-top:0.75rem}
@media (min-width:620px){.dex-grid{grid-template-columns:repeat(3,1fr)}}
.dex-card{border-radius:1.125rem;background:#fff;border:0.09375rem solid var(--line);padding:0.4375rem;text-align:center;position:relative;
  box-shadow:0 0.3125rem 0.75rem rgba(94,70,30,.05);transition:transform .15s ease}
.dex-card:active{transform:scale(.97)}
.dex-card .pic{height:6.75rem;border-radius:0.75rem;display:grid;place-items:center;position:relative;overflow:hidden}
@media (min-width:620px){.dex-card .pic{height:5.25rem}}
.dex-card .pic.t1{background:#EAF7DA}
.dex-card .pic.t2{background:#E6F4FF}
.dex-card .pic.t3{background:#FFF2D8}
.dex-card .pic.t4{background:#F0EBFF}
.dex-card .pic.t5{background:#FFF0E2}
.dex-card .pic svg{width:7rem;height:7rem;margin-bottom:-0.5rem}
@media (min-width:620px){.dex-card .pic svg{width:5.5rem;height:5.5rem}}
.dex-card .nm{font-size:0.6875rem;font-weight:var(--w-bold);margin-top:0.3125rem}
.dex-card .stg{font-size:0.625rem;font-weight:var(--w-mid);color:#A0AE9F;margin-top:0.0625rem;letter-spacing:0.01875rem}
.dex-card.locked .pic{background:#F4EFE3}
/* 未解锁形态用剪影展示，保留神秘感与收集欲 */
.dex-card.locked .pic svg{opacity:.22;filter:brightness(0)}
.dex-card.locked .nm{color:#B3AC9B}
.dex-card .rare{position:absolute;right:0.5rem;top:0.5rem;width:1rem;height:1rem;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:0.625rem;font-weight:var(--w-black);z-index:4;box-shadow:0 0.1875rem 0.375rem rgba(94,70,30,.18)}
.dex-card .rare.r3{background:#7FB4E8}
.dex-card .rare.r4{background:#A78BFA}
.dex-card .rare.r5{background:#F0A23B}
.dex-card .lock-ic{position:absolute;right:0.5625rem;top:0.5625rem;color:#C6BDAA;z-index:4}
.dex-card.current{outline:0.125rem solid rgba(46,139,87,.45);outline-offset:-0.125rem}
.dex-card .now-tag{position:absolute;left:0.5rem;top:0.5rem;font-size:0.59375rem;font-weight:var(--w-black);color:#fff;background:var(--green);
  padding:0.125rem 0.3125rem;border-radius:0.3125rem;z-index:4}
.dex-reward{margin-top:0.875rem;border-radius:1.25rem;padding:0.625rem 0.8125rem;display:flex;align-items:center;gap:0.6875rem;
  background:#fff;border:0.09375rem solid var(--line);box-shadow:0 0.5rem 1.125rem rgba(94,70,30,.07)}
.dex-reward .dr-ic{width:3.25rem;height:3.25rem;border-radius:0.875rem;overflow:hidden;flex:none;position:relative;border:0.0625rem solid rgba(120,75,40,.10)}
.dex-reward .dr-row{display:flex;justify-content:space-between;align-items:baseline;gap:0.5rem}
.dex-reward .dr-row b{font-size:0.71875rem;font-weight:var(--w-black)}
.dex-reward .dr-row span{font-size:0.6875rem;font-weight:var(--w-black);color:var(--green-d);white-space:nowrap}
.dex-reward .bar{height:0.4375rem;margin-top:0.3125rem}
.dex-reward .dr-note{font-size:0.625rem;font-weight:var(--w-read);color:#A19278;margin-top:0.25rem}
.dex-reward .dr-lock{width:1.875rem;height:1.875rem;border-radius:0.625rem;background:#FFF4CE;display:grid;place-items:center;color:#B4811C;flex:none}

/* 究极体机甲形态切换 */
.skin-head{display:flex;align-items:baseline;justify-content:space-between;gap:0.5rem;margin-top:1rem;padding:0 0.125rem}
.skin-head b{font-size:0.8125rem;font-weight:var(--w-black)}
.skin-head span{font-size:0.625rem;font-weight:var(--w-read);color:#A19278;white-space:nowrap}
.skin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0.5625rem;margin-top:0.5rem}
.skin-card{position:relative;border-radius:1.125rem;background:#fff;border:0.09375rem solid var(--line);padding:0.4375rem;text-align:center}
.skin-card:active{transform:scale(.97)}
.skin-card .pic{height:5.75rem;border-radius:0.75rem;background:#E8EEF9;overflow:hidden;display:grid;place-items:center}
.skin-card .pic svg{width:100%;height:100%;transform:scale(1.18) translateY(-3%)}
/* 究极体图鉴：完整展示整只恐龙，不放大裁切 */
.skin-card.form-card .pic svg{transform:none}
.skin-card .nm{font-size:0.6875rem;font-weight:var(--w-bold);margin-top:0.3125rem}
.skin-card .sub{font-size:0.59375rem;font-weight:var(--w-read);color:#A0AE9F;margin-top:0.0625rem}
.skin-card.on{border-color:rgba(46,139,87,.5);box-shadow:0 0.375rem 0.875rem rgba(46,139,87,.13)}
.skin-card .cur{position:absolute;left:0.5rem;top:0.5rem;font-size:0.59375rem;font-weight:var(--w-black);color:#fff;
  background:var(--green);padding:0.125rem 0.3125rem;border-radius:0.3125rem;z-index:4}
.skin-card.locked .pic{background:#F4EFE3}
.skin-card.locked .pic svg{opacity:.22;filter:brightness(0)}
.skin-card.locked .nm,.skin-card.locked .sub{color:#B3AC9B}
.skin-card .lock-ic{position:absolute;right:0.5625rem;top:0.5625rem;color:#C6BDAA;z-index:4}
.buy-tag{position:absolute;right:0.5625rem;top:0.5625rem;display:inline-flex;align-items:center;gap:0.125rem;background:#FFF4CE;color:#B4811C;font-size:0.59375rem;font-weight:var(--w-black);padding:0.125rem 0.3125rem;border-radius:0.375rem;line-height:1;z-index:4}

/* ------------------------------------------------ words */
.words-head{display:flex;align-items:flex-start;gap:0.625rem;margin-bottom:0.625rem}
.words-head h1{font-size:clamp(1.5rem,4vw,1.875rem);font-weight:var(--w-black);letter-spacing:-0.0375rem;line-height:1.05}
.words-head p{font-size:0.6875rem;font-weight:var(--w-read);color:var(--muted);margin-top:0.1875rem}
.words-count{flex:none;display:flex;align-items:baseline;gap:0.125rem;padding:0.375rem 0.625rem;border-radius:0.75rem;background:#E8F5D8;
  font-size:0.9375rem;font-weight:var(--w-black);color:var(--green-d)}
.words-count span{font-size:0.6875rem;color:var(--muted);font-weight:var(--w-bold)}
.wl-bar{display:flex;flex-wrap:wrap;gap:0.25rem;position:sticky;top:0;z-index:3;
  padding:0.375rem 0 0.5625rem;background:linear-gradient(180deg,var(--cream) 78%,rgba(251,243,227,0))}
.wl{flex:none;width:1.5625rem;height:1.5625rem;border-radius:0.5rem;display:grid;place-items:center;
  background:#fff;border:0.09375rem solid #EEE2CD;font-size:0.71875rem;font-weight:var(--w-black);color:#8B7B5C}
.wl.all{width:auto;padding:0 0.625rem}
.wl.on{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 0.25rem 0.5rem rgba(46,139,87,.22)}
.wl.off{opacity:.3}
.word-group{margin-top:0.8125rem}
.wg-letter{display:flex;align-items:center;gap:0.375rem;font-size:0.8125rem;font-weight:var(--w-black);color:var(--green-d);letter-spacing:0.03125rem}
.wg-letter::after{content:"";flex:1;height:0.09375rem;border-radius:0.125rem;background:#EADFC9}
.wg-letter span{font-size:0.625rem;font-weight:var(--w-black);color:#B3A184;background:#F4EFE3;border-radius:0.4375rem;padding:0.0625rem 0.375rem;letter-spacing:0}
.wg-list{display:grid;grid-template-columns:1fr;gap:0.5rem;margin-top:0.4375rem}
.word-row{position:relative;display:flex;align-items:center;gap:0.875rem;padding:0.625rem 0.625rem;min-height:5.125rem;text-align:left;
  background:#fff;border:0.09375rem solid var(--line);border-radius:1rem;box-shadow:0 0.25rem 0.625rem rgba(94,70,30,.04)}
.word-row:active{transform:scale(.985);background:#FBFDF6}
/* 未解锁单词：灰化占位，保留卡片高度与排版 */
.word-row.locked{background:#FAF7F0;border-color:#EDE6D8;box-shadow:none}
.word-row.locked .wr-pic{background:#F1ECE1}
.word-row.locked .wr-line b,.word-row.locked .wr-line i,.word-row.locked .wr-line.sub em{color:#B9AE99}
.wr-pic{width:3rem;height:3rem;border-radius:0.8125rem;background:#F5F9EC;display:grid;place-items:center;overflow:hidden;flex:none}
.wr-main{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:0.375rem}
.wr-line{display:flex;align-items:baseline;justify-content:flex-start;gap:0.25rem;min-width:0}
.wr-line b{font-size:1.375rem;font-weight:var(--w-black);letter-spacing:-0.025rem;line-height:1.12;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:auto}
.wr-line i{font-style:normal;font-size:0.84375rem;font-weight:var(--w-bold);color:var(--ink-2);white-space:nowrap;flex:none}
.wr-line.sub{align-items:center}
.wr-line.sub em{font-style:normal;font-size:0.6875rem;font-weight:var(--w-mid);color:#A19278;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:auto}
.wr-tag{flex:none;font-size:0.625rem;font-weight:var(--w-black);padding:0.1875rem 0.375rem;border-radius:0.375rem;letter-spacing:0.0125rem}
.wr-tag.pos{background:#F2EEE4;color:#8A7B62}
.words-foot{display:flex;align-items:center;gap:0.3125rem;justify-content:center;margin:1rem 0 0.25rem;
  font-size:0.65625rem;font-weight:var(--w-mid);color:#B3A184}
.collect-dex{margin-top:0.125rem}
.collect-dex .dex-sum{margin-top:0}

/* ============================================================
   DinoGo · 恐龙英语 — collect：收藏（背景 / 图鉴）
   ============================================================ */

/* ------------------------------------------------ collect */
.collect-head{display:flex;align-items:flex-start;gap:0.625rem;margin-bottom:0.875rem}
.collect-head h1{font-size:clamp(1.5rem,4vw,1.875rem);font-weight:var(--w-black);letter-spacing:-0.0375rem;line-height:1.1}
.collect-head p{font-size:0.6875rem;font-weight:var(--w-read);color:var(--muted);margin-top:0.25rem}
.collect-preview{height:clamp(11.875rem,26vh,15.625rem);border-radius:1.75rem;position:relative;overflow:hidden;
  background-color:#DDF0CB;
  background-image:url("images/background/jungle.webp");background-size:cover;background-position:center 78%;background-repeat:no-repeat;
  border:0.09375rem solid #D9E7C1;transition:border-color .5s ease}
.collect-preview > .dino{position:absolute;left:50%;top:1.875rem;width:clamp(10rem,22vh,13.125rem);height:clamp(10rem,22vh,13.125rem);transform:translateX(-50%);
  filter:drop-shadow(0 0.75rem 0.875rem rgba(48,104,64,.18));animation:bob 4.6s ease-in-out infinite}
.collect-preview .wearing{position:absolute;left:0.875rem;top:0.875rem;min-height:1.75rem;padding:0 0.625rem;border-radius:6.1875rem;background:#fff;
  display:flex;align-items:center;gap:0.3125rem;font-size:0.6875rem;font-weight:var(--w-bold);color:var(--green-d);
  box-shadow:0 0.25rem 0.625rem rgba(94,70,30,.1);z-index:2}
.collect-preview .pet{position:absolute;right:0.875rem;bottom:0.875rem;display:flex;align-items:center;gap:0.3125rem;
  font-size:0.6875rem;font-weight:var(--w-bold);color:#7B8E77;background:rgba(255,255,255,.82);padding:0.3125rem 0.5625rem;border-radius:6.1875rem;z-index:2}
.collect-preview.bg-jungle{background-image:url("images/background/jungle.webp")}
.collect-preview.bg-sunset{background-image:url("images/background/sunset.webp");background-position:center 74%;border-color:#CFE2DE}
.collect-preview.bg-night{background-image:url("images/background/night.webp");background-position:center 74%;border-color:#E6D8C0}

.collect-tabs{display:flex;align-items:center;gap:1.125rem;padding:0 0.125rem;height:2.75rem;margin-top:0.25rem}
.collect-tabs .tab{font-size:0.875rem;font-weight:var(--w-bold);color:#A3AF9F;position:relative;height:2.75rem;display:flex;align-items:center}
.collect-tabs .tab.on{font-size:0.9375rem;color:var(--ink)}
.collect-tabs .tab.on::after{content:"";position:absolute;left:0;right:0;bottom:0.375rem;height:0.21875rem;border-radius:6.1875rem;background:var(--green)}
.collect-tabs .tab .tb{display:inline-flex;align-items:center;justify-content:center;min-width:0.875rem;height:0.875rem;padding:0 0.25rem;
  border-radius:0.3125rem;background:var(--coral);color:#fff;font-size:0.59375rem;font-weight:var(--w-black);margin-left:0.25rem;vertical-align:0.1875rem}
.collect-tabs .all{margin-left:auto;font-size:0.71875rem;font-weight:var(--w-mid);color:var(--muted);display:flex;align-items:center;gap:0.1875rem}

.bg-grid{display:grid;grid-template-columns:1fr;gap:0.6875rem;margin-top:0.375rem}
@media (min-width:560px){.bg-grid{grid-template-columns:1fr 1fr}}
.bg-item{display:flex;align-items:center;gap:0.6875rem;border-radius:1.25rem;background:#fff;border:0.09375rem solid var(--line);
  padding:0.5625rem;text-align:left;box-shadow:0 0.375rem 0.875rem rgba(94,70,30,.05);transition:transform .15s ease}
.bg-item:active{transform:scale(.98)}
.bg-item .bg-thumb{width:5.5rem;height:3.875rem;border-radius:0.875rem;flex:none;overflow:hidden;position:relative;border:0.0625rem solid rgba(120,75,40,.10)}
.bg-thumb.jungle{background-image:url("images/background/jungle.webp")}
.bg-thumb.sunset{background-image:url("images/background/sunset.webp")}
.bg-thumb.night{background-image:url("images/background/night.webp")}
.bg-thumb.jungle,.bg-thumb.sunset,.bg-thumb.night{background-size:cover;background-position:center 80%;background-repeat:no-repeat}
.bg-item .bg-info b{font-size:0.8125rem;font-weight:var(--w-bold);display:block}
.bg-item .bg-info span{font-size:0.65625rem;color:#9AA89B;display:block;margin-top:0.125rem}
.bg-item .bg-info .price{margin-top:0.3125rem;display:inline-flex;width:fit-content}
.price{display:flex;align-items:center;gap:0.1875rem;font-size:0.78125rem;font-weight:var(--w-black);color:#8A6415}
.price.owned{color:var(--green-d);font-size:0.6875rem;background:#E9F7D9;padding:0.1875rem 0.4375rem;border-radius:0.4375rem}
.bg-item.using{outline:0.125rem solid rgba(46,139,87,.35);outline-offset:-0.125rem}
.bg-item .check-ico{width:1.625rem;height:1.625rem;border-radius:0.5625rem;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}

/* ============================================================
   DinoGo · 恐龙英语 — overlays：弹层 / 设置 / toast
   ============================================================ */

/* ------------------------------------------------ overlays */
.overlay{position:absolute;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(19,38,29,.42);backdrop-filter:blur(0.1875rem);-webkit-backdrop-filter:blur(0.1875rem);animation:fadeIn .2s ease}
.overlay.dialog-wrap{align-items:center}
.sheet{width:100%;max-width:35rem;max-height:88%;overflow-y:auto;overscroll-behavior-y:contain;touch-action:pan-y;background:#FFFBF3;border-radius:1.75rem 1.75rem 0 0;
  padding:1.125rem 1.25rem calc(1.25rem + var(--safe-bottom));box-shadow:0 -1.25rem 3.125rem rgba(20,40,30,.2);
  animation:sheetUp .3s cubic-bezier(.22,.9,.3,1) both}
.sheet .grab{width:2.375rem;height:0.25rem;border-radius:6.1875rem;background:#E0D2B8;margin:0 auto 0.875rem}
.sheet h2{font-size:1.25rem;font-weight:var(--w-black);letter-spacing:-0.01875rem}
.sheet .sheet-sub{font-size:0.71875rem;color:var(--muted);font-weight:var(--w-read);margin-top:0.25rem;line-height:1.6}
.sheet .sheet-actions{display:flex;flex-direction:column;gap:0.5625rem;margin-top:1rem}
.sheet .sheet-actions .btn{min-height:3.125rem;font-size:0.9375rem}
.dialog{width:calc(100% - 2.75rem);max-width:23.75rem;border-radius:1.625rem;background:#FFFBF3;padding:1.375rem 1.25rem 1.125rem;
  box-shadow:0 1.5rem 3.75rem rgba(20,40,30,.25);animation:pop .25s cubic-bezier(.2,1.4,.4,1) both;margin:auto}
.dialog .d-ico{width:3.25rem;height:3.25rem;border-radius:1rem;background:#FFF4CE;display:grid;place-items:center;margin:0 auto}
.dialog .dlg-dino{width:100%;height:8.5rem;border-radius:1rem;background:#E8EEF9;overflow:hidden;display:grid;place-items:center}
.dialog .dlg-dino svg{width:100%;height:100%}
.dialog h3{font-size:1.125rem;font-weight:var(--w-black);text-align:center;margin-top:0.625rem}
.dialog p{font-size:0.71875rem;color:var(--muted);font-weight:var(--w-read);text-align:center;line-height:1.65;margin-top:0.375rem}
.dialog .d-actions{display:flex;gap:0.5rem;margin-top:1rem}
.dialog .d-actions .btn{min-height:2.875rem;font-size:0.875rem}
.dialog .d-actions .btn.ghost{flex:1}
.dialog .d-actions .btn:not(.ghost){flex:1.3}
.setting-row{display:flex;align-items:center;gap:0.75rem;min-height:3.375rem;border-bottom:0.0625rem solid #F2E8D6}
.setting-row:last-child{border-bottom:0}
.setting-row .s-ic{width:2.125rem;height:2.125rem;border-radius:0.6875rem;background:#F4EFE3;display:grid;place-items:center;color:#7E8D7C;flex:none}
.setting-row .s-txt{flex:1}
.setting-row .s-txt b{display:block;font-size:0.8125rem;font-weight:var(--w-bold)}
.setting-row .s-txt span{display:block;font-size:0.65625rem;color:#A19278;margin-top:0.0625rem}
.switch{width:2.875rem;height:1.75rem;border-radius:6.1875rem;background:#DCCFB7;position:relative;flex:none;transition:background .2s ease}
.switch::after{content:"";position:absolute;left:0.1875rem;top:0.1875rem;width:1.375rem;height:1.375rem;border-radius:50%;background:#fff;box-shadow:0 0.125rem 0.3125rem rgba(120,75,40,.18);transition:transform .2s ease}
.switch.on{background:var(--green)}
.switch.on::after{transform:translateX(1.125rem)}
.install-step{display:flex;gap:0.625rem;margin-top:0.75rem;align-items:flex-start}
.install-step .n{width:1.375rem;height:1.375rem;border-radius:0.4375rem;background:var(--green);color:#fff;font-size:0.6875rem;font-weight:var(--w-black);display:grid;place-items:center;flex:none;margin-top:0.0625rem}
.install-step p{font-size:0.71875rem;line-height:1.65;color:#5F7364;font-weight:var(--w-read)}
.install-step p b{color:var(--ink)}
.install-note{margin-top:0.875rem;border-radius:0.875rem;background:#F5F0E3;padding:0.625rem 0.75rem;font-size:0.6875rem;line-height:1.6;color:#8E7D60;font-weight:var(--w-read)}
.word-sheet .word-art{width:5.5rem;height:5.5rem;margin:0.625rem auto 0;display:grid;place-items:center;flex:none;
  background:#F5F9EC;border:none;border-radius:1.375rem;box-shadow:inset 0 0 0 0.09375rem #E7F0D8}
.word-sheet .word-art svg{width:84%;height:84%;display:block}
.word-sheet .word-art:active{transform:scale(.96)}
.word-sheet .word-big{display:block;margin:0.5rem auto 0;padding:0;border:none;background:none;
  font-family:inherit;font-size:2.25rem;font-weight:var(--w-black);letter-spacing:-0.0625rem;color:var(--ink);line-height:1.1}
.word-sheet .word-big:active{transform:scale(.97)}
.word-sheet .word-phon{font-size:0.8125rem;color:#A68A4E;margin-top:0.125rem;font-weight:var(--w-read);text-align:center}
.word-sheet .word-zh{font-size:0.875rem;color:#5F7364;margin-top:0.375rem;font-weight:var(--w-mid);text-align:center}
.word-sheet .speak-btn{margin-top:0.875rem;transition:all .15s ease}
.word-sheet .speak-btn.recording{background:linear-gradient(180deg,#F58C7C,#DC5E46);box-shadow:0 0.25rem 0 #B23F2C,0 0.5rem 0.875rem rgba(220,94,70,.25)}
.rec-dot{display:inline-block;width:0.5625rem;height:0.5625rem;border-radius:50%;background:#fff;margin-right:0.1875rem;
  animation:recPulse .9s ease-in-out infinite}
@keyframes recPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.word-sheet .tip{margin-top:0.75rem;font-size:0.9375rem;font-weight:var(--w-read);letter-spacing:0.00625rem;color:#857455;text-align:center;line-height:1.7}

/* toast */
.toast-root{position:absolute;left:0;right:0;bottom:calc(5.875rem + var(--safe-bottom));z-index:120;display:flex;flex-direction:column;align-items:center;gap:0.375rem;pointer-events:none;padding:0 1.25rem}
.toast{background:rgba(25,46,36,.94);color:#FFF6E2;font-size:0.75rem;font-weight:var(--w-mid);padding:0.625rem 0.875rem;border-radius:0.75rem;
  box-shadow:0 0.625rem 1.5rem rgba(20,40,30,.25);animation:toastIn .25s ease both;max-width:100%;text-align:center}
.toast.out{animation:toastOut .25s ease both}

/* ============================================================
   ★ Dingo 恐龙转盘（DINO SPIN 抽屉升级版）
   ============================================================ */

.lucky-wheel-sheet{position:relative;max-width:26.5rem;text-align:center;padding:0.45rem 0.45rem calc(0.45rem + var(--safe-bottom));
  background:linear-gradient(180deg,#F3FAEF 0%,#FFFDF7 48%,#FBF3E3 100%);overflow-x:hidden}
/* 内层虚线纸框：贴在内容上一起滚动，始终完整包住转盘、按钮和记录 */
.lw-paper{position:relative;padding:0.35rem 0.55rem 0.85rem;border:0.125rem dashed #E4CFA9;border-radius:1.45rem}

/* 右上角关闭 */
.lw-close{position:absolute;right:0.75rem;top:0.75rem;z-index:12;width:1.95rem;height:1.95rem;border-radius:50%;
  display:grid;place-items:center;background:#FFFDF7;border:0.125rem solid #5C411D;
  box-shadow:0 0.15rem 0 #5C411D;padding:0}
.lw-close:active{transform:translateY(0.1rem);box-shadow:0 0.05rem 0 #5C411D}

/* 顶部标题与胶囊 */
.lw-head{position:relative;padding-top:0.125rem}
.lw-head h2{font-size:1.5rem;font-weight:var(--w-black);color:var(--ink);letter-spacing:0.04rem;
  text-shadow:0 0.125rem 0 rgba(255,255,255,.9)}
/* Dingo 使用站酷快乐体，字号略大，做出标识感 */
.lw-brand{font-family:var(--font-brand);font-size:1.85rem;letter-spacing:0.03rem;
  color:var(--green);text-shadow:0 0.125rem 0 #E9F7D9,0 0.2rem 0 rgba(30,107,71,.16)}
.lw-head p{font-size:0.71875rem;color:var(--ink-2);font-weight:var(--w-mid);line-height:1.5;margin-top:0.2rem}
.lw-deco{position:absolute;color:#E8A23C;line-height:1}
.lw-deco.d1{left:5%;top:0;font-size:1rem;transform:rotate(-12deg)}
.lw-deco.d2{right:6%;top:0.35rem;font-size:0.85rem;transform:rotate(14deg)}

.lw-chips{display:flex;justify-content:center;gap:0.5rem;margin-top:0.55rem}
.lw-chip{display:inline-flex;align-items:center;gap:0.25rem;height:1.85rem;padding:0 0.75rem;border-radius:6.1875rem;
  background:#FFFDF7;border:0.125rem solid #E4CFA9;box-shadow:0 0.1875rem 0 #E4CFA9;
  font-size:0.75rem;font-weight:var(--w-bold);color:var(--ink)}
.lw-chip i{font-style:normal;font-size:0.85rem;color:#E8A23C}
.lw-chip b{font-size:0.92rem;color:var(--green-d);font-weight:var(--w-black)}
.lw-chip.free{background:#E9F7D9}

/* 萌趣恐龙大转盘舞台（加宽比例：82vw / 19.5rem）
   底部留白 = 底座溢出 1.25rem + 1rem，与按钮到抽奖记录的间距保持一致 */
.lw-stage{position:relative;width:min(82vw,19.5rem);height:min(82vw,19.5rem);margin:1rem auto 2.25rem;
  display:flex;align-items:center;justify-content:center}
.lw-stand{position:absolute;bottom:-1.25rem;width:6.25rem;height:2.5rem;z-index:1;
  background:linear-gradient(180deg,#C9A06B 0%,#AC8350 100%);
  border:0.1875rem solid #5C411D;border-radius:0.75rem 0.75rem 1.25rem 1.25rem;
  box-shadow:inset 0 0.25rem 0 rgba(255,255,255,.25),0 0.35rem 0.7rem rgba(92,65,29,.2)}
.lw-rim{position:relative;width:100%;height:100%;border-radius:50%;padding:0.875rem;z-index:2;
  background:radial-gradient(circle at 30% 30%,#FFF8E6,#F0DCB6 62%,#DCC196 100%);
  border:0.25rem solid #5C411D;
  box-shadow:0 0.45rem 0 #C2A578,0 0.85rem 1.35rem rgba(92,65,29,.2),inset 0 0.2rem 0.4rem rgba(255,255,255,.8)}

/* 16 颗跑马灯灯泡（SVG 定位，无 resize 监听） */
.lw-bulbs{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.lw-bulb-a{animation:lwBulbA .9s infinite alternate}
.lw-bulb-b{animation:lwBulbB .9s infinite alternate}
.lw-rim.spinning-fast .lw-bulb-a,.lw-rim.spinning-fast .lw-bulb-b{animation-duration:.22s}
@keyframes lwBulbA{0%{fill:#FFFDF7;opacity:1}100%{fill:#F4D9A0;opacity:.5}}
@keyframes lwBulbB{0%{fill:#F6E4C0;opacity:.5}100%{fill:#FFFDF7;opacity:1}}

/* 旋转盘面 */
.lw-disc{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;
  border:0.1875rem solid #5C411D;background:#FFFDF7;will-change:transform;
  box-shadow:inset 0 0 0.7rem rgba(92,65,29,.16)}
.lw-disc svg{width:100%;height:100%;display:block}

/* 顶部卡通红指针 + 跨扇区弹跳 */
.lw-pointer{position:absolute;left:50%;top:-0.85rem;z-index:6;width:2.35rem;height:2.85rem;
  transform:translateX(-50%);transform-origin:50% 0.9rem;
  filter:drop-shadow(0 0.25rem 0.2rem rgba(90,60,20,.28))}
.lw-pointer.ticking{animation:lwPtrTick .16s ease-out}
@keyframes lwPtrTick{
  0%{transform:translateX(-50%) rotate(0deg)}
  35%{transform:translateX(-50%) rotate(-24deg)}
  70%{transform:translateX(-50%) rotate(8deg)}
  100%{transform:translateX(-50%) rotate(0deg)}
}

/* 中心恐龙尾巴徽章 */
.lw-hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;
  width:3.35rem;height:3.35rem;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#FFFDF7,#E9F7D9);
  border:0.1875rem solid #5C411D;
  box-shadow:0 0.2rem 0.45rem rgba(92,65,29,.2),inset 0 0.15rem 0.2rem rgba(255,255,255,.85)}

/* 3D 果冻 SPIN 按钮 */
.lw-spin-btn{position:relative;min-height:3.25rem;border-radius:1.4rem;
  background:linear-gradient(180deg,#3FA46A 0%,#2E8B57 55%,#26794C 100%);
  border:0.1875rem solid #1E6B47;color:#FFF;font-size:1.125rem;font-weight:var(--w-black);
  letter-spacing:0.03rem;text-shadow:0 0.0625rem 0 rgba(23,76,53,.45);
  box-shadow:0 0.35rem 0 #1E6B47,0 0.5rem 0 #16543A,0 0.75rem 1.1rem rgba(30,107,71,.22),inset 0 0.2rem 0.3rem rgba(255,255,255,.35)}
.lw-spin-btn:active:not(:disabled){transform:translateY(0.22rem);
  box-shadow:0 0.125rem 0 #1E6B47,0 0.28rem 0 #16543A}
.lw-spin-btn:disabled{filter:grayscale(.35);opacity:.8}

/* 抽屉内中奖喜报浮层 */
.lw-win-mask{position:fixed;inset:0;z-index:95;display:grid;place-items:center;padding:1rem;
  background:rgba(29,58,46,.5);backdrop-filter:blur(0.1875rem)}
.lw-win-card{width:min(100%,19.5rem);padding:1.25rem 1rem 1rem;text-align:center;border-radius:1.4rem;
  background:linear-gradient(180deg,#FFFDF7 0%,#FBF3E3 100%);
  border:0.2rem solid #5C411D;box-shadow:0 0.45rem 0 #E4CFA9;
  animation:pop .32s cubic-bezier(.34,1.56,.64,1) both}
.lw-win-ribbon{display:inline-block;margin:-2.1rem 0 0.5rem;padding:0.25rem 1rem;border-radius:999px;
  background:linear-gradient(180deg,#3FA46A,#2E8B57);color:#FFF;font-size:0.95rem;font-weight:var(--w-black);
  border:0.15rem solid #1E6B47;box-shadow:0 0.2rem 0 #16543A}
.lw-win-ico{width:4.5rem;height:4.5rem;margin:0.25rem auto;border-radius:1rem;background:#FBF3E3;
  border:0.15rem solid #E4CFA9;display:grid;place-items:center;font-size:2.4rem}
.lw-win-card h3{font-size:1.35rem;color:var(--ink);margin-top:0.35rem}
.lw-win-card p{font-size:0.78rem;color:var(--ink-2);font-weight:var(--w-mid);margin-top:0.2rem}
.lw-win-ok{margin-top:0.85rem;min-height:2.75rem;border-radius:0.95rem;border:0.15rem solid #1E6B47;
  background:linear-gradient(180deg,#3FA46A,#2E8B57);color:#FFF;font-size:0.95rem;font-weight:var(--w-black);
  box-shadow:0 0.25rem 0 #16543A}

/* 礼花纸屑 */
.lw-confetti{position:fixed;width:10px;height:10px;z-index:999;pointer-events:none;
  border:1.5px solid rgba(92,65,29,.75);animation:lwConfettiFall linear forwards}
@keyframes lwConfettiFall{
  0%{transform:translate3d(0,-10vh,0) rotate(0deg);opacity:1}
  85%{opacity:1}
  100%{transform:translate3d(var(--tx),105vh,0) rotate(var(--rot));opacity:0}
}

/* 抽奖记录 */
.lw-history{margin-top:1rem;padding:0.625rem 0.75rem 0.5rem;text-align:left;
  background:rgba(255,253,247,.9);border:0.125rem solid #E4CFA9;border-radius:1.125rem}
.lw-history-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:0.375rem}
.lw-history-head h3{font-size:0.8125rem;font-weight:var(--w-black);color:var(--ink)}
.lw-history-head span{font-size:0.625rem;color:var(--muted);font-weight:var(--w-mid)}
.lw-history-list{list-style:none;margin:0;padding:0;max-height:10.5rem;overflow-y:auto;display:flex;flex-direction:column;gap:0.4375rem;
  -webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;touch-action:pan-y}
.lw-record{display:flex;align-items:center;gap:0.55rem;padding:0.5rem 0.625rem;border-radius:0.8125rem;background:#FFF;
  border:0.0625rem solid #F0E4CE}
.lw-record.used{opacity:.68}
.lw-record .ico{width:1.875rem;height:1.875rem;border-radius:0.5625rem;background:#FBF3E3;
  display:grid;place-items:center;font-size:1rem;flex:none}
.lw-record-main{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:0.0625rem}
.lw-record-main b{font-size:0.8125rem;color:#3E5548;font-weight:var(--w-bold)}
.lw-record-main time{font-size:0.625rem;color:#91A095;font-weight:var(--w-read);white-space:nowrap}
.lw-redeem{flex:none;font-family:inherit;font-size:0.75rem;line-height:1.2;font-weight:var(--w-bold);color:#6B4E1E;
  background:#FBE3B6;border:0.1rem solid #E8A23C;border-radius:6.1875rem;padding:0.42rem 0.85rem;min-height:1.95rem;
  white-space:nowrap;cursor:pointer}
.lw-redeem:active{transform:scale(.94)}
.lw-used{flex:none;font-size:0.71875rem;font-weight:var(--w-mid);color:#97A69B;padding:0 0.25rem;white-space:nowrap}
.lw-confirm{display:flex;gap:0.375rem;flex:none}
.lw-mini{font-family:inherit;font-size:0.75rem;line-height:1.2;font-weight:var(--w-bold);color:#FFF;background:#3FA46A;
  border:0;border-radius:0.5625rem;padding:0.42rem 0.72rem;min-height:1.95rem;white-space:nowrap;cursor:pointer}
.lw-mini.ghost{background:#F2EBDF;color:#8A7550}
.lw-history-empty{padding:0.625rem 0;font-size:0.6875rem;color:#91A095;text-align:center;font-weight:var(--w-read)}

/* ============================================================
   zoo 主题：只覆盖视觉参数与位置，结构与题型引擎复用 game.css
   新增主题时在本目录新建同名 css，并在 index.html 中追加 link 即可
   ============================================================ */

/* 所有带路线图场景的答题页共用变量与安全区布局 */
.quiz-ref-page[data-scene]:not([data-scene=""]){
  /* 背景与顶部偏移由 responsive.css 的场景主题块接管 */

  --opt-line:#956220;--opt-line-w:0.1875rem;
  --opt-rim:#EAB373;--opt-rim-w:0.125rem;
  --opt-base:#C78C28;--opt-base-h:0.25rem;
  --opt-hi:radial-gradient(130% 100% at 12% 0%, #FFF3D8 0%, rgba(255,243,216,0) 46%);
  --opt-fill:linear-gradient(180deg,#FFE7C1 0%,#FDE4BB 72%,#F3D29B 100%);
  --opt-radius:1.0625rem;
  --opt-shadow:rgba(120,80,20,.18);
  --opt-key-bg:#FFF3D2;--opt-key-line:#C79A54;--opt-key-w:0.125rem;--opt-key-ink:#8A6415;

  --opt-ok-line:#5C8F47;--opt-ok-rim:#B9DDA3;
  --opt-ok-hi:radial-gradient(130% 100% at 12% 0%, #F6FFEC 0%, rgba(246,255,236,0) 46%);
  --opt-ok-fill:linear-gradient(180deg,#EDF9DC 0%,#DDF0C2 100%);--opt-ok-base:#9AC78B;

  --opt-bad-line:#C25A48;--opt-bad-rim:#F0B7A8;
  --opt-bad-hi:radial-gradient(130% 100% at 12% 0%, #FFF6F1 0%, rgba(255,246,241,0) 46%);
  --opt-bad-fill:linear-gradient(180deg,#FFF1EA 0%,#FFE0D4 100%);--opt-bad-base:#E5AA9B;
}
/* 竖版：背景放大到纸面 90%，左右框裁切，页头压到纸面内 */
@media (max-aspect-ratio:1/1){
  .quiz-ref-page[data-scene]:not([data-scene=""]){
    padding-top:max(7.5dvh,calc(0.5rem + var(--safe-top)));
  }
}
.quiz-ref-page[data-scene]:not([data-scene=""]) .option:active{
  transform:translateY(0.125rem);
  box-shadow:inset 0 0 0 var(--opt-rim-w) var(--opt-rim),0 0.125rem 0 var(--opt-base);
}
/* 标题块略微放大并下移，避开纸面上沿 */
.quiz-ref-page[data-scene]:not([data-scene=""]) .ref-stage-head{margin-top:1.375rem;margin-bottom:0.625rem}
.quiz-ref-page[data-scene]:not([data-scene=""]) .ref-stage-head h2{font-size:clamp(1.25rem,4.4vw,1.625rem)}
.quiz-ref-page[data-scene]:not([data-scene=""]) .ref-stage-badge{width:3.125rem;height:3.125rem}

/* 纸面安全区：横屏时内容宽度同时受屏宽与屏高约束，保证答题块落在背景纸面以内 */
.quiz-ref-page[data-scene]:not([data-scene=""]){container-type:size;--quiz-w:100%;--pic-w:min(100%,28rem,58cqh)}
.quiz-ref-page[data-scene]:not([data-scene=""]) .ref-quiz-body,
.quiz-ref-page[data-scene]:not([data-scene=""]) .quiz-foot{width:var(--quiz-w);max-width:var(--quiz-w);margin-left:auto;margin-right:auto}
/* 统一图片框宽度：看图 / 听音 / 喂食 / 进阶题共用 --pic-w */
.quiz-ref-page[data-scene]:not([data-scene=""]) .ref-picture-frame,
.quiz-ref-page[data-scene]:not([data-scene=""]) .ref-listen-speaker,
.quiz-ref-page[data-scene]:not([data-scene=""]) .ref-feed-animal,
.quiz-ref-page[data-scene]:not([data-scene=""]) .ref-action-stage{width:var(--pic-w)}
.quiz-ref-page[data-scene]:not([data-scene=""]) .ref-quiz-body{padding-top:1.25rem}
.quiz-ref-page[data-scene]:not([data-scene=""]) .ref-pic-options .option{padding:0 0.5rem;gap:0.375rem}
.quiz-ref-page[data-scene]:not([data-scene=""]) .ref-pic-options .option .word{font-size:clamp(0.9375rem,2.6vw,1.125rem)}
/* 横屏：纸面宽度受限，收窄内容 */
@media (min-aspect-ratio:1/1){
  /* 纸面上边界（背景 cover 缩放后） */
  .quiz-ref-page[data-scene]:not([data-scene=""]){--quiz-w:min(calc(100% - 2.5rem),57cqw,74cqh);
    --paper-top:max(23.4cqh,calc(50cqh - 20.31cqw))}
  .quiz-ref-page[data-scene]:not([data-scene=""])[data-type="pic"]{--quiz-w:min(calc(100% - 2rem),66cqw,78cqh)}
  /* 标题留在纸面外的天空，题卡整体下移到纸面以内 */
  .quiz-ref-page[data-scene]:not([data-scene=""]) .ref-stage-head + *{padding-top:max(0px,calc(var(--paper-top) - 4.5rem))}
}

/* ------------------------------------------------ iPhone 窄屏适配（≤390px） */

  .quiz-ref-page .ref-pic-options .option .word{font-size:0.9375rem}
  .ref-listen-grid{flex:none;min-height:0}

  .ref-listen-card-art{width:clamp(2rem,7vh,2.75rem);height:clamp(2rem,7vh,2.75rem)}
  .option{padding:0 0.5rem;gap:0.375rem}

  .option .word{font-size:clamp(0.75rem,3.5vw,0.9375rem);white-space:normal;overflow-wrap:anywhere;word-break:break-word}

/* ============================================================
   DinoGo · 恐龙英语 — UI 整站重构 + iPad 启蒙新玩法整合层 (v3.0)
   1. 全屏「恐龙树屋营地大厅」首页 (.basecamp-screen)
   2. 「浮空岛游乐场」闯关地图页 (.island-map-screen)
   3. 「去套娃大舞台 + 弧形玩具积木托盘」答题页 (.dino-stage-v2)
   4. 6 大 iPad 优先启蒙新玩法专属舞台样式
   严格锁定原奶油森林色盘（零换色）
   ============================================================ */

/* ---------------- PART 1: 全屏恐龙树屋营地大厅首页 ---------------- */
.basecamp-screen {
  position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden;
  background-color: #DDF2CE; background-size: cover; background-position: center 78%; background-repeat: no-repeat;
  container-type: size; isolation: isolate;
}
.basecamp-screen.bg-jungle { background-image: url("images/background/jungle.webp"); }
.basecamp-screen.bg-sunset { background-image: url("images/background/sunset.webp"); background-position: center 74%; }
.basecamp-screen.bg-night  { background-image: url("images/background/night.webp");  background-position: center 74%; }
.basecamp-screen::before {
  content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background:
    radial-gradient(ellipse 85% 55% at 50% 42%, rgba(255,252,242,.24) 0%, rgba(255,252,242,0) 70%),
    linear-gradient(180deg, rgba(251,243,227,.34) 0%, rgba(251,243,227,0) 32%, rgba(46,107,62,.14) 100%);
}
.basecamp-screen.sky-night::before {
  background:
    radial-gradient(ellipse 85% 55% at 50% 44%, rgba(255,246,210,.08) 0%, transparent 70%),
    linear-gradient(180deg, rgba(16,28,58,.45) 0%, rgba(16,28,58,.12) 45%, rgba(18,36,30,.32) 100%);
}
.bc-hills { position: absolute; left: -12%; right: -12%; bottom: -6%; height: 44cqh; z-index: 2; pointer-events: none; }
.bc-hill { position: absolute; border-radius: 50%; }
.bc-hill.h1 { left: -8%; bottom: 10cqh; width: 68%; height: 28cqh; background: rgba(197,230,166,.62); }
.bc-hill.h2 { right: -10%; bottom: 8cqh; width: 66%; height: 26cqh; background: rgba(173,218,138,.68); }
.bc-hill.h3 {
  left: 4%; right: 4%; bottom: -8cqh; height: 36cqh;
  background: linear-gradient(180deg, rgba(166,214,128,.88) 0%, rgba(132,192,98,.94) 100%);
  box-shadow: inset 0 0.25rem 0 rgba(255,255,255,.35);
}
.basecamp-screen.sky-night .bc-hill.h1 { background: rgba(78,118,92,.42); }
.basecamp-screen.sky-night .bc-hill.h2 { background: rgba(62,102,78,.48); }
.basecamp-screen.sky-night .bc-hill.h3 { background: linear-gradient(180deg, rgba(56,98,72,.82) 0%, rgba(36,72,54,.92) 100%); }

.bc-fern {
  position: absolute; bottom: -0.25rem; width: clamp(4.5rem, 15cqw, 8rem); height: auto;
  z-index: 6; pointer-events: none; transform-origin: bottom center; animation: bcFernSway 5.6s ease-in-out infinite;
}
.bc-fern.left { left: -0.35rem; }
.bc-fern.right { right: -0.35rem; transform: scaleX(-1); animation-name: bcFernSwayR; animation-delay: -2.2s; }
@keyframes bcFernSway  { 0%,100%{transform:rotate(-2.5deg)} 50%{transform:rotate(3.5deg)} }
@keyframes bcFernSwayR { 0%,100%{transform:scaleX(-1) rotate(-2.5deg)} 50%{transform:scaleX(-1) rotate(3.5deg)} }

.bc-hud {
