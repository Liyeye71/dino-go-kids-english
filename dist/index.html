<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#FBF3E3">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DinoGo">
  <meta name="format-detection" content="telephone=no">
  <title>DinoGo · 恐龙英语</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="data/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="data/icons/icon-192.png">
  <!-- 样式按模块拆分，顺序即构建时的内联顺序（build.mjs 直接解析本文件） -->
  <style>
/* ============================================================
   DinoGo · 恐龙英语 — interactive iOS / iPad app
   ============================================================ */

/* 站酷快乐体（子集化：DinoGo/恐龙英语 + 完整英文字母），默认不启用，用时显式设 font-family:var(--font-brand) */
@font-face{
  font-family:"ZCOOL KuaiLe";
  src:url("./font/ZCOOLKuaiLe.woff2") format("woff2");
  font-weight:400;
  font-style:normal;
  font-display:swap;
}

:root{
  --ink:#1D3A2E;
  --ink-2:#4F665A;
  --muted:#87988D;
  --cream:#FBF3E3;
  --paper:#FFFFFF;
  --line:#EDDFC7;
  --green:#2E8B57;
  --green-d:#1E6B47;
  --green-l:#E9F7D9;
  --orange:#FF8A4C;
  --coral:#FF6F61;
  --shadow:0 0.625rem 1.5rem rgba(94,70,30,.08);
  --safe-top:env(safe-area-inset-top,0);
  --safe-bottom:env(safe-area-inset-bottom,0);
  /* 正文默认：圆体链，不包含 ZCOOL KuaiLe */
  --font-round:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",
               "M PLUS Rounded 1c","PingFang SC","HarmonyOS Sans SC",
               "MiSans","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  /* 品牌手写体（按需使用） */
  --font-brand:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --w-read:500;
  --w-mid:700;
  --w-bold:800;
  --w-black:900;
  /* 动物园贴纸体系：从 game/map/overlays 中提取的高频色 */
  --sticker-ink:#5C411D;
  --sticker-paper:#FFFDF7;
  --sticker-line:#E4CFA9;
  --sticker-shade:#D9C39B;
  /* 3D 玩具材质：统一暖棕投影、顶面高光与果冻回弹曲线 */
  --warm-shadow:rgba(120,75,40,.14);
  --warm-edge:#C9A878;
  --pop-ease:cubic-bezier(.34,1.56,.64,1);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* 根字号随屏幕宽高微调：手机上略收紧，iPad / PC 上整体放大，所有 rem 尺寸随之等比缩放 */
html{font-size:clamp(14.75px,min(calc(12px + .9vw),calc(10px + 1.3vh)),18px)}
html,body{position:fixed;inset:0;width:100%;height:100%;margin:0;padding:0;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{
  font-family:var(--font-round);
  font-synthesis:none;letter-spacing:0.00938rem;text-rendering:optimizeLegibility;
  color:var(--ink);background:#EFE5D2;
  -webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,textarea{font:inherit}
svg{display:block}
/* 题面图片禁止浏览器原生拖拽：长按 / 鼠标拖动时不会把图片拖出容器 */
.quiz-ref-page img{
  -webkit-user-drag:none;user-drag:none;
  pointer-events:none;
  -webkit-touch-callout:none;
}
h1,h2,h3,h4,p{margin:0}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ------------------------------------------------ app shell */
.app{
  position:relative;width:100%;max-width:51.25rem;height:100vh;height:100dvh;
  margin:0 auto;background:var(--cream);overflow:hidden;isolation:isolate;
}
.view{position:absolute;inset:0}
.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;
  background:var(--cream);overflow:hidden;
  animation:screenIn .3s cubic-bezier(.22,.9,.3,1) both;
}
.scroll{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
  overscroll-behavior-y:contain;touch-action:pan-y;
  padding:calc(0.875rem + var(--safe-top)) 1.25rem calc(1.875rem + var(--safe-bottom));
}
.has-tab .scroll{padding-bottom:calc(6.5rem + var(--safe-bottom))}

@media (min-width:700px) and (min-height:600px){
  body{
    background:
      radial-gradient(75rem 50rem at 10% -10%,#E4F1D2 0%,rgba(228,241,210,0) 60%),
      radial-gradient(56.25rem 43.75rem at 110% 110%,#F8E3BE 0%,rgba(248,227,190,0) 60%),
      #EFE5D2;
    display:flex;align-items:center;justify-content:center;
  }
  .app{
    height:calc(100dvh - 3rem);max-height:70rem;
    border-radius:2.25rem;border:0.0625rem solid rgba(255,255,255,.65);
    box-shadow:0 2.5rem 5.625rem rgba(45,60,35,.22),0 0.125rem 0 rgba(255,255,255,.8) inset;
  }
  .scroll{padding:calc(1.625rem + var(--safe-top)) 2rem calc(2.125rem + var(--safe-bottom))}
  .has-tab .scroll{padding-bottom:calc(7rem + var(--safe-bottom))}
}

@media (min-width:1000px){
  .app{max-width:55rem}
}

/* ------------------------------------------------ status / tabbar */
.tabbar{
  position:absolute;left:0;right:0;bottom:0;z-index:40;
  height:calc(4.625rem + var(--safe-bottom));
  padding:0.5rem 0.75rem calc(0.5rem + var(--safe-bottom));
  display:flex;align-items:stretch;
  background:rgba(255,251,243,.95);
  border-top:0.09375rem solid #EFE2CB;
  box-shadow:0 -0.625rem 1.5rem rgba(94,70,30,.05);
  backdrop-filter:blur(1.125rem);-webkit-backdrop-filter:blur(1.125rem);
}
.tabbar .tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.1875rem;
  font-size:0.75rem;font-weight:var(--w-mid);color:#97A69B;letter-spacing:0.03125rem;border-radius:0.875rem;
}
.tabbar .tab .ic{width:2.5rem;height:1.875rem;border-radius:0.75rem;display:grid;place-items:center;transition:background .18s ease}
.tabbar .tab.on{color:var(--green-d)}
.tabbar .tab.on .ic{background:#E4F6D5}
.tabbar .tab:active .ic{transform:scale(.94)}

/* ------------------------------------------------ shared atoms */
/* 跨文件复用的原子规则：flex 子项省略布局 / 插画铺满 / 隐藏滚动条 */
.collect-head .t,.bg-item .bg-info,.dex-sum .ds-main,.dex-reward .dr-main,.words-head .t,.gc-main,.evo-unlock .u-txt,.home-top .greet,.growth-panel .g-main,.task .t-body,.profile-head .t,.nc-l{flex:1;min-width:0}
.wr-pic svg,.ref-listen-card-art svg,.ref-child-art,.ref-feed-animal .fd-art svg,.ref-food-art svg{width:100%;height:100%;display:block}
.scroll::-webkit-scrollbar,.dex-filters::-webkit-scrollbar,.quiz-body::-webkit-scrollbar,.result-scroll::-webkit-scrollbar,.evo-page::-webkit-scrollbar,.ref-quiz-body::-webkit-scrollbar{display:none}

.eyebrow{font-size:0.6875rem;font-weight:var(--w-bold);letter-spacing:0.1125rem;color:var(--muted);text-transform:uppercase}
.card{background:var(--paper);border:0.09375rem solid var(--line);border-radius:1.5rem;box-shadow:var(--shadow)}
.btn{
  display:flex;align-items:center;justify-content:center;gap:0.5rem;width:100%;min-height:3.5rem;
  padding:0 1.125rem;border-radius:1.125rem;
  background:linear-gradient(180deg,#3AA56B 0%,#28814F 100%);color:#fff;
  font-size:1.125rem;font-weight:var(--w-bold);letter-spacing:0.0375rem;
  box-shadow:inset 0 0.1875rem 0 rgba(255,255,255,.32),0 0.3125rem 0 #1B6140,0 0.875rem 1.5rem rgba(32,110,70,.24);
  transition:transform .14s var(--pop-ease),box-shadow .12s ease;
}
.btn:active{transform:translateY(0.1875rem) scale(.985);box-shadow:inset 0 0.125rem 0 rgba(255,255,255,.26),0 0.125rem 0 #1B6140,0 0.375rem 0.875rem rgba(32,110,70,.22)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn .hint{font-size:0.78125rem;font-weight:var(--w-mid);letter-spacing:0.01875rem;opacity:.85;background:rgba(255,255,255,.18);padding:0.1875rem 0.5rem;border-radius:6.1875rem}
.btn.yellow{background:linear-gradient(180deg,#FFD766,#F5B62F);color:#4C3306;box-shadow:0 0.3125rem 0 #D6971C,0 0.875rem 1.5rem rgba(214,151,28,.3)}
.btn.ghost{background:#fff;color:var(--green-d);border:0.125rem solid #DDEBD2;box-shadow:0 0.25rem 0 #E3EDD6}

.bar{height:0.75rem;border-radius:6.1875rem;background:#EEE2CD;box-shadow:inset 0 0.125rem 0.25rem rgba(93,68,25,.08);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6.1875rem;background:linear-gradient(90deg,#A9D84B,#3AA56B);position:relative;transition:width .6s cubic-bezier(.22,.9,.3,1)}
.bar>i::after{content:"";position:absolute;left:0.3125rem;right:0.4375rem;top:0.125rem;height:0.1875rem;border-radius:0.5625rem;background:rgba(255,255,255,.55)}

.star-pill{display:flex;align-items:center;gap:0.375rem;height:2.25rem;padding:0 0.75rem 0 0.5625rem;border-radius:6.1875rem;
  background:#fff;border:0.09375rem solid #EFE1C8;box-shadow:0 0.25rem 0.625rem rgba(94,70,30,.07);
  font-size:1rem;font-weight:var(--w-black);letter-spacing:0.01875rem;white-space:nowrap;flex:none;
  font-family:inherit;color:var(--ink);cursor:pointer;transition:transform .12s ease}
.star-pill:active{transform:scale(.94)}
.circle-btn{width:2.375rem;height:2.375rem;border-radius:0.8125rem;background:#fff;border:0.09375rem solid var(--line);
  display:grid;place-items:center;flex:none;color:var(--ink);
  box-shadow:inset 0 0.125rem 0 rgba(255,255,255,.9),0 0.1875rem 0 rgba(201,168,120,.45),0 0.375rem 0.75rem var(--warm-shadow);
  transition:transform .14s var(--pop-ease),box-shadow .12s ease}
.circle-btn:active{transform:translateY(0.09375rem) scale(.94);box-shadow:inset 0 0.0625rem 0 rgba(255,255,255,.8),0 0.0625rem 0 rgba(201,168,120,.45)}

.avatar{width:2.875rem;height:2.875rem;border-radius:1rem;background:#FFF6E2;border:0.125rem solid #fff;
  box-shadow:0 0.3125rem 0.75rem rgba(70,50,20,.14);overflow:hidden;position:relative;flex:none}
/* 头像从恐龙大图裁切头部区域，与 hero 视觉完全一致 */
.avatar .ava-icon{width:100%;height:100%;display:block;object-fit:cover;object-position:center 28%}
/* 环形进化 HUD：头像外圈成长进度环，满格时发暖金呼吸光 */
.avatar.avatar-hud{overflow:visible;border-radius:50%}
.avatar.avatar-hud .avatar-ring{position:absolute;inset:-0.1875rem;width:calc(100% + 0.375rem);height:calc(100% + 0.375rem);
  transform:rotate(-90deg);pointer-events:none;z-index:2}
.avatar.avatar-hud .avatar-ring circle{fill:none;stroke-width:0.1875rem}
.avatar.avatar-hud .ring-bg{stroke:rgba(191,170,132,.38)}
.avatar.avatar-hud .ring-fill{stroke:#7CBF5E;stroke-linecap:round;transition:stroke-dasharray .6s ease}
.avatar.avatar-hud.is-ready .avatar-ring{animation:hudGlow 2.4s ease-in-out infinite}
.avatar.avatar-hud.is-ready .ring-fill{stroke:#F2B53F}
@keyframes hudGlow{0%,100%{filter:drop-shadow(0 0 0 rgba(255,205,110,0))}50%{filter:drop-shadow(0 0 0.3125rem rgba(255,205,110,.85))}}

/* ------------------------------------------------ animations */
@keyframes screenIn{from{opacity:0;transform:translateY(0.5rem)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateY(0.5rem) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(0.375rem)}}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-0.3125rem)}}
@keyframes evoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-0.4375rem)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes starPop{0%{opacity:0;transform:scale(.4) rotate(-20deg)}70%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes dv2SlotRoll{from{transform:translateY(0)}to{transform:translateY(var(--dv2-slot-end))}}
@keyframes dv2Sparkle{0%,100%{transform:scale(1) rotate(-6deg);opacity:.88}50%{transform:scale(1.18) rotate(6deg);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-0.3125rem)}40%{transform:translateX(0.25rem)}60%{transform:translateX(-0.1875rem)}80%{transform:translateX(0.125rem)}}
@keyframes confettiFall{0%{opacity:0;transform:translateY(-1.875rem) rotate(0)}12%{opacity:.9}100%{opacity:.75;transform:translateY(10rem) rotate(240deg)}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}

/* ============================================================
   DinoGo · 恐龙英语 — home：乐园首页 + 随机记单词 + 成长档案
   ============================================================ */

/* ------------------------------------------------ home */
.home-top{display:flex;align-items:center;gap:0.6875rem;margin-top:0.125rem;margin-bottom:0.875rem}
.home-top .greet{flex:1;min-width:0}
.home-top .hi{font-size:1.25rem;font-weight:var(--w-black);letter-spacing:0.0125rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home-top .hi b{color:var(--green)}
.home-top .meta{display:flex;align-items:center;gap:0.25rem;font-size:0.75rem;font-weight:var(--w-read);color:var(--muted);margin-top:0.1875rem;letter-spacing:0.0125rem;white-space:nowrap;line-height:1;min-height:1rem}
.home-top .meta .flame{color:var(--orange);display:flex;align-items:center;justify-content:center;height:1rem;flex:none}
/* 家长角：右上角钥匙，长按 1.5 秒才进入成长档案，防止幼儿误触 */
.parent-gate{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:0.25rem;height:2rem;padding:0 0.625rem;
  border-radius:6.1875rem;background:rgba(255,255,255,.82);border:0.09375rem solid #EBDCC2;color:#7C6B52;
  font-family:inherit;font-size:0.6875rem;font-weight:var(--w-bold);letter-spacing:0.01875rem;
  box-shadow:0 0.125rem 0 rgba(201,168,120,.4),0 0.25rem 0.5rem rgba(120,75,40,.08);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
  transition:transform .14s var(--pop-ease)}
.parent-gate:active{transform:scale(.95)}
.parent-gate svg{flex:none}

.hero{
  position:relative;height:clamp(18.75rem,36vh,24rem);border-radius:1.875rem;overflow:hidden;
  border:0.09375rem solid #D9E8C2;
  background-color:#DDF2CE;
  /* 场景位图：中部留空给恐龙，前景草地承接恐龙站位 */
  background-image:url("images/background/jungle.webp");
  background-size:cover;background-position:center 82%;background-repeat:no-repeat;
  transition:border-color .6s ease;
  container-type:size;
}
.hero .dino-wrap{
  position:absolute;left:50%;bottom:4cqh;
  width:80cqh;height:80cqh;
  transform:translateX(-50%);
  filter:drop-shadow(0 3.6cqh 4.6cqh rgba(48,104,64,.16));
  animation:bob 4.2s ease-in-out infinite;
  z-index:2;
}
.hero .dino-wrap.ultra{filter:drop-shadow(0 0 7.8cqh rgba(255,210,90,.55)) drop-shadow(0 4.2cqh 5.4cqh rgba(48,104,64,.2))}
.hero .hero-id{position:absolute;left:4.2cqh;top:4.2cqh;z-index:4;display:flex;flex-direction:column;align-items:flex-start;gap:1.5cqh}
.hero .stage-tag{position:static;display:inline-flex;align-items:center;gap:0.375rem;height:7.8cqh;padding:0 0.625rem;
  border-radius:6.1875rem;background:rgba(255,255,255,.86);border:0.09375rem solid rgba(255,255,255,.92);
  font-size:0.75rem;font-weight:var(--w-bold);color:var(--green-d);letter-spacing:0.05rem;backdrop-filter:blur(0.25rem);
  box-shadow:0 0.1875rem 0.5rem rgba(80,60,20,.08)}
.hero .name{position:static;display:flex;align-items:center;gap:0.375rem}
.hero .name b{display:block;font-size:2.0625rem;font-weight:var(--w-black);letter-spacing:0.0125rem;line-height:1.15;
  text-shadow:0 0.0625rem 0 rgba(255,255,255,.45),0 0 0.625rem rgba(255,247,224,.85),0 0 1.375rem rgba(255,247,224,.5)}

.growth-panel{
  margin-top:0.75rem;border-radius:1.25rem;background:#fff;
  border:0.09375rem solid #EDF2E3;box-shadow:0 0.375rem 1rem rgba(74,97,50,.08);
  display:flex;align-items:center;gap:0.625rem;padding:0.625rem 0.625rem 0.5625rem 0.875rem;
}
.growth-panel .g-row{display:flex;align-items:baseline;gap:0.375rem;line-height:1.1}
.growth-panel .lb{font-size:0.71875rem;font-weight:var(--w-bold);color:var(--muted);letter-spacing:0.0625rem}
.growth-panel .val{font-size:1.125rem;font-weight:var(--w-black);color:var(--green-d);letter-spacing:0.0125rem}
.growth-panel .val em{font-style:normal;font-size:0.6875rem;color:var(--muted);font-weight:var(--w-mid)}
.growth-panel .g-next{font-size:0.6875rem;line-height:1.2;font-weight:var(--w-read);color:#8A9B8D;margin-top:0.25rem;letter-spacing:0.0125rem;display:flex;justify-content:space-between}
.growth-panel .g-next b{color:var(--orange);font-weight:var(--w-black)}
.growth-panel .g-bar{height:0.5rem;margin-top:0.375rem;background:#F2EEE3;box-shadow:inset 0 0.0625rem 0.1875rem rgba(93,68,25,.1)}
.growth-panel .g-bar>i{background:linear-gradient(90deg,#9FDD4F,#3AA56B 65%,#2E8B57)}
.growth-panel .g-bar>i::before{content:"";position:absolute;right:0.1875rem;top:0.0625rem;width:0.375rem;height:0.375rem;border-radius:50%;
  background:#fff;box-shadow:0 0 0 0.125rem rgba(255,255,255,.45)}
.go-btn{width:2.625rem;height:2.625rem;border-radius:0.875rem;flex:none;display:grid;place-items:center;color:#fff;
  background:linear-gradient(180deg,#3AA56B,#26804E);box-shadow:0 0.25rem 0 #1A5E3D,0 0.5rem 0.875rem rgba(31,107,74,.28)}
.go-btn:active{transform:translateY(0.125rem);box-shadow:0 0.125rem 0 #1A5E3D}
.go-btn.evolve{background:linear-gradient(180deg,#FFCF5C,#F0A92E);box-shadow:0 0.25rem 0 #C98A1C,0 0.5rem 0.875rem rgba(201,138,28,.3);color:#4A3206}

.task{display:flex;align-items:center;gap:0.5625rem;height:2rem}
.task .ico{width:1.8125rem;height:1.8125rem;border-radius:0.625rem;display:grid;place-items:center;flex:none}
.task .ico.orange{background:#FFF0D2;color:#E69523}
.task .ico.blue{background:#E6F4FF;color:#3D8FC4}
.task .ico.coral{background:#FFE7DE;color:#E96A4B}
.task .t-title{font-size:0.84375rem;font-weight:var(--w-mid);line-height:1.35}
.task .t-sub{font-size:0.6875rem;font-weight:var(--w-read);color:#A0AFA3;margin-top:0.125rem;line-height:1.4}
.task .reward{font-size:0.65625rem;font-weight:var(--w-black);color:#A98425;background:#FFF4CE;border-radius:6.1875rem;padding:0.1875rem 0.4375rem;letter-spacing:0.0125rem;white-space:nowrap}
.task .check{width:1.25rem;height:1.25rem;border-radius:50%;border:0.125rem solid #E3D6BF;flex:none;display:grid;place-items:center;color:#fff}
.task.done .check{background:var(--green);border-color:var(--green)}
.task.done .t-title{color:#809184;text-decoration:line-through;text-decoration-thickness:0.09375rem}

/* 今日单词木牌：木纹匾额 + 吊绳 + 顶面高光，玩法与排版保持不变 */
.word-card{min-height:8.75rem;margin-top:0.75rem;border-radius:1.5rem;padding:0.8125rem 1rem;display:flex;align-items:center;gap:0.875rem;
  background:
    repeating-linear-gradient(92deg,rgba(122,82,36,.055) 0 0.09375rem,transparent 0.09375rem 1.375rem),
    linear-gradient(160deg,#F9E3B4 0%,#F0CC8F 56%,#E2B472 100%);
  border:0.1875rem solid #B98B52;
  box-shadow:inset 0 0.1875rem 0 rgba(255,255,255,.55),inset 0 -0.1875rem 0 rgba(154,107,56,.18),
    0 0.375rem 0 #A97B44,0 0.75rem 1.25rem rgba(120,75,40,.18);
  position:relative;overflow:hidden;width:100%;text-align:left;transform:rotate(-0.5deg)}
/* 顶部两条小吊绳 */
.word-card::before,.word-card::after{content:"";position:absolute;top:0;width:0.125rem;height:1rem;border-radius:0.0625rem;
  background:linear-gradient(180deg,#8A6540,rgba(199,154,95,0))}
.word-card::before{left:1.25rem}
.word-card::after{right:1.75rem;height:0.8125rem}
.word-card .ring{display:none}
.word-card .spk{width:3.625rem;height:3.625rem;border-radius:1.125rem;background:#FFF9EA;display:grid;place-items:center;color:#A9761F;
  border:0.125rem solid #C9A26A;box-shadow:0 0.25rem 0 #C08F4C,inset 0 0.125rem 0 #fff;flex:none;position:relative}
.word-card .w-main{flex:1;position:relative;min-width:0;text-align:left}
.word-card .w-kicker{font-size:0.625rem;font-weight:var(--w-black);letter-spacing:0.09375rem;color:#8A5A22;white-space:nowrap}
.word-card .w-word{font-size:2.25rem;font-weight:var(--w-black);letter-spacing:0.025rem;line-height:1.2;color:#4A3208;white-space:nowrap}
.word-card .w-emoji{display:inline-block;margin-right:.25em;font-size:.95em;vertical-align:-.06em}
.word-card .w-pron-row{display:flex;align-items:center;flex-wrap:wrap;column-gap:1.125rem;row-gap:0.25rem;margin-top:0.25rem}
.word-card .w-phon{font-size:0.78125rem;font-weight:var(--w-read);color:#8F6B34;letter-spacing:0.0125rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
@keyframes spk-shake{0%,100%{transform:rotate(0) scale(1)}30%{transform:rotate(-8deg) scale(.94)}65%{transform:rotate(8deg) scale(.94)}}
.word-card .spk:active{animation:spk-shake .24s ease}

/* 恐龙蛋巢：今日任务 + 大转盘的合并入口 */
.nest-entry{position:relative;display:flex;align-items:center;gap:0.75rem;width:100%;margin-top:1rem;padding:0.75rem 0.875rem;
  border-radius:1.375rem;text-align:left;
  background:linear-gradient(160deg,#FFF7E4,#FBE9C6);border:0.125rem solid #EAD3A8;
  box-shadow:inset 0 0.1875rem 0 rgba(255,255,255,.8),0 0.3125rem 0 #E3C89A,0 0.875rem 1.25rem rgba(120,75,40,.12);
  transition:transform .14s var(--pop-ease),box-shadow .12s ease}
.nest-entry:active{transform:translateY(0.1875rem) scale(.99);
  box-shadow:inset 0 0.125rem 0 rgba(255,255,255,.7),0 0.0625rem 0 #E3C89A}
.nest-art{width:3.25rem;height:3.25rem;flex:none;display:grid;place-items:center}
.nest-art svg{width:100%;height:100%;display:block}
.nest-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:0.1875rem}
.nest-tx b{font-size:1.0625rem;font-weight:var(--w-black);color:#5C411D;letter-spacing:0.0125rem}
.nest-tx em{font-style:normal;font-size:0.71875rem;font-weight:var(--w-read);color:#9A7C52;letter-spacing:0.0125rem}
.nest-star{display:flex;align-items:center;gap:0.3125rem;flex:none;font-weight:var(--w-black);color:#8A5A22;font-size:1rem}
.nest-badge{position:absolute;top:-0.375rem;right:-0.3125rem;min-width:1.375rem;height:1.375rem;padding:0 0.25rem;
  border-radius:6.1875rem;background:var(--coral);color:#fff;font-size:0.6875rem;font-weight:var(--w-black);
  display:grid;place-items:center;box-shadow:0 0.125rem 0 #D9543F}

/* 蛋巢抽屉 */
.nest-sheet{padding-bottom:calc(1rem + var(--safe-bottom))}
.nest-sheet-head{display:flex;align-items:center;gap:0.5rem}
.nest-sheet-head h2{font-size:1.375rem;font-weight:var(--w-black)}
.nest-sheet-count{font-size:0.6875rem;font-weight:var(--w-black);color:var(--green-d);background:var(--green-l);
  padding:0.125rem 0.4375rem;border-radius:6.1875rem;letter-spacing:0.01875rem}
.nest-tasks{display:flex;flex-direction:column;gap:0.5rem;margin:0.875rem 0 1rem}
.nest-wheel{margin-top:0.25rem}

/* 成长路径抽屉 */
.growth-list{display:flex;flex-direction:column;gap:0.375rem;margin:0.875rem 0 0.625rem}
.growth-row{display:flex;align-items:center;gap:0.625rem;padding:0.5rem 0.625rem;border-radius:0.875rem;
  background:#FFFDF7;border:0.0625rem solid var(--line)}
.gr-dot{width:0.625rem;height:0.625rem;border-radius:50%;background:#DCCFB7;flex:none;
  box-shadow:inset 0 -0.125rem 0 rgba(120,75,40,.12)}
.growth-row.reached .gr-dot{background:#57AE6C}
.growth-row.current{border-color:#F0C878;background:#FFF8E6;box-shadow:0 0.1875rem 0 #F3DCA6}
.gr-name{flex:1;min-width:0;font-size:0.8125rem;font-weight:var(--w-black);color:var(--ink)}
.gr-name em{font-style:normal;font-size:0.65625rem;font-weight:var(--w-read);color:#A19278;margin-left:0.3125rem}
.gr-min{font-size:0.6875rem;color:#9A7C52;flex:none}
.gr-state{font-size:0.625rem;font-weight:var(--w-black);color:#A19278;flex:none;min-width:2.75rem;text-align:right}
.growth-row.current .gr-state{color:#C98B25}
.ultra-note{margin-top:0.5rem;padding:0.5rem 0.625rem;border-radius:0.75rem;background:#FFF3D6;
  font-size:0.6875rem;color:#8A6415;font-weight:var(--w-read);text-align:center;line-height:1.6}

.home-note{margin:0.75rem 0.25rem 0;font-size:0.6875rem;font-weight:var(--w-read);color:#AC9C80;text-align:center;line-height:1.7;letter-spacing:0.0125rem}

/* ============================================================
   DinoGo · 恐龙英语 — map：旅程进度 / 主题地图 / 下一关
   ============================================================ */

/* ------------------------------------------------ unit tabs */
/* 顶层单元切换：basic 开放 / advance 锁定，位于主题 tab 之上 */
.unit-tabs{display:flex;gap:0.375rem;width:max-content;max-width:100%;margin:0 auto 0.625rem;padding:0.25rem;
  border-radius:6.1875rem;background:#F3EADA;border:0.09375rem solid #E7DAC3;
  box-shadow:inset 0 0.1875rem 0.3125rem rgba(120,90,40,.08),0 0.25rem 0 var(--warm-edge),0 0.5rem 1rem var(--warm-shadow);
  overflow-x:auto;scrollbar-width:none}
.unit-tabs .ut{flex:none;display:flex;align-items:center;gap:0.4375rem;
  padding:0.5625rem 0.875rem;border-radius:6.1875rem;white-space:nowrap;
  background:transparent;border:0;box-shadow:none;font-size:0.875rem;font-weight:var(--w-bold);color:#8B7B5C;
  transition:transform .14s var(--pop-ease),background .18s ease,color .18s ease,box-shadow .12s ease}
.unit-tabs .ut:active{transform:scale(.96)}
.unit-tabs .ut b{font-size:1.0625rem;font-weight:400;line-height:1}
.unit-tabs .ut .ut-en{font-size:0.6875rem;font-weight:var(--w-bold);opacity:.72}
.unit-tabs .ut i{font-style:normal;font-size:0.75rem;line-height:1}
.unit-tabs .ut.on{background:linear-gradient(180deg,#4F9E62,#3F8851);color:#fff;
  box-shadow:inset 0 0.125rem 0 rgba(255,255,255,.3),0 0.25rem 0 #1E6B47,0 0.5rem 0.875rem rgba(52,110,70,.28)}
.unit-tabs .ut.locked{color:#B0A18A}
@media (max-width:480px){
  .unit-tabs{gap:0.25rem;padding:0.25rem;margin-bottom:0.5rem}
  .unit-tabs .ut{gap:0.3125rem;padding:0.4375rem 0.6875rem;font-size:0.8125rem}
  .unit-tabs .ut b{font-size:0.9375rem}
}

/* 锁定单元整卡占位 */
.unit-locked-card{margin:1.5rem auto 0;max-width:22rem;text-align:center;padding:2rem 1.25rem}
.unit-locked-card .ulc-emoji{font-size:3rem;line-height:1;margin-bottom:0.625rem}
.unit-locked-card h3{margin:0 0 0.375rem;font-size:1.0625rem;font-weight:var(--w-black);color:#5C4A2E}
.unit-locked-card p{margin:0;font-size:0.75rem;font-weight:var(--w-read);color:var(--muted);line-height:1.7}

/* 单元地图堆叠：每个主题一张整卡地图入口 */
.unit-maps{display:flex;flex-direction:column;gap:0.875rem;margin-bottom:0.25rem}
.unit-maps .next-card{margin-top:0}
.unit-map-card{display:flex;align-items:center;justify-content:center}

/* ------------------------------------------------ hero */
.map-hero{display:flex;align-items:center;justify-content:space-between;gap:0.625rem;flex-wrap:wrap;padding:0.125rem 0.125rem 0.75rem}
.map-hero .eyebrow{display:inline-flex;align-items:center;gap:0.375rem;color:var(--green);
  font-size:0.65625rem;font-weight:var(--w-black);letter-spacing:0.1125rem;text-transform:uppercase;margin-bottom:0.5rem}
.map-hero .eyebrow i{width:0.375rem;height:0.375rem;border-radius:50%;background:#82A16C}
.map-hero h1{font-size:1.875rem;line-height:1.2;font-weight:var(--w-black);letter-spacing:0.025rem}
.map-hero h1 span{background:linear-gradient(transparent 64%,#FFE08A 64%);padding:0 0.125rem}
.map-hero p{font-size:0.75rem;font-weight:var(--w-read);color:var(--muted);line-height:1.7;margin-top:0.4375rem}

/* 启蒙模式入口：糖果胶囊开关 */
.enlighten-btn{display:flex;align-items:center;gap:0.4375rem;flex:none;margin-left:auto;
  padding:0.25rem 0.5rem 0.25rem 0.3125rem;border-radius:6.1875rem;
  background:#FFE3B0;border:0.1875rem solid #fff;
  box-shadow:0 0.1875rem 0 #E8BE7A,0 0.375rem 0.75rem rgba(232,190,122,.18);
  font-family:inherit;color:inherit;cursor:pointer;text-align:left}
.enlighten-btn:active{transform:translateY(0.125rem);box-shadow:0 0.0625rem 0 #E8BE7A}
.eb-ico{width:1.875rem;height:1.875rem;border-radius:50%;background:#FFF3D6;display:grid;place-items:center;font-size:0.9375rem;flex:none}
.eb-txt{display:flex;flex-direction:column;gap:0.0625rem}
.eb-txt b{font-size:0.8125rem;font-weight:var(--w-black);color:#7A4B12;line-height:1.15}
.eb-txt em{font-style:normal;font-size:0.5625rem;font-weight:var(--w-read);color:#A77835;line-height:1.15}
.eb-switch{position:relative;flex:none;width:2.4rem;height:1.4rem;border-radius:6.1875rem;background:#E4D9C2;transition:background .2s}
.eb-switch i{position:absolute;left:0.125rem;top:0.125rem;width:1.15rem;height:1.15rem;border-radius:50%;background:#fff;
  box-shadow:0 0.0625rem 0.1875rem rgba(122,75,18,.22);transition:transform .2s}
.enlighten-btn.on .eb-switch{background:#FF9EB5}
.enlighten-btn.on .eb-switch i{transform:translateX(1rem)}
@media (max-width:22.5rem){.eb-txt em{display:none}}

/* ------------------------------------------------ journey */
.journey{display:flex;align-items:center;gap:0.625rem;padding:0.6875rem 0.875rem;margin:0.875rem 0;
  background:var(--sticker-paper);border:0.09375rem solid var(--line);border-radius:1.125rem;
  box-shadow:inset 0 0.125rem 0 rgba(255,255,255,.7),0 0.3125rem 0 #E3CFA8,0 0.625rem 1.25rem var(--warm-shadow)}
.journey .j-lb{font-size:0.625rem;font-weight:var(--w-black);color:#947B5A;letter-spacing:0.075rem;white-space:nowrap}
.journey .j-val{font-size:1rem;font-weight:var(--w-black);letter-spacing:0.0125rem;white-space:nowrap}
.journey .j-val em{font-style:normal;font-size:0.65625rem;color:var(--muted);font-weight:var(--w-bold);margin-left:0.125rem}
.journey .track{flex:1;height:0.4375rem;border-radius:6.1875rem;background:#EFE4CE;overflow:hidden}
.journey .track i{display:block;height:100%;border-radius:6.1875rem;
  background:linear-gradient(90deg,#9CCB58,#2E8B57);transition:width .5s cubic-bezier(.22,.9,.3,1)}

/* ------------------------------------------------ map card */
.map-card{position:relative;height:clamp(24.25rem,47vh,29.375rem);border-radius:1.875rem;overflow:hidden;isolation:isolate;
  border:0.09375rem solid var(--line);
  box-shadow:inset 0 0.1875rem 0 rgba(255,255,255,.45),0 0.5rem 0 0 var(--warm-edge),0 1rem 1.75rem var(--warm-shadow)}
.map-card .deco{position:absolute;pointer-events:none;z-index:1}
.map-card .route{position:absolute;inset:0;width:100%;height:100%;z-index:2}

.map-tag{position:absolute;left:0.875rem;top:0.875rem;z-index:4;display:inline-flex;align-items:center;gap:0.3125rem;
  padding:0.375rem 0.6875rem;border-radius:6.1875rem;font-size:0.625rem;font-weight:var(--w-black);letter-spacing:0.075rem;color:#8A7550;
  background:rgba(255,253,247,.88);border:0.0625rem solid rgba(214,198,166,.8);
  backdrop-filter:blur(0.25rem);-webkit-backdrop-filter:blur(0.25rem)}

/* ------------------------------------------------ caption */
.caption{position:absolute;z-index:4;left:8%;right:8%;bottom:0.875rem;display:flex;align-items:center;gap:0.5rem;
  padding:0.5rem 0.75rem;border-radius:0.875rem;
  background:rgba(255,253,247,.9);border:0.0625rem solid rgba(214,198,166,.75);
  backdrop-filter:blur(0.375rem);-webkit-backdrop-filter:blur(0.375rem)}
.caption b{font-size:0.75rem;font-weight:var(--w-black);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.caption span{font-size:0.65625rem;font-weight:var(--w-bold);color:#8A7550;margin-left:auto;white-space:nowrap}

/* ------------------------------------------------ next card */
.next-card{display:flex;align-items:center;gap:0.75rem;margin-top:0.875rem;padding:0.8125rem 0.875rem;
  background:var(--sticker-paper);border:0.09375rem solid var(--line);border-radius:1.375rem;
  box-shadow:inset 0 0.125rem 0 rgba(255,255,255,.7),0 0.3125rem 0 #E3CFA8,0 0.625rem 1.25rem var(--warm-shadow)}
.nc-kicker{display:flex;align-items:center;gap:0.25rem;font-size:0.59375rem;font-weight:var(--w-black);
  letter-spacing:0.09375rem;color:#B58A2E}
.nc-kicker svg{width:0.5rem;height:0.5rem}
.nc-l h3{font-size:1.0625rem;font-weight:var(--w-black);letter-spacing:0.0125rem;margin-top:0.1875rem}
.nc-meta{font-size:0.65625rem;font-weight:var(--w-read);color:var(--muted);margin-top:0.1875rem}
.nc-btn{flex:none;display:inline-flex;align-items:center;gap:0.3125rem;padding:0.6875rem 0.9375rem;border-radius:0.9375rem;
  background:var(--green);color:#fff;font-size:0.84375rem;font-weight:var(--w-bold);letter-spacing:0.01875rem;
  box-shadow:0 0.25rem 0 var(--green-d);transition:transform .12s ease,box-shadow .12s ease}
.nc-btn:active{transform:translateY(0.125rem);box-shadow:0 0.125rem 0 var(--green-d)}
.nc-btn svg{width:0.875rem;height:0.875rem}

/* ------------------------------------------------ iPad */
@media (min-width:700px) and (min-height:600px){
  .map-hero h1{font-size:2.125rem}
  .map-card{height:30rem}
}

/* ------------------------------------------------ animal static route sheet */
/* 弹层只保留地图与开始按钮：地图宽度与按钮一致，高度按视口为按钮留出空间 */
.animal-route-sheet{max-width:min(35rem,calc(88vh - 11rem));padding-top:0.5rem}
.animal-route-sheet .grab{margin-bottom:0.5rem}
.animal-route-map{position:relative;height:clamp(18rem,43vh,23rem);margin-top:1rem;overflow:hidden;border-radius:1.5rem;
  border:0.09375rem solid #A9D8E0;background:
    radial-gradient(circle at 88% 25%,transparent 0 0.4375rem,rgba(255,255,255,.38) 0.5rem 0.5625rem,transparent 0.625rem),
    radial-gradient(circle at 12% 70%,transparent 0 0.3125rem,rgba(255,255,255,.35) 0.375rem 0.4375rem,transparent 0.5rem),
    linear-gradient(180deg,#E9F9F8,#D5F0F2)}
.animal-route-map.zoo{border-color:#D9D6A5;background:
  radial-gradient(circle at 88% 25%,rgba(255,255,255,.5) 0 0.375rem,transparent 0.4375rem),
  linear-gradient(180deg,#F2F4D8,#E5EDCB)}
/* 真实路线图：画布比例与图片一致，保证百分比节点坐标严格对齐 */
.animal-route-map.has-map{width:100%;max-width:none;height:auto;aspect-ratio:var(--arm-ratio,1/1);margin:0;
  background:#F7ECD6;border-color:#E0CFAE;container-type:inline-size}
.arm-bg{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover}
.animal-route-node{position:absolute;z-index:2;display:grid;place-items:center;width:2.875rem;height:2.875rem;padding:0;
  transform:translate(-50%,-50%);border-radius:50%;background:var(--sticker-paper);border:0.1875rem solid #fff;
  color:#6F8B91;font-size:0.875rem;font-weight:var(--w-black);box-shadow:0 0.25rem 0.625rem rgba(70,100,90,.14);
  cursor:pointer;transition:transform .15s ease}
.animal-route-node:active{transform:translate(-50%,-50%) scale(.94)}
.animal-route-node.done{background:var(--green);color:#fff}
.animal-route-node.current{background:#FFB64D;color:#fff;box-shadow:0 0 0 0.5rem rgba(255,214,143,.55),0 0.25rem 0.625rem rgba(130,90,30,.18)}
/* 节点尺寸跟随地图容器宽度，右缘刚好盖住原编号并停在地名牌起点之前 */
.animal-route-map.has-map .animal-route-node{width:5cqw;height:5cqw;font-size:max(0.5rem,2cqw);
  border-width:0.2cqw;border-color:var(--sticker-paper);box-shadow:0 0.3cqw 0.9cqw rgba(60,45,20,.18)}
/* 保持 44px 级别的可点击热区，视觉节点可以更小 */
.animal-route-map.has-map .animal-route-node::after{content:"";position:absolute;inset:-0.85rem;border-radius:50%}
.animal-route-map.has-map .animal-route-node.locked{background:rgba(245,237,222,.94);color:#A8997D}
.animal-route-map.has-map .animal-route-node.current{box-shadow:0 0 0 0.7cqw rgba(255,214,143,.55),0 0.3cqw 0.9cqw rgba(130,90,30,.18)}

/* ============================================================
   🦁 Zoo 路线弹框（底部抽屉）
   - 棋盘地图按 1505/1045 铺满，50 个节点落在图上 1~50 号圆点
   - 支持 100%~250% 缩放，当前关自动滚入视口中央
   ============================================================ */

/* 抽屉宽度随屏幕自适应：大屏（iPad / 桌面）铺开到接近整屏，避免地图过窄 */
.sheet.zoo-route-sheet{width:100%;max-width:min(64rem,calc(96vw - 1rem))}
.zoo-route-head{display:flex;align-items:center;justify-content:space-between;gap:0.75rem;padding:0 0.25rem 0.5rem}
/* 主副标题同一行、底部对齐；窄屏时自动换行 */
.zoo-route-title{display:flex;flex-wrap:wrap;align-items:flex-end;gap:0.125rem 0.5rem;min-width:0}
.zoo-route-title strong{font-size:1rem;line-height:1.2;font-weight:var(--w-black);color:#3D5A3D}
.zoo-route-title small{font-size:0.6875rem;line-height:1.25;color:var(--muted)}
.zoo-route-close{flex:none;display:grid;place-items:center;width:2rem;height:2rem;padding:0;border:0;border-radius:50%;
  background:#FFF8E7;color:#6B5B45;font-size:1.25rem;line-height:1;cursor:pointer;
  box-shadow:0 0.125rem 0.375rem rgba(80,60,25,.12);transition:transform .12s ease}
.zoo-route-close:active{transform:scale(.94)}
/* 地图视口：小图完整显示，放大后在抽屉内部滚动 */
.zoo-board-frame{position:relative}
.zoo-board-viewport{max-height:min(58vh,32rem);overflow:auto;border-radius:1rem;
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:#F7EEDC}
.zoo-board-viewport::-webkit-scrollbar{width:0.5rem;height:0.5rem}
.zoo-board-viewport::-webkit-scrollbar-thumb{background:rgba(150,120,70,.35);border-radius:999rem}
.zoo-board-inner{width:100%}
.zoo-route-sheet .animal-route-map.has-map{margin:0 auto;border-color:#D9C79A;border-radius:0.9rem}
/* 缩放控制：固定在视口右上角（避开右下角终点区域） */
.zoo-zoom-bar{position:absolute;right:0.55rem;top:0.55rem;z-index:5;display:flex;align-items:center;gap:0.12rem;
  padding:0.16rem;border-radius:999rem;background:rgba(255,253,247,.94);
  box-shadow:0 0.2rem 0.6rem rgba(90,70,30,.22)}
.zoo-zoom-bar button{display:grid;place-items:center;width:1.85rem;height:1.85rem;padding:0;border:0;border-radius:50%;
  background:#F7EEDC;color:#6D5636;font-family:inherit;font-size:1rem;font-weight:var(--w-black);line-height:1;cursor:pointer;
  transition:transform .12s ease,background .12s ease}
.zoo-zoom-bar button:active{transform:scale(.92)}
.zoo-zoom-bar .zoo-zoom-val{width:3rem;border-radius:999rem;background:transparent;font-size:0.7rem;
  font-variant-numeric:tabular-nums;letter-spacing:.02em}
/* 50 格棋盘节点：未满三星的已通关节点纯白，满星居中盖章，保留当前关与锁定关状态 */
.animal-route-map.has-map.zoo .zoo-step{width:5.8cqw;height:5.8cqw;padding:0;display:grid;place-items:center;
  background:#fff;border:0.32cqw solid #E6DCC6;color:#7C6B4E;font-size:2.2cqw;line-height:1;
  font-weight:var(--w-black);font-variant-numeric:tabular-nums;
  box-shadow:0 0.16cqw 0.4cqw rgba(90,70,30,.14);transition:transform .12s ease}
.animal-route-map.has-map.zoo .zoo-step::after{inset:-0.35cqw}
.animal-route-map.has-map.zoo .zoo-step.done{background:#fff;border-color:#E6DCC6;color:#7C6B4E}
.animal-route-map.has-map.zoo .zoo-step.stars-3{background:#fff;cursor:default}
/* 满三星 / BOSS 通关：金色卡通星星印章 */
.animal-route-map.has-map.zoo .zoo-step.stars-3::before,
.animal-route-map.has-map.zoo .zoo-step.boss.done::before{
  content:"★";position:absolute;left:50%;top:50%;z-index:1;pointer-events:none;
  width:76%;height:76%;display:grid;place-items:center;border:0.28cqw solid #E2A62E;border-radius:50%;
  color:#F3C643;font-size:3.2cqw;line-height:1;font-weight:var(--w-black);
  text-shadow:0 0.14cqw 0 #B97812;
  box-shadow:inset 0 0 0 0.18cqw #fff,inset 0 0 0 0.38cqw #E2A62E;
  opacity:.95;transform:translate(-50%,-50%) rotate(-12deg)}
/* 每 5 关最后一关（BOSS 关）：未通关时圆内显示 Boss 小恐龙 */
.animal-route-map.has-map.zoo .zoo-step.boss:not(.done)::before{
  content:"🦖";position:absolute;left:50%;top:50%;z-index:1;pointer-events:none;
  font-size:3.1cqw;line-height:1;transform:translate(-50%,-50%);
  filter:drop-shadow(0 0.08cqw 0 rgba(255,255,255,.85))}
.animal-route-map.has-map.zoo .zoo-step.current{background:linear-gradient(180deg,#FFE082,#FFC24D);
  border-color:#E2A83C;color:#6B4A12;
  box-shadow:0 0.16cqw 0.4cqw rgba(120,80,20,.2),0 0 0 0.55cqw rgba(255,201,77,.3);
  animation:zoo-step-bob 1.5s ease-in-out infinite}
.animal-route-map.has-map.zoo .zoo-step.locked{background:#E7E3DA;border-color:#D0CABE;color:#9C968A;
  box-shadow:none;cursor:default}
.animal-route-map.has-map.zoo .zoo-step:not(.locked):not([disabled]):active{transform:translate(-50%,-50%) scale(.9)}
@keyframes zoo-step-bob{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.12)}}

/* ============================================================
   🎁 旅程进度条上的宝箱节点（30% / 60% / 100% 各一个）
   ============================================================ */

.journey .j-track{position:relative;flex:1;display:flex;align-items:center;min-width:0;max-width:30rem;margin:0 auto}
.j-chest{position:absolute;top:50%;z-index:2;display:grid;place-items:center;width:1.625rem;height:1.625rem;padding:0;
  transform:translate(-50%,-50%);border:0.125rem solid var(--sticker-paper);border-radius:50%;
  background:#F1E6D0;color:#9A8763;font-size:0.8125rem;line-height:1;cursor:pointer;font-family:inherit;
  box-shadow:0 0.125rem 0.3125rem rgba(90,70,30,.2);transition:transform .12s ease}
.j-chest:active{transform:translate(-50%,-50%) scale(.92)}
.j-chest:disabled{cursor:default}
.j-chest.locked{opacity:.55;background:#F3EADA;color:#B3A489;border-color:#F7F0E2;box-shadow:none}
.j-chest.done{background:#E4EFD6;color:#4E7A45;font-weight:var(--w-black)}
.j-chest.ready{background:linear-gradient(180deg,#FFE477,#FFC84D);color:var(--sticker-ink);
  box-shadow:0 0.125rem 0 #D89732,0 0 0 0.25rem rgba(255,200,77,.26);animation:j-chest-bob 1.6s ease-in-out infinite}
@keyframes j-chest-bob{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.12)}}
/* BOSS 额外奖励宝箱：作为独立按钮跟在进度条右侧 */
.j-chest.bonus{position:relative;left:auto;top:auto;transform:none;flex:none;width:1.75rem;height:1.75rem;animation:none;
  background:linear-gradient(180deg,#FFE477,#FFC84D);color:var(--sticker-ink);font-size:0.75rem}
.j-chest.bonus:active{transform:scale(.92)}
.j-chest.bonus b{position:absolute;right:-0.375rem;top:-0.375rem;min-width:0.875rem;height:0.875rem;padding:0 0.125rem;
  border-radius:6.1875rem;background:#E2622F;color:#fff;font-size:0.5625rem;line-height:1;display:grid;place-items:center}

/* ------------------------------------------------ 每日随机挑战入口 */
.daily-challenge-card{display:flex;align-items:center;gap:0.75rem;width:100%;margin:0.875rem 0 0;padding:0.8125rem 0.9375rem;
  border:0.09375rem solid #EDDFC7;border-radius:1.25rem;background:#fff;text-align:left;font:inherit;color:inherit;cursor:pointer;
  box-shadow:inset 0 0.125rem 0 rgba(255,255,255,.8),0 0.3125rem 0 #E3CFA8,0 0.625rem 1.25rem var(--warm-shadow);
  transition:transform .14s var(--pop-ease),box-shadow .12s ease}
.daily-challenge-card:active{transform:translateY(0.125rem) scale(.985)}
.daily-challenge-card.is-empty{opacity:.62}
.dcc-ic{flex:none;display:grid;place-items:center;width:2.875rem;height:2.875rem;border-radius:0.9375rem;
  background:#FFE9BC;font-size:1.375rem;line-height:1}
.dcc-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:0.1875rem}
.dcc-tx b{font-size:0.9375rem;font-weight:var(--w-black);color:#4E3C22}
.dcc-tx em{font-style:normal;font-size:0.6875rem;font-weight:var(--w-read);color:var(--muted);line-height:1.45}
.dcc-count{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;width:2.875rem;height:2.875rem;
  border-radius:0.9375rem;background:linear-gradient(180deg,#4F9E62,#3F8851);color:#fff;
  font-size:0.9375rem;font-weight:var(--w-black);line-height:1;box-shadow:0 0.125rem 0 #2F6B3F}
.dcc-count b{font-size:0.875rem;line-height:1;letter-spacing:-0.02rem}
.dcc-count small{margin-top:0.125rem;font-size:0.5rem;font-weight:var(--w-bold);opacity:.85;line-height:1}
.daily-challenge-card.is-empty .dcc-count{background:#C9BFAA;box-shadow:0 0.125rem 0 #B3A88F}

/* ============================================================
   浮空岛视觉：场景卡、地图节点、单元切换的立体质感
   复用 base.css 的 --warm-shadow / --warm-edge / --pop-ease
   ============================================================ */

/* 50 关节点：立体贴纸 —— 顶面高光 + 加厚底面投影 + 果冻按压回弹（坐标不动） */
.animal-route-map.has-map.zoo .zoo-step{
  box-shadow:inset 0 0.18cqw 0 rgba(255,255,255,.6),
    0 0.32cqw 0 rgba(150,115,70,.22),
    0 0.5cqw 1cqw rgba(90,70,30,.18);
  transition:transform .16s var(--pop-ease),box-shadow .12s ease;
}
.animal-route-map.has-map.zoo .zoo-step:not(.locked):not([disabled]):active{
  transform:translate(-50%,-50%) scale(.86);
  box-shadow:inset 0 0.1cqw 0 rgba(255,255,255,.5),
    0 0.12cqw 0 rgba(150,115,70,.2),
    0 0.25cqw 0.5cqw rgba(90,70,30,.15);
}
/* current 节点：暖金呼吸光升级，保留原 bob 动画 */
.animal-route-map.has-map.zoo .zoo-step.current{
  box-shadow:inset 0 0.18cqw 0 rgba(255,255,255,.7),
    0 0.32cqw 0 rgba(200,140,40,.3),
    0 0 0 0.55cqw rgba(255,201,77,.32),
    0 0.5cqw 1cqw rgba(120,80,20,.2);
}

/* ============================================================
   DinoGo · 恐龙英语 — 答题页：进度 / 题型容器 / 选项 / 动态反馈
   ============================================================ */

.quiz-page{display:flex;flex-direction:column;height:100%;padding-top:calc(0.5rem + var(--safe-top))}
.quiz-top{display:flex;align-items:center;gap:0.625rem;padding:0.375rem 1.25rem 0;flex:none}
.quiz-top .qbar{flex:1;height:0.75rem}
/* 题型标题槽：占据顶栏中段，前后按钮固定在两侧 */
.quiz-top .quiz-title{flex:1;min-width:0;display:flex;align-items:center;justify-content:center}
.quiz-top .quiz-title .ref-stage-head{flex:none;max-width:100%}
.quiz-top .qcount{font-size:0.75rem;font-weight:var(--w-black);color:var(--green-d);white-space:nowrap}
.quiz-top .qcount em{font-style:normal;color:#A5B2A7;font-weight:var(--w-mid)}
/* 每日随机挑战：用骰子标记代替生命值 */
.quiz-top .daily-run{flex:none;display:grid;place-items:center;width:1.75rem;height:1.75rem;border-radius:50%;
  background:#FFE9BC;border:0.0625rem solid #F0D79E;font-size:0.875rem;line-height:1}
.quiz-body{flex:1;min-height:0;overflow:hidden;padding:0.5rem 1.25rem 0.125rem;display:flex;flex-direction:column;scrollbar-width:none}
.quiz-prompt{display:flex;flex-direction:column;gap:0.4375rem;margin-top:0.75rem;flex:none}
.quiz-prompt .chip{align-self:flex-start;display:inline-flex;align-items:center;gap:0.3125rem;height:1.375rem;padding:0 0.5rem;border-radius:0.4375rem;
  background:#E8F5D8;color:var(--green-d);font-size:0.65625rem;font-weight:var(--w-black);letter-spacing:0.0625rem}
.quiz-prompt h2{font-size:clamp(1.1875rem,3.2vw,1.4375rem);font-weight:var(--w-black);letter-spacing:-0.025rem}
.listen{width:2.125rem;height:2.125rem;padding:0;border-radius:50%;background:#fff;
  display:inline-flex;align-items:center;justify-content:center;color:#9B7620;border:0.09375rem solid #fff;
  box-shadow:0 0.3125rem 0.75rem rgba(155,118,32,.16);cursor:pointer}
.listen svg{display:block}
.options{display:grid;grid-template-columns:1fr 1fr;gap:0.625rem;flex:none;margin-top:0.875rem}
.option{min-height:4.375rem;border-radius:1.125rem;background:#fff;border:0.125rem solid #EFE2CB;display:flex;align-items:center;justify-content:center;gap:0.5625rem;
  padding:0 0.75rem;box-shadow:0 0.25rem 0.625rem rgba(94,70,30,.05);position:relative;text-align:center;transition:all .15s ease}
.option .key{width:1.625rem;height:1.625rem;border-radius:0.5625rem;background:#F3EFE4;display:grid;place-items:center;
  font-size:0.75rem;font-weight:var(--w-black);color:#A6987B;flex:none;transition:all .15s ease}
.option .word{font-size:clamp(0.8125rem,3.2vw,1rem);font-weight:var(--w-bold);letter-spacing:-0.00625rem;line-height:1.2;min-width:0;white-space:normal;overflow-wrap:anywhere;word-break:break-word}
/* 答后勾叉：绝对定位到边框右上角，不参与文本排版 → 文本位置零位移 */
.option .mark{position:absolute;top:-0.5rem;right:-0.5rem;width:1.375rem;height:1.375rem;border-radius:50%;background:#4FA55E;color:#fff;
  display:grid;place-items:center;z-index:2;box-shadow:0 0.0625rem 0.25rem rgba(60,40,10,.2)}
.option .mark.bad{background:#E8604A}
.option .mark.radio{background:#fff;border:0.125rem solid #3AA56B}
.option .mark.radio i{display:block;width:0.625rem;height:0.625rem;border-radius:50%;background:#3AA56B}
.option.sel{border-color:#3AA56B;background:#F4FBEC;box-shadow:0 0.25rem 0 #D7EBC4,0 0.5rem 1rem rgba(58,165,107,.12)}
.option.sel .key{background:#DFF2CC;color:var(--green-d)}
.option.correct{border-color:#3AA56B;background:#EDF9E1}
.option.correct .key{background:#3AA56B;color:#fff}
.option.wrong{border-color:#F07A6A;background:#FFF0EC;animation:shake .4s ease}
.option.wrong .key{background:#F07A6A;color:#fff}
.option.dim{opacity:.55}
.options.one-col{grid-template-columns:1fr;grid-auto-rows:minmax(0,1fr);gap:0.5rem;margin-top:0.625rem;flex:1;min-height:0}
.options.one-col .option{min-height:0;padding:0 0.75rem}
.options.one-col .option .word{font-size:1.125rem}
/* 底部动作槽：答题前后高度固定，避免选项框因底部提示条增减而位移 */
.quiz-foot{flex:none;height:calc(4.5rem + var(--safe-bottom));padding:0.5rem 1.25rem calc(0.5rem + var(--safe-bottom));
  display:flex;flex-direction:column;justify-content:center;gap:0.625rem;background:var(--cream)}

/* ------------------------------------------------ 答题动态反馈 */
.qfx{position:absolute;inset:0;z-index:30;pointer-events:none;overflow:hidden}
.ok-fx::before{content:"";position:absolute;left:50%;top:40%;width:min(80vw,23.75rem);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(255,210,90,.5) 0%,rgba(255,210,90,0) 66%);
  transform:translate(-50%,-50%);animation:fxGlow .95s ease both}
.fx-confetti{position:absolute;inset:0}
.fx-confetti i{position:absolute;top:-8%;display:block;animation:fxFall linear both}

/* 答后结果卡：森林奶油风，位于答题框正中（参考 DinoGo Demo 反馈卡） */
.zoo-feedback-card{position:absolute;left:50%;top:50%;z-index:40;
  width:min(92%,27rem);max-height:86dvh;overflow:visible;
  display:flex;flex-direction:column;gap:0.9rem;
  padding:1.35rem 1.25rem;border-radius:1.6rem;
  background:#FDFBEB;border:0.18rem solid #5C411D;
  box-shadow:0 0.4rem 0 rgba(92,65,29,.3),0 1.2rem 2.5rem rgba(60,40,15,.22),inset 0 0.14rem 0 rgba(255,255,255,.85);
  animation:qrpIn .42s cubic-bezier(.2,1.45,.4,1) both}
.zoo-feedback-card.is-correct{background:#FDFBEB}
.zoo-feedback-card.is-wrong{background:#FFF6EC}
/* 进阶题型有「纸面安全框」：弹框宽度取纸面宽度的 75%，而不是整屏的 75% */
.quiz-ref-page .zoo-feedback-card{width:calc((var(--stage-max-w) - 0.75rem) * 0.75)}
/* 听音戳泡泡：彩带层提到结果卡之上；结果卡下移，露出草坪与获救小动物 */
.quiz-page[data-type="listen"] .qfx{z-index:45}
.quiz-page[data-type="listen"] .zoo-feedback-card{top:74%}
.zoo-feedback-header{position:relative;z-index:2;display:flex;align-items:center;gap:0.6rem}
.zoo-status-badge{width:2.2rem;height:2.2rem;border-radius:50%;flex:none;display:grid;place-items:center;
  background:#4FAE55;border:0.125rem solid #1E6B3B;box-shadow:0 0.14rem 0 rgba(30,107,59,.32)}
.zoo-feedback-card.is-wrong .zoo-status-badge{background:#E8604A;border-color:#8F2D1F;
  box-shadow:0 0.14rem 0 rgba(143,45,31,.35)}
.zoo-status-badge svg{width:1.3125rem;height:1.3125rem;display:block}
.zoo-feedback-title{margin:0;font-size:1.28rem;line-height:1.2;letter-spacing:-0.0125rem;
  font-weight:var(--w-black);color:#2E7A4C;overflow-wrap:anywhere}
.zoo-feedback-card.is-wrong .zoo-feedback-title{color:#B5452F}
.zoo-feedback-body{position:relative;z-index:2;display:flex;flex-direction:column;gap:0.9rem}
/* 答案条：左侧为英文 + 音标 + 中文，右侧独立放大喇叭按钮（框内垂直居中不溢出） */
.zoo-answer-box{display:flex;align-items:center;justify-content:space-between;gap:0.75rem;
  padding:0.72rem 0.85rem;border-radius:1rem;background:#FFF6DC;border:0.11rem solid #E4CFA9}
.zoo-answer-info{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:0.28rem}
.zoo-answer-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:0.2rem 0.5rem}
.zoo-answer-word{flex:0 1 auto;min-width:0;font-size:1.32rem;line-height:1.3;font-weight:var(--w-black);color:#4B3626;overflow-wrap:anywhere;word-break:break-word}
.zoo-answer-box .zoo-audio-btn{flex:none;width:3.35rem;height:3.35rem;background:#FFFDF7;border:0.14rem solid #C89B63;box-shadow:0 0.2rem 0 #D9C39B;color:#B47024}
.zoo-answer-box .zoo-audio-btn svg{width:66%;height:66%}
.zoo-answer-phon{flex:none;font-size:0.86rem;font-weight:var(--w-bold);color:#8E724D;white-space:nowrap}
.zoo-meaning-text{min-width:0;font-size:0.95rem;font-weight:var(--w-black);color:#8A6431;
  white-space:normal;overflow-wrap:anywhere}
.zoo-action-btn{position:relative;flex:none;display:flex;align-items:center;justify-content:center;gap:0.3125rem;
  width:100%;min-height:3.3rem;padding:0 1.5rem;border-radius:1.15rem;border:0.16rem solid #5C411D;border-bottom-width:0.44rem;
  background:linear-gradient(180deg,#FFE285 0%,#FFD766 100%);color:#5C411D;font-size:1.08rem;line-height:1;font-weight:var(--w-black);white-space:nowrap;
  box-shadow:0 0.35rem 0.85rem rgba(120,75,40,.12),inset 0 0.16rem 0 rgba(255,255,255,.92);cursor:pointer;
  transition:transform .14s cubic-bezier(.34,1.56,.64,1),border-bottom-width .1s ease}
.zoo-action-btn:active{transform:translateY(0.24rem) scale(.96,.93);border-bottom-width:0.16rem;box-shadow:0 0.1rem 0.3rem rgba(120,75,40,.12)}
/* 角上的草叶 / 落叶装饰 */
.zoo-decor-grass,.zoo-decor-leaf{position:absolute;pointer-events:none;z-index:1}
.zoo-decor-grass{left:0.9rem;top:-0.75rem;width:3.6rem;height:auto}
.zoo-decor-leaf{right:0.75rem;top:-0.6rem;width:4.5rem;height:auto}

@keyframes qrpIn{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}
  65%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1)}
}
@keyframes fxFall{
  0%{opacity:0;transform:translateY(-1.25rem) rotate(0)}
  10%{opacity:1}
  100%{opacity:.8;transform:translateY(108vh) rotate(560deg)}
}
@keyframes fxGlow{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}
  45%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.2)}
}

/* ============================================================
   DinoGo · 恐龙英语 — 闯关结算与恐龙进化（v2 统一精简版）
   已移除 v1 废弃样式，合并结算页 (.rs2-*) 与进化页 (.ev2-*) 公共骨架
   ============================================================ */

.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.confetti i{position:absolute;display:block;border-radius:0.125rem;opacity:.85;animation:confettiFall linear both}
/* 右上角关闭按钮 */
.result-close{position:absolute;top:calc(0.625rem + var(--safe-top));right:0.9375rem;z-index:10}

/* ============================================================
   公共骨架：暖杏草坡大舞台 + 下半屏弧形奶油白托盘
   ============================================================ */
.result-page.result-stage-v2,
.evo-page.evo-stage-v2 {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
  padding: 0;
  background: #FBF3E3;
  color: #5C411D;
  container-type: size;
  isolation: isolate;
}

/* 背景放射状柔光 */
.rs2-rays,
.ev2-rays {
  position: absolute;
  left: 50%;
  top: 24cqh;
  width: max(150cqw, 150cqh);
  height: max(150cqw, 150cqh);
  transform: translate(-50%, -50%);
  background: repeating-conic-gradient(
    from 0deg,
    rgba(255, 255, 255, 0.43) 0deg 10deg,
    rgba(255, 255, 255, 0) 10deg 22deg
  );
  pointer-events: none;
  z-index: 0;
  animation: spin 90s linear infinite;
}
.ev2-rays { top: 25cqh; }

/* 中段几何草坡地平线 */
.rs2-hill,
.ev2-hill {
  position: absolute;
  left: -24%;
  right: -24%;
  top: 33cqh;
  bottom: -10%;
  border-radius: 50% 50% 0 0 / 16cqh 16cqh 0 0;
  background: linear-gradient(180deg, #98B99D 0%, #83A98A 100%);
  box-shadow: inset 0 0.25rem 0 rgba(255, 255, 255, 0.35);
  pointer-events: none;
  z-index: 1;
}
.ev2-hill { top: 42cqh; }

/* 顶部主标题 */
.rs2-title,
.ev2-title {
  margin: 0;
  font-weight: var(--w-black);
  letter-spacing: 0.04rem;
  color: #E08743;
  text-align: center;
  -webkit-text-stroke: 0.09375rem #7A4B22;
  paint-order: stroke fill;
  text-shadow: 0 0.3125rem 0.75rem rgba(122, 75, 34, 0.14);
}
.rs2-title { font-size: clamp(1.375rem, 4.4cqw, 2.05rem); line-height: 1.2; }
.rs2-title.is-boss { color: #FF6B35; }
.ev2-title { margin-top: 0.25rem; font-size: clamp(1.5rem, 4.6cqw, 2.2rem); line-height: 1.18; }

/* 主角大恐龙 */
.rs2-dino,
.ev2-dino {
  position: relative;
  display: grid;
  place-items: center;
  animation: evoFloat 3.4s ease-in-out infinite;
  filter: drop-shadow(0 0.5rem 0.65rem rgba(48, 92, 60, 0.2));
}
.rs2-dino svg, .rs2-dino img,
.ev2-dino svg, .ev2-dino img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* 下半屏：弧形奶油白托盘 */
.rs2-tray-wrap,
.ev2-tray-wrap {
  position: relative;
  z-index: 4;
  flex: none;
  width: 100%;
  display: flex;
  justify-content: center;
  padding: 0 clamp(0.625rem, 3.5cqw, 2.25rem);
}
.rs2-tray,
.ev2-tray {
  width: 100%;
  max-width: 44rem;
  padding: clamp(1rem, 2.6cqh, 1.5rem) clamp(1rem, 3.5cqw, 2.25rem) calc(1.15rem + var(--safe-bottom));
  border-radius: clamp(2rem, 6cqw, 3.25rem) clamp(2rem, 6cqw, 3.25rem) 0 0;
  background: #FFFDF7;
  border: 0.3125rem solid #DFC49C;
  border-bottom: 0;
  box-shadow:
    inset 0 0.1875rem 0 rgba(255, 255, 255, 0.9),
    0 -0.5rem 1.75rem rgba(92, 65, 29, 0.14);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(0.75rem, 2cqh, 1.2rem);
}

/* 双色 3D 立体奖励胶囊 */
.rs2-pills,
.ev2-pills {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(0.625rem, 2.5cqw, 1.25rem);
  width: 100%;
}
.ev2-pills { flex-wrap: wrap; }
.rs2-pill,
.ev2-pill {
  flex: 0 1 13.5rem;
  min-height: clamp(2.85rem, 7cqh, 3.45rem);
  padding: 0 1.15rem;
  border-radius: 6.1875rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.45rem;
  font-size: clamp(0.95rem, 2.8cqw, 1.22rem);
  font-weight: var(--w-black);
  color: #FFFFFF;
  text-shadow: 0 0.09375rem 0 rgba(70, 45, 15, 0.32);
  white-space: nowrap;
}
.rs2-pill.exp,
.ev2-pill.gold {
  background: linear-gradient(180deg, #FFD36E 0%, #F1A63E 100%);
  border: 0.125rem solid #D98E2B;
  box-shadow: 0 0.28rem 0 #C77E1E, inset 0 0.15rem 0 rgba(255, 255, 255, 0.55);
}
.rs2-pill.star,
.ev2-pill.sage {
  background: linear-gradient(180deg, #98C2BC 0%, #6E9E99 100%);
  border: 0.125rem solid #5B8883;
  box-shadow: 0 0.28rem 0 #4B7470, inset 0 0.15rem 0 rgba(255, 255, 255, 0.45);
}
.rs2-pill-ic {
  width: 1.55rem;
  height: 1.55rem;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.28);
  display: grid;
  place-items: center;
  flex: none;
}

/* 3D 绿色主按钮（结算页 & 进化页共用） */
.rs2-btn,
.ev2-cta {
  min-height: clamp(3.25rem, 8cqh, 3.85rem);
  padding: 0 1.25rem;
  border-radius: 6.1875rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
  font-size: clamp(1rem, 2.8cqw, 1.22rem);
  font-weight: var(--w-black);
  letter-spacing: 0.03rem;
  cursor: pointer;
  transition: transform 0.14s var(--pop-ease), box-shadow 0.1s ease;
}
.rs2-btn.primary,
.ev2-cta {
  background: linear-gradient(180deg, #42B372 0%, #2E8B57 100%);
  color: #FFFFFF;
  border: 0.15625rem solid #FFFFFF;
  box-shadow: 0 0.35rem 0 #1B6140, 0 0.75rem 1.25rem rgba(27, 97, 64, 0.25), inset 0 0.15rem 0 rgba(255, 255, 255, 0.35);
}
.rs2-btn.primary:active,
.ev2-cta:active {
  transform: translateY(0.2rem) scale(0.97);
  box-shadow: 0 0.125rem 0 #1B6140;
}

/* ============================================================
   结算页专属 (.rs2-*)
   ============================================================ */
.rs2-hero {
  position: relative;
  z-index: 3;
  flex: 1 1 44cqh;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: calc(3.2rem + var(--safe-top)) 1rem 0;
}
.rs2-sub {
  margin-top: 0.2rem;
  font-size: 0.75rem;
  font-weight: var(--w-bold);
  color: #8A7150;
}

/* 弧形三颗大星 */
.rs2-stars {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: clamp(0.35rem, 1.5cqw, 0.75rem);
  margin-top: 0.35rem;
}
.rs2-stars svg {
  animation: starPop 0.55s cubic-bezier(0.2, 1.5, 0.4, 1) both;
  filter: drop-shadow(0 0.25rem 0.35rem rgba(180, 120, 20, 0.22));
}
.rs2-stars svg:nth-child(1) { transform: rotate(-14deg) translateY(0.35rem); animation-delay: 0.08s; }
.rs2-stars svg:nth-child(2) { animation-delay: 0.2s; }
.rs2-stars svg:nth-child(3) { transform: rotate(14deg) translateY(0.35rem); animation-delay: 0.32s; }

.rs2-dino {
  width: clamp(7.25rem, min(32cqw, 23cqh), 11.75rem);
  height: clamp(7.25rem, min(32cqw, 23cqh), 11.75rem);
  margin-top: auto;
}
.rs2-dino::after {
  content: "";
  position: absolute;
  bottom: 0.25rem;
  left: 50%;
  transform: translateX(-50%);
  width: 68%;
  height: 0.75rem;
  border-radius: 50%;
  background: rgba(46, 86, 56, 0.22);
  filter: blur(0.1875rem);
  z-index: -1;
}

/* 进化进度条 */
.rs2-evo {
  width: min(100%, 30rem);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.45rem;
}
.rs2-evo-txt {
  font-size: clamp(0.875rem, 2.5cqw, 1.0625rem);
  font-weight: var(--w-black);
  color: #5C411D;
  text-align: center;
}
.rs2-evo-txt b { color: var(--green-d); }
.rs2-evo-track {
  position: relative;
  width: 100%;
  height: 0.9375rem;
  border-radius: 6.1875rem;
  background: #F4EAD6;
  border: 0.125rem solid #6B9467;
  box-shadow: inset 0 0.125rem 0.25rem rgba(92, 65, 29, 0.1);
}
.rs2-evo-fill {
  height: 100%;
  border-radius: 6.1875rem;
  background: linear-gradient(90deg, #9AD67E 0%, #68B86A 100%);
  transition: width 0.6s cubic-bezier(0.22, 0.9, 0.3, 1);
}
.rs2-evo-head {
  position: absolute;
  top: 50%;
  width: 2.15rem;
  height: 2.15rem;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  background: #E9F7D9;
  border: 0.15625rem solid #5C8E59;
  box-shadow: 0 0.1875rem 0.45rem rgba(46, 107, 62, 0.24);
  overflow: hidden;
  transition: left 0.6s cubic-bezier(0.22, 0.9, 0.3, 1);
}
.rs2-evo-head img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 26%;
  display: block;
}

/* 可点读无框动物圆标 */
.rs2-words {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: clamp(0.75rem, 3cqw, 2rem);
  width: 100%;
}
.rs2-word-item {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.1875rem 0.375rem;
  border-radius: 6.1875rem;
  cursor: pointer;
  transition: transform 0.14s var(--pop-ease);
}
.rs2-word-item:active { transform: scale(0.93); }
.rs2-word-pic {
  width: clamp(3.15rem, 9cqw, 4.1rem);
  height: clamp(3.15rem, 9cqw, 4.1rem);
  border-radius: 50%;
  padding: 0.38rem;
  display: grid;
  place-items: center;
  flex: none;
  box-shadow: inset 0 0.125rem 0 rgba(255, 255, 255, 0.7);
}
.rs2-word-pic.t0 { background: #F6E6E2; }
.rs2-word-pic.t1 { background: #F4EAD6; }
.rs2-word-pic.t2 { background: #DFECCE; }
.rs2-word-pic img { width: 100%; height: 100%; object-fit: contain; display: block; }
.rs2-word-pic .art-fallback { font-size: 1.75rem; line-height: 1; }
.rs2-word-label {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  font-size: clamp(1rem, 2.8cqw, 1.3rem);
  font-weight: var(--w-black);
  color: #5C411D;
}
.rs2-word-label svg { color: #B48A5A; flex: none; }

/* 底部 3D 双按钮 */
.rs2-actions {
  display: grid;
  grid-template-columns: 0.9fr 1.25fr;
  gap: clamp(0.625rem, 2.5cqw, 1.15rem);
  width: min(100%, 34rem);
  margin-top: 0.15rem;
}
.rs2-btn.secondary {
  background: #FFFDF7;
  color: #5C411D;
  border: 0.15625rem solid #8C6D46;
  box-shadow: 0 0.3125rem 0 #D8C29F, inset 0 0.125rem 0 #FFFFFF;
}
.rs2-btn.secondary:active {
  transform: translateY(0.1875rem) scale(0.97);
  box-shadow: 0 0.125rem 0 #D8C29F;
}
.rs2-btn.primary.evolve {
  background: linear-gradient(180deg, #FFD766 0%, #F2A92C 100%);
  color: #5C3A06;
  box-shadow: 0 0.35rem 0 #C47F14, 0 0.75rem 1.25rem rgba(196, 127, 20, 0.28);
}

@media (max-width: 520px) {
  .rs2-word-item { flex-direction: column; gap: 0.25rem; }
  .rs2-actions { grid-template-columns: 1fr 1.25fr; }
}

/* ============================================================
   🎲 每日挑战专属 (.daily-v2 / .dv2-*)
   ============================================================ */
.daily-v2 .rs2-pill.daily {
  background: linear-gradient(180deg, #F6A9B8 0%, #E77A8C 100%);
  border: 0.125rem solid #C95C70;
  box-shadow: 0 0.28rem 0 #B24A5D, inset 0 0.15rem 0 rgba(255, 255, 255, 0.45);
}
.dv2-slot {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.15rem;
  margin-top: 0.35rem;
}
.dv2-slot-emoji {
  display: flex;
  align-items: center;
  line-height: 1;
  filter: drop-shadow(0 0.25rem 0.3rem rgba(180, 120, 20, 0.25));
  animation: dv2Sparkle 1.4s ease-in-out 0.5s infinite;
}
/* 与首页星星同款 SVG，尺寸略大于原 emoji，和后面的数字比例更协调 */
.dv2-slot-emoji svg {
  display: block;
  width: clamp(1.75rem, 5cqw, 2.35rem);
  height: auto;
}
.dv2-slot-times {
  font-size: clamp(1.05rem, 3cqw, 1.4rem);
  font-weight: var(--w-black);
  color: #B08445;
  line-height: 1;
}
.dv2-slot-window {
  display: block;
  height: 1.35em;
  min-width: 1.35em;
  overflow: hidden;
  font-size: clamp(1.9rem, 5.4cqw, 2.6rem);
  font-weight: var(--w-black);
  color: #E08743;
  -webkit-text-stroke: 0.0625rem #7A4B22;
  paint-order: stroke fill;
  filter: drop-shadow(0 0.2rem 0.3rem rgba(122, 75, 34, 0.16));
}
.dv2-slot-reel {
  display: flex;
  flex-direction: column;
  animation: dv2SlotRoll 1.9s cubic-bezier(0.13, 0.86, 0.16, 1) both;
}
.dv2-slot-reel i {
  display: block;
  height: 1.35em;
  line-height: 1.35em;
  font-style: normal;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.dv2-stats {
  display: flex;
  width: min(100%, 30rem);
  border-radius: 0.9375rem;
  background: #F8F1DF;
  border: 0.09375rem solid #E8D9B3;
  overflow: hidden;
}
.dv2-stats .ds-stat {
  flex: 1;
  text-align: center;
  padding: 0.5rem 0.25rem;
  position: relative;
}
.dv2-stats .ds-stat + .ds-stat::before {
  content: "";
  position: absolute;
  left: 0;
  top: 20%;
  bottom: 20%;
  width: 0.09375rem;
  background: #E8D9B3;
}
.dv2-stats .ds-stat b {
  display: block;
  font-size: clamp(1rem, 2.8cqw, 1.375rem);
  font-weight: var(--w-black);
  color: #5C411D;
  font-variant-numeric: tabular-nums;
}
.dv2-stats .ds-stat span {
  display: block;
  font-size: 0.6875rem;
  font-weight: var(--w-bold);
  color: #A88F68;
  margin-top: 0.125rem;
}
.dv2-chips-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 0.375rem;
  width: 100%;
}
.dv2-chip {
  padding: 0.25rem 0.625rem;
  border-radius: 6.1875rem;
  font-size: clamp(0.8125rem, 2.2cqw, 1rem);
  font-weight: var(--w-bold);
  white-space: nowrap;
  transition: transform 0.14s var(--pop-ease);
}
.dv2-chip.ok { background: #E9F7D9; color: #3E6E33; border: 0.09375rem solid #CFE7B7; }
.dv2-chip.no { background: #FDEDE9; color: #B4543C; border: 0.09375rem solid #F5D2C9; }
.dv2-chip:active { transform: scale(0.93); }
.dv2-note {
  font-size: 0.6875rem;
  font-weight: var(--w-read);
  color: #A88F68;
  text-align: center;
  line-height: 1.5;
  padding-top: 0.125rem;
}

/* ============================================================
   进化页专属 (.ev2-*)
   ============================================================ */
.ev2-top-wrap {
  position: relative;
  z-index: 4;
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: calc(0.75rem + var(--safe-top)) 3rem 0.25rem;
}
.ev2-milestone {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  height: 1.55rem;
  padding: 0 0.75rem;
  border-radius: 6.1875rem;
  background: rgba(255, 253, 247, 0.94);
  border: 0.09375rem solid #E4CFA9;
  box-shadow: 0 0.125rem 0 #D8C29F;
  font-size: 0.65625rem;
  font-weight: var(--w-black);
  letter-spacing: 0.08rem;
  color: #8A6B45;
}
.ev2-stages {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.45rem;
  margin-top: 0.35rem;
  flex-wrap: wrap;
}
.ev2-st {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  height: 1.75rem;
  padding: 0 0.72rem;
  border-radius: 6.1875rem;
  background: rgba(255, 253, 247, 0.92);
  border: 0.09375rem solid #DFC49C;
  box-shadow: 0 0.125rem 0 #D4BC91;
  font-size: 0.71875rem;
  font-weight: var(--w-black);
  color: #6B5233;
}
.ev2-st.is-new {
  background: linear-gradient(180deg, #FFE48A 0%, #F5BE46 100%);
  border-color: #C98B25;
  color: #5C3A06;
}
.ev2-st-arr { color: #B98642; font-weight: var(--w-black); font-size: 0.875rem; }

.ev2-hero {
  position: relative;
  z-index: 3;
  flex: 1 1 0;
  min-height: 0;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 0.35rem;
}
.ev2-halo {
  position: absolute;
  left: 50%;
  bottom: 0.6rem;
  transform: translateX(-50%);
  width: clamp(8.5rem, min(36cqw, 26cqh), 13.5rem);
  height: clamp(8.5rem, min(36cqw, 26cqh), 13.5rem);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 224, 120, 0.55) 0%, rgba(255, 224, 120, 0.12) 62%, transparent 74%);
  pointer-events: none;
}
.ev2-orbit {
  position: absolute;
  left: 50%;
  bottom: 0.2rem;
  transform: translateX(-50%);
  width: clamp(9.8rem, min(42cqw, 30cqh), 15.5rem);
  height: clamp(9.8rem, min(42cqw, 30cqh), 15.5rem);
  border-radius: 50%;
  border: 0.125rem dashed rgba(184, 134, 62, 0.42);
  pointer-events: none;
  animation: spin 48s linear infinite;
}
.ev2-dino {
  z-index: 2;
  width: clamp(7.6rem, min(34cqw, 24cqh), 12.25rem);
  height: clamp(7.6rem, min(34cqw, 24cqh), 12.25rem);
}

.ev2-compare {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(0.65rem, 2.5cqw, 1.35rem);
  width: min(100%, 34rem);
}
.ev2-avatars { display: flex; align-items: center; gap: 0.45rem; flex: none; }
.ev2-ava {
  width: clamp(3.1rem, 8.8cqw, 4rem);
  height: clamp(3.1rem, 8.8cqw, 4rem);
  border-radius: 50%;
  overflow: hidden;
  border: 0.15625rem solid #E4CFA9;
  box-shadow: 0 0.2rem 0.45rem rgba(92, 65, 29, 0.12);
  flex: none;
}
.ev2-ava.from { background: #F6E6E2; }
.ev2-ava.to { background: #DFECCE; border-color: #76AF68; }
.ev2-ava img { width: 100%; height: 100%; object-fit: cover; object-position: center 26%; display: block; }
.ev2-ava-arr { font-size: 1rem; font-weight: var(--w-black); color: #B48A5A; }
.ev2-desc {
  font-size: clamp(0.875rem, 2.5cqw, 1.08rem);
  font-weight: var(--w-black);
  line-height: 1.4;
  color: #5C411D;
  text-align: left;
}
.ev2-desc small {
  display: block;
  margin-top: 0.15rem;
  font-size: 0.75rem;
  font-weight: var(--w-bold);
  color: #4E8A57;
}
.ev2-cta {
  width: min(100%, 28rem);
  padding: 0 1.5rem;
}

/* ------------------------------------------------ sky fx：太阳 / 月亮 / 星星 / 云随真实时间切换 */
.sky-fx{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden;transition:background .8s ease}
.sky-fx.dawn{background:linear-gradient(180deg,rgba(255,212,158,.3),rgba(255,236,206,.06) 55%,transparent)}
.sky-fx.day{background:linear-gradient(180deg,rgba(255,255,255,.1),transparent 46%)}
.sky-fx.dusk{background:linear-gradient(180deg,rgba(255,166,108,.34),rgba(255,197,150,.1) 52%,transparent)}
.sky-fx.night{background:linear-gradient(180deg,rgba(18,32,66,.62),rgba(22,38,74,.34) 48%,rgba(24,40,74,.18))}
.sf-sun{position:absolute;width:3.25rem;height:3.25rem;border-radius:50%;
  background:radial-gradient(circle at 42% 38%,#FFF5C8,#FFD25E 62%,#F5AE28);
  box-shadow:0 0 0.875rem rgba(255,208,96,.6),0 0 2.5rem rgba(255,204,88,.42)}
.sf-sun::after{content:"";position:absolute;inset:-40%;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(255,203,84,.62) 0deg 5deg,transparent 5deg 24deg);
  -webkit-mask:radial-gradient(circle,transparent 55%,#000 56% 74%,transparent 75%);
  mask:radial-gradient(circle,transparent 55%,#000 56% 74%,transparent 75%);
  animation:skySpin 70s linear infinite}
.sky-fx.dawn .sf-sun{left:10%;top:32%;width:2.75rem;height:2.75rem;opacity:.92}
.sky-fx.day .sf-sun{right:12%;top:10%}
.sky-fx.dusk .sf-sun{right:15%;top:19%;background:radial-gradient(circle at 42% 38%,#FFE3B4,#FFA85E 62%,#EE7A3C);
  box-shadow:0 0 0.875rem rgba(255,166,94,.6),0 0 2.5rem rgba(255,150,80,.4)}
.sf-moon{position:absolute;right:14%;top:10%;width:2.75rem;height:2.75rem;border-radius:50%;
  background:radial-gradient(circle at 38% 34%,#FFFBDF,#FFEEB0 70%,#F7DE8E);
  box-shadow:0 0 1.5rem rgba(255,238,176,.5),0 0 0.5rem rgba(255,240,186,.4)}
.sf-moon::before{content:"";position:absolute;left:26%;top:45%;width:22%;height:22%;border-radius:50%;background:rgba(226,200,126,.45)}
.sf-moon::after{content:"";position:absolute;left:57%;top:22%;width:16%;height:16%;border-radius:50%;background:rgba(226,200,126,.4)}
.sf-star{position:absolute;width:0.3125rem;height:0.3125rem;border-radius:50%;background:#FFF7D2;
  box-shadow:0 0 0.5rem rgba(255,244,190,.9);animation:twinkle 3.2s ease-in-out infinite}
.sf-star.s1{left:8%;top:16%}.sf-star.s2{left:22%;top:36%;width:0.25rem;height:0.25rem;animation-delay:.6s}
.sf-star.s3{left:36%;top:11%;animation-delay:1.2s}.sf-star.s4{left:52%;top:26%;width:0.25rem;height:0.25rem;animation-delay:.3s}
.sf-star.s5{left:68%;top:14%;animation-delay:1.8s}.sf-star.s6{left:83%;top:34%;width:0.25rem;height:0.25rem;animation-delay:.9s}
.sf-star.s7{left:44%;top:44%;width:0.21875rem;height:0.21875rem;animation-delay:2.1s}.sf-star.s8{left:92%;top:8%;width:0.25rem;height:0.25rem;animation-delay:1.5s}
.sf-cloud{position:absolute;height:1.25rem;width:3.25rem;border-radius:6.25rem;background:rgba(255,255,255,.85);
  box-shadow:1rem 0.25rem 0 -0.1rem rgba(255,255,255,.8),-1rem 0.3rem 0 -0.15rem rgba(255,255,255,.72);
  animation:skyDrift 32s ease-in-out infinite alternate}
.sf-cloud.c1{left:37%;top:7%;transform:scale(.78);animation-duration:38s}
.sf-cloud.c2{right:5%;top:34%;transform:scale(.92);opacity:.82;animation-duration:28s}
.sf-cloud.c3{left:4%;top:52%;transform:scale(.55);opacity:.62;animation-duration:44s}
.sky-fx.night .sf-cloud{background:rgba(206,222,246,.3);box-shadow:1rem 0.25rem 0 -0.1rem rgba(206,222,246,.26),-1rem 0.3rem 0 -0.15rem rgba(206,222,246,.22);
  top:24%;left:30%;transform:scale(.85);opacity:.7}
.sky-fx.dusk .sf-cloud{background:rgba(255,236,224,.82);box-shadow:1rem 0.25rem 0 -0.1rem rgba(255,236,224,.72),-1rem 0.3rem 0 -0.15rem rgba(255,236,224,.66)}
@keyframes skySpin{to{transform:rotate(360deg)}}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
@keyframes skyDrift{from{translate:-0.5rem 0}to{translate:0.75rem 0.25rem}}

/* ------------------------------------------------ 背景微动画：夜间萤火虫 */
.hero-deco{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.firefly{position:absolute;width:0.3125rem;height:0.3125rem;border-radius:50%;background:#FFF3B0;
  box-shadow:0 0 0.4375rem rgba(255,238,150,.95),0 0 0.875rem rgba(255,225,110,.55);
  animation:fireflyFloat 6s ease-in-out infinite}
.firefly.x1{left:12%;bottom:22%}
.firefly.x2{left:28%;bottom:38%;animation-delay:1.2s}
.firefly.x3{right:18%;bottom:30%;animation-delay:2.1s}
.firefly.x4{right:8%;bottom:48%;animation-delay:.7s}
.firefly.x5{left:46%;bottom:15%;animation-delay:2.8s}
@keyframes fireflyFloat{0%,100%{transform:translate(0,0);opacity:.25}50%{transform:translate(0.375rem,-0.75rem);opacity:1}}
@media (prefers-reduced-motion:reduce){.firefly{animation:none}}

/* ------------------------------------------------ profile */
.profile-head{display:flex;align-items:center;gap:0.625rem;margin-bottom:0.875rem}
.profile-head h1{font-size:clamp(1.375rem,3.6vw,1.75rem);font-weight:var(--w-black);letter-spacing:-0.03125rem}
.profile-head p{font-size:0.71875rem;font-weight:var(--w-read);color:var(--muted);margin-top:0.125rem}
.profile-card{border-radius:1.625rem;padding:0.9375rem;display:flex;align-items:center;gap:0.75rem;position:relative;overflow:hidden;
  background:linear-gradient(125deg,#FFF7E4,#F7EEDB);border:0.09375rem solid #EBDCC0}
.profile-card .pc-ava{width:3.875rem;height:3.875rem;border-radius:1.25rem;background:#E6F5D3;border:0.15625rem solid #fff;overflow:hidden;
  position:relative;flex:none;box-shadow:0 0.375rem 0.875rem rgba(70,50,20,.12);z-index:1}
.profile-card .pc-ava .ava-icon{width:100%;height:100%;display:block;object-fit:cover;object-position:center 28%}
.profile-card .pc-main{flex:1;min-width:0;position:relative;z-index:1}
.profile-card .pc-main b{font-size:1.1875rem;font-weight:var(--w-black);letter-spacing:-0.0125rem}
.profile-card .pc-main .lv{font-size:0.625rem;font-weight:var(--w-black);color:#fff;background:var(--green);padding:0.125rem 0.375rem;border-radius:0.3125rem;margin-left:0.3125rem;vertical-align:0.125rem}
.profile-card .pc-main p{font-size:0.71875rem;font-weight:var(--w-read);color:#8D7E62;margin-top:0.25rem}
.profile-card .pc-stage{text-align:right;flex:none;position:relative;z-index:1}
.profile-card .pc-stage .chip{display:inline-flex;align-items:center;gap:0.25rem;height:1.5rem;padding:0 0.5rem;border-radius:6.1875rem;
  background:#fff;font-size:0.65625rem;font-weight:var(--w-bold);color:var(--green-d);border:0.0625rem solid #DDEBD0;white-space:nowrap}
.profile-card .pc-stage p{font-size:0.625rem;color:#A3927A;margin-top:0.3125rem;white-space:nowrap}
.profile-card .leaf{position:absolute;right:-1rem;bottom:-1.375rem;width:6rem;opacity:.2;z-index:0}

.stat-row{display:flex;gap:0.5625rem;margin-top:0.75rem}
.stat-card{flex:1;min-height:4.25rem;border-radius:1.125rem;background:#fff;border:0.09375rem solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.0625rem;box-shadow:0 0.3125rem 0.75rem rgba(94,70,30,.05)}
.stat-card .v{font-size:1.125rem;font-weight:var(--w-black);display:flex;align-items:center;gap:0.1875rem}
.stat-card .k{font-size:0.625rem;font-weight:var(--w-mid);color:var(--muted);letter-spacing:0.025rem}

.chart-card{border-radius:1.5rem;padding:0.875rem 1rem 0.75rem;margin-top:0.75rem;height:13.5rem;display:flex;flex-direction:column}
@media (min-width:700px) and (min-height:600px){.chart-card{height:14.875rem}}
.chart-card .ch-head{display:flex;align-items:flex-start;justify-content:space-between;gap:0.5rem}
.chart-card .ch-head .lb{font-size:0.6875rem;font-weight:var(--w-bold);letter-spacing:0.05rem;color:var(--muted)}
.chart-card .ch-head .v{font-size:1.4375rem;font-weight:var(--w-black);color:var(--green-d);margin-top:0.0625rem}
.chart-card .ch-head .v small{font-size:0.6875rem;font-weight:var(--w-mid);color:var(--muted)}
.chart-card .ch-head .goal{font-size:0.625rem;font-weight:var(--w-bold);color:#8A6415;background:#FFF4CE;padding:0.1875rem 0.4375rem;border-radius:6.1875rem;white-space:nowrap}
.chart{flex:1;display:flex;align-items:flex-end;gap:0.5625rem;margin-top:0.5rem;position:relative;padding-top:0.625rem;min-height:6.875rem}
.chart .gl{position:absolute;left:0;right:0;bottom:1.375rem;border-top:0.09375rem dashed #E6D9C1}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:0.3125rem;height:100%;justify-content:flex-end;position:relative;z-index:2}
.chart .col .b{width:1.375rem;border-radius:0.4375rem;background:#DCEBCB;position:relative}
.chart .col .b::after{content:"";position:absolute;left:0.25rem;right:0.25rem;top:0.1875rem;height:0.1875rem;border-radius:0.5625rem;background:rgba(255,255,255,.6)}
.chart .col.today .b{background:linear-gradient(180deg,#FFD25A,#F2A93B);box-shadow:0 0.25rem 0.5rem rgba(242,169,59,.3)}
.chart .col .d{font-size:0.625rem;font-weight:var(--w-mid);color:#A6B2A4}
.chart .col.today .d{color:#8A6415;font-weight:var(--w-black)}
.chart .col .tip{position:absolute;top:-0.875rem;font-size:0.625rem;font-weight:var(--w-black);color:#8A6415;background:#FFF4CE;padding:0.125rem 0.3125rem;border-radius:0.3125rem;white-space:nowrap}

/* 成就徽章：卡片概览 + 全屏抽屉共用一套徽章样式 */
.ach-card{--ach-gap:#fff;border-radius:1.5rem;padding:0.875rem 1rem 0.875rem;margin-top:0.75rem}
.ach-card .ach-head{display:flex;align-items:center;justify-content:space-between;gap:0.5rem}
.ach-title{display:flex;align-items:center;gap:0.375rem;min-width:0}
.ach-title .ach-title-ic{width:1.625rem;height:1.625rem;border-radius:0.5625rem;flex:none;
  display:grid;place-items:center;background:linear-gradient(160deg,#FFE7A8,#F6C35A);
  box-shadow:inset 0 0.0625rem 0 rgba(255,255,255,.75)}
.ach-title b{font-size:0.875rem;font-weight:var(--w-black);letter-spacing:-0.00625rem}
.ach-count{font-size:0.65625rem;font-weight:var(--w-mid);color:var(--muted);white-space:nowrap}
.ach-count b{font-size:0.75rem;color:#8A6415;font-weight:var(--w-black)}
.ach-track{height:0.3125rem;border-radius:6.1875rem;background:#F2E9D8;overflow:hidden;margin-top:0.625rem}
.ach-track i{display:block;height:100%;border-radius:6.1875rem;
  background:linear-gradient(90deg,#8EC7F2,#AE96F5 48%,#F5B641);transition:width .35s ease}
.ach-list{display:flex;gap:0.5rem;margin-top:0.875rem}
.ach{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:0.3125rem;
  padding:0.125rem 0;text-align:center;border-radius:0.875rem;transition:transform .14s ease}
.ach:active{transform:scale(.95)}
.ach .medal{--tone:#F2A93B;--tone-soft:#F5D79E;--face:linear-gradient(160deg,#FFE49E,#F5B641);
  width:clamp(2.75rem,9vw,3.25rem);height:clamp(2.75rem,9vw,3.25rem);border-radius:50%;position:relative;
  display:grid;place-items:center;flex:none;
  background:conic-gradient(var(--tone-soft) calc(var(--p,0) * 1%), #EADFC9 0)}
.ach .medal::before{content:"";position:absolute;inset:0.21875rem;border-radius:50%;background:var(--ach-gap,#fff)}
.ach .medal.is-done,.ach.is-done .medal{background:conic-gradient(var(--tone) 100%, var(--tone) 0)}
.ach .medal.tone-gold{--tone:#F2A93B;--tone-soft:#F6D79C;--face:linear-gradient(160deg,#FFE49E,#F5B641)}
