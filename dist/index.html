  }

  /* 动物喂食：干扰项按「栖息地 + 食性」双维度隔离
     - habitat 隔离：海洋动物只从海洋食物池挑干扰项，陆地动物只从陆地池挑
       避免 shark 吃草、panda 吃 shellfish 这类跨域乱配
     - diet 隔离：carnivore 只配 plant 类干扰，herbivore 只配 animal 类干扰
       herbivore 额外排除 milk（奶牛产奶易误判）和 worm（鸟/爬行动物也吃） */
  function buildFeedAnimal(task, pool) {
    /* 1. 从 pool 里收集所有不重复的食物（自带 cls / habitat 字段） */
    const unique = [];
    const seenFood = new Set();
    pool.forEach((w) => {
      if (!w.food || seenFood.has(w.food.id)) return;
      seenFood.add(w.food.id);
      unique.push(w.food);
    });
    const need = optionCount();
    if (task.food && unique.length >= need) {
      const correct = task.food;
      const targetHabitat = task.habitat || "land"; /* 兜底陆地 */

      /* 2. 先按 habitat 过滤同域食物（正确答案天然已在同域） */
      let sameHabitat = unique.filter((f) => f.habitat === targetHabitat && f.id !== correct.id);

      /* 3. 再按 diet 过滤：食性安全池 */
      let safe;
      if (task.diet === "carnivore") {
        /* 肉食动物 → 植物类干扰 */
        safe = sameHabitat.filter((f) => f.cls === "plant");
      } else if (task.diet === "herbivore") {
        /* 食草动物 → 动物类干扰，排除 milk/worm（孩子易误判为正确） */
        safe = sameHabitat.filter((f) => f.cls === "animal" && f.id !== "milk" && f.id !== "worm");
      } else {
        /* omnivore（启蒙模式不出喂食题，这里兜底） */
        safe = sameHabitat;
      }

      /* 4. 分层兜底：同域安全 → 同域不限食性 → 全域安全 → 全域不限 */
      let rest = shuffle(safe).slice(0, need - 1);
      if (rest.length < need - 1) {
        const seenIds = new Set([correct.id, ...rest.map((f) => f.id)]);
        /* 同域不限食性补齐 */
        for (const f of sameHabitat) {
          if (rest.length >= need - 1) break;
          if (seenIds.has(f.id)) continue;
          rest.push(f); seenIds.add(f.id);
        }
      }
      if (rest.length < need - 1) {
        const seenIds = new Set([correct.id, ...rest.map((f) => f.id)]);
        /* 全域安全池补齐（仍保持食性安全，但允许跨域） */
        let globalSafe = unique.filter((f) => f.id !== correct.id && !seenIds.has(f.id));
        if (task.diet === "carnivore") globalSafe = globalSafe.filter((f) => f.cls === "plant");
        else if (task.diet === "herbivore") globalSafe = globalSafe.filter((f) => f.cls === "animal" && f.id !== "milk" && f.id !== "worm");
        for (const f of shuffle(globalSafe)) {
          if (rest.length >= need - 1) break;
          rest.push(f);
        }
      }
      if (rest.length < need - 1) {
        /* 最终兜底：全域不限 */
        const seenIds = new Set([correct.id, ...rest.map((f) => f.id)]);
        for (const f of shuffle(unique)) {
          if (rest.length >= need - 1) break;
          if (seenIds.has(f.id)) continue;
          rest.push(f); seenIds.add(f.id);
        }
      }

      task.foods = shuffle([correct, ...rest]);
      task.correctFood = correct.id;
      task.correctZh = correct.zh || "";
      task.correctPhon = correct.phon || "";
      return;
    }
    /* 其他主题沿用原有 emoji 食物池 */
    const foodPool = pool.filter((w) => w.category === "food" || ["banana", "meat", "grass", "honey", "bamboo"].includes(w.word));
    const foods = foodPool.slice(0, need).map((w) => ({ word: w.word, emoji: w.emoji || "🍎", zh: w.zh || "", phon: w.phon || "" }));
    if (foods.length < need) {
      /* 兜底：用不重复的基础食物补足选项数 */
      const seen = new Set(foods.map((f) => f.word));
      const fallback = [
        { word: "meat", emoji: "🥩", zh: "肉", phon: "/miːt/" },
        { word: "banana", emoji: "🍌", zh: "香蕉", phon: "/bəˈnɑːnə/" },
        { word: "bamboo", emoji: "🎋", zh: "竹子", phon: "/bæmˈbuː/" },
      ];
      for (const f of fallback) {
        if (foods.length >= need) break;
        if (seen.has(f.word)) continue;
        foods.push(f);
        seen.add(f.word);
      }
    }
    /* 打乱；正确答案优先用词条自带的 eats，其次用动物常量映射 */
    task.foods = shuffle(foods);
    const match = { panda: "bamboo", lion: "meat", tiger: "meat", bear: "honey", monkey: "banana", koala: "eucalyptus", rabbit: "carrot" };
    const preferred = task.eats || match[task.word];
    task.correctFood = preferred && task.foods.some((f) => f.word === preferred)
      ? preferred
      : task.foods[0].word;
    /* 答错提示用：正确食物的中文翻译 */
    task.correctZh = (task.foods.find((f) => f.word === task.correctFood) || {}).zh || "";
    task.correctPhon = (task.foods.find((f) => f.word === task.correctFood) || {}).phon || "";
  }

  function renderFeedAnimal({ q, quiz, artOf }) {
    const revealed = quiz.revealed;
    const foods = q.foods.map((f) => {
      const id = f.id || f.word;
      const art = f.img ? artWithImage(f.img, "ref-food-img", f.emoji || "🍎") : (f.emoji || artOf(id)());
      /* 所有模式均使用纯图片选项，不显示英文名 */
      return `<button type="button" class="fd-food ${revealed && id === q.correctFood ? "correct" : ""} ${quiz.selected === id ? "selected" : ""}"
              data-action="fd-pick" data-drag="food" data-food="${id}"><span class="ref-food-art">${art}</span></button>`;
    }).join("");
    const body = `
            <div class="fd-wrap ref-feed-wrap">
              <div class="fd-animal ref-feed-animal" data-feed-drop>
                <div class="fd-art">${artWithImage(q.img, "fd-animal-img", artOf(q.word)())}</div>
                ${revealed ? "" : `<span class="feed-hungry-badge" aria-hidden="true">💭</span>`}
              </div>
              <p class="ref-hint">${q.zh} 爱吃什么？拖到嘴边或点选食物</p>
              <div class="fd-foods">${foods}</div>
            </div>`;
    return { body, btn: revealed ? quizNextButton() : "" };
  }

  /* 动作猜猜：动作图片（点击可重播卡通拟声音效）+ 提示 + 文字选项 */
  function renderAction({ q, quiz, options }) {
    const actionSrc = q.img || `images/words/action/${q.assetKey}.webp`;
    return advancedLayout({
      wrap: "ref-action-wrap",
      stage: `<div class="ref-action-stage" data-action="action-sfx" data-word="${esc(q.word)}">
                  ${wordArtImg(actionSrc, "ref-action-img", q.emoji || wordGlyph(q.word), "pic-emoji")}
                </div>`,
      tipClass: "ref-hint",
      tip: q.themeId === "animal" ? "点单词听一听，动物在干什么？" : "点单词听一听，小恐龙在干什么？",
      optionsClass: "ref-action-options",
      options: options(q.options),
      btn: quiz.revealed ? quizNextButton() : "",
    });
  }

  /* 动物喂食答对：咬一口的“咔嚓”声 + 咀嚼回弹 + Yummy!/爱心飘出（不触发重绘） */
  function playFeedChew() {
    sfx("crunch");
    const box = document.querySelector(".ref-feed-animal");
    if (!box) return;
    box.classList.remove("is-chewing");
    /* 强制回流，保证连续答对时动画能重复播放 */
    void box.offsetWidth;
    box.classList.add("is-chewing");
    box.querySelectorAll(".feed-yummy, .feed-heart").forEach((n) => n.remove());
    const yummy = document.createElement("span");
    yummy.className = "feed-yummy";
    yummy.textContent = "Yummy!";
    const h1 = document.createElement("span");
    h1.className = "feed-heart h1";
    h1.textContent = "❤";
    const h2 = document.createElement("span");
    h2.className = "feed-heart h2";
    h2.textContent = "💛";
    box.append(yummy, h1, h2);
  }

  /* 动物喂食答错：软萌摇头 + 食物弹开 + Nope!/汗滴飘出，延时后再进统一结算 */
  function playFeedWrong({ q, word }) {
    sfx("nope");
    const box = document.querySelector(".ref-feed-animal");
    if (!box) return;
    box.classList.remove("is-chewing", "is-rejecting");
    void box.offsetWidth;
    box.classList.add("is-rejecting");
    box.querySelectorAll(".feed-nope, .feed-sweat, .feed-reject-food").forEach((n) => n.remove());
    const nope = document.createElement("span");
    nope.className = "feed-nope";
    nope.textContent = "Nope!";
    const sweat = document.createElement("span");
    sweat.className = "feed-sweat";
    sweat.textContent = "💧";
    box.append(nope, sweat);
    const picked = q && Array.isArray(q.foods)
      ? q.foods.find((f) => (f.id || f.word) === word)
      : null;
    if (picked) {
      const reject = document.createElement("span");
      reject.className = "feed-reject-food";
      reject.innerHTML = picked.img
        ? `<img src="${picked.img}" alt="">`
        : (picked.emoji || "🍽️");
      box.append(reject);
    }
  }

  /* 情景对话 eat 类答对：食物从选项飞到提问动物身上，并朗读小恐龙的回答（单一音源） */
  function playDialogReply({ q, el }) {
    const d = q && q.dialog;
    if (!d) return;
    const askBox = document.querySelector(".ref-dialog-ask");
    if (d.foodImg && el && askBox) {
      sfx("pop");
      const from = el.getBoundingClientRect();
      const to = askBox.getBoundingClientRect();
      const fly = document.createElement("img");
      fly.className = "dialog-food";
      fly.src = d.foodImg;
      fly.alt = "";
      fly.style.left = `${from.left + from.width / 2}px`;
      fly.style.top = `${from.top + from.height / 2}px`;
      document.body.appendChild(fly);
      const dx = to.left + to.width / 2 - (from.left + from.width / 2);
      const dy = to.top + to.height / 2 - (from.top + from.height / 2);
      requestAnimationFrame(() => {
        fly.style.transform = `translate(${dx}px, ${dy}px) scale(.55)`;
        fly.style.opacity = "0.15";
      });
      setTimer(() => {
        fly.remove();
        /* 食物抵达：动物轻点头“开吃”，随后随重绘消失 */
        askBox.classList.remove("is-eating");
        void askBox.offsetWidth;
        askBox.classList.add("is-eating");
        setTimer(() => askBox.classList.remove("is-eating"), 900);
      }, 520);
    }
    /* 单一音源：先朗读回答句，弹卡在 settleDelay 后发生 */
    if (d.answerText) speak(d.answerText);
  }

  /* 通用默认答后信息与反馈策略（各题型可按需覆盖，消除 main.js / events.js 中的题型 if/else） */
  function defaultAnswerMeta(q) {
    const word = q && q.options && q.word ? q.word : null;
    return {
      word,
      zh: (q && q.zh) || "",
      phon: (q && q.phon) || "",
      speakText: (q && q.word) || "",
      isSentence: false,
    };
  }
  function wordOptionFeedback(q) {
    return { okSfx: "answer-right", wrongSfx: "answer-wrong", speakOnOk: (q && (q.answerValue || q.word)) || "" };
  }
  function defaultPromptLines(q, game) {
    const lines = [];
    if (game && game.prompt) lines.push(game.prompt);
    if (game && game.autoSpeak && q && q.word) lines.push(q.word);
    return lines;
  }

  function defaultGames() {
    return {
      pic: {
        label: "看图选词",
        title: "看图，选出正确的单词",
        prompt: "What is this animal?",
        pageClass: "pic-page",
        build: threeChoiceBuild,
        render: renderPic,
        getAnswerMeta: defaultAnswerMeta,
        getPromptLines(q) {
          const t = typeof currentTheme === "function" ? currentTheme() : null;
          const prompt = (q && q.picPrompt) || (t && t.picPrompt) || this.prompt;
          return prompt ? [prompt] : [];
        },
        getFeedbackOpts: wordOptionFeedback,
      },
      listen: {
        label: "听音戳泡泡",
        title: "听单词，戳破正确的泡泡",
        prompt: "Listen and pop the right bubble!",
        badgeIcon: "speaker",
        autoSpeak: true,
        build: threeChoiceBuild,
        render: renderListen,
        getAnswerMeta: defaultAnswerMeta,
        getPromptLines(q) {
          /* 直接播目标词，去掉冗长前导句，避免还没读完就戳泡泡 */
          return q && q.word ? [q.word] : [];
        },
        getFeedbackOpts: () => ({ okSfx: "excellent", wrongSfx: "wrong", speakOnOk: "" }),
        /* 答对：爆裂救援特效；答错：果冻晃动弹开，延迟后统一结算 */
        settleDelay: 650,
        onCorrectFx: playBubbleRescue,
        wrongSettleDelay: 540,
        onWrongFx: playBubbleWrong,
      },
      dialog: {
        label: "情景对话",
        title: "读对话，选出正确的答案",
        build: buildDialog,
        render: renderDialog,
        getAnswerMeta(q) {
          const d = q && q.dialog;
          const isSentence = Boolean(d && d.mode === "sentence");
          const word = isSentence
            ? q.answerText
            : (d ? d.answerValue : (q && q.options && q.word ? q.word : null));
          const zh = isSentence ? (q.answerZh || "") : ((q && q.zh) || "");
          const phon = word && q && word === q.word ? (q.phon || "") : "";
          const speakText = isSentence ? (q.answerText || q.answerValue || q.word || "") : ((q && q.word) || "");
          return { word, zh, phon, speakText, isSentence };
        },
        getPromptLines(q) {
          const d = q && q.dialog;
          const ask = d && d.ask ? d.ask : ((q && q.dlgQ) || "").replace("{word}", (q && q.word) || "");
          const text = String(ask || "").replace(/<[^>]*>/g, "").trim();
          return text ? [text] : [];
        },
        getFeedbackOpts(q) {
          const d = q && q.dialog;
          const isWordMode = !d || (d.mode !== "sentence" && d.mode !== "image");
          if (isWordMode) return wordOptionFeedback(q);
          /* eat 类整句题已在 playDialogReply 中朗读回复句，其余子模式答对后补读回答句 */
          const alreadySpoke = Boolean(d && d.mode === "sentence" && d.foodImg);
          const speakOnOk = alreadySpoke ? "" : ((d && d.answerText) || (q && (q.answerText || q.word)) || "");
          return { okSfx: "excellent", wrongSfx: "wrong", speakOnOk };
        },
        /* 仅 eat 类整句题：飞食物 + 读回复，按句长估算弹卡时机 */
        settleDelay: (q) => {
          const d = q && q.dialog;
          if (!d || d.mode !== "sentence" || !d.foodImg) return 0;
          const words = String(d.answerText || "").trim().split(/\s+/).filter(Boolean).length;
          return 800 + words * 200;
        },
        onCorrectFx: playDialogReply,
      },
      /* 🍎 动物喂食 Feed the Animal（emoji 拖拽 + 选卡） */
      feed_animal: {
        label: "动物喂食",
        title: "给动物喂它爱吃的食物！",
        prompt: "What does this animal like to eat?",
        build: buildFeedAnimal,
        render: renderFeedAnimal,
        getCorrectValue: (q) => (q && q.correctFood) || "",
        getAnswerMeta(q) {
          const food = (q && q.correctFood) || "";
          return {
            word: food || null,
            zh: (q && q.correctZh) || "",
            phon: (q && q.correctPhon) || "",
            speakText: food || (q && q.word) || "",
            isSentence: false,
          };
        },
        getPromptLines(q) {
          return q && q.word
            ? [`What does the ${q.word} like to eat?`]
            : [this.prompt];
        },
        getFeedbackOpts: (q) => ({ okSfx: "excellent", wrongSfx: "wrong", speakOnOk: (q && q.correctFood) || "" }),
        onMount: (root, q, view) => { if (view && view.setupDragging) view.setupDragging(root); },
        settleDelay: 720,
        onCorrectFx: playFeedChew,
        wrongSettleDelay: 600,
        onWrongFx: playFeedWrong,
      },
      /* 🏃 动作猜猜 Action（进阶题：中央动态动物 + 纯文字选项） */
      action: {
        label: "动作猜猜",
        title: "看动作，选出正确的单词",
        prompt: "What is the animal doing?",
        hasOwnCue: true,
        build: threeChoiceBuild,
        render: renderAction,
        getAnswerMeta: defaultAnswerMeta,
        getPromptLines(q) { return defaultPromptLines(q, this); },
        getFeedbackOpts: wordOptionFeedback,
        onMount(root, q) {
          if (q && q.word && typeof actionSfx === "function") {
            setTimer(() => actionSfx(q.word), 120);
          }
        },
      },
    };
  }

  /* 只读缓存：供高频查题型复用，避免每次调用 defaultGames() 重建 7 套闭包对象 */
  let _defaultGamesCache = null;
  function getDefaultGame(type) {
    if (!_defaultGamesCache) _defaultGamesCache = defaultGames();
    return _defaultGamesCache[type];
  }

  /* ============================================================
     每日随机挑战：跨主题混抽词汇，从共用全题型池随机抽取适配题型
     ============================================================ */
  function dailyWordPool(theme, types) {
    const scenes = (theme.scenes || []).filter((s) => s.playable !== false && (s.words || []).length);
    const list = scenes.length ? scenes.flatMap((s) => s.words) : (theme.words || []);
    return list.filter((w) => {
      if (!w || !w.word) return false;
      return types.some((type) => {
        const rule = RULE_BY_KEY[type];
        return rule && fitsRule(w, rule);
      });
    });
  }
  function buildDailyTasks(size) {
    const count = Math.max(1, Number(size) || 10);
    const types = typesForMode(IMPLEMENTED_TYPES);
    /* 未开放主题（上学了 / 去旅行）只要有适配词表也参与混抽 */
    const themes = (window.DINO_WORD_SETS || []).filter(
      (t) => t && t.isTheme && dailyWordPool(t, types).length
    );
    if (!themes.length) return [];
    const pools = new Map(themes.map((t) => [t.id, dailyWordPool(t, types)]));
    const wordMaps = new Map(themes.map((t) => [t.id, new Map(pools.get(t.id).map((w) => [w.word, w]))]));
    const used = new Set();
    const usedTypes = new Set();
    const picked = [];
    /* 先每个主题各抽 1 个，保证跨主题；不足再从全局补抽 */
    const themeQueue = shuffle(themes);
    while (themeQueue.length && picked.length < count) {
      const theme = themeQueue.pop();
      const pool = pools.get(theme.id).filter((w) => !used.has(w.word));
      const w = shuffle(pool)[0];
      if (w) { used.add(w.word); picked.push({ theme, w }); }
    }
    const rest = shuffle(
      themes.flatMap((theme) => pools.get(theme.id).filter((w) => !used.has(w.word)).map((w) => ({ theme, w })))
    );
    while (picked.length < count && rest.length) {
      const item = rest.pop();
      if (used.has(item.w.word)) continue;
      used.add(item.w.word);
      picked.push(item);
    }
    return picked.map(({ theme, w }) => {
      const pool = pools.get(theme.id) || [];
      const wordMap = wordMaps.get(theme.id);
      const compatible = types.filter((type) => fitsRule(w, RULE_BY_KEY[type]));
      const type = pickType(compatible, usedTypes);
      usedTypes.add(type);
      const rule = RULE_BY_KEY[type];
      const task = toTask(
        { gameType: type, recordWrong: rule.recordWrong, targetWord: w },
        pool,
        theme.dialog || { q: "What's this?", a: "It's a {word}." },
        theme.id,
        pool,
        theme,
        wordMap
      );
      return attachOptionArt(task, pool, wordMap);
    });
  }

  window.DynamicEngine = {
    GAME_RULES,
    CATEGORIES,
    NORMAL_MIX,
    quizSize,
    /* 题型实现（唯一来源，主题注册时取用） */
    defaultGames,
    getDefaultGame,
    defaultLevelGames,
    buildTasks,
    buildDailyTasks,

    /* level 为全局 1~50 关卡号；pool 为当前场景词池 */
    generateSession(sceneWords, stopWords, sceneId, level) {
      const pool = sceneWords && sceneWords.length ? sceneWords : (stopWords || themeWords());
      return buildSession(level, pool, sceneId || state.scene || "zoo");
    },
  };
})();

  if (voiceUnlocked) return;

    const a = getVoiceAudio();
    if (a.src && !a.paused) { voiceUnlocked = true; return; }

        return;
      }
      /* 修复 iOS / Chrome 偶发 paused 导致朗读静默卡死 */
      try { if (synth.paused) synth.resume(); } catch (e) { /* ignore */ }
      const u = new SpeechSynthesisUtterance(line);
      u.lang = "en-US";
      /* 启蒙模式自动放慢，方便 3~4 岁听清尾音与跟读 */
      u.rate = slow ? 0.72 : (kids ? 0.80 : 0.84);
      u.pitch = kids ? 1.15 : 1.04;
      if (voice) u.voice = voice;
      u.onend = () => next();
      u.onerror = () => next();
      synth.speak(u);
    };

    const sayFrom = (i) => {
      if (token !== speakToken || i >= lines.length) return;
      const line = lines[i];
      const next = () => sayFrom(i + 1);
      const url = kids ? anaVoiceUrl(line) : "";
      if (url) {
        /* 复用已解锁的全局单例 Audio，避免 iOS Safari 在 setTimeout 异步回调中拦截新 Audio */
        const audio = getVoiceAudio();
        const targetRate = slow ? 0.85 : 0.93;
        const applyRate = () => {
          try {
            if ("preservesPitch" in audio) audio.preservesPitch = true;
            if ("webkitPreservesPitch" in audio) audio.webkitPreservesPitch = true;
            audio.defaultPlaybackRate = targetRate;
            audio.playbackRate = targetRate;
          } catch (e) { /* ignore */ }
        };
        audio.muted = false;
        audio.onended = null;
        audio.onerror = null;
        audio.onloadedmetadata = applyRate;
        audio.pause();
        audio.src = url;
        applyRate();
        activeAudio = audio;
        let settled = false;
        const done = () => {
          if (settled) return;
          settled = true;
          if (activeAudio === audio) activeAudio = null;
          next();
        };
        const fallback = () => {
          if (settled) return;
          settled = true;
          if (activeAudio === audio) activeAudio = null;
          if (token === speakToken) speakWithSynth(line, next);
        };
        audio.onended = done;
        audio.onerror = fallback;
        const p = audio.play();
        if (p && typeof p.then === "function") {
          p.then(() => { voiceUnlocked = true; applyRate(); }).catch(fallback);
        }
        return;
      }
      speakWithSynth(line, next);
    };

    /* 刚 cancel 完系统朗读时稍作延迟，避免部分浏览器丢弃紧随其后的 speak */
    if (hadSynth && !kids) {
      setTimeout(() => sayFrom(0), 60);
    } else {
      sayFrom(0);
    }
  } catch (e) { /* ignore */ }
}

function levelCue(id) {

/* ============================================================
   卡通动作拟声音效（纯 Web Audio 合成，零音频文件、离线秒播）
   仅覆盖物理/卡通动作类；真实动物叫声（bark/roar 等）不硬合成
   ============================================================ */
function noiseBurst(dur = 0.12, freq = 900, q = 1.6, vol = 0.04, delay = 0) {
  if (!audioCtx) return;
  const len = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const filter = audioCtx.createBiquadFilter();
  filter.type = "bandpass";
  filter.frequency.value = freq;
  filter.Q.value = q;
  const gain = audioCtx.createGain();
  const t = audioCtx.currentTime + delay;
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.02, dur * 0.25));
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(filter).connect(gain).connect(audioCtx.destination);
  src.start(t);
  src.stop(t + dur + 0.02);
}

function slideTone(f1, f2, dur = 0.16, type = "sine", vol = 0.055, delay = 0) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(f1, t);
  osc.frequency.exponentialRampToValueAtTime(Math.max(40, f2), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + dur + 0.02);
}

const CARTOON_ACTION_SFX = {
  /* 弹簧跳 */
  jump() {
    slideTone(250, 780, 0.18, "sine", 0.065, 0);

  /* 水花四溅 */

  /* 划水游泳 */

  walk() {

  },
  /* 吃 / 咬：清脆咔嚓 */
  eat() {

    tone(185, 0.065, "triangle", 0.03, 0.15);

  bite() {

  },
  /* 咕咚喝水 */
  drink() {

  },
  /* 沙沙挖土 */
  dig() {

  dance() {
    [NOTE_FREQ.C5, NOTE_FREQ.E5, NOTE_FREQ.G5, NOTE_FREQ.E5, NOTE_FREQ.C6].forEach((f, i) => {
      tone(f, 0.09, "triangle", 0.042, i * 0.08);

  },
  /* 摇尾巴呼呼声 */
  wag() {
    slideTone(300, 440, 0.09, "sine", 0.035, 0);
    slideTone(440, 300, 0.09, "sine", 0.035, 0.1);
    slideTone(300, 460, 0.09, "sine", 0.035, 0.2);

  climb() {
    [NOTE_FREQ.C4, NOTE_FREQ.E4, NOTE_FREQ.G4, NOTE_FREQ.C5].forEach((f, i) => {
      tone(f, 0.08, "triangle", 0.042, i * 0.09);

  /* 伸懒腰 */
  stretch() {
    slideTone(260, 520, 0.22, "sine", 0.045, 0);
    slideTone(520, 390, 0.16, "sine", 0.035, 0.22);
  },
  /* 抓 / 拉 / 推 */
  catch() {

  },
  pull() { slideTone(240, 420, 0.18, "triangle", 0.045, 0); },
  push() { slideTone(380, 210, 0.16, "triangle", 0.045, 0); },
  /* 悄悄躲藏 */
  hide() {
    tone(520, 0.07, "sine", 0.035, 0);

  },
  /* 轻柔安眠波 */
  sleep() {
    slideTone(220, 265, 0.22, "sine", 0.032, 0);
    slideTone(265, 200, 0.24, "sine", 0.028, 0.22);
  },
  nap() { CARTOON_ACTION_SFX.sleep(); },
};

function actionSfx(word) {
  if (!state.sound || !word) return false;
  const fn = CARTOON_ACTION_SFX[String(word).toLowerCase()];
  if (!fn) return false;
  try {
    ensureAudio();
    if (!audioCtx) return false;
    fn();
    return true;
  } catch (e) { return false; }
}

  while (el && el !== document.body && el !== document.documentElement) {
    const style = window.getComputedStyle(el);
    if ((style.overflowY === "auto" || style.overflowY === "scroll") && el.scrollHeight > el.clientHeight + 1) {

  const atTop = _touchScroller.scrollTop <= 0 && dy > 0;

    collect: screenCollect,

    else current = history.state.screen;
  } catch (e) { current = "home"; }

  // Quiz, result and evolution screens require runtime context.
  if (!screenContextValid(current)) current = "home";

  let skyAt = skyPhase();

  document.addEventListener("touchstart", wake, { passive: true });

  const ios = isIOSDevice();

  try { seen = localStorage.getItem("dinogo.installHint") === "1"; } catch (e) {}

  <script>
/* ============================================================
   WrongBank · 智能错题库
   - 独立 localStorage 持久化（key: dinogo.wrongbank）
   - 答错自动收录 + 错误次数累加
   - 连续答对 2 次自动"毕业"移出错题库
   - 查询接口：pickFromWrong(候选词) → 65% 概率优先返回错题
   - 数据隔离：wordId 格式 "{scene}_{word}"，跨场景互不污染
   ============================================================ */
(function () {
  "use strict";

  const STORAGE_KEY = "dinogo.wrongbank";

  /* 运行时内存结构：{ [wordId]: { errorCount: n, consecutiveCorrect: n } } */
  let bank = load();

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }
  /* 写入节流：连续答题时合并成一次 localStorage 写入，避免同步阻塞主线程 */
  let persistTimer = null;
  function flush() {
    if (persistTimer) { clearTimeout(persistTimer); persistTimer = null; }
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(bank)); } catch (e) {}
  }
  function persist() {
    if (persistTimer) return;
    persistTimer = setTimeout(flush, 300);
  }
  window.addEventListener("pagehide", flush);

  /* 对外 API */
  window.WrongBank = {
    /* 为某个场景的单词生成唯一 ID：zoo + lion → "zoo_lion" */
    makeId(sceneId, word) {
      return `${sceneId || ""}_${word || ""}`;
    },

    /* 统一入口：按题型 task 记录一次答题结果（由主题能力 usesWrongBank 控制）
       所有题型一视同仁：答错必收录，答对累计连续正确次数 */
    applyResult(task, ok) {
      if (!task || !task.wrongWordId) return false;
      if (typeof usesWrongBank === "function" && !usesWrongBank()) return false;
      if (ok) return this.recordCorrect(task.wrongWordId);
      this.recordWrong(task.wrongWordId);
      return false;
    },

    /* 答错时调用：自动收录 + 错误次数累加 + 打断连续正确 */
    recordWrong(wordId) {
      if (!wordId) return;
      if (!bank[wordId]) {
        bank[wordId] = { errorCount: 1, consecutiveCorrect: 0 };
      } else {
        bank[wordId].errorCount += 1;
        bank[wordId].consecutiveCorrect = 0;
      }
      persist();
    },

    /* 答对时调用：连续答对 2 次自动毕业 → 返回 true 触发"康复欢呼"特效 */
    recordCorrect(wordId) {
      if (!wordId) return false;
      const rec = bank[wordId];
      if (!rec) return false;
      rec.consecutiveCorrect += 1;
      if (rec.consecutiveCorrect >= 2) {
        delete bank[wordId];
        persist();
        return true;
      }
      persist();
      return false;
    },

    /* 判断某个词是否在错题库中 */
    isWrongWord(wordId) {
      return Boolean(bank[wordId]);
    },

    /* 从候选词列表里加权挑一个：65% 概率优先从错题里抽（单次分桶） */
    pickWithBias(candidates, wordIdGetter) {
      if (!candidates || candidates.length === 0) return null;
      const getter = wordIdGetter || ((w) => w);
      const wrong = [];
      const normal = [];
      for (let i = 0; i < candidates.length; i++) {
        const w = candidates[i];
        (bank[getter(w)] ? wrong : normal).push(w);
      }
      const BIAS = 0.65;
      if (wrong.length > 0 && Math.random() < BIAS) {
        return wrong[Math.floor(Math.random() * wrong.length)];
      }
      if (normal.length > 0) {
        return normal[Math.floor(Math.random() * normal.length)];
      }
      return candidates[Math.floor(Math.random() * candidates.length)];
    },

    /* 列出某场景的所有错题 wordId */
    listInScene(sceneId) {
      const prefix = `${sceneId || ""}_`;
      return Object.keys(bank).filter((k) => k.startsWith(prefix));
    },

    /* 清空（重玩全部关卡前可调用） */
    clear() { bank = {}; persist(); },
  };
})();

   ChestManager · 神秘宝箱 + 星星幸运大转盘
   - 旅程里程碑：当前主题星数上限的 30% / 60% / 100%，各 1 个宝箱（共 3 个）
   - 打开宝箱 = 获得 1 次免费转盘机会，并直接进入转盘页面；不消耗星星

  const MILESTONE_PCTS = [0.3, 0.6, 1];

    { id: "zoo",      label: "周末去动物园",    short: "动物园",   color: "#DFEAC8", ink: "#46603A", weight: 4,  icon: "🦁" },
    { id: "book",     label: "挑1本新绘本",     short: "新绘本",   color: "#DCE0F5", ink: "#3B4473", weight: 5,  icon: "📖" },
    { id: "icecream", label: "吃1个小冰淇淋",   short: "冰淇淋",   color: "#FBE2CE", ink: "#7A4B2A", weight: 4,  icon: "🍦" },
  ];
  const PRIZE_ICON = {};
  REWARD_POOL.forEach((p) => { PRIZE_ICON[p.id] = p.icon; });

  /* 按 weight 随机抽取索引 */
  function pickWeightedIndex(list) {
    const total = list.reduce((sum, item) => sum + item.weight, 0);
    let r = Math.random() * total;
    for (let i = 0; i < list.length; i++) {
      r -= list[i].weight;
      if (r <= 0) return i;
    }
    return 0;
  }

  /* 构建并缓存 12 扇区 SVG 盘面（0 号扇区正对顶部指针） */
  let _wheelSvgCache = "";
  function buildWheelSVG() {
    if (_wheelSvgCache) return _wheelSvgCache;
    const cx = 200, cy = 200, r = 196;
    const sliceDeg = 360 / REWARD_POOL.length;
    const slices = REWARD_POOL.map((p, i) => {
      const a1 = (-90 - sliceDeg / 2 + i * sliceDeg) * Math.PI / 180;
      const a2 = (-90 + sliceDeg / 2 + i * sliceDeg) * Math.PI / 180;
      const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
      const x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
      return `<g>
        <path d="M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 0 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z"
          fill="${p.color}" stroke="#5C411D" stroke-width="2.4" stroke-linejoin="round" stroke-opacity=".55"/>
        <g transform="translate(${cx},${cy}) rotate(${i * sliceDeg})">
          <text x="0" y="-150" text-anchor="middle" fill="${p.ink}" font-size="12.5" font-weight="800">${p.short}</text>
          <text x="0" y="-116" text-anchor="middle" font-size="22">${p.icon}</text>
        </g>
      </g>`;
    }).join("");
    _wheelSvgCache = `<svg viewBox="0 0 400 400">${slices}</svg>`;
    return _wheelSvgCache;
  }

  /* 构建并缓存外圈 16 颗跑马灯灯泡 */
  let _bulbsSvgCache = "";
  function buildBulbsSVG() {
    if (_bulbsSvgCache) return _bulbsSvgCache;
    const cx = 180, cy = 180, r = 171;
    let dots = "";
    for (let i = 0; i < 16; i++) {
      const rad = ((i * 360) / 16 - 90) * Math.PI / 180;
      dots += `<circle cx="${(cx + r * Math.cos(rad)).toFixed(1)}" cy="${(cy + r * Math.sin(rad)).toFixed(1)}"
        r="5.5" class="${i % 2 === 0 ? "lw-bulb-a" : "lw-bulb-b"}" stroke="#B08E5C" stroke-width="1.5"/>`;
    }
    _bulbsSvgCache = `<svg class="lw-bulbs" viewBox="0 0 360 360" aria-hidden="true">${dots}</svg>`;
    return _bulbsSvgCache;
  }

  /* 礼花纸屑喷射 */
  function launchConfetti() {
    const colors = ["#2E8B57", "#E8A23C", "#FF8A4C", "#FF6F61", "#9BC98A", "#7FA8C9", "#C9A6D8", "#F2C6CE"];
    for (let i = 0; i < 36; i++) {
      const el = document.createElement("div");
      el.className = "lw-confetti";
      el.style.left = Math.random() * 100 + "vw";
      el.style.backgroundColor = colors[i % colors.length];
      el.style.borderRadius = i % 2 === 0 ? "50%" : "3px";
      el.style.setProperty("--tx", (Math.random() - 0.5) * 200 + "px");
      el.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
      el.style.animationDuration = (1.5 + Math.random() * 1.3).toFixed(2) + "s";
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }
  }

  let spinning = false;
  let confirmAsk = -1;
  let lastWon = null;
  let currentDeg = 0;

  function buildRecordsHtml() {
    const coupons = Array.isArray(state.coupons) ? state.coupons : [];
    return coupons.length
      ? coupons.map((c, i) => {
        const action = c.used
          ? `<span class="lw-used">已兑换</span>`
          : confirmAsk === i
            ? `<span class="lw-confirm">
                <button class="lw-mini ghost" data-action="coupon-cancel">取消</button>
                <button class="lw-mini" data-action="coupon-redeem" data-index="${i}">确认</button>
              </span>`
            : `<button class="lw-redeem" data-action="coupon-ask" data-index="${i}">家长核销</button>`;
        return `<li class="lw-record${c.used ? " used" : ""}">
          <span class="ico">${PRIZE_ICON[c.id] || "🎁"}</span>
          <span class="lw-record-main"><b>${c.label}</b><time>${c.date || ""}</time></span>
          ${action}
        </li>`;
      }).join("")
      : `<li class="lw-history-empty">还没有抽奖记录，转一转试试手气吧</li>`;
  }

  /* 仅局部刷新抽奖记录列表，避免整页重绘触发抽屉入场动画与滚动条跳动 */
  function refreshHistoryList() {
    const listEl = document.querySelector(".lucky-wheel-sheet .lw-history-list");
    if (!listEl) {
      openOverlay(buildOverlay(false));
      return;
    }
    listEl.innerHTML = buildRecordsHtml();
  }

  function buildOverlay(fromChest) {
    const free = pendingSpins();
    const balance = starBalance();
    const coupons = Array.isArray(state.coupons) ? state.coupons : [];
    const dailyLeft = Math.max(0, DAILY_LIMIT - spinsToday());

    let btnText;
    let disabled = false;
    if (dailyLeft <= 0) { btnText = `今天转满 ${DAILY_LIMIT} 次啦，明天再来`; disabled = true; }
    else if (free > 0) btnText = free > 1 ? `开始抽奖！免费转（剩 ${free} 次）` : "开始抽奖！免费转一次";
    else if (balance >= WHEEL_COST) btnText = `开始抽奖！花 ${WHEEL_COST} ★ SPIN!`;
    else { btnText = `还差 ${WHEEL_COST - balance} ★ 才能转哦`; disabled = true; }

    const baseHint = fromChest
      ? "宝箱开启成功！送你 1 次免费转盘机会"
      : free > 0
        ? "免费机会不消耗星星，未使用会保留到下次"
        : `每 ${WHEEL_COST} ★ 转一次，抽中的奖励找爸爸妈妈兑换`;
    const hint = `${baseHint}；今天还剩 ${dailyLeft}/${DAILY_LIMIT} 次`;

    const records = buildRecordsHtml();

    const winPop = lastWon ? `<div class="lw-win-mask">
      <div class="lw-win-card">
        <div class="lw-win-ribbon">🎉 恭喜中奖啦！ 🎉</div>
        <div class="lw-win-ico">${lastWon.icon}</div>
        <h3>${lastWon.label}</h3>
        <p>已放入下方抽奖记录，快找爸爸妈妈兑换吧~</p>
        <button type="button" class="btn lw-win-ok" data-action="wheel-win-ok">开心收下！</button>
      </div>
    </div>` : "";

    return `<div class="overlay"><div class="sheet lucky-wheel-sheet">
      <div class="lw-paper">
      <div class="grab"></div>
      <button type="button" class="lw-close" data-action="close-overlay" aria-label="关闭转盘">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="#5C411D" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </button>
      <header class="lw-head">
        <span class="lw-deco d1">✦</span><span class="lw-deco d2">✦</span>
        <h2><span class="lw-brand">Dingo</span> 恐龙转盘</h2>
        <p>${hint}</p>
      </header>
      <div class="lw-chips">
        <span class="lw-chip"><i>★</i>星星 <b id="lw-star-val">${fmt(balance)}</b></span>
        <span class="lw-chip free"><i>🎁</i>免费机会 <b id="lw-free-val">${free}</b></span>
      </div>
      <div class="lw-stage">
        <div class="lw-stand" aria-hidden="true"></div>
        <div class="lw-pointer" id="lw-pointer" aria-hidden="true">
          <svg viewBox="0 0 60 72" width="100%" height="100%">
            <path d="M30,68 L8,26 A22,22 0 1,1 52,26 Z" fill="#FF6F61" stroke="#5C411D" stroke-width="4.5" stroke-linejoin="round"/>
            <circle cx="30" cy="24" r="10" fill="#FFF6E0" stroke="#5C411D" stroke-width="3.5"/>
            <circle cx="27" cy="21" r="3" fill="#FFF"/>
          </svg>
        </div>
        <div class="lw-rim" id="lw-rim">
          ${buildBulbsSVG()}
          <div class="lw-disc" id="lucky-wheel-disc" style="transform:rotate(${currentDeg}deg)">${buildWheelSVG()}</div>
          <span class="lw-hub" aria-hidden="true">
            <svg width="34" height="34" viewBox="0 0 64 64">
              <path d="M18,52 C14,34 22,14 42,10 C38,24 42,38 48,48 C38,54 26,55 18,52 Z" fill="#2E8B57" stroke="#5C411D" stroke-width="3.5" stroke-linejoin="round"/>
              <polygon points="22,26 14,22 20,33" fill="#E8A23C" stroke="#5C411D" stroke-width="2.5"/>
              <polygon points="28,16 21,10 25,22" fill="#E8A23C" stroke="#5C411D" stroke-width="2.5"/>
              <polygon points="36,11 32,4 33,15" fill="#E8A23C" stroke="#5C411D" stroke-width="2.5"/>
            </svg>
          </span>
        </div>
      </div>
      <button class="btn lw-spin-btn" id="lw-spin-btn" data-action="wheel-spin" ${disabled ? "disabled" : ""}>${btnText}</button>
      <section class="lw-history">
        <div class="lw-history-head"><h3>抽奖记录</h3><span>已抽 ${coupons.length} 次 · 兑换请家长核销</span></div>
        <ul class="lw-history-list">${records}</ul>
      </section>
      </div>
      ${winPop}
    </div></div>`;
  }

  function open(opts) {
    confirmAsk = -1;
    lastWon = null;
    currentDeg = 0;
    sfx("tap");
    openOverlay(buildOverlay(Boolean(opts && opts.fromChest)));
  }

  function spin() {
    if (spinning) return;
    if (spinsToday() >= DAILY_LIMIT) {
      toast(`今天已经转满 ${DAILY_LIMIT} 次啦，明天再来哦！`);
      return;
    }
    const free = pendingSpins();
    const balance = starBalance();
    /* 优先消耗宝箱赠送的免费机会，其次才花星星 */
    if (free <= 0 && balance < WHEEL_COST) {
      toast(`还需要 ${WHEEL_COST - balance} ★ 才能转转盘哦！`);
      return;
    }

    ensureAudio();
    sfx("coin");
    spinning = true;
    lastWon = null;

    /* 1. 扣费 + 抽取中奖扇区 + 立刻写入存档（防中途刷新丢星星） */
    if (free > 0) state.spins = free - 1;
    else state.stars = balance - WHEEL_COST;
    if (state.spinDay !== dateKey()) { state.spinDay = dateKey(); state.spinCount = 0; }
    state.spinCount = (Number(state.spinCount) || 0) + 1;

    const winIdx = pickWeightedIndex(REWARD_POOL);
    const prize = REWARD_POOL[winIdx];
    if (!Array.isArray(state.coupons)) state.coupons = [];
    const now = new Date();
    const pad = (n) => String(n).padStart(2, "0");
    state.coupons.unshift({
      id: prize.id,
      label: prize.label,
      date: `${now.getMonth() + 1}月${now.getDate()}日 ${pad(now.getHours())}:${pad(now.getMinutes())}`,
      used: false,
    });
    save();

    /* 2. 更新顶部数字与按钮禁用态（不整页重绘，保持转盘流畅） */
    const starEl = document.getElementById("lw-star-val");
    const freeEl = document.getElementById("lw-free-val");
    const btnEl = document.getElementById("lw-spin-btn");
    const rimEl = document.getElementById("lw-rim");
    const discEl = document.getElementById("lucky-wheel-disc");
    const ptrEl = document.getElementById("lw-pointer");
    if (starEl) starEl.textContent = fmt(starBalance());
    if (freeEl) freeEl.textContent = pendingSpins();
    if (btnEl) btnEl.disabled = true;
    if (rimEl) rimEl.classList.add("spinning-fast");

    /* 3. requestAnimationFrame 物理缓动 + 跨扇区指针滴答声 */
    const sliceDeg = 360 / REWARD_POOL.length;
    const targetMod = (360 - winIdx * sliceDeg) % 360;
    const jitter = (Math.random() - 0.5) * (sliceDeg * 0.55);
    const curMod = ((currentDeg % 360) + 360) % 360;
    let delta = (targetMod - curMod + jitter + 360) % 360;
    if (delta < 60) delta += 360;

    const startRot = currentDeg;
    const targetRot = startRot + 6 * 360 + delta;
    const startTime = performance.now();
    const duration = 4200;
    let lastStep = Math.floor((startRot + sliceDeg / 2) / sliceDeg);

    function frame(ts) {
      const p = Math.min((ts - startTime) / duration, 1);
      const eased = 1 - Math.pow(1 - p, 4.2);
      const deg = startRot + (targetRot - startRot) * eased;
      if (discEl) discEl.style.transform = `rotate(${deg}deg)`;

      const step = Math.floor((deg + sliceDeg / 2) / sliceDeg);
      if (step !== lastStep) {
        lastStep = step;
        if (ptrEl) {
          if (typeof ptrEl.animate === "function") {
            ptrEl.animate(
              [{ transform: "rotate(-16deg)" }, { transform: "rotate(0deg)" }],
              { duration: 120, easing: "ease-out" }
            );
          } else {
            ptrEl.classList.remove("ticking");
            void ptrEl.offsetWidth;
            ptrEl.classList.add("ticking");
          }
        }
        if (state.sound && typeof tone === "function") tone(680, 0.04, "triangle", 0.055);
      }

      if (p < 1) {
        requestAnimationFrame(frame);
      } else {
        currentDeg = targetRot;
        spinning = false;
        lastWon = prize;
        if (rimEl) rimEl.classList.remove("spinning-fast");
        sfx("win");
        launchConfetti();
        const root = document.getElementById("overlay-root");
        if (root && root.querySelector(".lucky-wheel-sheet")) openOverlay(buildOverlay(false));
        render();
      }
    }
    requestAnimationFrame(frame);
  }

  function closeWinPop() {
    lastWon = null;
    sfx("tap");
    openOverlay(buildOverlay(false));
  }

  /* 家长核销：先点「家长核销」进入确认，再由家长点「确认」 */
  function askRedeem(i) {
    if (!Array.isArray(state.coupons) || !state.coupons[i] || state.coupons[i].used) return;
    confirmAsk = i;
    refreshHistoryList();
  }

  function cancelRedeem() {
    confirmAsk = -1;
    refreshHistoryList();
  }

  function redeem(i) {
    const c = Array.isArray(state.coupons) ? state.coupons[i] : null;
    if (!c || c.used) return;
    c.used = true;
    confirmAsk = -1;
    save();
    sfx("win");
    toast(`已核销：「${c.label}」，请家长兑现奖励`);
    refreshHistoryList();
  }

  window.LuckyWheel = {
    open,
    spin,
    closeWinPop,
    askRedeem,
    cancelRedeem,
    redeem,
    isSpinning: () => spinning,
  };
})();

</script>
  <script>
/* ============================================================
   DinoGo · 恐龙英语 — 闯关结算与恐龙进化
   由 chest.js 拆出：结算页 finishQuiz/screenResult，进化页 beginEvolution/screenEvolution
   ============================================================ */
(function () {
  'use strict';

  /* ============================================================
     闯关结算
     ============================================================ */
  /* 每日随机挑战结算：完成才消耗当日次数，一题一星，不推进关卡、不计成长值 */
  function finishDailyQuiz() {
    const total = quiz.order.length || 1;
    takeDailyChallenge();
    const correct = Math.min(quiz.correct, total);
    const stars = Math.min((quiz.starIndex || []).length, total);
    const enlighten = Boolean(state.enlighten);
    const seconds = Math.max(1, Math.round((Date.now() - quiz.startedAt) / 1000));
    const wordList = quiz.order.map((q) => ({ word: q.word, ok: quiz.words.indexOf(q.word) >= 0 }));
    state.stars = starBalance() + stars;
    lastResult = {
      mode: "daily",
      level: 0,
      total,
      correct,
      stars,
      starGain: stars,
      best: stars,
      growthGain: 0,
      accuracy: Math.round((correct / total) * 100),
      seconds,
      enlighten,
      dailyLeft: dailyChallengeLeft(),
      wordList,
    };
    quiz = null;
    save();
    sfx(correct >= 5 ? "win" : correct >= 3 ? "coin" : "answer-right");
    go("result", { replace: true });
  }

  function finishQuiz() {
    if (!quiz) return;
    if (quiz.mode === "daily") { finishDailyQuiz(); return; }
    /* 每 5 关一个循环：
       前 4 关基础练习：3 题；第 5/10/15… 关考核关：5 题
       星级只按答对题数计算，不作为是否过关的门槛 */
    const assessment = isAssessmentLevel(quiz.level);
    const total = quizSize(quiz.level);
    const correct = Math.min(quiz.correct, total);
    const accuracy = correct / total;
    const enlighten = Boolean(state.enlighten);
    /* 每关都按答对题数发 1~3 星：普通关 3 题答对 1/2/3 → 1/2/3 星；
       考核关 5 题答对 3/4/5 → 1/2/3 星 */
    const stars = assessment
      ? (correct >= 5 ? 3 : correct >= 4 ? 2 : correct >= 3 ? 1 : 0)
      : (correct >= 3 ? 3 : correct >= 2 ? 2 : correct >= 1 ? 1 : 0);
    const prog = themeProgress();
    const completedLevel = quiz.level;
    const prevBest = prog.stars[completedLevel] || 0;
    const best = Math.max(prevBest, stars);
    /* 基础关不产出星星；考核关按最高星结算 */
    const bestGain = Math.max(0, best - prevBest);
    /* 已通关判定：末关通过后 prog.level 不再增长，靠 cleared 标记区分首通与重玩 */
    const alreadyCleared = Boolean(prog.cleared && prog.cleared[completedLevel]);
    const isReplay = alreadyCleared || completedLevel < prog.level;
    /* 重玩未满星关卡：只发放星级增量，可把这一关补到满星；成长值仍不重复发放 */
    const starGain = bestGain;
    const growthGain = isReplay ? 0 : correct * 24;
    const elapsed = Math.max(5, Math.round((Date.now() - quiz.startedAt) / 1000));
    state.growth += growthGain;
    state.stars += starGain;
    if (best > 0) prog.stars[completedLevel] = best;
    /* 完成结算即可推进到下一关，重玩旧关卡不影响进度 */
    if (!isReplay) prog.level = Math.min(levelsPerTheme(), completedLevel + 1);
    prog.cleared[completedLevel] = true;
    /* 单词数由解锁列表决定，同一单词答对多次不会重复计数 */
    state.words = Array.isArray(state.unlocked) ? state.unlocked.length : 0;
    const newUnlocked = [...new Set(quiz.newWords || [])];
    /* 三星收藏只在首次拿到 3 星时 +1，重玩补到满星同样计入 */
    if (stars === 3 && prevBest < 3) state.threeStars += 1;
    state.tasks.level = true;
    /* 学习日志记录本次实际获得的星星，重玩不虚增 */
    recordLevel(starGain);
    const target = stageForGrowth(state.growth);
    const canEvolve = stageIndex(target.key) > stageIndex(state.stage);
    lastResult = {
      level: completedLevel,
      replay: isReplay,
      prevBest,
      best,
      correct: quiz.correct,
      total,
      assessment,
      accuracy: Math.round(accuracy * 100),
      stars,
      enlighten,
      growthGain,
      starGain,
      seconds: elapsed,
      newWords: newUnlocked.length,
      canEvolve,
      targetStage: target.key,
      wordList: newUnlocked.slice(0, 5),
    };
    quiz = null;
    save();
    sfx(stars === 3 ? "win" : "coin");

    /* 🔥 总 BOSS 关通关额外奖励：仅首次全通关发放 */
    if (isFinalBossLevel(completedLevel) && window.ChestManager) {
      lastResult.bossClear = true;
      if (!ChestManager.isAllCleared()) lastResult.bossChests = ChestManager.rewardBossClear();
      lastResult.allCleared = ChestManager.isAllCleared();
    }

    go("result", { replace: true });
  }

  /* 每日随机挑战结算页：10 题 10 星、可爱恐龙、鼓励语，展示本局单词 */
  function screenDailyResult(r) {
    /* 星级按答对题数计：一题一星 */
    const title = r.stars >= r.total ? "满星通关！" : r.stars >= Math.ceil(r.total * 0.8) ? "太厉害啦！" : "挑战完成！";
    const mm = String(Math.floor(r.seconds / 60)).padStart(2, "0");
    const ss = String(r.seconds % 60).padStart(2, "0");
    /* 星星不再整排展示：改为「✨*数字」，数字取答对题数，进入页面时老虎机滚动落定 */
    const slotLen = 31;
    const slotReel = Array.from({ length: slotLen - 1 }, (_, i) => `<i>${(i + 1) % 10}</i>`).join("") + `<i>${r.correct}</i>`;
    const slotEnd = -((slotLen - 1) * 1.35);
    /* 无条件飘彩纸屑（v2 骨架统一） */
    const confettiPieces = renderConfetti(20, "result");
    /* 单词 chip：带 ok/no 标记 */
    const chips = r.wordList.map((w) => `<span class="dv2-chip ${w.ok ? "ok" : "no"}">${w.word} ${w.ok ? "✓" : "✗"}</span>`).join("");

    /* 按钮：右侧主按钮为「再抽一次」（次数用完时禁用），左侧次要按钮为「回地图」 */
    const leftBtn = `<button type="button" class="rs2-btn secondary" data-action="close-quiz">回地图</button>`;
    const rightBtn = r.dailyLeft > 0

  function screenResult() {
    if (!lastResult) {
      setTimeout(() => go("home", { replace: true }), 0);
      return `<section class="screen"></section>`;
    }
    const r = lastResult;
    if (r.mode === "daily") return screenDailyResult(r);

    const st = stageMeta(state.stage);
    const next = nextStage(st.key);
    const pending = r.canEvolve && r.targetStage;
    const target = pending ? stageMeta(r.targetStage) : null;
    const pct = next ? clamp((state.growth - st.min) / (next.min - st.min), 0, 1) : 1;
    const atMax = st.key === "super";
    const isUltra = st.key === "ultra";
    const ultraOpen = ultraExchangeOpen();
    const growPct = isUltra ? 1 : atMax ? clamp(state.growth / ULTRA_MIN, 0, 1) : pending ? 1 : pct;
    const growPctNum = Math.round(growPct * 100);
    /* 进度条小恐龙头像滑块位置限制在 8% ~ 94%，避免贴边溢出 */
    const headLeft = Math.max(8, Math.min(94, growPctNum));

    const evoText = isUltra
      ? "究极体已解锁 · 可在图鉴切换形态"
      : atMax
        ? (ultraOpen
            ? `究极体兑换已开放（<b>${ULTRA_PRICE}★/只</b>）`
            : `距 <b>究极体兑换</b> 还差 <b>${Math.max(0, ULTRA_MIN - state.growth)}</b>`)
      : pending
        ? `成长值已满 · 可以进化为 <b>${target.name}</b>！`
        : next
          ? `距 <b>${next.name}</b> 还差 <b>${Math.max(0, next.min - state.growth)}</b>`
          : "已达成最高形态";

    /* 关卡进度与按钮逻辑：完成结算即可进入下一关 */
    const progNow = themeProgress();
    const nextLevel = Math.min(progNow.level, r.level + 1);
    const nextCleared = nextLevel < progNow.level || Boolean(progNow.cleared && progNow.cleared[nextLevel]);
    const canNext = !nextCleared;
    const canReplay = r.best < 3;

    /* 顶部主标题 */
    const titleText = r.bossClear
      ? `BOSS · 全部通关!`
      : `LEVEL ${String(r.level).padStart(2, "0")} · ${r.replay ? "复习完成" : "闯关完成"}`;

    /* 弧形三颗大星 */
    const starRow = [0, 1, 2].map((i) =>
      star(
        i === 1 ? 74 : 58,
        i < r.best ? "#FFC94A" : "#EFE4CE",
        i < r.best ? "#E09A2B" : "#D6C5A7",
        i < r.best ? 1 : 0.65
      )
    ).join("");

    /* 本关可点读无框动物圆标（最多展示 3 个，点击直接触发全局 speak-word 朗读） */
    const rawWords = r.wordList && r.wordList.length
      ? r.wordList
      : (state.unlocked || []).slice(-3).map((k) => k.slice(k.lastIndexOf(":") + 1));
    const uniqueWords = [...new Set(rawWords)].slice(0, 3);
    const lib = window.DINO_WORD_LIBRARY || {};
    const wordItemsHtml = uniqueWords.map((w, idx) => {
      const meta = lib[w] || {};
      const imgSrc = meta.img || wordImgPath(w);
      const emoji = meta.emoji || "🐾";
      return `<button type="button" class="rs2-word-item" data-action="speak-word" data-word="${esc(w)}" aria-label="朗读 ${w}">
      <span class="rs2-word-pic t${idx % 3}">
        ${wordArtImg(imgSrc, "", emoji, "art-fallback")}
      </span>
      <span class="rs2-word-label"><span>${esc(w)}</span>${I.speaker(16, "#B48A5A")}</span>
    </button>`;
    }).join("");

    /* 轻柔飘落彩纸屑 */
    const confettiPieces = renderConfetti(20, "result");

    /* 左侧辅助按钮：未满星可重新挑战，已满星直接返回地图 */
    const leftBtn = canReplay
      ? `<button type="button" class="rs2-btn secondary" data-action="start-quiz" data-level="${r.level}">重新挑战</button>`
      : `<button type="button" class="rs2-btn secondary" data-action="close-quiz">返回地图</button>`;

    /* 右侧主按钮：满足进化条件优先引导进化 */
    const rightBtn = pending
      ? `<button type="button" class="rs2-btn primary evolve" data-action="evolve">✨ 见证进化 ▶</button>`
      : canNext
        ? `<button type="button" class="rs2-btn primary" data-action="start-quiz" data-level="${nextLevel}">继续下一关 ▶</button>`
        : `<button type="button" class="rs2-btn primary" data-action="close-quiz">回地图看看 ▶</button>`;

    return `<section class="screen result-page result-stage-v2" data-screen="result">
    <button class="circle-btn result-close" data-action="close-quiz" aria-label="关闭">${I.close(16)}</button>
    <div class="rs2-rays" aria-hidden="true"></div>
    <div class="rs2-hill" aria-hidden="true"></div>
    <div class="confetti">${confettiPieces}</div>

    <header class="rs2-hero">
      <h1 class="rs2-title${r.bossClear ? " is-boss" : ""}">${titleText}</h1>
      ${r.bossClear && r.bossChests ? `<div class="rs2-sub">🎁 额外获得 ${r.bossChests} 个神秘宝箱</div>` : ""}
      <div class="rs2-stars">${starRow}</div>
      <div class="rs2-dino">${dino(state.stage)}</div>
    </header>

    <div class="rs2-tray-wrap">
      <div class="rs2-tray">
        <div class="rs2-pills">
          <div class="rs2-pill exp">
            <span class="rs2-pill-ic">${I.leaf(15, "#FFFFFF")}</span>
            <span class="num">+${r.growthGain} 成长值</span>
          </div>
          <div class="rs2-pill star">
            <span class="rs2-pill-ic">${star(15, "#FFE07D", "#C88B22")}</span>
            <span class="num">+${r.starGain} 星星</span>
          </div>
        </div>

        <div class="rs2-evo">
          <div class="rs2-evo-txt">${evoText}</div>
          <div class="rs2-evo-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${growPctNum}">
            <div class="rs2-evo-fill" style="width:${growPctNum}%"></div>
            <span class="rs2-evo-head" style="left:${headLeft}%">
              <img src="${avatarArtSrc()}" alt="">
            </span>
          </div>
        </div>

        <div class="rs2-words" aria-label="本关收获单词">
          ${wordItemsHtml}
        </div>

        <div class="rs2-actions">
          ${leftBtn}
          ${rightBtn}
        </div>
      </div>
    </div>
  </section>`;
  }

  /* ============================================================
     恐龙进化
     ============================================================ */
  function beginEvolution() {
    const from = stageMeta(state.stage);
    /* 自动进化止步完全体，究极体改为图鉴星星兑换 */
    if (from.key === "super" || from.key === "ultra") {
      toast("已经进化到完全体啦，去图鉴用星星兑换究极体吧");
      go("home", { replace: true });
      return;
    }
    const to = stageForGrowth(state.growth);
    if (stageIndex(to.key) <= stageIndex(from.key)) {
      toast("成长值还不够，再去闯一关吧");
      go("home", { replace: true });
      return;
    }
    const wasInDex = state.dex.includes(to.key);
    const newDex = [...new Set([...state.dex, to.key])];
    state.stage = to.key;
    state.dex = newDex;
    let dexReward = null;
    if (state.dex.length >= 4 && !state.bgOwned.includes("sunset")) {
      state.bgOwned.push("sunset");
      dexReward = "静谧湖畔";
    }
    if (state.dex.length >= 6 && !state.bgOwned.includes("night")) {
      state.bgOwned.push("night");
      dexReward = "珊瑚海湾";
    }
    save();
    evolutionInfo = { from, to, isNew: !wasInDex, dexReward };
    sfx("evolve");
    go("evolution");
  }

  function screenEvolution() {
    if (!evolutionInfo) {
      setTimeout(() => go("home", { replace: true }), 0);
      return `<section class="screen"></section>`;
    }
    const info = evolutionInfo;
    const fromIdx = stageIndex(info.from.key);
    const toIdx = stageIndex(info.to.key);
    const fromSrc = dinoArtSrc(info.from.key, state.ultraSkin);
    const toSrc = dinoArtSrc(info.to.key, state.ultraSkin);

    const subNote = info.to.key === "ultra"
      ? "4 种究极体机甲形态可在图鉴中自由切换"
      : "已收录进图鉴，外形和能力都更强了！";

    return `<section class="screen" data-screen="evolution" style="background:#FBF3E3">
    <div class="evo-page evo-stage-v2">
      <button class="circle-btn result-close" data-action="home" aria-label="回到乐园">${I.close(16)}</button>
      <div class="ev2-rays" aria-hidden="true"></div>
      <div class="ev2-hill" aria-hidden="true"></div>

      <header class="ev2-top-wrap">
        <div class="ev2-milestone">${spark(11, "#E9A93C")} MILESTONE ${String(toIdx).padStart(2, "0")} / ${String(EVOLVE_MAX_INDEX).padStart(2, "0")}</div>
        <h1 class="ev2-title">进化成功！</h1>
        <div class="ev2-stages">
          <span class="ev2-st">${info.from.name} · LV.${fromIdx + 1}</span>
          <span class="ev2-st-arr" aria-hidden="true">→</span>
          <span class="ev2-st is-new">${I.crownMini(13, "#8A5B15")} ${info.to.name} · LV.${toIdx + 1}</span>
        </div>
      </header>

      <div class="ev2-hero">
        <div class="ev2-halo" aria-hidden="true"></div>
        <div class="ev2-orbit" aria-hidden="true"></div>
        <div class="ev2-dino">${dino(info.to.key)}</div>
      </div>

      <div class="ev2-tray-wrap">
        <div class="ev2-tray">
          <div class="ev2-pills">
            <div class="ev2-pill gold">
              <span>✨ 新形态 · ${info.to.name}</span>
            </div>
            <div class="ev2-pill sage">
              <span>${info.isNew ? "+1 图鉴收录" : "图鉴已收录"}</span>
            </div>
            ${info.dexReward ? `<div class="ev2-pill gold"><span>🎁 解锁「${info.dexReward}」</span></div>` : ""}
          </div>

          <div class="ev2-compare">
            <div class="ev2-avatars" aria-hidden="true">
              <span class="ev2-ava from"><img src="${fromSrc}" alt=""></span>
              <span class="ev2-ava-arr">→</span>
              <span class="ev2-ava to"><img src="${toSrc}" alt=""></span>
            </div>
            <div class="ev2-desc">
              ${subNote}
              <small>首次闯关答对越多，成长值奖励越高</small>
            </div>
          </div>

          <button type="button" class="ev2-cta" data-action="home">太棒了，继续冒险 ▶</button>
        </div>
      </div>
    </div>
  </section>`;
  }

  /* 结算 / 进化函数由其他模块按全局名调用，这里统一暴露 */
  window.finishQuiz = finishQuiz;
  window.screenResult = screenResult;
  window.beginEvolution = beginEvolution;
  window.screenEvolution = screenEvolution;
})();

</script>
  <script>
/* ============================================================
   DinoGo · 恐龙英语 — 游戏流程
   包含公共答题流程
   ============================================================ */

const UNKNOWN_ART = (word) => emojiArt(wordGlyph(word));
let artMap = null;
/* 题型答对延时结算锁：防止特效播放期间重复点击/重复计分 */
let settleLock = false;
/* 新题语音/提示音延时句柄：选答案或切题时可精准取消，避免残留播报 */
let promptTimer = null;

function cancelTaskPrompt() {
  if (promptTimer) {
    clearTimeout(promptTimer);
    promptTimer = null;
  }
  if (typeof stopSpeak === "function") stopSpeak();
}

/* 当前主题（或场景）的「单词 → 插图」索引，避免每个选项都线性查找 */
function artOf(word) {
  const theme = currentTheme();
  const key = `${theme.id}:${state.scene || ""}`;
  if (!artMap || artMap.key !== key) {
    artMap = { key, map: new Map(themeWords().map((w) => [w.word, w.art])) };
  }
  return artMap.map.get(word) || (() => UNKNOWN_ART(word));
}

/* 每日挑战按题目来源取题型实现；复用 words.js 的 THEME_BY_ID，回退到只读公共实现 */
function gameForTask(q) {
  if (!q) return null;
  const source = THEME_BY_ID.get(q.themeId);
  const currentGames = currentTheme().games || {};
  return (source && source.games && source.games[q.type]) || currentGames[q.type] || DynamicEngine.getDefaultGame(q.type);
}

/* 统一读取题型的正确答案值与答后展示信息 */
function correctValueOf(q, game) {
  const g = game || gameForTask(q);
  if (g && typeof g.getCorrectValue === "function") return g.getCorrectValue(q);
  return q && q.answerValue != null ? q.answerValue : (q && q.word) || "";
}
function answerMetaOf(q, game) {
  const g = game || gameForTask(q);
  if (g && typeof g.getAnswerMeta === "function") return g.getAnswerMeta(q);
  return {
    word: q && q.options && q.word ? q.word : null,
    zh: (q && q.zh) || "",
    phon: (q && q.phon) || "",
    speakText: (q && q.word) || "",
    isSentence: false,
  };
}

/* 统一重置单题交互状态 */
function resetQuestionState(qState) {
  qState.selected = null;
  qState.selectedEl = null;
  qState.revealed = false;
  qState.choiceCorrect = null;
  return qState;
}

/* 统一创建一局答题状态 */
function createQuiz(opts) {
  settleLock = false;
  return resetQuestionState({
    level: opts.level || 0,
    index: 0,
    correct: 0,
    startedAt: Date.now(),
    words: [],
    newWords: [],
    order: opts.order,
    ...(opts.mode ? { mode: opts.mode } : {}),
    ...(opts.starIndex ? { starIndex: opts.starIndex } : {}),
  });
}

function startQuiz(level, opts = {}) {
  const lvl = Math.min(levelsPerTheme(), Math.max(1, Number(level) || themeProgress().level));
  /* 关卡按顺序解锁：完成结算一次即可进入下一关，已通关关卡可复习 */
  const prog = themeProgress();
  const cleared = Boolean(prog.cleared && prog.cleared[lvl]);
  const replay = Boolean(opts.replay) || cleared || lvl < prog.level;
  if (lvl > prog.level) {
    toast("先完成前面的关卡吧");
    return;
  }
  cancelTaskPrompt();
  quiz = createQuiz({ level: lvl, order: DynamicEngine.buildTasks(lvl, { replay }) });
  lastResult = null;
  levelCue(currentTheme().id);
  go("quiz");
  /* 第 1 题已有开场旋律：听力题等旋律播完再读词，非听力题不叠播入场提示音 */
  speakTask(780, { playCue: false });
}

/* 每日随机挑战：全主题混抽 10 题，答对 1 题得 1★，完成结算才消耗次数 */
function startDailyQuiz() {
  if (dailyChallengeLeft() <= 0) {
    toast("今天的挑战已经完成啦，明天再来吧");
    return;
  }
  const order = DynamicEngine.buildDailyTasks(10);
  if (!order.length) {
    toast("词库还在准备中，稍后再试");
    return;
  }
  cancelTaskPrompt();
  quiz = createQuiz({ mode: "daily", level: 0, starIndex: [], order });
  lastResult = null;
  go("quiz");
  speakTask(260);
}

/* 答对：只撒彩纸，鼓励语与答案统一收进居中的结果卡 */
function correctFx() {
  return `<div class="qfx ok-fx" aria-hidden="true">
    <div class="fx-confetti">${renderConfetti(18, "quiz")}</div>
  </div>`;
}

/* 答完题后统一的手动“下一题”按钮 */
function quizNextButton() {
  if (!quiz) return "";
  const label = quiz.index >= quiz.order.length - 1 ? "See results" : "Next";
  return `<button class="btn" data-action="next">${label} ${I.arrow(18)}</button>`;
}

function screenQuiz() {
  if (!quiz) {
    setTimeout(() => go("home", { replace: true }), 0);
    return `<section class="screen"></section>`;
  }
  const total = quiz.order.length;
  const q = quiz.order[quiz.index];
  const game = gameForTask(q);
  const selected = quiz.selected;
  const revealed = quiz.revealed;
  const letters = ["A", "B", "C", "D"];
  const optionClass = (opt, base = "option") => {
    if (revealed) {
      if (opt === q.word) return `${base} correct`;
      if (opt === selected) return `${base} wrong`;
      return `${base} dim`;
    }
    return opt === selected ? `${base} sel` : base;
  };
  const choiceButton = () => (revealed ? quizNextButton() : "");
  const options = (list) => list.map((opt, i) => {
    const cls = optionClass(opt);
    let mark = "";
    if (revealed) {
      if (opt === q.word) mark = `<span class="mark">${I.check(11)}</span>`;
      else if (opt === selected) mark = `<span class="mark bad">${I.close(12, "#fff")}</span>`;
    } else if (opt === selected) {
      mark = `<span class="mark radio"><i></i></span>`;
    }
    return `<button class="${cls}" data-action="select" data-word="${opt}">
      <span class="word">${opt}</span>${mark}
    </button>`;
  }).join("");
  const view = game.render({ q, quiz, total, optionClass, choiceButton, options, letters, artOf });

  const meta = answerMetaOf(q, game);
  const answerWord = meta.word;
  const answerZh = meta.zh;
  const answerPhon = meta.phon;
  const dialogSentence = !!meta.isSentence;
  /* 答后结果卡：森林奶油风结构，从屏幕正中心弹出 */
  const ok = !!quiz.choiceCorrect;
  const statusTitle = ok ? "答对了，你真棒！" : "回答错误，继续努力";
  const nextLabel = quiz.index >= quiz.order.length - 1
    ? "查看结果" : "下一题";
  const audioIcon = `<svg viewBox="0 0 48 48" fill="none">
            <path d="M10 19 H18 L31 10 V38 L18 29 H10 C8.3 29 7 27.7 7 26 V22 C7 20.3 8.3 19 10 19 Z" fill="#d98a3c" stroke="#5c3412" stroke-width="3.5" stroke-linejoin="round"/>
            <ellipse cx="32" cy="24" rx="5.5" ry="13.5" fill="#fce4a6" stroke="#5c3412" stroke-width="3.5"/>
            <ellipse cx="32" cy="24" rx="2.5" ry="7" fill="#7a491d"/>
          </svg>`;
  const answerBox = answerWord
    ? `<div class="zoo-answer-box${dialogSentence ? " is-sentence" : ""}">
        <div class="zoo-answer-info">
          <div class="zoo-answer-top">
            <span class="zoo-answer-word">${answerWord}</span>
            ${answerPhon ? `<span class="zoo-answer-phon">${answerPhon}</span>` : ""}
          </div>
          ${answerZh ? `<span class="zoo-meaning-text">中文：${answerZh}</span>` : ""}
        </div>
        <button class="zoo-audio-btn" type="button" data-action="speak-answer" aria-label="播放读音">
          ${audioIcon}
        </button>
      </div>`
    : "";

  const actionArea = `<button class="zoo-action-btn" data-action="next"><span>${nextLabel} ▶</span></button>`;
  const decor = ok
    ? `<svg class="zoo-decor-grass" viewBox="0 0 80 26" fill="none">
        <path d="M4 24 L14 6 L22 20 L34 2 L44 21 L56 7 L66 24 Z" fill="#63b848" stroke="#1e6b3b" stroke-width="3" stroke-linejoin="round"/>
      </svg>`
    : `<svg class="zoo-decor-leaf" viewBox="0 0 110 50" fill="none">

/* 进题提醒：仅听力题（autoSpeak）自动读单词；其余题型改用轻提示音效 + 视觉引导，点喇叭仍可手动听题 */
function speakTask(delay = 260, opts = {}) {
  cancelTaskPrompt();
  const q = quiz && quiz.order[quiz.index];
  if (!q) return;
  const game = gameForTask(q);
  if (game && game.autoSpeak) {
    const lines = typeof game.getPromptLines === "function" ? game.getPromptLines(q) : [];
    if (lines.length) {
      promptTimer = setTimeout(() => {
        promptTimer = null;
        if (!quiz || quiz.revealed || quiz.order[quiz.index] !== q) return;
        speak(lines);
      }, delay);
    }
    return;
  }
  const playCue = opts.playCue !== false;
  if (playCue && !(game && game.hasOwnCue)) {
    promptTimer = setTimeout(() => {
      promptTimer = null;
      if (!quiz || quiz.revealed || quiz.order[quiz.index] !== q) return;
      sfx("question");
    }, 80);

/* 通用结算分流：支持题型按答对 / 答错分别声明延时特效，再进入统一结算 */
function beginSettlement(q, ok, el, commit) {
  const run = typeof commit === "function" ? commit : checkAnswer;
  const game = gameForTask(q);
  /* settleDelay / wrongSettleDelay 支持数字（固定）或函数（按题目动态估算） */
  const rawDelay = game
    ? (ok ? game.settleDelay : game.wrongSettleDelay)
    : 0;
  const delay = (typeof rawDelay === "function" ? rawDelay(q) : rawDelay) || 0;
  if (delay > 0) {
    settleLock = true;
    const fxFn = ok ? game.onCorrectFx : game.onWrongFx;
    if (typeof fxFn === "function") fxFn({ q, el, word: quiz && quiz.selected });
    setTimer(() => {
      settleLock = false;
      /* 延时期间可能已退出答题页，避免在空页面上结算 */
      if (!document.querySelector(".quiz-page")) return;
      run();
    }, delay);
    return;
  }
  run();

/* 看图 / 动作 / 喂食点选 / 情景对话文字与整句模式：先点选朗读，再点「选好了」确认，防幼儿乱点 */
function needsConfirmSelect(q) {
  if (!q) return false;
  if (q.type === "pic" || q.type === "action" || q.type === "feed_animal") return true;
  if (q.type === "dialog") return !(q.dialog && q.dialog.mode === "image");

/* 局部更新选中态与原地确认按钮（不触发整页重绘，避免主图闪烁与布局跳动） */

  const root = document.querySelector(".quiz-ref-page");
  if (!root) return;
  if (q.type === "feed_animal") {
    root.querySelectorAll(".fd-food[data-food]").forEach((btn) => {
      btn.classList.toggle("selected", btn.dataset.food === word);
    });
  } else {
    root.querySelectorAll('.option[data-action="select"]').forEach((btn) => {
      const on = btn.dataset.word === word;
      btn.classList.toggle("sel", on);
      let radio = btn.querySelector(".mark.radio");
      if (on && !radio) {
        radio = document.createElement("span");
        radio.className = "mark radio";
        radio.innerHTML = "<i></i>";
        btn.appendChild(radio);
      } else if (!on && radio) {
        radio.remove();
      }
    });
  }
  if (q.type === "dialog") {
    const bubble = root.querySelector(".ref-dialog-row.reply .ref-dialog-bubble");
    if (bubble) {
      const blank = bubble.querySelector(".blank");
      const pending = bubble.querySelector(".ref-dialog-reply");
      if (blank) blank.textContent = word;
      else if (pending) {
        pending.textContent = word;
        pending.classList.remove("pending");
      }
      if (!bubble.querySelector(".ref-confirm-btn")) {
        const confirmBtn = document.createElement("button");
        confirmBtn.type = "button";
        confirmBtn.className = "ref-confirm-btn is-inline";
        confirmBtn.dataset.action = "confirm-answer";
        confirmBtn.innerHTML = `<span>选好了 ✓</span>`;
        bubble.appendChild(confirmBtn);
      }
    }
    return;
  }
  const hint = root.querySelector(".ref-hint");
  if (hint) {
    hint.classList.add("has-confirm");
    hint.innerHTML = `<button type="button" class="ref-confirm-btn" data-action="confirm-answer"><span>选好了 ✓</span></button>`;
  }
}

function selectOption(word, el, opts = {}) {
  if (!quiz || quiz.revealed || settleLock) return;
  cancelTaskPrompt();
  const q = quiz.order[quiz.index];
  quiz.selected = word;
  quiz.selectedEl = el || null;
  if (!opts.direct && needsConfirmSelect(q)) {
    sfx("tap");
    syncConfirmUI(q, word);
    speak(word);
    return;
  }
  const correctValue = correctValueOf(q);
  sfx("tap");
  beginSettlement(q, word === correctValue, el);
}

function confirmSelection() {
  if (!quiz || quiz.revealed || settleLock || !quiz.selected) return;
  cancelTaskPrompt();
  const q = quiz.order[quiz.index];
  const correctValue = correctValueOf(q);
  sfx("tap");
  beginSettlement(q, quiz.selected === correctValue, quiz.selectedEl || null);
}

/* 动物喂食点选 / 拖拽入口：点选先读音+确认按钮，拖拽进嘴直接喂食 */
function feedPick(food, el = null, opts = {}) {

/* 答对后解锁当前单词：写入存档并加入本次新解锁列表，词汇页立即可见 */
function unlockTaskWord(q) {
  if (!q || !q.word || typeof unlockWord !== "function") return;
  if (unlockWord(q.word) && quiz && Array.isArray(quiz.newWords)) quiz.newWords.push(q.word);
}
/* 每日挑战计星：一题一星，答对即得星；答错直接公布答案，不重来 */
function markDailyStar() {
  if (!quiz || quiz.mode !== "daily") return;
  quiz.starIndex = quiz.starIndex || [];
  if (!quiz.starIndex.includes(quiz.index)) quiz.starIndex.push(quiz.index);
}
/* 统一单题结算副作用：供选择题与喂食题共用 */
function finalizeTask(q, ok, opts = {}) {
  const {
    okSfx = "excellent",
    wrongSfx = "wrong",
    speakOnOk = "",
    speakOnWrong,
    words = null,
    wrongBank = true,
  } = opts;
  quiz.revealed = true;
  quiz.choiceCorrect = ok;
  const isDaily = quiz.mode === "daily";
  if (ok) {
    quiz.correct++;
    markDailyStar();
    const list = Array.isArray(words) ? words : (q && q.word ? [q.word] : []);
    list.forEach((w) => {
      quiz.words.push(w);
      if (!isDaily) unlockTaskWord({ word: w });
    });
    if (okSfx) sfx(okSfx);
    if (speakOnOk) {
      setTimer(() => {
        if (typeof shakeBtn === "function") shakeBtn(document.querySelector(".zoo-audio-btn"));
        speak(speakOnOk);
      }, 600);
    }
    if (!isDaily && wrongBank) WrongBank.applyResult(q, true);
  } else {
    if (wrongSfx) sfx(wrongSfx);
    /* 答错弹出结果卡后自动朗读正确读音，帮助孩子纠音记忆 */
    const wrongSpeak = speakOnWrong !== undefined ? speakOnWrong : answerMetaOf(q).speakText;
    if (wrongSpeak) {
      setTimer(() => {
        if (typeof shakeBtn === "function") shakeBtn(document.querySelector(".zoo-audio-btn"));
        speak(wrongSpeak);
      }, 520);
    }
    if (!isDaily && wrongBank) WrongBank.applyResult(q, false);
  }
  render();
}

function checkAnswer() {
  if (!quiz || quiz.revealed || !quiz.selected) return;
  const q = quiz.order[quiz.index];
  const game = gameForTask(q);
  const ok = quiz.selected === correctValueOf(q, game);
  const fb = game && typeof game.getFeedbackOpts === "function"
    ? game.getFeedbackOpts(q)
    : { okSfx: "excellent", wrongSfx: "wrong", speakOnOk: "" };
  finalizeTask(q, ok, fb);
}
function nextQuestion() {
  if (!quiz) return;
  cancelTaskPrompt();
  settleLock = false;
  clearTimers();
  if (quiz.index >= quiz.order.length - 1) { finishQuiz(); return; }
  quiz.index++;
  resetQuestionState(quiz);
  render();
  speakTask();
}

/* ============================================================
   DinoGo · 恐龙英语 — 答题页视图层交互
   由 main.js 拆出：喇叭朗读、拖拽手势、渲染后绑定
   ============================================================ */

/* 题型的视图层交互，不参与题目生成与判分 */
window.QuizView = {
  abort: null,
  drag: null,

  afterRender() {
    this.cleanup();
    const root = document.querySelector(".quiz-ref-page");
    if (!root || !quiz) return;
    const q = quiz.order[quiz.index];
    this.abort = new AbortController();
    const game = gameForTask(q);
    if (game && typeof game.onMount === "function") game.onMount(root, q, this);
  },

  cleanup() {
    if (this.abort) this.abort.abort();
    this.abort = null;
    this.clearDragVisual();
    this.drag = null;
  },

  clearDragVisual() {
    document.querySelectorAll(".ref-drag-ghost").forEach((el) => el.remove());
    document.querySelectorAll(".drop-ready").forEach((el) => el.classList.remove("drop-ready"));
  },

  /* 动物喂食：拖拽食物到动物嘴里 */
  setupDragging(root) {
    const options = { signal: this.abort.signal };
    root.querySelectorAll("[data-drag]").forEach((source) => {
      source.addEventListener("pointerdown", (e) => this.startDrag(e, source), options);
    });
  },

  startDrag(e, source) {
    if (!quiz || quiz.revealed || e.button !== 0 || source.disabled) return;
    const drag = {
      pointerId: e.pointerId, source, kind: source.dataset.drag,
      value: source.dataset.food,
      x: e.clientX, y: e.clientY, moved: false, ghost: null, overTarget: null,
    };
    this.drag = drag;
    try { source.setPointerCapture(e.pointerId); } catch {}
    const options = { signal: this.abort.signal };
    const move = (ev) => {
      if (ev.pointerId !== drag.pointerId) return;
      if (!drag.moved && Math.hypot(ev.clientX - drag.x, ev.clientY - drag.y) <= 6) return;
      ev.preventDefault();
      if (!drag.moved) {
        drag.moved = true;
        drag.ghost = document.createElement("span");
        drag.ghost.className = "ref-drag-ghost";
        const art = source.querySelector(".ref-food-art");
        if (drag.kind === "food" && art) drag.ghost.innerHTML = art.innerHTML;
        else drag.ghost.textContent = source.textContent.trim();
        document.body.appendChild(drag.ghost);
      }
      drag.ghost.style.left = `${ev.clientX}px`;
      drag.ghost.style.top = `${ev.clientY}px`;
      const hit = document.elementFromPoint(ev.clientX, ev.clientY);
      const target = hit && hit.closest("[data-feed-drop]");
      if (target !== drag.overTarget) {
        if (drag.overTarget) drag.overTarget.classList.remove("drop-ready");
        if (target) target.classList.add("drop-ready");
        drag.overTarget = target || null;
      }
    };
    const finish = (ev, cancelled) => {
      if (ev.pointerId !== drag.pointerId) return;
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", up);
      document.removeEventListener("pointercancel", cancel);
      const hit = document.elementFromPoint(ev.clientX, ev.clientY);
      this.clearDragVisual();
      this.drag = null;
      try { if (source.hasPointerCapture(ev.pointerId)) source.releasePointerCapture(ev.pointerId); } catch {}
      if (cancelled || !drag.moved) return;
      this.suppressClick(source);
      const target = hit && hit.closest("[data-feed-drop]");
      if (target) feedPick(drag.value, source, { direct: true });
    };
    const up = (ev) => finish(ev, false);
    const cancel = (ev) => finish(ev, true);
    document.addEventListener("pointermove", move, options);
    document.addEventListener("pointerup", up, options);
    document.addEventListener("pointercancel", cancel, options);
  },

  suppressClick(source) {
    const stop = (e) => { e.preventDefault(); e.stopPropagation(); };
    source.addEventListener("click", stop, { capture: true, once: true });
    setTimeout(() => source.removeEventListener("click", stop, true), 350);
  },
};

  if (voiceTimer) { clearInterval(voiceTimer); voiceTimer = null; }
  if (voiceRec && voiceRec.state !== "inactive") {
    try { voiceRec.stop(); } catch (e) {}
  }
  voiceRec = null;

  if (voiceUrl) { URL.revokeObjectURL(voiceUrl); voiceUrl = ""; }

function setRecBtn(label, recording) {
  const btn = $('[data-action="record-say"]');
  if (!btn) return;
  btn.classList.toggle("recording", !!recording);
  btn.innerHTML = recording ? `<span class="rec-dot"></span>${label}` : `${I.speaker(18)} ${label}`;
}

async function recordSay() {
  if (voiceRec && voiceRec.state === "recording") {
    if (voiceTimer) { clearInterval(voiceTimer); voiceTimer = null; }
    voiceRec.stop();
    return;
  }
  if (!navigator.mediaDevices || !window.MediaRecorder) { toast("当前浏览器不支持录音"); return; }
  setRecBtn("准备录音…", true);
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    voiceChunks = [];
    voiceRec = new MediaRecorder(stream);
    voiceRec.ondataavailable = (e) => { if (e.data && e.data.size) voiceChunks.push(e.data); };
    voiceRec.onstop = () => {
      stream.getTracks().forEach((t) => t.stop());
      if (voiceUrl) URL.revokeObjectURL(voiceUrl);
      const blob = new Blob(voiceChunks, voiceRec.mimeType ? { type: voiceRec.mimeType } : {});
      voiceUrl = URL.createObjectURL(blob);
      setRecBtn("重新跟读", false);
      if (voiceTimer) { clearInterval(voiceTimer); voiceTimer = null; }
      toast("录好啦，点「回放声音」听一听");
    };
    voiceRec.start();
    let left = 5;
    setRecBtn(`录音中 ${left}s · 点击结束`, true);
    voiceTimer = setInterval(() => {
      left -= 1;
      if (left <= 0) {
        clearInterval(voiceTimer); voiceTimer = null;
        if (voiceRec && voiceRec.state === "recording") voiceRec.stop();
        return;
      }
      setRecBtn(`录音中 ${left}s · 点击结束`, true);
    }, 1000);
  } catch (e) {
    setRecBtn("跟着读", false);
    toast("无法使用麦克风，请允许录音权限");
  }
}

/* 首页卡片展示 4 枚：优先已点亮，再从不同分类里挑最接近达成的 */
function featuredAchievements(list) {
  const picked = list.filter((a) => a.done).slice(0, 4);
  const rest = list.filter((a) => !a.done).sort((a, b) => b.pct - a.pct);
  const cats = new Set(picked.map((a) => a.cat));
  for (const a of rest) {
    if (picked.length >= 4) break;
    if (cats.has(a.cat)) continue;
    picked.push(a);
    cats.add(a.cat);
  }
  for (const a of rest) {
    if (picked.length >= 4) break;
    if (!picked.includes(a)) picked.push(a);
  }
  return picked.slice(0, 4);
}
function achBadge(a) {
  const tone = achTone(a.cat);
  return `<button class="ach ${a.done ? "is-done" : "is-locked"}" data-action="ach-detail" data-id="${a.id}" aria-label="${a.name}，${a.done ? "已点亮" : a.sub}">
    <span class="medal tone-${tone}" style="--p:${a.pct}">
      <span class="ach-face">${a.done ? a.icon(ACH_TONE_INK[tone]) : I.lock(16, "#B9AE99")}</span>
      ${a.done ? `<span class="dot">${I.check(8)}</span>` : ""}
    </span>
    <b>${a.name}</b>
    <span class="ach-sub">${a.sub}</span>
  </button>`;
}
function achCard() {
