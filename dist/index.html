.ref-listen-card-art .listen-card-emoji{width:100%;height:100%;place-items:center}
.ref-listen-card-word{font-size:clamp(0.75rem,2.8vw,0.9375rem);font-weight:var(--w-black);color:#7A5A35;margin-top:0.125rem}
.ref-listen-card-word.correct{color:#39754A}
.ref-listen-card-word.wrong{color:#A74F3D}
.ref-listen-mark{position:absolute;top:-0.5rem;right:-0.5rem;width:1.375rem;height:1.375rem;display:grid;place-items:center;
  border-radius:50%;background:#4FA55E;color:#fff;font-style:normal;font-weight:var(--w-black);font-size:0.8125rem;line-height:1;
  box-shadow:0 0.0625rem 0.25rem rgba(60,40,10,.2);z-index:2}
.ref-listen-mark.bad{background:#E8604A;color:#fff}

/* 单词连线 */
.ref-match-area{position:relative;display:flex;justify-content:center;align-items:flex-start;gap:clamp(2rem,9vw,4rem);width:min(100%,32rem);margin:0 auto;padding:0.5rem 0.25rem;
  --match-card:clamp(4rem,13vw,5.25rem)}
.ref-match-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:3}
.ref-match-col{display:flex;flex-direction:column;gap:1rem;z-index:1}
.ref-match-row{display:flex;align-items:center;gap:0.625rem;transition:opacity .18s ease}
.ref-match-row.done{opacity:.55}
.ref-match-row.sel .ref-match-dot{box-shadow:0 0 0 0.1875rem rgba(216,166,70,.45),0 0.1875rem 0 var(--sticker-shade)}
/* 两列都是「内容 + 圆点」/「圆点 + 内容」，圆点分别贴内侧，且行高一致保证每组圆点水平 */
.ref-match-col-left .ref-match-row{flex-direction:row}
.ref-match-col-right .ref-match-row{flex-direction:row;min-height:var(--match-card)}
.ref-match-art-card{display:flex;align-items:center;justify-content:center;width:var(--match-card);height:var(--match-card);flex:none;
  border:0.1875rem solid var(--sticker-ink);border-radius:1rem;background:var(--sticker-paper);box-shadow:0 0.25rem 0 var(--sticker-shade);cursor:pointer}
.ref-match-art-card svg{width:2.5rem;height:2.5rem;display:block}
.ref-match-word-card{min-width:clamp(4.5rem,15vw,6rem);padding:0.625rem 1rem;flex:none;text-align:center;
  border:0.1875rem solid var(--sticker-ink);border-radius:1rem;background:var(--sticker-paper);box-shadow:0 0.25rem 0 var(--sticker-shade);
  color:#4B3626;font-size:clamp(0.9375rem,3.4vw,1.1875rem);font-weight:var(--w-black)}
.ref-match-dot{position:relative;display:grid;place-items:center;width:1.5rem;height:1.5rem;flex:none;
  border:0.1875rem solid var(--sticker-ink);border-radius:50%;background:#F9D876;box-shadow:0 0.1875rem 0 var(--sticker-ink);
  cursor:pointer;touch-action:none;transition:transform .15s ease,box-shadow .15s ease,background .15s ease}
.ref-match-dot:hover{transform:scale(1.15)}
.ref-match-dot:active{transform:scale(.95)}
.ref-match-row.done .ref-match-dot{background:#9BE382;border-color:#3F8155;box-shadow:0 0.1875rem 0 #3F8155}
.ref-match-dot .ok-check{font-size:0.75rem;font-style:normal;color:#243F2B;font-weight:var(--w-black)}
.ref-match-path{fill:none;stroke:#8A76A8;stroke-width:0.375rem;stroke-linecap:round;stroke-dasharray:0.625rem 0.5rem}
.ref-match-path.temp{stroke:#E4A14B;stroke-dasharray:none;opacity:.85}
.quiz-ref-page .listen-row .listen{border:0.09375rem solid var(--sticker-line);color:#72532F;box-shadow:0 0.1875rem 0 #D5BB8D}

/* 情景对话 */
.ref-dialog-card{display:flex;flex-direction:column;gap:0.625rem;flex:none}
.ref-dialog-row{display:flex;align-items:flex-end;gap:0.5rem}
.ref-dialog-row.reply{justify-content:flex-end}
.ref-dialog-person{width:4.5rem;height:5.75rem;flex:none}
.ref-dialog-bubble{position:relative;display:flex;align-items:center;gap:0.5rem;flex:1;max-width:calc(100% - 5rem);min-height:4rem;padding:0.75rem;
  border:0.125rem solid var(--sticker-ink);border-radius:1.25rem 1.25rem 1.25rem 0.25rem;background:var(--sticker-paper);box-shadow:0 0.25rem 0 var(--sticker-shade)}
.ref-dialog-row.reply .ref-dialog-bubble{border-radius:1.25rem 1.25rem 0.25rem 1.25rem;background:#FFF0F3}
.ref-dialog-bubble p{font-size:0.9375rem;font-weight:var(--w-bold);line-height:1.4;color:#4B3626}
.ref-dialog-bubble .blank{color:#6B8D46;border-bottom:0.125rem dashed #9DB97B;padding:0 0.125rem}
.ref-dialog-name{display:grid;place-items:center;align-self:flex-start;flex:none;width:1.5rem;height:1.5rem;border-radius:50%;background:#FFE49A;color:var(--sticker-ink);font-size:0.75rem;font-weight:var(--w-black)}
.ref-dialog-pic{width:3rem;height:3rem;flex:none;margin-left:auto;display:grid;place-items:center}
.ref-dialog-pic svg{width:100%;height:100%}
.ref-dialog-listen{margin-top:0.25rem}
.quiz-ref-page .ref-dialog-options{flex:1;min-height:9rem}
.quiz-ref-page .ref-dialog-options .option{min-height:3.25rem}

/* 词汇拼图 */
.quiz-ref-page .ref-puzzle-wrap{flex:1;min-height:0;justify-content:center;gap:0.875rem}
.ref-puzzle-hint{padding:0.5rem 1rem;border:0.09375rem solid var(--sticker-line);border-radius:1.25rem;background:rgba(255,253,247,.88)}
.ref-puzzle-hint .pz-art{width:6.5rem;height:6.5rem;display:grid;place-items:center}
.ref-puzzle-hint small{color:#806039;font-weight:var(--w-bold)}
.quiz-ref-page .pz-slots{display:grid;grid-template-columns:repeat(var(--slot-count),minmax(0,2.75rem));justify-content:center;gap:0.375rem;width:100%;margin:0}
.quiz-ref-page .pz-slot{width:auto;height:clamp(2.75rem,8vw,3.5rem);min-width:0;border:0.125rem dashed #A78C61;border-radius:0.75rem;background:#F2E4C8;
  color:var(--sticker-ink);font-size:clamp(0.875rem,4vw,1.5rem);box-shadow:inset 0 0.1875rem 0.375rem rgba(92,65,29,.1)}
.quiz-ref-page .pz-slot.filled{border-style:solid;border-color:var(--sticker-ink);background:#FFE49A;box-shadow:0 0.1875rem 0 #D1AE62}
.quiz-ref-page .pz-letters{gap:0.5rem;margin-top:0.25rem}
.quiz-ref-page .pz-letter{width:2.75rem;height:3rem;border:0.125rem solid var(--sticker-ink);border-radius:0.75rem;background:#68BE83;color:#203B29;
  box-shadow:0 0.25rem 0 #3F8155;font-size:1.25rem;touch-action:none;user-select:none}
.quiz-ref-page .pz-letter.used{opacity:.25;pointer-events:none}
.ref-puzzle-wrap .pz-check{width:min(100%,20rem);border:0.125rem solid var(--sticker-ink);background:#68BE83;color:#243F2B;box-shadow:0 0.25rem 0 #3F8155}
.ref-puzzle-wrap .pz-check:disabled{border-color:#A49379;background:#E5DCCB;box-shadow:0 0.1875rem 0 #BCAE96}
/* 答后移除检查按钮时保留同尺寸占位，避免题目区因剩余空间重分配而上下移位 */
.ref-puzzle-wrap .pz-check-spacer{flex:none;width:min(100%,20rem);min-height:2.75rem;margin-top:0.75rem;visibility:hidden}

/* 动物喂食 */
.quiz-ref-page .ref-feed-wrap{flex:1;min-height:0;justify-content:center;gap:1rem}
.ref-feed-animal{width:min(100%,22rem);padding:0.75rem;border:0.125rem dashed #B69662;border-radius:2rem;background:rgba(255,253,247,.82);transition:background .15s ease,transform .15s ease}
.ref-feed-animal.drop-ready{background:#FFF0C9;transform:scale(1.03)}
.ref-feed-animal .fd-art{width:8.5rem;height:8.5rem;display:grid;place-items:center}
.ref-feed-animal .fd-name{color:var(--sticker-ink);font-size:1.375rem}
.ref-feed-animal small{color:#806039;text-align:center;line-height:1.4}
.quiz-ref-page .fd-foods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0.75rem;width:min(100%,24rem);margin-top:0}
.quiz-ref-page .fd-food{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.125rem;width:auto;height:6rem;padding:0.375rem;
  border:0.125rem solid var(--sticker-line);border-radius:1.25rem;background:var(--sticker-paper);box-shadow:0 0.25rem 0 var(--sticker-shade);touch-action:none;user-select:none}
.quiz-ref-page .fd-food.selected{border-color:#D8A646;background:#FFF5D9;box-shadow:0 0 0 0.1875rem rgba(216,166,70,.2),0 0.25rem 0 var(--sticker-shade)}
.quiz-ref-page .fd-food.correct{border-color:#68A873;background:#EAF7E3;box-shadow:0 0.25rem 0 #9AC78B}
.ref-food-art{width:3.75rem;height:3.75rem;display:grid;place-items:center}
.fd-food small{max-width:100%;overflow:hidden;text-overflow:ellipsis;color:#6A4C2D;font-size:0.6875rem;font-weight:var(--w-bold)}

@media (min-width:48rem){
  .ref-quiz-body{padding-left:2rem;padding-right:2rem}
  .ref-pic-options,.ref-listen-grid,.ref-dialog-options{width:min(100%,38rem);align-self:center}
  .ref-match-area,.ref-dialog-card{width:min(100%,38rem);align-self:center}
}
@media (max-height:45rem){
  .ref-stage-head{margin-top:0.5rem;margin-bottom:0.375rem}
  .ref-stage-badge{width:2.5rem;height:2.5rem}
  .ref-stage-head h2{font-size:1.0625rem}
  .ref-picture-art{width:7.5rem;height:7.5rem}
  .ref-listen-speaker{height:6rem}
  .ref-dialog-person{width:3.5rem;height:4.5rem}
  .ref-dialog-bubble{min-height:3.25rem;padding:0.5rem}
  .ref-puzzle-hint .pz-art{width:4.5rem;height:4.5rem}
  .ref-feed-animal .fd-art{width:6rem;height:6rem}
  .quiz-ref-page .fd-food{height:5rem}
  .ref-food-art{width:3rem;height:3rem}
}

/* ============================================================
   DinoGo · 恐龙英语 — dex：恐龙图鉴
   ============================================================ */

/* ------------------------------------------------ dex */
.dex-count{display:flex;align-items:baseline;gap:0.125rem;font-size:0.875rem;font-weight:var(--w-black);color:var(--green-d);
  background:#fff;border:0.09375rem solid var(--line);border-radius:0.8125rem;padding:0.375rem 0.625rem;box-shadow:0 0.25rem 0.625rem rgba(94,70,30,.06);flex:none}
.dex-count span{font-size:0.6875rem;color:var(--muted);font-weight:var(--w-mid)}
.dex-sum{border-radius:1.375rem;padding:0.8125rem 0.9375rem;display:flex;align-items:center;gap:0.8125rem}
.dex-sum .ds-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:0.4375rem}
.dex-sum .ds-row b{font-size:0.75rem;font-weight:var(--w-bold)}
.dex-sum .ds-row span{font-size:0.6875rem;font-weight:var(--w-black);color:var(--green-d)}
.dex-sum .ds-foot{display:flex;align-items:center;gap:0.25rem;margin-top:0.4375rem;font-size:0.65625rem;font-weight:var(--w-mid);color:#A19278}
.dex-sum .ds-badge{width:2.875rem;height:2.875rem;border-radius:0.9375rem;background:#FFF4CE;display:grid;place-items:center;flex:none;color:#B4811C}
.dex-filters{display:flex;gap:0.375rem;margin-top:0.75rem;overflow-x:auto;scrollbar-width:none;padding-bottom:0.125rem}
.dex-filters .f{height:1.875rem;padding:0 0.6875rem;border-radius:0.5625rem;background:#fff;border:0.09375rem solid #EEE2CD;
  font-size:0.71875rem;font-weight:var(--w-mid);color:#8C9B8C;display:flex;align-items:center;white-space:nowrap;flex:none}
.dex-filters .f.on{background:var(--ink);border-color:var(--ink);color:#FFF6DF}

.dex-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0.5625rem;margin-top:0.75rem}
@media (min-width:620px){.dex-grid{grid-template-columns:repeat(3,1fr)}}
.dex-card{border-radius:1.125rem;background:#fff;border:0.09375rem solid var(--line);padding:0.4375rem;text-align:center;position:relative;
  box-shadow:0 0.3125rem 0.75rem rgba(94,70,30,.05);transition:transform .15s ease}
.dex-card:active{transform:scale(.97)}
.dex-card .pic{height:6.75rem;border-radius:0.75rem;display:grid;place-items:center;position:relative;overflow:hidden}
@media (min-width:620px){.dex-card .pic{height:5.25rem}}
.dex-card .pic.t1{background:#EAF7DA}
.dex-card .pic.t2{background:#E6F4FF}
.dex-card .pic.t3{background:#FFF2D8}
.dex-card .pic.t4{background:#F0EBFF}
.dex-card .pic.t5{background:#FFF0E2}
.dex-card .pic svg{width:7rem;height:7rem;margin-bottom:-0.5rem}
@media (min-width:620px){.dex-card .pic svg{width:5.5rem;height:5.5rem}}
.dex-card .nm{font-size:0.6875rem;font-weight:var(--w-bold);margin-top:0.3125rem}
.dex-card .stg{font-size:0.625rem;font-weight:var(--w-mid);color:#A0AE9F;margin-top:0.0625rem;letter-spacing:0.01875rem}
.dex-card.locked .pic{background:#F4EFE3}
.dex-card.locked .pic svg{opacity:.2;filter:grayscale(1)}
.dex-card.locked .nm{color:#B3AC9B}
.dex-card .rare{position:absolute;right:0.5rem;top:0.5rem;width:1rem;height:1rem;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:0.625rem;font-weight:var(--w-black);z-index:4;box-shadow:0 0.1875rem 0.375rem rgba(94,70,30,.18)}
.dex-card .rare.r3{background:#7FB4E8}
.dex-card .rare.r4{background:#A78BFA}
.dex-card .rare.r5{background:#F0A23B}
.dex-card .lock-ic{position:absolute;right:0.5625rem;top:0.5625rem;color:#C6BDAA;z-index:4}
.dex-card.current{outline:0.125rem solid rgba(46,139,87,.45);outline-offset:-0.125rem}
.dex-card .now-tag{position:absolute;left:0.5rem;top:0.5rem;font-size:0.59375rem;font-weight:var(--w-black);color:#fff;background:var(--green);
  padding:0.125rem 0.3125rem;border-radius:0.3125rem;z-index:4}
.dex-reward{margin-top:0.875rem;border-radius:1.25rem;padding:0.625rem 0.8125rem;display:flex;align-items:center;gap:0.6875rem;
  background:#fff;border:0.09375rem solid var(--line);box-shadow:0 0.5rem 1.125rem rgba(94,70,30,.07)}
.dex-reward .dr-ic{width:3.25rem;height:3.25rem;border-radius:0.875rem;overflow:hidden;flex:none;position:relative;border:0.0625rem solid rgba(0,0,0,.05)}
.dex-reward .dr-row{display:flex;justify-content:space-between;align-items:baseline;gap:0.5rem}
.dex-reward .dr-row b{font-size:0.71875rem;font-weight:var(--w-black)}
.dex-reward .dr-row span{font-size:0.6875rem;font-weight:var(--w-black);color:var(--green-d);white-space:nowrap}
.dex-reward .bar{height:0.4375rem;margin-top:0.3125rem}
.dex-reward .dr-note{font-size:0.625rem;font-weight:var(--w-read);color:#A19278;margin-top:0.25rem}
.dex-reward .dr-lock{width:1.875rem;height:1.875rem;border-radius:0.625rem;background:#FFF4CE;display:grid;place-items:center;color:#B4811C;flex:none}

/* 究极体机甲形态切换 */
.skin-head{display:flex;align-items:baseline;justify-content:space-between;gap:0.5rem;margin-top:1rem;padding:0 0.125rem}
.skin-head b{font-size:0.8125rem;font-weight:var(--w-black)}
.skin-head span{font-size:0.625rem;font-weight:var(--w-read);color:#A19278;white-space:nowrap}
.skin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0.5625rem;margin-top:0.5rem}
.skin-card{position:relative;border-radius:1.125rem;background:#fff;border:0.09375rem solid var(--line);padding:0.4375rem;text-align:center}
.skin-card:active{transform:scale(.97)}
.skin-card .pic{height:5.75rem;border-radius:0.75rem;background:#E8EEF9;overflow:hidden;display:grid;place-items:center}
.skin-card .pic svg{width:100%;height:100%;transform:scale(1.18) translateY(-3%)}
.skin-card .nm{font-size:0.6875rem;font-weight:var(--w-bold);margin-top:0.3125rem}
.skin-card .sub{font-size:0.59375rem;font-weight:var(--w-read);color:#A0AE9F;margin-top:0.0625rem}
.skin-card.on{border-color:rgba(46,139,87,.5);box-shadow:0 0.375rem 0.875rem rgba(46,139,87,.13)}
.skin-card .cur{position:absolute;left:0.5rem;top:0.5rem;font-size:0.59375rem;font-weight:var(--w-black);color:#fff;
  background:var(--green);padding:0.125rem 0.3125rem;border-radius:0.3125rem;z-index:4}
.skin-card.locked .pic{background:#F4EFE3}
.skin-card.locked .pic svg{opacity:.22;filter:grayscale(1)}
.skin-card.locked .nm,.skin-card.locked .sub{color:#B3AC9B}
.skin-card .lock-ic{position:absolute;right:0.5625rem;top:0.5625rem;color:#C6BDAA;z-index:4}

/* ------------------------------------------------ words */
.words-head{display:flex;align-items:flex-start;gap:0.625rem;margin-bottom:0.625rem}
.words-head h1{font-size:clamp(1.5rem,4vw,1.875rem);font-weight:var(--w-black);letter-spacing:-0.0375rem;line-height:1.05}
.words-head p{font-size:0.6875rem;font-weight:var(--w-read);color:var(--muted);margin-top:0.1875rem}
.words-count{flex:none;display:flex;align-items:baseline;gap:0.125rem;padding:0.375rem 0.625rem;border-radius:0.75rem;background:#E8F5D8;
  font-size:0.9375rem;font-weight:var(--w-black);color:var(--green-d)}
.words-count span{font-size:0.6875rem;color:var(--muted);font-weight:var(--w-bold)}
.wl-bar{display:flex;flex-wrap:wrap;gap:0.25rem;position:sticky;top:0;z-index:3;
  padding:0.375rem 0 0.5625rem;background:linear-gradient(180deg,var(--cream) 78%,rgba(251,243,227,0))}
.wl{flex:none;width:1.5625rem;height:1.5625rem;border-radius:0.5rem;display:grid;place-items:center;
  background:#fff;border:0.09375rem solid #EEE2CD;font-size:0.71875rem;font-weight:var(--w-black);color:#8B7B5C}
.wl.all{width:auto;padding:0 0.625rem}
.wl.on{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 0.25rem 0.5rem rgba(46,139,87,.22)}
.wl.off{opacity:.3}
.word-group{margin-top:0.8125rem}
.wg-letter{display:flex;align-items:center;gap:0.375rem;font-size:0.8125rem;font-weight:var(--w-black);color:var(--green-d);letter-spacing:0.03125rem}
.wg-letter::after{content:"";flex:1;height:0.09375rem;border-radius:0.125rem;background:#EADFC9}
.wg-letter span{font-size:0.625rem;font-weight:var(--w-black);color:#B3A184;background:#F4EFE3;border-radius:0.4375rem;padding:0.0625rem 0.375rem;letter-spacing:0}
.wg-list{display:grid;grid-template-columns:1fr;gap:0.5rem;margin-top:0.4375rem}
.word-row{position:relative;display:flex;align-items:center;gap:0.875rem;padding:0.625rem 0.625rem;min-height:5.125rem;text-align:left;
  background:#fff;border:0.09375rem solid var(--line);border-radius:1rem;box-shadow:0 0.25rem 0.625rem rgba(94,70,30,.04)}
.word-row:active{transform:scale(.985);background:#FBFDF6}
.wr-pic{width:3rem;height:3rem;border-radius:0.8125rem;background:#F5F9EC;display:grid;place-items:center;overflow:hidden;flex:none}
.wr-main{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:0.375rem}
.wr-line{display:flex;align-items:baseline;justify-content:flex-start;gap:0.25rem;min-width:0}
.wr-line b{font-size:1.375rem;font-weight:var(--w-black);letter-spacing:-0.025rem;line-height:1.12;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:auto}
.wr-line i{font-style:normal;font-size:0.84375rem;font-weight:var(--w-bold);color:var(--ink-2);white-space:nowrap;flex:none}
.wr-line.sub{align-items:center}
.wr-line.sub em{font-style:normal;font-size:0.6875rem;font-weight:var(--w-mid);color:#A19278;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:auto}
.wr-tag{flex:none;font-size:0.625rem;font-weight:var(--w-black);padding:0.1875rem 0.375rem;border-radius:0.375rem;letter-spacing:0.0125rem}
.wr-tag.pos{background:#F2EEE4;color:#8A7B62}
.words-foot{display:flex;align-items:center;gap:0.3125rem;justify-content:center;margin:1rem 0 0.25rem;
  font-size:0.65625rem;font-weight:var(--w-mid);color:#B3A184}
.collect-dex{margin-top:0.125rem}
.collect-dex .dex-sum{margin-top:0}


/* ============================================================
   DinoGo · 恐龙英语 — collect：收藏（背景 / 图鉴）
   ============================================================ */

/* ------------------------------------------------ collect */
.collect-head{display:flex;align-items:flex-start;gap:0.625rem;margin-bottom:0.875rem}
.collect-head h1{font-size:clamp(1.5rem,4vw,1.875rem);font-weight:var(--w-black);letter-spacing:-0.0375rem;line-height:1.1}
.collect-head p{font-size:0.6875rem;font-weight:var(--w-read);color:var(--muted);margin-top:0.25rem}
.collect-preview{height:clamp(11.875rem,26vh,15.625rem);border-radius:1.75rem;position:relative;overflow:hidden;
  background-color:#DDF0CB;

.collect-preview .wearing{position:absolute;left:0.875rem;top:0.875rem;min-height:1.75rem;padding:0 0.625rem;border-radius:6.1875rem;background:#fff;

  box-shadow:0 0.25rem 0.625rem rgba(94,70,30,.1);z-index:2}
.collect-preview .pet{position:absolute;right:0.875rem;bottom:0.875rem;display:flex;align-items:center;gap:0.3125rem;
  font-size:0.6875rem;font-weight:var(--w-bold);color:#7B8E77;background:rgba(255,255,255,.82);padding:0.3125rem 0.5625rem;border-radius:6.1875rem;z-index:2}

.collect-preview.bg-sunset{background-image:url("images/background/sunset.webp");background-position:center 74%;border-color:#CFE2DE}

.collect-tabs{display:flex;align-items:center;gap:1.125rem;padding:0 0.125rem;height:2.75rem;margin-top:0.25rem}

.collect-tabs .tab.on::after{content:"";position:absolute;left:0;right:0;bottom:0.375rem;height:0.21875rem;border-radius:6.1875rem;background:var(--green)}

.bg-grid{display:grid;grid-template-columns:1fr;gap:0.6875rem;margin-top:0.375rem}

.bg-item{display:flex;align-items:center;gap:0.6875rem;border-radius:1.25rem;background:#fff;border:0.09375rem solid var(--line);

.bg-item .bg-info b{font-size:0.8125rem;font-weight:var(--w-bold);display:block}

.price{display:flex;align-items:center;gap:0.1875rem;font-size:0.78125rem;font-weight:var(--w-black);color:#8A6415}
.price.owned{color:var(--green-d);font-size:0.6875rem;background:#E9F7D9;padding:0.1875rem 0.4375rem;border-radius:0.4375rem}

/* ============================================================
   DinoGo · 恐龙英语 — overlays：弹层 / 设置 / toast
   ============================================================ */

/* ------------------------------------------------ overlays */
.overlay{position:absolute;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(19,38,29,.42);backdrop-filter:blur(0.1875rem);-webkit-backdrop-filter:blur(0.1875rem);animation:fadeIn .2s ease}
.overlay.dialog-wrap{align-items:center}
.sheet{width:100%;max-width:35rem;max-height:88%;overflow-y:auto;background:#FFFBF3;border-radius:1.75rem 1.75rem 0 0;
  padding:1.125rem 1.25rem calc(1.25rem + var(--safe-bottom));box-shadow:0 -1.25rem 3.125rem rgba(20,40,30,.2);
  animation:sheetUp .3s cubic-bezier(.22,.9,.3,1) both}
.sheet .grab{width:2.375rem;height:0.25rem;border-radius:6.1875rem;background:#E0D2B8;margin:0 auto 0.875rem}
.sheet h2{font-size:1.25rem;font-weight:var(--w-black);letter-spacing:-0.01875rem}
.sheet .sheet-sub{font-size:0.71875rem;color:var(--muted);font-weight:var(--w-read);margin-top:0.25rem;line-height:1.6}
.sheet .sheet-actions{display:flex;flex-direction:column;gap:0.5625rem;margin-top:1rem}
.sheet .sheet-actions .btn{min-height:3.125rem;font-size:0.9375rem}
.dialog{width:calc(100% - 2.75rem);max-width:23.75rem;border-radius:1.625rem;background:#FFFBF3;padding:1.375rem 1.25rem 1.125rem;
  box-shadow:0 1.5rem 3.75rem rgba(20,40,30,.25);animation:pop .25s cubic-bezier(.2,1.4,.4,1) both;margin:auto}
.dialog .d-ico{width:3.25rem;height:3.25rem;border-radius:1rem;background:#FFF4CE;display:grid;place-items:center;margin:0 auto}
.dialog h3{font-size:1.125rem;font-weight:var(--w-black);text-align:center;margin-top:0.625rem}
.dialog p{font-size:0.71875rem;color:var(--muted);font-weight:var(--w-read);text-align:center;line-height:1.65;margin-top:0.375rem}
.dialog .d-actions{display:flex;gap:0.5rem;margin-top:1rem}
.dialog .d-actions .btn{min-height:2.875rem;font-size:0.875rem}
.dialog .d-actions .btn.ghost{flex:1}
.dialog .d-actions .btn:not(.ghost){flex:1.3}
.setting-row{display:flex;align-items:center;gap:0.75rem;min-height:3.375rem;border-bottom:0.0625rem solid #F2E8D6}
.setting-row:last-child{border-bottom:0}
.setting-row .s-ic{width:2.125rem;height:2.125rem;border-radius:0.6875rem;background:#F4EFE3;display:grid;place-items:center;color:#7E8D7C;flex:none}
.setting-row .s-txt{flex:1}
.setting-row .s-txt b{display:block;font-size:0.8125rem;font-weight:var(--w-bold)}
.setting-row .s-txt span{display:block;font-size:0.65625rem;color:#A19278;margin-top:0.0625rem}
.switch{width:2.875rem;height:1.75rem;border-radius:6.1875rem;background:#DCCFB7;position:relative;flex:none;transition:background .2s ease}
.switch::after{content:"";position:absolute;left:0.1875rem;top:0.1875rem;width:1.375rem;height:1.375rem;border-radius:50%;background:#fff;box-shadow:0 0.125rem 0.3125rem rgba(0,0,0,.18);transition:transform .2s ease}
.switch.on{background:var(--green)}
.switch.on::after{transform:translateX(1.125rem)}
.install-step{display:flex;gap:0.625rem;margin-top:0.75rem;align-items:flex-start}
.install-step .n{width:1.375rem;height:1.375rem;border-radius:0.4375rem;background:var(--green);color:#fff;font-size:0.6875rem;font-weight:var(--w-black);display:grid;place-items:center;flex:none;margin-top:0.0625rem}
.install-step p{font-size:0.71875rem;line-height:1.65;color:#5F7364;font-weight:var(--w-read)}
.install-step p b{color:var(--ink)}
.install-note{margin-top:0.875rem;border-radius:0.875rem;background:#F5F0E3;padding:0.625rem 0.75rem;font-size:0.6875rem;line-height:1.6;color:#8E7D60;font-weight:var(--w-read)}
.word-sheet .word-art{width:5.5rem;height:5.5rem;margin:0.625rem auto 0;display:grid;place-items:center;flex:none;
  background:#F5F9EC;border:none;border-radius:1.375rem;box-shadow:inset 0 0 0 0.09375rem #E7F0D8}
.word-sheet .word-art svg{width:84%;height:84%;display:block}
.word-sheet .word-art:active{transform:scale(.96)}
.word-sheet .word-big{display:block;margin:0.5rem auto 0;padding:0;border:none;background:none;
  font-family:inherit;font-size:2.25rem;font-weight:var(--w-black);letter-spacing:-0.0625rem;color:var(--ink);line-height:1.1}
.word-sheet .word-big:active{transform:scale(.97)}
.word-sheet .word-phon{font-size:0.8125rem;color:#A68A4E;margin-top:0.125rem;font-weight:var(--w-read);text-align:center}
.word-sheet .word-zh{font-size:0.875rem;color:#5F7364;margin-top:0.375rem;font-weight:var(--w-mid);text-align:center}
.word-sheet .speak-btn{margin-top:0.875rem;transition:all .15s ease}
.word-sheet .speak-btn.recording{background:linear-gradient(180deg,#F58C7C,#DC5E46);box-shadow:0 0.25rem 0 #B23F2C,0 0.5rem 0.875rem rgba(220,94,70,.25)}
.rec-dot{display:inline-block;width:0.5625rem;height:0.5625rem;border-radius:50%;background:#fff;margin-right:0.1875rem;
  animation:recPulse .9s ease-in-out infinite}
@keyframes recPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.word-sheet .tip{margin-top:0.75rem;font-size:0.9375rem;font-weight:var(--w-read);letter-spacing:0.00625rem;color:#857455;text-align:center;line-height:1.7}

/* toast */
.toast-root{position:absolute;left:0;right:0;bottom:calc(5.875rem + var(--safe-bottom));z-index:120;display:flex;flex-direction:column;align-items:center;gap:0.375rem;pointer-events:none;padding:0 1.25rem}
.toast{background:rgba(25,46,36,.94);color:#FFF6E2;font-size:0.75rem;font-weight:var(--w-mid);padding:0.625rem 0.875rem;border-radius:0.75rem;
  box-shadow:0 0.625rem 1.5rem rgba(20,40,30,.25);animation:toastIn .25s ease both;max-width:100%;text-align:center}
.toast.out{animation:toastOut .25s ease both}

/* ============================================================
   🎁 神秘宝箱开箱
   ============================================================ */
.chest-sheet{display:flex;flex-direction:column;align-items:center;padding:1.25rem 1rem 1.5rem;background:linear-gradient(180deg,#FFF9EC 0%,#FFEED5 100%)}
.chest-reveal{display:flex;flex-direction:column;align-items:center;gap:0.625rem;padding:0.5rem 0;width:100%}
.chest-sparkle{font-size:1.125rem;letter-spacing:0.3125rem;color:#FFB64D;animation:chest-sparkle 1.2s ease-in-out infinite}
@keyframes chest-sparkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.25)}}
.chest-found{width:100%;max-width:16rem;height:10rem;display:grid;place-items:center;border-radius:1rem;background:#FFFFFF;

.cf-stage{transform-origin:center}
.chest-meta{text-align:center}
.chest-rarity{font-size:0.9375rem;letter-spacing:0.125rem;line-height:1}
.chest-rarity.rarity-3{color:#B0B0B0}
.chest-rarity.rarity-4{color:#6BB6FF}
.chest-rarity.rarity-5{color:#FFB64D}
.chest-meta h2{font-size:1.25rem;font-weight:var(--w-black);color:#3D5A3D;margin:0.25rem 0}
.chest-meta h2 b{color:#FF8C3D}
.chest-phase{font-size:0.6875rem;color:#8C6B3D;font-weight:var(--w-bold);margin:0}
.chest-desc{font-size:0.75rem;color:#70624D;line-height:1.6;margin:0.25rem 0.5rem}
.chest-progress{width:100%;max-width:20rem;display:flex;flex-direction:column;gap:0.25rem;margin-top:0.5rem;padding:0.5rem 0.75rem;
  border-radius:0.75rem;background:rgba(255,255,255,.7);font-size:0.6875rem;color:#8C6B3D}
.chest-progress span{font-weight:var(--w-bold)}
.chest-progress b{float:right;font-weight:var(--w-black);color:#3D5A3D}
.chest-progress .bar{height:0.25rem;border-radius:0.125rem;background:rgba(92,65,29,.15);overflow:hidden}
.chest-progress .bar i{display:block;height:100%;background:#FFB64D;border-radius:0.125rem;transition:width .5s}
.chest-actions{display:flex;flex-direction:column;gap:0.375rem;width:100%;max-width:20rem;margin-top:0.75rem}
.chest-actions .btn{background:linear-gradient(180deg,#FFE477,#FFC84D);color:var(--sticker-ink);border:0.09375rem solid rgba(255,255,255,.7);box-shadow:0 0.1875rem 0 #D89732;min-height:2.75rem}

.chest-open{display:flex;flex-direction:column;align-items:center;gap:0.625rem;padding:2rem 1rem;text-align:center}
.chest-emoji{font-size:3.75rem;animation:chest-pop .55s cubic-bezier(.2,1.2,.4,1) both}

/* ============================================================
   zoo 主题：只覆盖视觉参数与位置，结构与题型引擎复用 game.css
   新增主题时在本目录新建同名 css 即可，构建会自动登记
   ============================================================ */
/* zoo 主题：只切换变量（背景素材 + 选项框风格），结构复用通用规则 */
.quiz-ref-page[data-scene="zoo"]{
  /* 背景由 responsive.css 方案二接管（暖杏绘本小镇渐变 + SVG 场景） */

  --opt-line:#956220;--opt-line-w:0.1875rem;
  --opt-rim:#EAB373;--opt-rim-w:0.125rem;
  --opt-base:#C78C28;--opt-base-h:0.25rem;
  --opt-hi:radial-gradient(130% 100% at 12% 0%, #FFF3D8 0%, rgba(255,243,216,0) 46%);
  --opt-fill:linear-gradient(180deg,#FFE7C1 0%,#FDE4BB 72%,#F3D29B 100%);
  --opt-radius:1.0625rem;
  --opt-shadow:rgba(120,80,20,.18);
  --opt-key-bg:#FFF3D2;--opt-key-line:#C79A54;--opt-key-w:0.125rem;--opt-key-ink:#8A6415;

  --opt-ok-line:#5C8F47;--opt-ok-rim:#B9DDA3;
  --opt-ok-hi:radial-gradient(130% 100% at 12% 0%, #F6FFEC 0%, rgba(246,255,236,0) 46%);
  --opt-ok-fill:linear-gradient(180deg,#EDF9DC 0%,#DDF0C2 100%);--opt-ok-base:#9AC78B;

  --opt-bad-line:#C25A48;--opt-bad-rim:#F0B7A8;
  --opt-bad-hi:radial-gradient(130% 100% at 12% 0%, #FFF6F1 0%, rgba(255,246,241,0) 46%);
  --opt-bad-fill:linear-gradient(180deg,#FFF1EA 0%,#FFE0D4 100%);--opt-bad-base:#E5AA9B;
}
/* 竖版：背景放大到纸面 90%，左右框裁切，页头压到纸面内 */
@media (max-aspect-ratio:1/1){
  .quiz-ref-page[data-scene="zoo"]{
    padding-top:max(7.5dvh,calc(0.5rem + var(--safe-top)));
  }
}
.quiz-ref-page[data-scene="zoo"] .option:active{
  transform:translateY(0.125rem);
  box-shadow:inset 0 0 0 var(--opt-rim-w) var(--opt-rim),0 0.125rem 0 var(--opt-base);
}
/* 标题块略微放大并下移，避开纸面上沿 */
.quiz-ref-page[data-scene="zoo"] .ref-stage-head{margin-top:1.375rem;margin-bottom:0.625rem}
.quiz-ref-page[data-scene="zoo"] .ref-stage-head h2{font-size:clamp(1.25rem,4.4vw,1.625rem)}
.quiz-ref-page[data-scene="zoo"] .ref-stage-badge{width:3.125rem;height:3.125rem}

/* zoo 纸面安全区：横屏时内容宽度同时受屏宽与屏高约束，保证答题块落在背景纸面以内 */
.quiz-ref-page[data-scene="zoo"]{container-type:size;--quiz-w:100%;--pic-w:min(100%,25rem,58cqh)}
.quiz-ref-page[data-scene="zoo"] .ref-quiz-body,
.quiz-ref-page[data-scene="zoo"] .quiz-foot{width:var(--quiz-w);max-width:var(--quiz-w);margin-left:auto;margin-right:auto}
.quiz-ref-page[data-scene="zoo"] .ref-picture-frame{width:var(--pic-w)}
.quiz-ref-page[data-scene="zoo"] .ref-quiz-body{padding-top:1.25rem}
.quiz-ref-page[data-scene="zoo"] .ref-pic-options .option{padding:0 0.5rem;gap:0.375rem}
.quiz-ref-page[data-scene="zoo"] .ref-pic-options .option .word{font-size:clamp(0.9375rem,2.6vw,1.125rem)}
/* 横屏：纸面宽度受限，收窄内容 */
@media (min-aspect-ratio:1/1){
  /* 纸面上边界（背景 cover 缩放后） */
  .quiz-ref-page[data-scene="zoo"]{--quiz-w:min(calc(100% - 2.5rem),57cqw,74cqh);
    --paper-top:max(23.4cqh,calc(50cqh - 20.31cqw))}
  .quiz-ref-page[data-scene="zoo"][data-type="pic"]{--quiz-w:min(calc(100% - 2rem),66cqw,78cqh)}
  /* 标题留在纸面外的天空，题卡整体下移到纸面以内 */
  .quiz-ref-page[data-scene="zoo"] .ref-stage-head + *{padding-top:max(0px,calc(var(--paper-top) - 4.5rem))}
}

/* ============================================================
   DinoGo · 恐龙英语 — responsive：大屏（iPad）适配，最后加载以覆盖前面规则
   ============================================================ */

/* ------------------------------------------------ larger screens */
@media (min-width:700px) and (min-height:600px){
  .home-top{margin-bottom:1.125rem}
  .home-top .hi{font-size:1.25rem}
  .hero{height:25.625rem}
  .hero .name b{font-size:2.125rem}
  .growth-panel .val{font-size:1.125rem}
  .growth-panel .lb,.growth-panel .g-next{font-size:0.75rem}
  .tasks{padding:1rem 1.125rem;gap:0.625rem;margin-top:1rem}
  .tasks .head h3{font-size:1.0625rem}
  .task{height:2.375rem}
  .task .t-title{font-size:0.875rem}
  .task .t-sub{font-size:0.71875rem}
  .word-card{padding:0.8125rem 1.25rem;min-height:9.125rem;margin-top:1rem}
  .word-card .spk{width:4rem;height:4rem;border-radius:1.1875rem}
  .word-card .w-word{font-size:2.25rem}
  .word-card .w-emoji{font-size:2.75rem}
  .word-card .w-kicker{font-size:0.6875rem}
  .word-card .w-phon{font-size:0.8125rem}
  .option{min-height:4.875rem}
  .option .word{font-size:1.125rem}
  .chart .col .b{width:1.75rem}
  .result-scroll{padding-left:2rem;padding-right:2rem}
  .result-foot{padding-left:2rem;padding-right:2rem}
  .result-card,.grow-card,.result-head{width:100%;max-width:38.75rem;margin-left:auto;margin-right:auto}
  .result-foot .btn{width:100%;max-width:38.75rem;margin-left:auto;margin-right:auto}
  .collect-preview{height:18.125rem}
  .collect-preview > .dino{width:14.375rem;height:14.375rem;top:2.25rem}
  .dex-grid{grid-template-columns:repeat(2,1fr)}
  .dex-card .pic{height:10.5rem}
  .dex-card .pic svg{width:10.5rem;height:10.5rem}
  .dex-card .nm{font-size:0.8125rem}
  .dex-card .stg{font-size:0.65625rem}
}

/* ------------------------------------------------ 大屏答题页：按视口宽高流体缩放，内容收成手机比例居中 */
@media (min-width:640px){
  /* 内容宽度同时受屏宽和屏高约束：矮屏自动收窄，保持竖屏比例 */
  .quiz-ref-page{--quiz-w:clamp(20rem,72vh,32rem)}

  .quiz-ref-page .quiz-top,
  .quiz-ref-page .ref-quiz-body,
  .quiz-ref-page .quiz-foot{width:100%;max-width:var(--quiz-w);margin-left:auto;margin-right:auto}

  /* 听音选图：卡片跟随可用高度缩放，不再被 flex 拉成长条 */
  .ref-listen-wrap{justify-content:center}
  .quiz-ref-page .ref-listen-grid{flex:none;width:min(100%,26rem);height:clamp(8rem,22vh,11rem);min-height:0}

  /* 其余题型的主容器 / 卡片也按同一视口比例收缩 */
  .ref-picture-frame{width:min(100%,28rem,70vh)}
  .ref-match-area{--match-card:clamp(3.75rem,min(13vw,8.5vh),5.25rem)}
  .quiz-ref-page .ref-action-stage,
  .quiz-ref-page .ref-cmp-stage{min-height:clamp(7rem,20vh,11rem)}
  .ref-zoom-lens{width:clamp(8rem,min(27vh,32vw),13.5rem)}
}

/* ------------------------------------------------ 矮屏（横屏/小窗口）：压缩答题页留白，把空间让给图片 */

/* ============================================================
   答题页统一版式：外壳 / 纸面安全框 / 题型槽位
   ============================================================ */

/* 1. 统一答题页外壳：宽度与安全区 */
.quiz-ref-page {
  container-type: size;
  display: flex;
  flex-direction: column;
  padding-top: calc(0.5rem + var(--safe-top)) !important;
  /* 统一三端内容最大宽度：手机全宽，iPad/PC 舒适居中 */
  --stage-max-w: min(100%, 42rem);
}

/* 2. zoo 场景：由方案二样式接管背景与顶部偏移 */

/* 3. 顶栏、主体纸面、底栏共用同一套宽度与居中基准 */
.quiz-ref-page .quiz-top,
.quiz-ref-page .quiz-foot {

  padding-right: 1rem !important;

}

/* 4. 把 .ref-quiz-body 本身做成“奶油纸面安全框”，100% 包住所有题型不越界 */
.quiz-ref-page .ref-quiz-body {

  box-shadow: 0 0.375rem 0 rgba(149, 98, 32, 0.18), 0 0.75rem 1.5rem rgba(92, 65, 29, 0.12);

/* 5. 标题槽位锁死：所有题型标题高度、间距完全一致 */

/* 6. 收编所有题型包裹层：统一占满纸面剩余高度，内部采用“上展示 + 下选项” */

/* 7. 统一所有题型的“视觉展示区”高度（占中间弹性区，不撑破、不塌陷） */

/* ============================================================
   方案二：暖杏绘本小镇（童趣背景 + 底层单行艺术字 + 三端固定槽位）
   ============================================================ */

/* 1. 答题页外壳：统一坐标系 + 暖杏奶油贴纸配色 */
.quiz-ref-page[data-scene="zoo"] {
  container-type: size;
  display: flex;
  flex-direction: column;
  padding-top: calc(0.5rem + var(--safe-top)) !important;
  background: #FFF8EA !important;
  --stage-max-w: min(100%, 42rem);

  /* 暖杏奶油选项按钮配色 */
  --opt-line: #C89B63;
  --opt-line-w: 0.15625rem;
  --opt-rim: rgba(255, 255, 255, 0.9);
  --opt-rim-w: 0.125rem;
  --opt-base: #DFB989;
  --opt-base-h: 0.25rem;
  --opt-hi: linear-gradient(180deg, rgba(255,255,255,.8) 0%, rgba(255,255,255,0) 52%);
  --opt-fill: linear-gradient(180deg, #FFFDF8 0%, #FDEED4 100%);
  --opt-radius: 1.125rem;
  --opt-shadow: rgba(156, 112, 62, 0.12);
  --opt-key-bg: #FFE9BF;
  --opt-key-line: #D8AD74;
  --opt-key-w: 0.09375rem;
  --opt-key-ink: #845A2B;

  /* 答对：柔和抹茶绿 */
  --opt-ok-line: #76AF68;
  --opt-ok-rim: rgba(255, 255, 255, 0.85);
  --opt-ok-hi: linear-gradient(180deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 50%);
  --opt-ok-fill: linear-gradient(180deg, #EEF9E3 0%, #DCF0C8 100%);
  --opt-ok-base: #A4CC92;

  /* 答错：柔和蜜桃粉 */
  --opt-bad-line: #DC8470;
  --opt-bad-rim: rgba(255, 255, 255, 0.85);
  --opt-bad-hi: linear-gradient(180deg, rgba(255,255,255,.5) 0%, rgba(255,255,255,0) 50%);
  --opt-bad-fill: linear-gradient(180deg, #FFF4F0 0%, #FFE2D8 100%);
  --opt-bad-base: #E8AEA0;
}

/* 2. 启用矢量背景层，并清除横屏下的顶部偏移 */
.quiz-ref-page[data-scene="zoo"] .ref-stage-head + * {
  padding-top: 0 !important;
}
.quiz-ref-page[data-scene="zoo"] .ref-scene-svg {
  display: block !important;
}

/* 3. 暖杏奶油天空底色 */
.quiz-ref-page[data-scene="zoo"] .ref-scene-bg {

    radial-gradient(circle at 82% 18%, rgba(255, 232, 196, 0.55) 0%, transparent 48%),
    linear-gradient(180deg, #FFFBF2 0%, #FDF2DC 62%, #F9E5C2 100%) !important;
  background-size: 100% 100% !important;
  background-position: center !important;
}

/* 4. 左上小飞机、右上热气球：贴边锚定，宽屏舒展、竖屏不遮挡 */
.zoo-deco-plane,
.zoo-deco-balloons {
  position: absolute;
  pointer-events: none;
  z-index: 1;
}
.zoo-deco-plane {
  left: clamp(0.5rem, 3vw, 2.25rem);
  top: clamp(3.25rem, 10vh, 5.5rem);
  width: clamp(4.75rem, 13vw, 8.25rem);
  height: auto;
  animation: zooPlaneDrift 6s ease-in-out infinite;
}
.zoo-deco-balloons {
  right: clamp(0.5rem, 3vw, 2.25rem);
  top: clamp(3rem, 9vh, 5rem);
  width: clamp(4.5rem, 12vw, 7.75rem);
  height: auto;
  animation: zooBalloonFloat 5.2s ease-in-out infinite;
}
@keyframes zooPlaneDrift {
  0%, 100% { transform: translate(0, 0) rotate(-2deg); }
  50% { transform: translate(0.35rem, -0.35rem) rotate(2deg); }
}
@keyframes zooBalloonFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-0.5rem); }
}

/* 5. 顶栏 & 底栏：统一居中宽度，底栏为最下层艺术字留出呼吸空间 */

  /* 判断当前是否为动物园场景（启用动态出题引擎） */
  function isZooScene() {
    return state.theme === "animal" && state.scene === "zoo";
  }

  /* 当前动物园场景对象 */
  function zooScene() {
    return (currentTheme().scenes || []).find((s) => s.id === (state.scene || "zoo")) || null;
  }

  /* 每馆第 5 关为馆内 BOSS，最后一关为总 BOSS */
  function isAnimalBossLevel(level) {
    return isZooScene() && Number(level) % LEVELS_PER_VENUE === 0;
  }
  function isAnimalFinalBoss(level) {
    const scene = zooScene();
    return isZooScene() && !!scene && Number(level) === scene.levelCount;
  }

  window.isZooScene = isZooScene;
  window.zooScene = zooScene;
  window.isAnimalBossLevel = isAnimalBossLevel;
  window.isAnimalFinalBoss = isAnimalFinalBoss;

  /* 阶段门槛：每 5 关为一阶段，阶段内第 5 关需前 4 关累计 ≥8 星 */
  const STAGE_SIZE = 5;
  const STAGE_GATE_STARS = 8;
  function stageStarsBefore(level) {
    const L = Number(level) || 1;
    const start = Math.floor((L - 1) / STAGE_SIZE) * STAGE_SIZE + 1;
    const stars = themeProgress().stars || {};
    let sum = 0;
    for (let i = start; i < L; i++) sum += Number(stars[i]) || 0;
    return sum;
  }
  function canEnterLevel(level) {
    const L = Number(level) || 1;
    if (!isZooScene()) return true;
    if (L % STAGE_SIZE !== 0) return true;
    return stageStarsBefore(L) >= STAGE_GATE_STARS;
  }
  window.STAGE_SIZE = STAGE_SIZE;
  window.STAGE_GATE_STARS = STAGE_GATE_STARS;
  window.stageStarsBefore = stageStarsBefore;
  window.canEnterLevel = canEnterLevel;

    return step >= 3 ? ["pic", "listen", "word_puzzle"] : ["pic", "listen"];
  }

  /* 第 5 题在「身体部位」和「形容词」之间按权重抽取：
     前两关偏局部观察，第 3 关起逐步提高形容词对比题的权重 */
  function pickPartOrAdjType(step) {
    const adjWeight = step <= 2 ? 0.3 : 0.5;
    return Math.random() < adjWeight ? "compare" : "body_zoom";
  }

  function wordId(sceneId, word) {
    return WrongBank.makeId(sceneId, word);
  }

  /* 单词是否符合某个题型：标签匹配 + 特殊资源（动作 / 部位 / 对比图）齐备 */
  function fitsRule(w, rule) {
    if (!w || !rule.cats.includes(w.category)) return false;
    if (rule.maxLetters && String(w.word).length > rule.maxLetters) return false;
    if (rule.key === "action" && !w.actor) return false;
    if (rule.key === "body_zoom" && !w.owner) return false;
    if (rule.key === "compare" && !w.compare) return false;
    return true;
  }

  /* 同类型题型尽量不重复，让一关里题型更丰富 */
  function pickType(types, usedTypes) {
    const fresh = shuffle(types).filter((type) => !usedTypes.has(type));
    return fresh[0] || shuffle(types)[0];
  }

  /* 生成一道题：按题型筛词 + 错题库加权 + 同局去重 */
  function makeQuestion(type, pool, sceneId, usedWords, usedTypes) {
    const rule = RULE_BY_KEY[type];
    if (!rule) return null;

    let candidates = pool.filter((w) => fitsRule(w, rule) && !usedWords.has(w.word));
    if (!candidates.length) candidates = pool.filter((w) => fitsRule(w, rule));
    if (!candidates.length) return null;

    /* 错题库加权抽词：答错过的词优先复现 */
    const target = WrongBank.pickWithBias(candidates, (w) => wordId(sceneId, w.word)) || candidates[0];
    usedWords.add(target.word);
    usedTypes.add(type);
    return { gameType: type, recordWrong: rule.recordWrong, targetWord: target };
  }

  /* 按固定配比组卷：普通关 3 题，BOSS 关 5 题 */
  function buildSession(level, pool, sceneId) {
    const step = ((Number(level) - 1) % LEVELS_PER_VENUE) + 1;
    const isBoss = step === LEVELS_PER_VENUE;
    const mix = isBoss ? BOSS_MIX : NORMAL_MIX;
    const usedWords = new Set();
    const usedTypes = new Set();
    const questions = [];

    for (const slot of mix) {
      for (let i = 0; i < slot.count; i++) {
        let type = "action";
        if (isBoss) {
          type = slot.role === "partOrAdj" ? pickPartOrAdjType(step) : BOSS_TYPE_BY_ROLE[slot.role];
        } else if (slot.role === "noun") type = pickType(nounTypesForStep(step), usedTypes);
        else if (slot.role === "partOrAdj") type = pickPartOrAdjType(step);
        const question = makeQuestion(type, pool, sceneId, usedWords, usedTypes);
        if (question) questions.push(question);
      }
    }

    return questions;
  }

  /* 把引擎输出转换成现有 quiz.order 兼容的 task 对象 */
  function toTask(question, allWords, dlg, sceneId) {
    const w = allWords.find((x) => x.word === question.targetWord.word) || question.targetWord;
    const task = {
      type: question.gameType,
      word: w.word,
      zh: w.zh || "",
      emoji: w.emoji || "",
      art: w.art || (() => UNKNOWN_ART(w.word)),
      phon: w.phon || "",
      category: w.category || "",
      /* 素材键：题目与图片解耦；成对形容词共用同一个 assetKey */
      assetKey: w.assetKey || w.word,
      animal: !!w.animal,
      /* 进阶题型专用数据 */
      actor: w.actor || "",
      motion: w.motion || "",
      owner: w.owner || "",
      focus: w.focus || null,
      compare: w.compare || null,
      dlgQ: dlg.q,
      dlgA: dlg.a,
      recordWrong: question.recordWrong,
      wrongWordId: wordId(sceneId, w.word),
    };
    const game = currentTheme().games[question.gameType];
    if (game && game.build) game.build(task, allWords);
    return task;
  }

  /* 兜底补题：只使用本次改造后的 6 个题型，避免抽到待建设题型 */
  const IMPLEMENTED_TYPES = ["pic", "listen", "word_puzzle", "action", "body_zoom", "compare"];
  function fillTasks(tasks, size, allWords, dlg, sceneId, allowedTypes) {
    const types = allowedTypes && allowedTypes.length ? allowedTypes : IMPLEMENTED_TYPES;
    const usedWords = new Set(tasks.map((task) => task.word));
    let guard = 0;
    while (tasks.length < size && guard++ < 20) {
      const type = types[Math.floor(Math.random() * types.length)];
      const rule = RULE_BY_KEY[type];
      let candidates = allWords.filter((w) => fitsRule(w, rule) && !usedWords.has(w.word));
      if (!candidates.length) candidates = allWords.filter((w) => fitsRule(w, rule));
      if (!candidates.length) break;
      const w = candidates[Math.floor(Math.random() * candidates.length)];
      usedWords.add(w.word);
      tasks.push(toTask({ gameType: type, recordWrong: rule.recordWrong, targetWord: w }, allWords, dlg, sceneId));
    }
    return tasks;
  }

  /* 关卡题型表（非动物园主题沿用）：优先取主题配置，缺省回退第 10 关 */
  function levelPlan(level) {
    const plans = currentTheme().levelGames || {};
    return plans[level] || plans[10];
  }

  function buildTasks(level) {
    const theme = currentTheme();
    const pool = themeWords();
    const dlg = theme.dialog || { q: "What's this?", a: "It's a {word}." };

    /* 🦁 动物园场景：按四类题库 + 关卡模板动态组卷 */
    if (isZooScene() && window.DynamicEngine) {
      const sceneId = state.scene || "zoo";
      const scene = zooScene();
      const allSceneWords = scene && scene.words && scene.words.length ? scene.words : pool;
      const boss = isAnimalBossLevel(level);
      const size = boss ? BOSS_QUIZ_SIZE : QUIZ_SIZE;

      const questions = buildSession(level, allSceneWords, sceneId);
      let tasks = questions
        .filter((q) => theme.games[q.gameType] && theme.games[q.gameType].render)
        .map((q) => toTask(q, allSceneWords, dlg, sceneId));

      return fillTasks(tasks, size, allSceneWords, dlg, sceneId, boss ? BOSS_TYPES : null).slice(0, size);
    }

    /* ✈️🍽️ 其他主题：原有固定题型顺序逻辑 */
    const picks = shuffle(pool);
    return levelPlan(level).map((type, i) => {
      const w = picks[i % picks.length];
      const task = { type, word: w.word, art: w.art, phon: w.phon, dlgQ: dlg.q, dlgA: dlg.a };
      const game = theme.games[type];
      if (game.build) game.build(task, pool);
      return task;
    });
  }


  /* ============================================================
     题型实现
     ============================================================ */

  /* 默认关卡题序（恐龙 / 学校等固定卷主题沿用） */
  function defaultLevelGames() {
    return {
      1: ["pic", "listen", "pic", "listen", "pic"],
      2: ["pic", "listen", "feed_animal", "pic", "listen"],
      3: ["pic", "listen", "match", "feed_animal", "listen"],
      4: ["listen", "pic", "match", "word_puzzle", "pic"],
      5: ["pic", "match", "word_puzzle", "listen", "pic"],
      6: ["listen", "feed_animal", "match", "pic", "listen"],
      7: ["pic", "match", "word_puzzle", "dialog", "listen"],
      8: ["listen", "dialog", "match", "feed_animal", "pic"],
      9: ["dialog", "match", "listen", "dialog", "word_puzzle"],
      10: ["dialog", "listen", "word_puzzle", "match", "feed_animal"],
    };
  }

  /* 选择题通用选项：干扰项优先取同类词（名词配名词、动词配动词） */
  function buildOptions(task, pool, count) {
    const sameCat = pool.filter((x) => x.word !== task.word && x.category && x.category === task.category);
    const source = sameCat.length >= count - 1 ? sameCat : pool.filter((x) => x.word !== task.word);
    task.options = shuffle([
      task.word,
      ...shuffle(source).slice(0, count - 1).map((x) => x.word),
    ]);
  }
  /* 三个选项的选择题共用 build（看图 / 听音 / 对话 / 动作 / 局部特写） */
  function threeChoiceBuild(task, pool) {
    buildOptions(task, pool, 3);
  }

  /* 对比观察选项：正确词 + 成对形容词 + 其他形容词干扰 */
  function buildCompareOptions(task, pool) {
    const adjPool = pool.filter((w) => w.category === "adj");
    const pair = task.compare && task.compare.pair;
    const extras = shuffle(adjPool.filter((w) => w.word !== task.word && w.word !== pair)).slice(0, 3 - (pair ? 2 : 1));
    task.options = shuffle([task.word, ...(pair ? [pair] : []), ...extras.map((w) => w.word)]);
  }

  /* 单词主图：优先 images/words/animal/{word}.webp，其次 images/words/{word}.png，缺图时回退 emoji */
  window.wordArtFallback = function (img) {
    if (!img.dataset.fallback) {
      img.dataset.fallback = "png";
      img.src = img.src.replace("/animal/", "/").replace(/\.webp$/, ".png");
      return;
    }
    img.style.display = "none";
    img.nextElementSibling.style.display = "grid";
  };
  function wordHeroArt(w) {
    const emoji = w.emoji || wordGlyph(w.word);
    return `<img class="pic-img" src="images/words/animal/${w.word}.webp" alt="" loading="eager" decoding="async"
      onerror="wordArtFallback(this)">
      <span class="pic-emoji" style="display:none">${emoji}</span>`;
  }

  /* 进阶题（动作 / 局部特写 / 对比观察）共用的「舞台 + 提示 + 选项」外壳 */
  function advancedLayout({ wrap, stage, tipClass, tip, optionsClass, options, btn }) {
    return {
      body: `<div class="${wrap}">${stage}<p class="${tipClass}">${tip}</p><div class="options ${optionsClass}">${options}</div></div>`,
      btn,
    };
  }

          };
        },
        onPickWord(word) {
          if (!quiz || quiz.revealed) return;
          quiz.pickWord = word;
          quiz.pickWordSide = "word";
          sfx("tap");
          render();
        },
        onPickArt(word) {
          if (!quiz || quiz.revealed || !quiz.pickWord) return;
          const q = quiz.order[quiz.index];
          /* 构造错题库 wordId（match 题型的 q.pairs 里没有 wrongWordId） */
          const _sceneId = (state && state.scene) || "";
          const _makeWid = (w) => window.WrongBank ? WrongBank.makeId(_sceneId, w) : null;
          if (word === quiz.pickWord) {
            quiz.matched.push(word);
            quiz.pickWord = null;
            quiz.pickWordSide = null;
            sfx("correct");
            /* 🦁 动物园：配对成功 → 尝试清除错题库 */
            if (window.isZooScene && isZooScene() && _makeWid(word)) WrongBank.recordCorrect(_makeWid(word));
            if (quiz.matched.length >= q.pairs.length) {
              quiz.revealed = true;
              quiz.choiceCorrect = quiz.matchWrong === 0;
              if (quiz.choiceCorrect) {
                quiz.correct++;
                q.pairs.forEach((p) => quiz.words.push(p.word));
                sfx("excellent");
              }
              render();
              return;
            }

            quiz.matchWrong++;

            quiz.pickWord = null;
            quiz.pickWordSide = null;
            quiz.hearts = Math.max(0, quiz.hearts - 1);

            if (window.isZooScene && isZooScene() && _makeWid(wrongPair)) WrongBank.recordWrong(_makeWid(wrongPair));
            if (quiz.hearts <= 0) {
              quiz.revealed = true;
              quiz.choiceCorrect = false;
              render();
              return;

            toast("答错了，继续努力");

          render();

/* ============================================================
   🦁 路线弹框（底部抽屉）
   - 点「开始闯关」后升起，使用原版海报地图（不重绘画面）
   - 50 个关卡点直接落在图上 1~50 号白色圆圈中心
   - 节点只画状态环：已通关绿色、当前关金色跳动、未解锁灰化，保留底图原数字
   - 抽屉内支持 100% / 150% / 200% / 250% 缩放，打开时自动定位当前关
   ============================================================ */
const ZOO_ZOOM_STEPS = [1, 1.5, 2, 2.5];
let zooZoom = 1;

function zooBoardEls() {
  const viewport = document.querySelector(".zoo-board-viewport");
  const inner = viewport && viewport.querySelector(".zoo-board-inner");
  const label = document.querySelector(".zoo-zoom-val");
  return { viewport, inner, label };
}

/* 以当前关为锚点缩放，放大后始终把当前关留在视口中央 */
function zooApplyZoom() {
  const { viewport, inner, label } = zooBoardEls();
  if (!viewport || !inner) return;
  inner.style.width = (zooZoom * 100) + "%";
  if (label) label.textContent = Math.round(zooZoom * 100) + "%";
  requestAnimationFrame(zooFocusCurrent);
}

/* 把当前关节点滚到视口中央 */
function zooFocusCurrent() {
  const { viewport } = zooBoardEls();
  const node = viewport && viewport.querySelector(".zoo-step.current");
  if (!viewport || !node) return;
  const vr = viewport.getBoundingClientRect();
  const nr = node.getBoundingClientRect();
  viewport.scrollLeft += nr.left - vr.left - (vr.width - nr.width) / 2;
  viewport.scrollTop += nr.top - vr.top - (vr.height - nr.height) / 2;
}

window.ZooRouteView = {
  focusCurrent: zooFocusCurrent,
  zoomIn() {
    const i = ZOO_ZOOM_STEPS.indexOf(zooZoom);
    zooZoom = ZOO_ZOOM_STEPS[Math.min(ZOO_ZOOM_STEPS.length - 1, (i < 0 ? 0 : i) + 1)];
    zooApplyZoom();
  },
  zoomOut() {
    const i = ZOO_ZOOM_STEPS.indexOf(zooZoom);
    zooZoom = ZOO_ZOOM_STEPS[Math.max(0, (i < 0 ? 0 : i) - 1)];
    zooApplyZoom();
  },
  resetZoom() {
    zooZoom = 1;
    zooApplyZoom();
    zooFocusCurrent();
  },
};

function renderZooRouteSheet(scene, prog) {
  zooZoom = 1;
  const total = scene.levelCount || scene.levels.length;
  const level = Math.min(total, Math.max(1, prog.level || 1));
  const stars = Object.values(prog.stars || {}).reduce((a, b) => a + (Number(b) || 0), 0);
  const current = scene.levels[level - 1];
  const venue = current ? current.venue : scene.venues[scene.venues.length - 1];
  const gateNeed = level % LEVELS_PER_VENUE === 0 && !canEnterLevel(level)
    ? STAGE_GATE_STARS - stageStarsBefore(level)
    : 0;

  const nodes = scene.levels.map((s) => {
    const locked = s.level > level || !canEnterLevel(s.level);
    const done = s.level < level;
    const isCurrent = s.level === level;
    const cls = [
      "animal-route-node", "zoo-step",
      done ? "done" : "",
      isCurrent ? "current" : "",
      locked ? "locked" : "",
      s.step === LEVELS_PER_VENUE ? "venue-boss" : "",
    ].filter(Boolean).join(" ");
    return `<button type="button" class="${cls}" style="left:${s.x}%;top:${s.y}%"
        data-action="zoo-node" data-level="${s.level}"
        title="${s.venue.zh} · 第 ${s.level} 关"
        aria-label="${s.venue.zh}第 ${s.step} 关${done ? "，已通关" : isCurrent ? "，当前关卡" : "，未解锁"}"
        ${locked ? "disabled" : ""}><span class="zoo-step-num">${s.level}</span></button>`;
  }).join("");

  return `<div class="overlay">
    <section class="sheet animal-route-sheet zoo-route-sheet" role="dialog" aria-modal="true" aria-label="陆地动物园闯关路线">
      <div class="grab"></div>
      <div class="zoo-route-head">
        <div class="zoo-route-title">
          <strong>🦁 陆地动物园</strong>
          <small>第 ${level} 关 · ${venue ? venue.zh : "全部通关"} · ★ ${stars} / ${total * 3}${gateNeed ? ` · 还差 ${gateNeed} ★ 解锁` : ""}</small>
        </div>
        <button type="button" class="zoo-route-close" data-action="close-overlay" aria-label="关闭路线图">×</button>
      </div>
      <div class="zoo-board-frame">
        <div class="zoo-board-viewport">
          <div class="zoo-board-inner">
            <div class="animal-route-map has-map zoo" style="--arm-ratio:1505/1045">
              <img class="arm-bg" src="${scene.mapImage}" alt="陆地动物园闯关路线图">
              ${nodes}
            </div>
          </div>
        </div>
        <div class="zoo-zoom-bar" role="group" aria-label="路线图缩放">
          <button type="button" data-action="zoo-zoom-out" aria-label="缩小路线图">−</button>
          <button type="button" class="zoo-zoom-val" data-action="zoo-zoom-reset" title="恢复 100%">100%</button>
          <button type="button" data-action="zoo-zoom-in" aria-label="放大路线图">＋</button>
        </div>
      </div>
    </section>
  </div>`;
}

  C3: 130.81, D3: 146.83, E3: 164.81, F3: 174.61, G3: 196.0, A3: 220.0, B3: 246.94,
  C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.0, A4: 440.0, B4: 493.88,
  C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880.0, B5: 987.77,
  C6: 1046.5, D6: 1174.66, E6: 1318.5,
};

/* 首次交互时创建 / 唤醒音频上下文（iOS 要求） */
function ensureAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}

/* 播放一个音：类型、音量、延迟与输出目标均可配置 */
function tone(freq, dur = 0.12, type = "sine", vol = 0.05, delay = 0, dest = null) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(gain).connect(dest || audioCtx.destination);
  osc.start(t);
  osc.stop(t + dur + 0.02);
}

/* 界面音效 */
function sfx(name) {
  if (!state.sound) return;
  try {
    ensureAudio();
    if (name === "tap") tone(520, 0.05, "sine", 0.025);
    else if (name === "correct") { tone(660, 0.12, "sine", 0.05); tone(880, 0.16, "sine", 0.05, 0.1); }
    else if (name === "excellent") {
      [659, 784, 988, 1318].forEach((f, i) => tone(f, 0.16, "triangle", 0.05, i * 0.08));
      tone(1568, 0.36, "sine", 0.035, 0.34);
    }
    else if (name === "wrong") { tone(190, 0.2, "sawtooth", 0.035); tone(150, 0.24, "sawtooth", 0.03, 0.12); }
    else if (name === "coin") { tone(988, 0.08, "triangle", 0.05); tone(1318, 0.14, "triangle", 0.045, 0.07); }
    else if (name === "star") { tone(740, 0.1, "sine", 0.05); tone(1108, 0.14, "sine", 0.04, 0.09); }
    else if (name === "evolve") { [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, 0.24, "triangle", 0.05, i * 0.13)); }
    else if (name === "win") { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.3, "sine", 0.045, i * 0.1)); }
  } catch (e) { /* no audio */ }
}

/* 英文单词朗读 */
function speak(text) {
  try {
    if (!("speechSynthesis" in window)) {
      if (typeof toast === "function") toast("当前浏览器不支持发音");
      return;
    }
    const synth = window.speechSynthesis;
    const say = () => {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      u.rate = 0.82;
      u.pitch = 1.08;
      synth.speak(u);
    };
    /* 先停掉上一段朗读；连续点击时立即 speak 会被部分浏览器丢弃，稍作延迟 */
    if (synth.speaking || synth.pending) {
      synth.cancel();
      setTimeout(say, 60);
    } else {
      say();
    }
  } catch (e) { /* ignore */ }
}

/* 关卡提示音：进入某主题关卡时播放的短旋律 */
const LEVEL_CUES = {
  animal: [
    [110, 0.2, "triangle", 0.05, 0], [NOTE_FREQ.D5, 0.16, "triangle", 0.045, 0.18],
    [NOTE_FREQ.F5, 0.16, "triangle", 0.045, 0.3], [NOTE_FREQ.A5, 0.16, "triangle", 0.045, 0.42],
    [NOTE_FREQ.D6, 0.34, "triangle", 0.04, 0.54],
  ],
};

function levelCue(id) {
  if (!state.sound) return;
  try {
    ensureAudio();
    if (!audioCtx) return;
    const pattern = LEVEL_CUES[id] || LEVEL_CUES.animal;
    pattern.forEach(([f, d, type, vol, delay]) => tone(f, d, type, vol, delay));
  } catch (e) { /* no audio */ }
}

}

}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {

/* ============================================================
   词汇池与关卡规则：词性池、随机复习词、主题筛选与进度计算
   ============================================================ */

/* 没有精确 emoji 的词，用单词首字母大写代替，避免出现统一的问号占位 */
function wordGlyph(word) {
  const ch = String(word || "").trim().charAt(0);
  return ch ? ch.toUpperCase() : "?";
}
function wordArt(w) {
  return w.art || (() => emojiArt(w.emoji || wordGlyph(w.word)));
}
/* 单词池：所有 isPool:true 的词性文件里的原子词（带 type 标注），仅供每日随机记单词与单词本使用 */
const POS_POOL = (window.DINO_WORD_SETS || [])
  .filter((s) => s.isPool)
  .flatMap((s) => (s.words || []).map((w) => ({ ...w, pos: s.id })))
  .map((w) => ({ ...w, art: wordArt(w) }));
/* 随机记单词只取名词与动词短语 */
const REVIEW_WORDS = POS_POOL.filter(
  (w) => w.pos === "noun" || (w.pos === "verb" && w.type === "phrase")
);
/* 词性中文名（单词本页签展示用） */
const POS_ZH = { noun: "名词", verb: "动词", adj: "形容词", adv: "副词", pron: "代词", prep: "介词", conj: "连词", interj: "感叹词", num: "数词" };
function posZh(w) {
  if (!w || !w.pos) return "";
  if (w.pos === "verb" && w.type === "phrase") return "动词短语";
  return POS_ZH[w.pos] || "";
}
/* 关卡主题：每个主题自带独立词表，不再从词库按类型筛选；多场景主题每个场景一套词 */
function themeWordList(list) {
  return (list || []).map((w) => ({ ...w, art: wordArt(w) }));
}
const WORD_SETS = (window.DINO_WORD_SETS || [])
  .filter((s) => s.isTheme)
  .map((set) => ({
    ...set,
    words: themeWordList(set.words),
    scenes: (set.scenes || []).map((scene) => ({ ...scene, words: themeWordList(scene.words) })),
  }));
/* 普通主题 10 关，动物乐园按场景各 50 关；普通关 3 题、BOSS 关 5 题；动物园每阶段第 5 关需前 4 关累计 8 星 */
const LEVELS_PER_THEME = 10;
const PASS_STARS = 1;
/* 主题按 id 建索引，避免每次渲染都线性查找 */
const THEME_BY_ID = new Map(WORD_SETS.map((set) => [set.id, set]));
function currentTheme() {
  return THEME_BY_ID.get(state.theme) || WORD_SETS[0];
}
/* 多场景主题取当前场景词表，单场景主题取主题词表 */
function sceneOf(theme, sceneId) {
  const scenes = (theme && theme.scenes) || [];
  if (!scenes.length) return null;
  return scenes.find((s) => s.id === sceneId) || scenes[0];
}
function sceneWords(theme, sceneId) {
  const scene = sceneOf(theme, sceneId);
  if (scene && scene.words && scene.words.length) return scene.words;
  return (theme && theme.words) || [];
}
function themeWords() {
  return sceneWords(currentTheme(), state && state.scene);
}
/* 当前主题（多场景主题为当前场景）的关卡总数：动物乐园 50 关，其余主题 10 关 */
function levelsPerTheme(id) {
  const theme = THEME_BY_ID.get(id) || currentTheme();
  const scene = sceneOf(theme, state && state.scene);
  return (scene && scene.levelCount) || (theme && theme.levelCount) || LEVELS_PER_THEME;
}
/* 多场景主题（如动物乐园）：每个场景拥有独立 10 关进度，存档键为「主题:场景」 */
function sceneProgress(themeId, sceneId) {
  if (!state.progress) state.progress = {};
  const key = `${themeId}:${sceneId}`;
  if (!state.progress[key]) state.progress[key] = { level: 1, stars: {} };
  return state.progress[key];
}
function activeProgressKey(themeId) {
  const id = themeId || (state && state.theme) || WORD_SETS[0].id;
  const theme = THEME_BY_ID.get(id);
  const scenes = theme && theme.scenes;
  if (scenes && scenes.length) {
    const scene = scenes.find((s) => s.id === (state && state.scene)) || scenes[0];
    return `${id}:${scene.id}`;
  }
  return id;
}
/* 每个主题（多场景主题为当前场景）独立关卡进度：{ level, stars }，互不影响 */
function themeProgress(id) {
  const key = activeProgressKey(id);
  if (!state.progress) state.progress = {};
  if (!state.progress[key]) state.progress[key] = { level: 1, stars: {} };
  return state.progress[key];
}
function themeStars(p) {
  return Object.values(p.stars).reduce((a, b) => a + b, 0);
}
function totalLevelsDone() {
  return Object.values(state.progress || {}).reduce(
    (n, p) => n + Math.max(0, (Number(p.level) || 1) - 1),
    0
  );
}

      stars: legacy ? Math.floor((Number(parsed.stars) || 0) / 5) : (Number(parsed.stars) || 0),
      tasks: { ...DEFAULT_STATE.tasks, ...(parsed.tasks || {}) },
      scene: parsed.scene || DEFAULT_STATE.scene,
      progress,
      log: parsed.log || {},
      bgOwned: Array.isArray(parsed.bgOwned) ? parsed.bgOwned : [...DEFAULT_STATE.bgOwned],

/* ------------------------------------------------ timers */
function setTimer(fn, ms) {
  const id = setTimeout(() => { timers = timers.filter((t) => t !== id); fn(); }, ms);
  timers.push(id);

}
function clearTimers() { timers.forEach((t) => clearTimeout(t)); timers = []; }

/* 全新存档：零星星、零成长、零记录，所有主题从第 1 关开始 */
function initialState() {

    ...DEFAULT_STATE,
    tasks: { ...DEFAULT_STATE.tasks },

    log: {},

    if (opts.replace) history.replaceState({ screen: name }, "");

  } catch (e) { /* local file / restricted history */ }

  <script>
/* ============================================================
   WrongBank · 智能错题库
   - 独立 localStorage 持久化（key: dinogo.wrongbank）
   - 答错自动收录 + 错误次数累加
   - 连续答对 2 次自动"毕业"移出错题库
   - 查询接口：pickFromWrong(候选词) → 65% 概率优先返回错题
   - 数据隔离：wordId 格式 "{scene}_{word}"，跨场景互不污染
   ============================================================ */
(function () {
  "use strict";

  const STORAGE_KEY = "dinogo.wrongbank";

  /* 运行时内存结构：{ [wordId]: { errorCount: n, consecutiveCorrect: n } } */
  let bank = load();

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }
  /* 写入节流：连续答题时合并成一次 localStorage 写入，避免同步阻塞主线程 */
  let persistTimer = null;
  function flush() {
    if (persistTimer) { clearTimeout(persistTimer); persistTimer = null; }
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(bank)); } catch (e) {}
  }
  function persist() {
    if (persistTimer) return;
    persistTimer = setTimeout(flush, 300);
  }
  window.addEventListener("pagehide", flush);

  /* 对外 API */
  window.WrongBank = {
    /* 为某个场景的单词生成唯一 ID：zoo + lion → "zoo_lion" */
    makeId(sceneId, word) {
      return `${sceneId || ""}_${word || ""}`;
    },

    /* 统一入口：按题型 task 记录一次答题结果（仅动物园场景生效）
       所有题型一视同仁：答错必收录，答对累计连续正确次数 */
    applyResult(task, ok) {
      if (!task || !task.wrongWordId) return false;
      if (typeof isZooScene === "function" && !isZooScene()) return false;
      if (ok) return this.recordCorrect(task.wrongWordId);
      this.recordWrong(task.wrongWordId);
      return false;
    },

    /* 答错时调用：自动收录 + 错误次数累加 + 打断连续正确 */
    recordWrong(wordId) {
      if (!wordId) return;
      if (!bank[wordId]) {
        bank[wordId] = { errorCount: 1, consecutiveCorrect: 0 };
      } else {
        bank[wordId].errorCount += 1;
        bank[wordId].consecutiveCorrect = 0;
      }
      persist();
    },

    /* 答对时调用：连续答对 2 次自动毕业 → 返回 true 触发"康复欢呼"特效 */
    recordCorrect(wordId) {
      if (!wordId) return false;
      const rec = bank[wordId];
      if (!rec) return false;
      rec.consecutiveCorrect += 1;
      if (rec.consecutiveCorrect >= 2) {
        delete bank[wordId];
        persist();
        return true;
      }
      persist();
      return false;
    },

    /* 判断某个词是否在错题库中 */
    isWrongWord(wordId) {
      return Boolean(bank[wordId]);
    },

    /* 从候选词列表里加权挑一个：65% 概率优先从错题里抽 */
    pickWithBias(candidates, wordIdGetter) {
      if (!candidates || candidates.length === 0) return null;
      const getter = wordIdGetter || ((w) => w);
      const wrong = candidates.filter((w) => bank[getter(w)]);
      const normal = candidates.filter((w) => !bank[getter(w)]);
      const BIAS = 0.65;
      if (wrong.length > 0 && Math.random() < BIAS) {
        return wrong[Math.floor(Math.random() * wrong.length)];
      }
      if (normal.length > 0) {
        return normal[Math.floor(Math.random() * normal.length)];
      }
      return candidates[Math.floor(Math.random() * candidates.length)];
    },

    /* 某场景在错题库里的单词数量 */
    countInScene(sceneId) {
      const prefix = `${sceneId || ""}_`;
      return Object.keys(bank).filter((k) => k.startsWith(prefix)).length;
    },

    /* 列出某场景的所有错题 wordId */
    listInScene(sceneId) {
      const prefix = `${sceneId || ""}_`;
      return Object.keys(bank).filter((k) => k.startsWith(prefix));
    },

    /* 清空（重玩全部关卡前可调用） */
    clear() { bank = {}; persist(); },
  };
})();

  <script>
/* ============================================================
   ChestManager · 神秘宝箱
   - 旅程里程碑：按当前主题星数上限三等分（10 关主题 10/20/30，50 关主题 50/100/150）
   - 领取：随机给一个恐龙形态（state.dex 里还没有的 STAGES key）
   - 存档：state.chests = { total: 已开数, unlocked: 额外待开数, claimed: { 进度键: [里程碑星数] } }
   - 结算与进化见 result.js
   ============================================================ */
(function () {
  "use strict";

  /* 宝箱里程碑：按当前主题星数上限三等分
     10 关主题 → 10 / 20 / 30；50 关主题 → 50 / 100 / 150 */
  function milestonesFor(starMax) {
    const total = Number(starMax) || 30;
    return [1, 2, 3].map((n) => Math.round((total * n) / 3));
  }
  function currentStarMax() {
    return levelsPerTheme() * 3;
  }

  /* 安全获取 state（可能从模块内或 window） */
  function _state() { return window.state || state; }

  /* 确保 chests 字段存在 */
  function ensureChests() {
    const s = _state();
    if (!s.chests || typeof s.chests !== "object") {
      s.chests = { total: 0, unlocked: 0, claimed: {} };
    }
    if (!s.chests.claimed || typeof s.chests.claimed !== "object") s.chests.claimed = {};
  }

  /* 从 STAGES 里挑一个 state.dex 里还没有的（未发现的恐龙） */
  function pickRandomDino() {
    const s = _state();
    const found = new Set(s.dex || []);
    const pool = STAGES.filter((st) => !found.has(st.key));
    if (pool.length === 0) return null; /* 图鉴收齐了 */
    const pick = pool[Math.floor(Math.random() * pool.length)];
    return pick;
  }

  /* 把恐龙收进图鉴 */
  function addDex(dino) {
    const s = _state();
    if (!dino) return;
    if (!s.dex) s.dex = [];
    if (s.dex.indexOf(dino.key) < 0) s.dex.push(dino.key);
  }

  /* 某个进度键下，三个宝箱的状态：done 已领取 / ready 可领取 / locked 未解锁 */
  function milestoneStatus(key, starTotal, starMax) {
    ensureChests();
    const claimed = _state().chests.claimed[key] || [];
    return milestonesFor(starMax || currentStarMax()).map((stars) => {
      const done = claimed.indexOf(stars) >= 0;
      return { stars, done, ready: !done && starTotal >= stars };
    });
  }

  window.ChestManager = {
    /* 旅程进度条上的宝箱节点：由地图页渲染，点击走 chest-claim */
    renderJourneyChests(key, starTotal, starMax) {
      const total = starMax || currentStarMax();
      return milestoneStatus(key, starTotal, total).map((m) => {
        const pct = total ? (m.stars / total) * 100 : 0;
        const cls = m.done ? "done" : m.ready ? "ready" : "locked";
        const tip = m.done ? "已领取" : m.ready ? "点击开启" : `再获得 ${m.stars - starTotal} ★ 解锁`;
        return `<button type="button" class="j-chest ${cls}" style="left:${pct}%"
          data-action="chest-claim" data-threshold="${m.stars}"
          aria-label="${m.stars} 星宝箱，${tip}" title="${m.stars} ★ 宝箱 · ${tip}"
          ${m.ready ? "" : "disabled"}>${m.done ? "✓" : "🎁"}</button>`;
      }).join("");
    },

    /* 领取旅程里程碑宝箱：返回 { status: ok|locked|done, dino, need } */
    claimJourney(threshold) {
      const s = _state();
      ensureChests();
      const starMax = currentStarMax();
      /* 只接受当前主题配置里的三个里程碑，防止无效入口 */
      if (milestonesFor(starMax).indexOf(threshold) < 0) return { status: "done", dino: null, need: 0 };
      const key = activeProgressKey();
      const starTotal = themeStars(themeProgress());
      const claimed = s.chests.claimed[key] || (s.chests.claimed[key] = []);
      if (claimed.indexOf(threshold) >= 0) return { status: "done", dino: null, need: 0 };
      if (starTotal < threshold) return { status: "locked", dino: null, need: threshold - starTotal };

      claimed.push(threshold);
      s.chests.total += 1;
      const dino = pickRandomDino();
      addDex(dino);
      save();
      return { status: "ok", dino, need: 0 };
    },

    /* 手动开一个额外宝箱（BOSS 奖励）：返回抽到的恐龙 STAGES 对象，null 表示没有宝箱了 */
    openOne() {
      const s = _state();
      ensureChests();
      if (s.chests.unlocked <= 0) return null;
      const dino = pickRandomDino();
      addDex(dino);
      s.chests.unlocked -= 1;
      s.chests.total += 1;
      save();
      return dino;
    },

    /* 只读：当前有多少个额外宝箱待开 */
    available() {
      ensureChests();
      return _state().chests.unlocked || 0;
    },

    /* 通关总 BOSS 关（第 50 关）：额外 2 个宝箱 + 首次全通关标记 allCleared */
    rewardBossClear() {
      const s = _state();
      ensureChests();
      s.chests.unlocked += 2;
      /* allCleared 只记首次动物园全通关 */
      if (!s.allCleared) s.allCleared = true;
      save();
      return 2;
    },

    /* 只读：是否首次全通关 */
    isAllCleared() {
      return Boolean(_state().allCleared);
    },
  };
})();

/* ============================================================
   DinoGo · 恐龙英语 — 闯关结算与恐龙进化

(function () {
  'use strict';

  /* ============================================================
     闯关结算
     ============================================================ */
  function finishQuiz() {
    if (!quiz) return;
    /* 普通关 3 题：答对 3/2/1 题 → 3/2/1 星，≥1 星过关

    const correct = Math.min(quiz.correct, total);

    const stars = isBoss
      ? (correct >= 5 ? 3 : correct >= 4 ? 2 : correct >= 3 ? 1 : 0)
      : (correct >= 3 ? 3 : correct >= 2 ? 2 : correct >= 1 ? 1 : 0);
    const passed = isBoss ? correct >= 4 : correct >= 1;
    const growthGain = quiz.correct * 24;

    const completedLevel = quiz.level;
    const prevBest = prog.stars[completedLevel] || 0;

  <script>

const UNKNOWN_ART = (word) => emojiArt(wordGlyph(word));
let artMap = null;
/* 当前主题（或场景）的「单词 → 插图」索引，避免每个选项都线性查找 */
function artOf(word) {
  const theme = currentTheme();
  const key = `${theme.id}:${state.scene || ""}`;
  if (!artMap || artMap.key !== key) {
    artMap = { key, map: new Map(themeWords().map((w) => [w.word, w.art])) };
  }
  return artMap.map.get(word) || (() => UNKNOWN_ART(word));
}

function startQuiz(level) {
  const lvl = Math.min(levelsPerTheme(), Math.max(1, Number(level) || themeProgress().level));
  /* 阶段门槛：每阶段第 5 关需前 4 关累计 8 星 */
  if (window.canEnterLevel && !canEnterLevel(lvl)) {
    toast(`还差 ${STAGE_GATE_STARS - stageStarsBefore(lvl)} 颗星才能进入第 ${lvl} 关`);
    return;
  }
  quiz = {
    level: lvl,
    index: 0,

    choiceCorrect: null,

    pickWord: null,
    pickWordSide: null,

const FX_COLORS = ["#FFC94A", "#FF8A4C", "#5BC178", "#5FBCDA", "#FF6F61", "#B8E05A"];
/* 答对：只撒彩纸，鼓励语与答案统一收进居中的结果卡 */
function correctFx() {
  const confetti = Array.from({ length: 18 }, (_, i) => {
    const left = 5 + Math.round(Math.random() * 90);
    const delay = (Math.random() * 0.45).toFixed(2);
    const dur = (1.05 + Math.random() * 0.6).toFixed(2);
    const size = 6 + Math.round(Math.random() * 6);
    const round = i % 3 === 0 ? "50%" : "0.125rem";
    return `<i style="left:${left}%;width:${sz(size)};height:${sz(size)};background:${FX_COLORS[i % FX_COLORS.length]};border-radius:${round};animation-delay:${delay}s;animation-duration:${dur}s"></i>`;
  }).join("");
  return `<div class="qfx ok-fx" aria-hidden="true">
    <div class="fx-confetti">${confetti}</div>

/* 答完题后统一的手动“下一题”按钮 */
function quizNextButton() {

function screenQuiz() {

  const selected = quiz.selected;

  /* 进度条按「已答完的题数」计算，答完最后一题正好 100% */
  const progress = Math.round(((quiz.index + (revealed ? 1 : 0)) / total) * 100);
  const hearts = [0, 1, 2].map((i) => I.heart(16, "#FF6F61", i < quiz.hearts ? 1 : 0.22)).join("");
  const letters = ["A", "B", "C", "D"];
  const optionClass = (opt, base = "option") => {
    if (revealed) {

  const options = (list) => list.map((opt, i) => {

    if (revealed) {

  const answerPhon = answerWord && answerWord === q.word ? (q.phon || "") : "";
  /* 答后结果卡：参考 temp/correnct.html、woring.html 的森林奶油风结构，从屏幕正中心弹出 */
  const ok = !!quiz.choiceCorrect;
  const statusTitle = ok ? "答对了，你真棒！" : "回答错误，继续努力";

    ? "Result" : "Next";
  const answerBox = answerWord
    ? `<div class="zoo-answer-box">

            <path d="M10 19 H18 L31 10 V38 L18 29 H10 C8.3 29 7 27.7 7 26 V22 C7 20.3 8.3 19 10 19 Z" fill="#d98a3c" stroke="#5c3412" stroke-width="3.5" stroke-linejoin="round"/>
            <ellipse cx="32" cy="24" rx="5.5" ry="13.5" fill="#fce4a6" stroke="#5c3412" stroke-width="3.5"/>
            <ellipse cx="32" cy="24" rx="2.5" ry="7" fill="#7a491d"/>
          </svg>
        </button>
        ${answerPhon ? `<span class="zoo-answer-phon">${answerPhon}，</span>` : ""}
        ${answerZh ? `<span class="zoo-meaning-text">${answerZh}</span>` : ""}
      </div>`
    : "";
  const star = (cls) => `<svg class="zoo-btn-star ${cls}" viewBox="0 0 24 24"><polygon points="12,1 15,9 23,12 15,15 12,23 9,15 1,12 9,9" fill="#ffe066" stroke="#8a5a00" stroke-width="1.5"/></svg>`;
  const actionArea = `<button class="zoo-action-btn" data-action="next">
        ${ok ? star("star-top") : ""}<span>${nextLabel}</span>${ok ? star("star-bottom") : ""}

  const decor = ok
    ? `<svg class="zoo-decor-grass" viewBox="0 0 80 26" fill="none">
        <path d="M4 24 L14 6 L22 20 L34 2 L44 21 L56 7 L66 24 Z" fill="#63b848" stroke="#1e6b3b" stroke-width="3" stroke-linejoin="round"/>

        <path d="M10 12 Q70 25 135 18 Q145 65 138 115" stroke="#2d7a36" stroke-width="6" stroke-linecap="round"/>
        <path d="M55 16 C45 2, 72 0, 74 16 Z" fill="#68be47" stroke="#1e6b3b" stroke-width="2.5"/>
        <path d="M105 22 C110 38, 130 34, 124 18 Z" fill="#54a838" stroke="#1e6b3b" stroke-width="2.5"/>
        <path d="M138 58 C154 52, 156 74, 138 74 Z" fill="#68be47" stroke="#1e6b3b" stroke-width="2.5"/>
        <g transform="translate(126, 22)">

  const resultPop = revealed ? `<div class="zoo-feedback-card ${ok ? "is-correct" : "is-wrong"}" role="status" aria-live="polite">

          <svg viewBox="0 0 32 32" fill="none">${ok
            ? `<path d="M6.5 16.5 L13 23 L25.5 9.5" stroke="#ffffff" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>`

  const fx = revealed && ok ? correctFx() : "";
  const refHead = refType ? `<div class="ref-stage-head">
      <span class="ref-stage-badge">${q.type === "listen" ? I.speaker(24, "#5C411D") : I.leaf(24, "#5C411D")}</span>
      <div><span class="ref-stage-kicker">${isAnimalBossLevel(quiz.level) ? "BOSS · " : ""}LEVEL ${String(quiz.level).padStart(2, "0")} · ${game.label}</span>

  const frameTop = refType && state.scene === "zoo"
    ? `<button class="circle-btn result-close" data-action="close-quiz" aria-label="关闭">${I.close(16)}</button>`
    : `<div class="quiz-top">
      <button class="circle-btn" data-action="close-quiz" aria-label="退出闯关">${I.close(16)}</button>
      <div class="bar qbar"><i style="width:${progress}%"></i></div>
      <div class="qcount num">${quiz.index + 1} <em>/ ${total}</em></div>
      <div class="hearts">${hearts}</div>

  return `<section class="screen quiz-page ${game.pageClass || ""}${refType ? " quiz-ref-page" : ""}" data-screen="quiz" data-theme="${state.theme}" data-scene="${state.scene || ""}" data-type="${q.type}">
    ${fx}
    ${refType ? `<div class="ref-scene-bg">${QuizUiArt.scene()}</div>` : ""}

function speakTask() {
  const q = quiz && quiz.order[quiz.index];
  if (q && currentTheme().games[q.type].autoSpeak) setTimer(() => speak(q.word), 450);
}
function selectOption(word) {
  if (!quiz || quiz.revealed) return;
  quiz.selected = word;
  sfx("tap");
  checkAnswer();
}
/* 听发音按钮：纯喇叭图标 + 圆形底色 */
function listenPill() {
  return `<button class="listen" data-action="listen-selected" aria-label="听发音">${I.speaker(16)}</button>`;
}
/* 听发音：需先点击选项，答题后朗读正确答案 */
function listenSelected() {
  if (!quiz) return;
  const q = quiz.order[quiz.index];
  const word = quiz.revealed ? q.word : quiz.selected || quiz.pickWord;
  if (!word) return;
  speak(word);
}
function callGameAction(action, value) {
  const q = quiz && quiz.order[quiz.index];
  const game = q && currentTheme().games[q.type];
  if (game && game[action]) game[action](value);
}
function matchPickWord(word) { callGameAction("onPickWord", word); }
function matchPickArt(word) { callGameAction("onPickArt", word); }

/* 拼图和喂食的共享动作：点击与拖拽走同一条状态、计分路径 */
function puzzlePlace(letterId, slotId = null) {
  if (!quiz || quiz.revealed) return;
  const q = quiz.order[quiz.index];
  const slot = slotId === null
    ? q.puzzleSlots.find((s) => s.filled === null)
    : q.puzzleSlots.find((s) => s.id === Number(slotId));
  const letter = q.puzzleLetters.find((l) => l.id === letterId);
  if (!slot || slot.filled !== null || !letter || q.puzzleSlots.some((s) => s.filled === letterId)) return;
  slot.filled = letterId;
  sfx("tap");
  render();
}
function feedPick(food, shouldRender = true) {
  if (!quiz || quiz.revealed) return;
  quiz.selected = food;
  sfx("tap");
  if (shouldRender) render();
}
function feedCheck() {
  if (!quiz || quiz.revealed || !quiz.selected) return;
  const q = quiz.order[quiz.index];
  const ok = quiz.selected === q.correctFood;
  quiz.revealed = true; quiz.choiceCorrect = ok;
  if (ok) {
    quiz.correct++; quiz.words.push(q.word); sfx("excellent");
    WrongBank.applyResult(q, true);
  } else {
    quiz.hearts = Math.max(0, quiz.hearts - 1); sfx("wrong");
    WrongBank.applyResult(q, false);
  }
  render();
}

function checkAnswer() {
  if (!quiz || quiz.revealed || !quiz.selected) return;
  const q = quiz.order[quiz.index];
  const ok = quiz.selected === q.word;
  quiz.revealed = true;
  quiz.choiceCorrect = ok;
  if (ok) {
    quiz.correct++;
    quiz.words.push(q.word);
    sfx("excellent");
    /* 🦁 动物园场景：答对 → 尝试清除错题库 */
    WrongBank.applyResult(q, true);
  } else {
    quiz.hearts = Math.max(0, quiz.hearts - 1);
    sfx("wrong");
    /* 🦁 动物园场景：答错 → 自动收录错题库 */
    WrongBank.applyResult(q, false);
  }
  render();
}
function nextQuestion() {
  if (!quiz) return;
  clearTimers();
  const atEnd = quiz.index >= quiz.order.length - 1;
  if (atEnd || quiz.hearts <= 0) { finishQuiz(); return; }
  quiz.index++;
  quiz.selected = null;
  quiz.revealed = false;
  quiz.choiceCorrect = null;
  quiz.matched = [];
  quiz.pickWord = null;
  quiz.pickWordSide = null;
  quiz.matchWrong = 0;
  render();
  speakTask();
}
