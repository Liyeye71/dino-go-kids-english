<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#FBF3E3">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DinoGo">
  <meta name="format-detection" content="telephone=no">
  <title>DinoGo · 恐龙英语</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="images/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="images/icons/icon-192.png">
  <!-- 样式按模块拆分，顺序与 build.mjs 的 CSS_FILES 保持一致 -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="css/dex.css">
  <link rel="stylesheet" href="css/shop.css">
  <link rel="stylesheet" href="css/overlays.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app" id="app">
    <main class="view" id="view"></main>
    <div id="overlay-root"></div>
    <div class="toast-root" id="toast-root"></div>
  </div>
  <!-- 主题词汇：每个主题一个文件，新增主题在此登记（build.mjs 的 JS_FILES 也要同步） -->
  <!-- 词性词汇池（原子词，带 attrs 分类标签） -->
  <script src="data/words/noun.js"></script>
  <script src="data/words/verb.js"></script>
  <script src="data/words/adj.js"></script>
  <script src="data/words/adv.js"></script>
  <script src="data/words/pron.js"></script>
  <script src="data/words/prep.js"></script>
  <script src="data/words/conj.js"></script>
  <script src="data/words/interj.js"></script>
  <script src="data/words/num.js"></script>
  <!-- 主题关卡筛选器（按 attrs 从词汇池匹配单词，保留关卡进度身份） -->
  <script src="data/level/beginner/fruits.js"></script>
  <script src="data/level/beginner/cars.js"></script>
  <script src="data/level/beginner/zoo.js"></script>
  <script src="data/level/beginner/food.js"></script>
  <!-- 声音：音效 / 语音 / 关卡提示音 + 主题背景音乐 -->
  <script src="data/sounds/sfx.js"></script>
  <script src="data/sounds/bgm.js"></script>
  <!-- 公共：工具 / 视觉 / 配置 / 词汇 / 状态 / 界面 / 事件 / 启动；四个 Tab 各自一个文件 -->
  <script src="frame/core/utils.js"></script>
  <script src="frame/core/visual.js"></script>
  <script src="frame/core/data.js"></script>
  <script src="frame/core/words.js"></script>
  <script src="frame/core/state.js"></script>
  <script src="frame/core/ui.js"></script>
  <script src="frame/core/events.js"></script>
  <script src="frame/core/boot.js"></script>
  <script src="frame/home.js"></script>
  <script src="frame/map.js"></script>
  <script src="frame/dex.js"></script>
  <script src="frame/shop.js"></script>
  <script>boot();</script>
</body>
</html>
