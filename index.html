<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#FBF3E3">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DinoGo">
  <meta name="format-detection" content="telephone=no">
  <title>DinoGo · 恐龙英语</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="images/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="images/icons/icon-192.png">
  <!-- 样式按模块拆分，顺序与 build.mjs 的 CSS_FILES 保持一致 -->
  <style>
/* ============================================================
   DinoGo · 恐龙英语 — interactive iOS / iPad app
   ============================================================ */

:root{
  --ink:#1D3A2E;
  --ink-2:#4F665A;
  --muted:#87988D;
  --cream:#FBF3E3;
  --paper:#FFFFFF;
  --line:#EDDFC7;
  --green:#2E8B57;
  --green-d:#1E6B47;
  --green-dd:#17553A;
  --green-l:#E9F7D9;
  --lime:#B8E05A;
  --yellow:#FFC94A;
  --orange:#FF8A4C;
  --coral:#FF6F61;
  --sky:#9FDCF2;
  --purple:#9D8CFF;
  --shadow:0 10px 24px rgba(94,70,30,.08);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0;overscroll-behavior:none}
body{
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink);background:#EFE5D2;
  -webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,textarea{font:inherit}
svg{display:block}
h1,h2,h3,h4,p{margin:0}
.num{font-variant-numeric:tabular-nums}

/* ------------------------------------------------ app shell */
.app{
  position:relative;width:100%;max-width:820px;height:100vh;height:100dvh;
  margin:0 auto;background:var(--cream);overflow:hidden;isolation:isolate;
}
.view{position:absolute;inset:0}
.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;
  background:var(--cream);overflow:hidden;
  animation:screenIn .3s cubic-bezier(.22,.9,.3,1) both;
}
.scroll{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
  padding:calc(14px + var(--safe-top)) 20px calc(30px + var(--safe-bottom));
}
.scroll::-webkit-scrollbar{display:none}
.has-tab .scroll{padding-bottom:calc(104px + var(--safe-bottom))}

@media (min-width:700px) and (min-height:600px){
  body{
    background:
      radial-gradient(1200px 800px at 10% -10%,#E4F1D2 0%,rgba(228,241,210,0) 60%),
      radial-gradient(900px 700px at 110% 110%,#F8E3BE 0%,rgba(248,227,190,0) 60%),
      #EFE5D2;
    display:flex;align-items:center;justify-content:center;
  }
  .app{
    height:calc(100dvh - 48px);max-height:1120px;
    border-radius:36px;border:1px solid rgba(255,255,255,.65);
    box-shadow:0 40px 90px rgba(45,60,35,.22),0 2px 0 rgba(255,255,255,.8) inset;
  }
  .scroll{padding:calc(26px + var(--safe-top)) 32px calc(34px + var(--safe-bottom))}
  .has-tab .scroll{padding-bottom:calc(112px + var(--safe-bottom))}
}

@media (min-width:1000px){
  .app{max-width:880px}
}

/* ------------------------------------------------ status / tabbar */
.tabbar{
  position:absolute;left:0;right:0;bottom:0;z-index:40;
  height:calc(74px + var(--safe-bottom));
  padding:8px 12px calc(8px + var(--safe-bottom));
  display:flex;align-items:stretch;
  background:rgba(255,251,243,.95);
  border-top:1.5px solid #EFE2CB;
  box-shadow:0 -10px 24px rgba(94,70,30,.05);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
}
.tabbar .tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:11.5px;font-weight:700;color:#97A69B;letter-spacing:.3px;border-radius:14px;
}
.tabbar .tab .ic{width:40px;height:30px;border-radius:12px;display:grid;place-items:center;transition:background .18s ease}
.tabbar .tab.on{color:var(--green-d)}
.tabbar .tab.on .ic{background:#E4F6D5}
.tabbar .tab:active .ic{transform:scale(.94)}

/* ------------------------------------------------ shared atoms */
.eyebrow{font-size:10.5px;font-weight:800;letter-spacing:1.7px;color:var(--muted);text-transform:uppercase}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;
  padding:0 18px;border-radius:18px;
  background:linear-gradient(180deg,#3AA56B 0%,#28814F 100%);color:#fff;
  font-size:17.5px;font-weight:800;letter-spacing:.4px;
  box-shadow:0 5px 0 #1B6140,0 14px 24px rgba(32,110,70,.24);
  transition:transform .12s ease,box-shadow .12s ease;
}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1B6140,0 6px 14px rgba(32,110,70,.22)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn .hint{font-size:12px;font-weight:700;opacity:.85;background:rgba(255,255,255,.18);padding:3px 8px;border-radius:99px}
.btn.yellow{background:linear-gradient(180deg,#FFD766,#F5B62F);color:#4C3306;box-shadow:0 5px 0 #D6971C,0 14px 24px rgba(214,151,28,.3)}
.btn.ghost{background:#fff;color:var(--green-d);border:2px solid #DDEBD2;box-shadow:0 4px 0 #E3EDD6}
.btn.small{min-height:44px;font-size:14px;border-radius:14px;box-shadow:0 4px 0 #1B6140}
.btn.small:active{box-shadow:0 1px 0 #1B6140}

.bar{height:12px;border-radius:99px;background:#EEE2CD;box-shadow:inset 0 2px 4px rgba(93,68,25,.08);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#A9D84B,#3AA56B);position:relative;transition:width .6s cubic-bezier(.22,.9,.3,1)}
.bar>i::after{content:"";position:absolute;left:5px;right:7px;top:2px;height:3px;border-radius:9px;background:rgba(255,255,255,.55)}
.bar.gold>i{background:linear-gradient(90deg,#FFD86B,#FFB13D)}

.star-pill{display:flex;align-items:center;gap:5px;height:34px;padding:0 11px 0 8px;border-radius:99px;
  background:#fff;border:1.5px solid #EFE1C8;box-shadow:0 4px 10px rgba(94,70,30,.07);
  font-size:14px;font-weight:900;letter-spacing:.2px;white-space:nowrap;flex:none}
.circle-btn{width:38px;height:38px;border-radius:13px;background:#fff;border:1.5px solid var(--line);
  display:grid;place-items:center;flex:none;box-shadow:0 4px 10px rgba(94,70,30,.06);color:var(--ink)}
.circle-btn:active{transform:scale(.94)}

.avatar{width:46px;height:46px;border-radius:16px;background:#FFF6E2;border:2px solid #fff;
  box-shadow:0 5px 12px rgba(70,50,20,.14);overflow:hidden;position:relative;flex:none}
.avatar .crop{position:absolute;width:96px;height:96px;left:-39px;top:-7px}

/* ------------------------------------------------ animations */
@keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(6px)}}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-5px)}}
@keyframes evoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes starPop{0%{opacity:0;transform:scale(.4) rotate(-20deg)}70%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes heartOut{0%{transform:scale(1)}40%{transform:scale(1.35);opacity:1}100%{transform:scale(.6);opacity:.25}}
@keyframes confettiFall{0%{opacity:0;transform:translateY(-30px) rotate(0)}12%{opacity:.9}100%{opacity:.75;transform:translateY(160px) rotate(240deg)}}
@keyframes glowPulse{0%,100%{opacity:.6}50%{opacity:1}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}

/* ============================================================
   DinoGo · 恐龙英语 — home：乐园首页 + 随机记单词 + 成长档案
   ============================================================ */

/* ------------------------------------------------ home */
.home-top{display:flex;align-items:center;gap:11px;margin-top:2px;margin-bottom:14px}
.home-top .greet{flex:1;min-width:0}
.home-top .hi{font-size:18px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home-top .hi b{color:var(--green)}
.home-top .meta{display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--muted);margin-top:3px;white-space:nowrap}
.home-top .meta .flame{color:var(--orange)}

.hero{
  position:relative;height:clamp(332px,40vh,420px);border-radius:30px;overflow:hidden;
  border:1.5px solid #D9E8C2;
  background:linear-gradient(168deg,#DDF2CE 0%,#EFF8D6 48%,#FDF2D9 100%);
  transition:background .6s ease,border-color .6s ease;
}
.hero .scene{position:absolute;inset:0;transition:opacity .4s ease}
.hero .sun{position:absolute;right:34px;top:24px;width:62px;height:62px;border-radius:50%;
  background:radial-gradient(circle at 38% 34%,#FFF3B8,#FFD25E);
  box-shadow:0 0 0 12px rgba(255,218,112,.16);transition:all .5s ease}
.hero .moon{position:absolute;right:38px;top:28px;width:56px;height:56px;border-radius:50%;
  background:radial-gradient(circle at 38% 34%,#FFFCE8,#FFE9A8);box-shadow:0 0 26px rgba(255,236,170,.5)}
.hero .moon::after{content:"";position:absolute;left:-12px;top:4px;width:44px;height:44px;border-radius:50%;
  background:#1C4638;box-shadow:0 0 0 1px rgba(255,255,255,.02)}
.hero .stars i{position:absolute;background:#FFF6D8;border-radius:50%}
.hero .cloud{position:absolute;background:#fff;border-radius:99px;opacity:.62}
.hero .cloud.a{width:58px;height:18px;right:92px;top:32px}
.hero .cloud.b{width:40px;height:14px;right:118px;top:45px}
.hero .hill{position:absolute;left:-10%;right:-10%;border-radius:50% 50% 0 0;transition:background .6s ease}
.hero .hill.a{height:110px;bottom:-44px;background:#CDE9AC}
.hero .hill.b{height:86px;bottom:-40px;background:#B9DF92;left:34%;right:-24%}
.hero .leaves{position:absolute;pointer-events:none;opacity:.9}
.hero .leaves.l{left:-8px;bottom:66px;width:96px}
.hero .leaves.r{right:-12px;top:96px;width:86px;opacity:.75;transform:rotate(18deg)}
.hero .dino-wrap{
  position:absolute;left:calc(50% - 40px);bottom:82px;
  width:clamp(218px,28vh,300px);height:clamp(218px,28vh,300px);
  transform:translateX(-50%);
  filter:drop-shadow(0 14px 18px rgba(48,104,64,.18));
  animation:bob 4.2s ease-in-out infinite;
}
.hero .dino-wrap.ultra{filter:drop-shadow(0 0 26px rgba(255,210,90,.55)) drop-shadow(0 14px 18px rgba(48,104,64,.2))}
.hero .dino-wrap.with-hat{bottom:66px}
.hero .hero-id{position:absolute;left:14px;top:14px;z-index:4;display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.hero .stage-tag{position:static;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;
  border-radius:99px;background:rgba(255,255,255,.86);border:1.5px solid rgba(255,255,255,.92);
  font-size:11.5px;font-weight:800;color:var(--green-d);letter-spacing:.3px;backdrop-filter:blur(4px);
  box-shadow:0 3px 8px rgba(80,60,20,.08)}
.hero .name{position:static;display:flex;align-items:center;gap:6px}
.hero .name b{display:block;font-size:29px;font-weight:900;letter-spacing:-.5px;line-height:1.1;
  text-shadow:0 1px 0 rgba(255,255,255,.45)}
.hero .bubble{position:absolute;right:12px;top:138px;width:112px;padding:8px 10px;
  border-radius:12px 12px 12px 3px;background:#fff;font-size:10.5px;line-height:1.55;
  font-weight:700;color:#57705B;box-shadow:0 5px 12px rgba(70,50,20,.1)}
.hero .bubble b{color:var(--green);font-size:12px}
.hero .bubble.max b{color:var(--orange)}

.growth-panel{
  position:absolute;left:12px;right:12px;bottom:12px;min-height:92px;border-radius:22px;
  background:rgba(255,255,255,.94);border:1.5px solid rgba(255,255,255,.9);
  box-shadow:0 8px 18px rgba(74,97,50,.12);backdrop-filter:blur(6px);
  display:flex;align-items:center;gap:12px;padding:12px 12px 12px 15px;
}
.growth-panel .g-main{flex:1;min-width:0}
.growth-panel .g-row{display:flex;align-items:baseline;gap:6px}
.growth-panel .lb{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.4px}
.growth-panel .val{font-size:16px;font-weight:900;color:var(--green-d)}
.growth-panel .val em{font-style:normal;font-size:11px;color:var(--muted);font-weight:700}
.growth-panel .g-next{font-size:10.5px;font-weight:600;color:#8A9B8D;margin-top:5px;display:flex;justify-content:space-between}
.growth-panel .g-next b{color:var(--orange)}
.growth-panel .g-bar{height:9px;margin-top:5px}
.go-btn{width:48px;height:48px;border-radius:16px;flex:none;display:grid;place-items:center;color:#fff;
  background:linear-gradient(180deg,#3AA56B,#26804E);box-shadow:0 4px 0 #1A5E3D,0 8px 14px rgba(31,107,74,.28)}
.go-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #1A5E3D}
.go-btn.evolve{background:linear-gradient(180deg,#FFCF5C,#F0A92E);box-shadow:0 4px 0 #C98A1C,0 8px 14px rgba(201,138,28,.3);color:#4A3206}

.tasks{padding:13px 15px 12px;display:flex;flex-direction:column;gap:8px;margin-top:12px}
.tasks .head{display:flex;align-items:center;gap:8px}
.tasks .head h3{font-size:15.5px;font-weight:900}
.tasks .head .count{font-size:10.5px;font-weight:900;color:var(--green-d);background:var(--green-l);padding:2px 7px;border-radius:99px}
.tasks .head .more{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:2px}
.task{display:flex;align-items:center;gap:9px;height:32px}
.task .ico{width:29px;height:29px;border-radius:10px;display:grid;place-items:center;flex:none}
.task .ico.orange{background:#FFF0D2;color:#E69523}
.task .ico.blue{background:#E6F4FF;color:#3D8FC4}
.task .ico.coral{background:#FFE7DE;color:#E96A4B}
.task .t-body{flex:1;min-width:0}
.task .t-title{font-size:12.5px;font-weight:700;line-height:1.2}
.task .t-sub{font-size:9.5px;font-weight:600;color:#A0AFA3;margin-top:2px}
.task .t-sub b{color:var(--orange)}
.task .reward{font-size:10px;font-weight:900;color:#A98425;background:#FFF4CE;border-radius:99px;padding:3px 7px;white-space:nowrap}
.task .check{width:20px;height:20px;border-radius:50%;border:2px solid #E3D6BF;flex:none;display:grid;place-items:center;color:#fff}
.task.done .check{background:var(--green);border-color:var(--green)}
.task.done .t-title{color:#809184;text-decoration:line-through;text-decoration-thickness:1.5px}

.word-card{min-height:104px;margin-top:12px;border-radius:24px;padding:14px 15px;display:flex;align-items:center;gap:12px;
  background:linear-gradient(120deg,#FFF4CF 0%,#FFE9B8 100%);border:1.5px solid #F3DFA6;
  box-shadow:0 10px 22px rgba(196,146,41,.12);position:relative;overflow:hidden;width:100%;text-align:left}
.word-card .ring{position:absolute;right:-26px;top:-30px;width:110px;height:110px;border-radius:50%;border:14px solid rgba(255,255,255,.35)}
.word-card .spk{width:44px;height:44px;border-radius:15px;background:#fff;display:grid;place-items:center;color:#B4811C;
  box-shadow:0 4px 10px rgba(180,129,28,.18);flex:none;position:relative}
.word-card .w-main{flex:1;position:relative;min-width:0}
.word-card .w-kicker{font-size:9px;font-weight:900;letter-spacing:1.4px;color:#B58A2E}
.word-card .w-word{font-size:23px;font-weight:900;letter-spacing:-.3px;line-height:1.15;color:#4A360F}
.word-card .w-phon{font-size:11px;font-weight:600;color:#A68A4E;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.word-card .w-btn{position:relative;height:32px;padding:0 11px;border-radius:99px;background:#fff;color:#8A6415;
  font-size:11px;font-weight:800;display:flex;align-items:center;gap:4px;box-shadow:0 3px 8px rgba(180,129,28,.15);flex:none}
.word-card:active{transform:scale(.99)}

.home-note{margin:12px 4px 0;font-size:10px;font-weight:600;color:#AC9C80;text-align:center;line-height:1.6}

/* hero background themes · 白天沿用已购背景，夜晚统一夜空 */
.hero.sky-day.bg-sunset{background:linear-gradient(170deg,#FFD9A8 0%,#FFC7A0 44%,#FFE4C0 100%);border-color:#F1CBA4}
.hero.sky-day.bg-sunset .sun{right:50px;top:70px;background:radial-gradient(circle at 38% 34%,#FFF3C4,#FF9E5C);
  box-shadow:0 0 0 16px rgba(255,158,92,.16),0 0 60px rgba(255,158,92,.4)}
.hero.sky-day.bg-sunset .hill.a{background:#E7B68C}
.hero.sky-day.bg-sunset .hill.b{background:#D49A76}
.hero.sky-night{background:linear-gradient(170deg,#183F38 0%,#1E4E40 45%,#2A5A46 100%);border-color:#2D5C4A}
.hero.sky-night .hill.a{background:#245845}
.hero.sky-night .hill.b{background:#1C4938}
.hero.sky-night .name b{color:#FFF6DE}
.hero.sky-night .bubble{background:rgba(255,255,255,.94);color:#57705B}
.hero.sky-night .stage-tag{background:rgba(255,255,255,.9)}
.hero.sky-night .leaves{opacity:.42;filter:brightness(.75)}

/* ------------------------------------------------ profile */
.profile-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.profile-head .t{flex:1;min-width:0}
.profile-head h1{font-size:clamp(22px,3.6vw,28px);font-weight:900;letter-spacing:-.5px}
.profile-head p{font-size:10.5px;font-weight:600;color:var(--muted);margin-top:2px}
.profile-card{border-radius:26px;padding:15px;display:flex;align-items:center;gap:12px;position:relative;overflow:hidden;
  background:linear-gradient(125deg,#FFF7E4,#F7EEDB);border:1.5px solid #EBDCC0}
.profile-card .pc-ava{width:62px;height:62px;border-radius:20px;background:#E6F5D3;border:2.5px solid #fff;overflow:hidden;
  position:relative;flex:none;box-shadow:0 6px 14px rgba(70,50,20,.12);z-index:1}
.profile-card .pc-ava .crop{position:absolute;width:110px;height:110px;left:-45px;top:-4px}
.profile-card .pc-main{flex:1;min-width:0;position:relative;z-index:1}
.profile-card .pc-main b{font-size:19px;font-weight:900;letter-spacing:-.2px}
.profile-card .pc-main .lv{font-size:9px;font-weight:900;color:#fff;background:var(--green);padding:2px 6px;border-radius:5px;margin-left:5px;vertical-align:2px}
.profile-card .pc-main p{font-size:10.5px;font-weight:600;color:#8D7E62;margin-top:4px}
.profile-card .pc-stage{text-align:right;flex:none;position:relative;z-index:1}
.profile-card .pc-stage .chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:99px;
  background:#fff;font-size:9.5px;font-weight:800;color:var(--green-d);border:1px solid #DDEBD0;white-space:nowrap}
.profile-card .pc-stage p{font-size:8.5px;color:#A3927A;margin-top:5px;white-space:nowrap}
.profile-card .leaf{position:absolute;right:-16px;bottom:-22px;width:96px;opacity:.2;z-index:0}

.stat-row{display:flex;gap:9px;margin-top:12px}
.stat-card{flex:1;min-height:68px;border-radius:18px;background:#fff;border:1.5px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 5px 12px rgba(94,70,30,.05)}
.stat-card .v{font-size:18px;font-weight:900;display:flex;align-items:center;gap:3px}
.stat-card .k{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:.4px}

.chart-card{border-radius:24px;padding:14px 16px 12px;margin-top:12px;height:216px;display:flex;flex-direction:column}
@media (min-width:700px) and (min-height:600px){.chart-card{height:238px}}
.chart-card .ch-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.chart-card .ch-head .lb{font-size:10px;font-weight:800;letter-spacing:.8px;color:var(--muted)}
.chart-card .ch-head .v{font-size:23px;font-weight:900;color:var(--green-d);margin-top:1px}
.chart-card .ch-head .v small{font-size:10px;font-weight:700;color:var(--muted)}
.chart-card .ch-head .goal{font-size:9px;font-weight:800;color:#8A6415;background:#FFF4CE;padding:3px 7px;border-radius:99px;white-space:nowrap}
.chart{flex:1;display:flex;align-items:flex-end;gap:9px;margin-top:8px;position:relative;padding-top:10px;min-height:110px}
.chart .gl{position:absolute;left:0;right:0;bottom:22px;border-top:1.5px dashed #E6D9C1}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end;position:relative;z-index:2}
.chart .col .b{width:22px;border-radius:7px;background:#DCEBCB;position:relative}
.chart .col .b::after{content:"";position:absolute;left:4px;right:4px;top:3px;height:3px;border-radius:9px;background:rgba(255,255,255,.6)}
.chart .col.today .b{background:linear-gradient(180deg,#FFD25A,#F2A93B);box-shadow:0 4px 8px rgba(242,169,59,.3)}
.chart .col .d{font-size:9px;font-weight:700;color:#A6B2A4}
.chart .col.today .d{color:#8A6415;font-weight:900}
.chart .col .tip{position:absolute;top:-14px;font-size:8.5px;font-weight:900;color:#8A6415;background:#FFF4CE;padding:2px 5px;border-radius:5px;white-space:nowrap}

.ach-card{border-radius:24px;padding:14px 16px 16px;margin-top:12px}
.ach-card .ach-head{display:flex;align-items:center;justify-content:space-between}
.ach-card .ach-head b{font-size:14px;font-weight:900}
.ach-card .ach-head span{font-size:9.5px;font-weight:700;color:var(--muted)}
.ach-list{display:flex;gap:10px;margin-top:12px}
.ach{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.ach .medal{width:clamp(44px,9vw,54px);height:clamp(44px,9vw,54px);border-radius:50%;display:grid;place-items:center;position:relative}
.ach .medal.a1{background:linear-gradient(160deg,#FFE39B,#F5B641);color:#7A4E08;box-shadow:0 5px 12px rgba(245,182,65,.3)}
.ach .medal.a2{background:linear-gradient(160deg,#CFE9FF,#8EC7F2);color:#265A80;box-shadow:0 5px 12px rgba(142,199,242,.3)}
.ach .medal.a3{background:linear-gradient(160deg,#E2D6FF,#AE96F5);color:#4B3585;box-shadow:0 5px 12px rgba(174,150,245,.3)}
.ach .medal.lock{background:#F2ECDF;color:#C0B7A4;border:1.5px dashed #D9CFBB}
.ach .medal .dot{position:absolute;right:0;bottom:2px;width:14px;height:14px;border-radius:50%;background:var(--green);border:2px solid #fff;display:grid;place-items:center;color:#fff}
.ach b{font-size:9px;font-weight:800;color:#5E7263;text-align:center}
.ach span{font-size:8px;font-weight:600;color:#AAB4A8;margin-top:-2px}

.quote-card{min-height:64px;border-radius:20px;margin-top:12px;background:linear-gradient(120deg,#EAF7D9,#F7FBE9);border:1.5px solid #D8E9C4;
  display:flex;align-items:center;gap:10px;padding:10px 14px}
.quote-card .q{font-size:10px;font-weight:700;color:#6D8464;line-height:1.5}
.quote-card .q b{color:var(--green-d)}
.quote-card .qi{width:32px;height:32px;border-radius:11px;background:#fff;display:grid;place-items:center;color:#E2A62E;flex:none}
.profile-cta{margin-top:12px}
.profile-scroll{display:flex;flex-direction:column}
.profile-scroll .quote-card{margin-top:auto}

/* ============================================================
   DinoGo · 恐龙英语 — map：本单元进度 / 下一关 / 关卡地图 / 答题 / 结算 / 进化
   ============================================================ */

/* ------------------------------------------------ map */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.topbar .t{flex:1;min-width:0}
.topbar h1{font-size:23px;font-weight:900;letter-spacing:-.3px;line-height:1.15}
.topbar p{font-size:11px;font-weight:600;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* theme tabs：主题切换 */
.theme-tabs{display:flex;gap:7px;margin:-4px 0 12px;overflow-x:auto;scrollbar-width:none}
.theme-tabs::-webkit-scrollbar{display:none}
.theme-tabs .tt{flex:none;display:flex;align-items:center;gap:5px;padding:7px 12px;border-radius:99px;white-space:nowrap;
  background:#fff;border:1.5px solid #EADFC9;font-size:12px;font-weight:800;color:#8B7B5C;transition:transform .12s ease}
.theme-tabs .tt:active{transform:scale(.96)}
.theme-tabs .tt b{font-size:14px;font-weight:400;line-height:1}
.theme-tabs .tt.on{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 6px 12px rgba(46,139,87,.22)}
/* unit card：本单元进度 */
.unit-card{margin-top:0;padding:14px 15px 13px;border-radius:22px}
.uc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.uc-lb{font-size:8.5px;font-weight:900;letter-spacing:1.3px;color:var(--muted)}
.uc-lb b{display:block;font-size:14px;font-weight:900;letter-spacing:-.2px;color:var(--ink);margin-top:2px}
.uc-star{flex:none;display:flex;align-items:center;gap:3px;background:#FFF4CE;padding:5px 9px;border-radius:12px;
  font-size:13.5px;font-weight:900;color:#8A6415;white-space:nowrap}
.uc-star i{font-style:normal;font-size:9px;font-weight:800;color:#B79A5A;margin-left:1px}
.uc-bar{position:relative;height:9px;border-radius:99px;background:#EDEADA;margin-top:9px;overflow:hidden}
.uc-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;
  background:linear-gradient(90deg,#9ADB6F,#3AA56B);box-shadow:inset 0 1px 0 rgba(255,255,255,.55)}
.uc-row{display:flex;align-items:baseline;justify-content:space-between;margin-top:6px;
  font-size:10px;font-weight:700;color:var(--muted)}
.uc-row b{font-size:12.5px;font-weight:900;color:var(--green-d);margin-right:1px}
/* next card：下一关入口，独立卡片 */
.next-card{margin-top:12px;padding:13px 14px;border-radius:20px;display:flex;align-items:center;gap:10px;
  background:linear-gradient(135deg,#F6FBEC,#FFFDF4);border-color:#E3EFD2}
.uc-nl{flex:1;min-width:0}
.uc-kicker{display:flex;align-items:center;gap:5px;font-size:8.5px;font-weight:900;letter-spacing:1.2px;color:var(--orange)}
.uc-nl h3{font-size:16.5px;font-weight:900;letter-spacing:-.3px;color:var(--ink);margin-top:3px}
.uc-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:3px;
  font-size:10px;font-weight:600;color:var(--muted)}
.uc-st{display:flex;gap:1px}
.uc-btn{flex:none;min-height:44px;padding:0 14px;border-radius:14px;color:#fff;font-size:13px;font-weight:900;
  display:flex;align-items:center;justify-content:center;gap:3px;white-space:nowrap;
  background:linear-gradient(180deg,#3AA56B,#28814F);box-shadow:0 4px 0 #1B6140,0 8px 14px rgba(32,110,70,.2)}
.uc-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #1B6140}

.map-canvas{position:relative;height:clamp(390px,48vh,570px);margin-top:12px;border-radius:28px;overflow:hidden;
  background:linear-gradient(180deg,#E9F6D6 0%,#F3F7DA 60%,#FBF2D8 100%);
  border:1.5px solid #DCE9C6}
.map-canvas .deco{position:absolute;pointer-events:none;z-index:1}
.map-canvas .route{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.mnode{position:absolute;width:54px;height:54px;transform:translate(-50%,-50%);z-index:2;transition:transform .2s ease}
.mnode:active{transform:translate(-50%,-50%) scale(.94)}
.mnode[data-action]{cursor:pointer}
.mnode .disc{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;
  background:#fff;border:3px solid #fff;box-shadow:0 6px 12px rgba(79,110,58,.18);color:#fff}
.mnode.done .disc{background:linear-gradient(180deg,#5CB87A,#2F9159)}
.mnode.done.half .disc{background:linear-gradient(180deg,#9DC98B,#6EAE6B)}
.mnode.locked .disc{background:#F1EADB;color:#B7B09C;box-shadow:0 4px 8px rgba(79,110,58,.1)}
.mnode.now{width:78px;height:78px}
.mnode.now .ring{position:absolute;inset:-9px;border-radius:50%;border:2px dashed rgba(46,139,87,.4);animation:spin 18s linear infinite}
.mnode.now .disc{width:78px;height:78px;background:linear-gradient(180deg,#EAF9D2,#D6F0B4);border:4px solid #fff;
  box-shadow:0 8px 18px rgba(31,107,74,.26),0 0 0 4px rgba(46,139,87,.18);overflow:hidden}
.mnode.now .disc .dino{position:absolute;width:82px;height:82px;left:-2px;bottom:-12px}
.mnode.now .go{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);height:21px;padding:0 9px;
  border-radius:99px;background:var(--orange);color:#fff;font-size:10px;font-weight:900;letter-spacing:1px;
  display:flex;align-items:center;box-shadow:0 3px 6px rgba(220,94,38,.3);border:2px solid #fff}
.mnode .mlabel{position:absolute;left:50%;transform:translateX(-50%);bottom:-16px;font-size:10px;font-weight:900;
  color:#7D907F;letter-spacing:.5px;white-space:nowrap}
.mnode.now .mlabel{bottom:-31px}
.mnode.done .mlabel{color:var(--green-d)}
.mnode.chest .disc{background:linear-gradient(180deg,#FFDD85,#F3B43F);color:#7A4E08}
.mnode.chest .mlabel{color:#A9771A}
.mnode .mstars{position:absolute;top:-11px;left:50%;transform:translateX(-50%);display:flex;gap:1px;
  background:#fff;padding:2px 5px;border-radius:99px;box-shadow:0 3px 6px rgba(79,110,58,.14);white-space:nowrap}
.mnode .mstars span{font-size:9px;font-weight:900;color:#8A6415}

/* ------------------------------------------------ quiz */
.quiz-page{display:flex;flex-direction:column;height:100%;padding-top:calc(8px + var(--safe-top))}
.quiz-top{display:flex;align-items:center;gap:10px;padding:6px 20px 0;flex:none}
.quiz-top .qbar{flex:1;height:12px}
.quiz-top .qcount{font-size:12px;font-weight:900;color:var(--green-d);white-space:nowrap}
.quiz-top .qcount em{font-style:normal;color:#A5B2A7;font-weight:700}
.hearts{display:flex;align-items:center;gap:3px;flex:none}
.heart-pop{animation:heartOut .4s ease forwards}
.quiz-body{flex:1;min-height:0;overflow:hidden;padding:8px 20px 2px;display:flex;flex-direction:column;scrollbar-width:none}
.quiz-body::-webkit-scrollbar{display:none}
.quiz-prompt{display:flex;flex-direction:column;gap:7px;margin-top:4px;flex:none}
.quiz-prompt .chip{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:7px;
  background:#E8F5D8;color:var(--green-d);font-size:9.5px;font-weight:900;letter-spacing:1px}
.quiz-prompt h2{font-size:clamp(19px,3.2vw,23px);font-weight:900;letter-spacing:-.4px}
.quiz-art{
  flex:1;min-height:0;max-height:470px;margin-top:12px;border-radius:28px;position:relative;overflow:hidden;
  background:radial-gradient(circle at 50% 42%,#FFFDF2 0%,#FFF3D6 55%,#FBE8BE 100%);
  border:1.5px solid #F2DFB2;display:grid;place-items:center
}
.quiz-art::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(190,150,60,.16) 1px,transparent 1px);background-size:22px 22px}
.quiz-art .blob{position:absolute;width:58%;max-width:250px;aspect-ratio:1;border-radius:48% 52% 55% 45%/50% 46% 54% 50%;
  background:#FFE6A9;opacity:.55}
.quiz-art .fruit{position:relative;width:100%;height:100%;max-width:100%;max-height:100%;padding:5% 4%;
  filter:drop-shadow(0 16px 18px rgba(160,98,24,.2));animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
.quiz-art .art-tag{position:absolute;left:14px;top:14px;font-size:9.5px;font-weight:900;letter-spacing:1.3px;color:#C49A3E}
.quiz-art .art-spark{position:absolute;color:#E8C377;opacity:.8}
.quiz-art .s1{left:34px;top:76px}
.quiz-art .s2{right:38px;top:112px}
.quiz-art .s3{left:52px;bottom:88px}
.quiz-art .listen{position:absolute;right:14px;bottom:14px;height:34px;padding:0 12px;border-radius:99px;background:#fff;
  display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;color:#9B7620;
  box-shadow:0 5px 12px rgba(155,118,32,.16)}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:none;margin-top:14px}
.option{min-height:70px;border-radius:18px;background:#fff;border:2px solid #EFE2CB;display:flex;align-items:center;gap:9px;
  padding:0 12px;box-shadow:0 4px 10px rgba(94,70,30,.05);position:relative;text-align:left;transition:all .15s ease}
.option .key{width:26px;height:26px;border-radius:9px;background:#F3EFE4;display:grid;place-items:center;
  font-size:12px;font-weight:900;color:#A6987B;flex:none;transition:all .15s ease}
.option .word{font-size:18px;font-weight:800;letter-spacing:-.1px;line-height:1.2}
.option .mark{margin-left:auto;width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}
.option .mark.radio{background:#fff;border:2px solid #3AA56B}
.option .mark.radio i{display:block;width:10px;height:10px;border-radius:50%;background:#3AA56B}
.option.sel{border-color:#3AA56B;background:#F4FBEC;box-shadow:0 4px 0 #D7EBC4,0 8px 16px rgba(58,165,107,.12)}
.option.sel .key{background:#DFF2CC;color:var(--green-d)}
.option.correct{border-color:#3AA56B;background:#EDF9E1}
.option.correct .key{background:#3AA56B;color:#fff}
.option.wrong{border-color:#F07A6A;background:#FFF0EC;animation:shake .4s ease}
.option.wrong .key{background:#F07A6A;color:#fff}
.option.dim{opacity:.55}
/* 听音选图：图片选项 + 听力按钮 + 连线 + 跟读 + 情景对话 */
.options.pic-grid{grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:9px;margin-top:12px;flex:1;min-height:0}
.option.pic{flex-direction:column;gap:2px;padding:6px;min-height:0;height:100%;position:relative;overflow:hidden}
.option.pic .key{position:absolute;left:8px;top:8px;width:22px;height:22px;font-size:10px}
.option.pic .pic{flex:1;min-height:0;min-width:0;width:100%;display:grid;place-items:center;overflow:hidden}
.option.pic .pic svg{width:100%;height:100%;display:block}
.option.pic .pic-word{font-size:14px;font-weight:900;color:var(--green-d);letter-spacing:-.2px;flex:none}
.big-speaker{width:clamp(72px,14vh,96px);height:clamp(72px,14vh,96px);border-radius:50%;display:grid;place-items:center;color:#fff;
  background:linear-gradient(160deg,#57BE84,#2E8B57);box-shadow:0 10px 20px rgba(46,139,87,.28);position:relative}
.big-speaker:active{transform:scale(.95)}
.quiz-art .listen-tip{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:10.5px;font-weight:800;color:#A89A7E}
/* 听音选图：把空间让给 2×2 图片卡，喇叭区固定为小高度 */
.quiz-art.listen-art{flex:0 0 auto;height:clamp(146px,24vh,216px);max-height:216px;margin-top:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px 0}
.quiz-art.listen-art .big-speaker{width:clamp(64px,12vh,84px);height:clamp(64px,12vh,84px);flex:none}
.quiz-art.listen-art .listen-tip{position:static;bottom:auto;flex:none}
.match-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr);gap:12px;margin-top:14px;flex:1;min-height:0}
.match-col{display:flex;flex-direction:column;gap:9px;min-height:0}
.mcard{border-radius:16px;background:#fff;border:2px solid #EFE2CB;min-height:0;flex:1;display:flex;align-items:center;justify-content:center;
  font-size:16.5px;font-weight:800;color:#4B443A;padding:6px;transition:transform .12s ease;overflow:hidden}
.mcard:active{transform:scale(.97)}
.mcard.art svg{width:100%;height:100%;display:block}
.mcard.sel{border-color:#3AA56B;box-shadow:0 0 0 3px rgba(58,165,107,.16)}
.mcard.ok{border-color:#B9DDA1;background:#EFF8E4;opacity:.7}
.repeat-word{margin-top:12px;text-align:center;display:flex;flex-direction:column;gap:3px}
.repeat-word b{font-size:28px;font-weight:900;color:var(--green-d);letter-spacing:-.4px}
.repeat-word span{font-size:13px;font-weight:700;color:#A89A7E}
.repeat-word i{font-size:11px;font-style:normal;font-weight:700;color:#B3A588;margin-top:2px}
.dialog-card{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.dlg{display:flex;gap:9px;align-items:center;background:#fff;border:2px solid #EFE2CB;border-radius:18px;padding:11px 13px}
.dlg.me{background:#F5FBEA;border-color:#DDEECB}
.dlg .who{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:900;
  color:#fff;background:#C9B58C}
.dlg.me .who{background:var(--green)}
.dlg p{font-size:15px;font-weight:800;color:#4B443A;line-height:1.45}
.dlg .blank{color:var(--green-d);border-bottom:2px dashed #9ACB7D;padding:0 2px}
.dlg-pic{width:56px;height:56px;flex:none;margin-left:auto;display:grid;place-items:center}
.dlg-pic svg{width:100%;height:100%}
.options.one-col{grid-template-columns:1fr;grid-auto-rows:minmax(0,1fr);gap:8px;margin-top:10px;flex:1;min-height:0}
.options.one-col .option{min-height:0;padding:0 12px}
.options.one-col .option .word{font-size:18px}
.quiz-foot{flex:none;padding:10px 20px calc(18px + var(--safe-bottom));display:flex;flex-direction:column;gap:10px;background:var(--cream)}
.combo{min-height:38px;border-radius:13px;display:flex;align-items:center;justify-content:center;gap:6px;
  background:linear-gradient(90deg,#FFF0C9,#FFE4A6);border:1.5px solid #F5D48B;
  font-size:11.5px;font-weight:800;color:#95691A;padding:6px 10px;text-align:center}
.combo b{color:#7C5209}
.combo.silent{background:transparent;border-color:transparent;color:#A6987B}

/* ------------------------------------------------ result */
.result-page{display:flex;flex-direction:column;height:100%;position:relative;overflow:hidden}
.result-scroll{flex:1;min-height:0;overflow-y:auto;padding:calc(18px + var(--safe-top)) 20px 8px;scrollbar-width:none;position:relative;z-index:2;display:flex;flex-direction:column;justify-content:space-between}
.result-scroll::-webkit-scrollbar{display:none}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.confetti i{position:absolute;display:block;border-radius:2px;opacity:.85;animation:confettiFall linear both}
.result-head{text-align:center;margin-top:6px}
.result-head .eyebrow{color:#B4A07B;font-size:11.5px;letter-spacing:2px}
.result-head h1{font-size:clamp(34px,5.4vw,42px);font-weight:900;letter-spacing:-1px;margin-top:6px}
.result-stars{display:flex;align-items:flex-end;justify-content:center;gap:6px;height:94px;margin-top:8px}
.result-stars svg{animation:starPop .55s cubic-bezier(.2,1.5,.4,1) both}
.result-stars svg:nth-child(1){transform:rotate(-14deg) translateY(4px);animation-delay:.10s}
.result-stars svg:nth-child(2){animation-delay:.22s}
.result-stars svg:nth-child(3){transform:rotate(14deg) translateY(4px);animation-delay:.34s}
.result-sub{text-align:center;font-size:13.5px;font-weight:700;color:#96876A;margin-top:8px}

.result-card{margin-top:16px;border-radius:26px;background:#fff;border:1.5px solid var(--line);
  box-shadow:0 14px 30px rgba(94,70,30,.1);padding:18px}
.rc-top{display:flex;align-items:center;justify-content:space-between}
.rc-growth{display:flex;align-items:center;gap:11px}
.rc-growth .g-ic{width:50px;height:50px;border-radius:16px;background:#E9F7D9;display:grid;place-items:center;color:var(--green-d)}
.rc-growth .lb{font-size:11.5px;font-weight:800;letter-spacing:.8px;color:var(--muted)}
.rc-growth .v{font-size:29px;font-weight:900;color:var(--green-d);line-height:1.1}
.rc-growth .v small{font-size:13.5px;font-weight:800}
.rc-stars{display:flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:99px;background:#FFF5D1;
  font-size:15px;font-weight:900;color:#8A6415}

.rc-stats{display:flex}

.evo-card{margin-top:14px;border-radius:22px;padding:15px 16px;position:relative;overflow:hidden;

.evo-card .evo-bar{margin-top:10px;height:10px}
.evo-card .evo-mini{position:absolute;right:10px;bottom:8px;width:62px;height:62px;opacity:.95}
.evo-card .evo-tip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:#fff;

.result-cheer{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:0;padding-top:10px}
.result-cheer .cheer-dino{width:100px;height:100px;flex:none;filter:drop-shadow(0 8px 10px rgba(48,104,64,.14))}
.result-cheer .cheer-say{background:#fff;border:1.5px solid var(--line);border-radius:14px 14px 14px 4px;
  padding:10px 14px;box-shadow:0 5px 12px rgba(94,70,30,.07)}
.result-cheer .cheer-say b{display:block;font-size:13.5px;font-weight:900;color:#405A46}
.result-cheer .cheer-say span{display:block;font-size:12px;font-weight:600;color:#9A8B70;margin-top:3px}
.result-foot{flex:none;padding:10px 20px calc(18px + var(--safe-bottom));display:flex;flex-direction:column;gap:8px;background:var(--cream);z-index:3}
.result-foot .back{height:28px;font-size:13px;font-weight:700;color:#96876A;display:flex;align-items:center;justify-content:center;gap:4px}

/* ------------------------------------------------ evolution */
.evo-page{position:relative;height:100%;display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:none;
  background:#0F2E24;color:#FFF7E4;padding:calc(10px + var(--safe-top)) 20px calc(20px + var(--safe-bottom))}
.evo-page::-webkit-scrollbar{display:none}
.evo-page .bg{position:absolute;inset:0;
  background:
    radial-gradient(58% 42% at 50% 42%,rgba(255,206,92,.24) 0%,rgba(255,206,92,.06) 46%,rgba(15,46,36,0) 70%),
    radial-gradient(120% 80% at 50% 116%,#1E5B41 0%,#143A2C 52%,#0C241C 100%)}
.evo-page .stars{position:absolute;inset:0;pointer-events:none}
.evo-page .stars i{position:absolute;background:#FFF4CF;border-radius:50%}
.evo-page .ring{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);border-radius:50%;
  border:1.5px solid rgba(255,224,142,.26);pointer-events:none}
.evo-page .ring.r1{width:min(86vw,330px);height:min(86vw,330px)}
.evo-page .ring.r2{width:min(102vw,400px);height:min(102vw,400px);border-style:dashed;border-color:rgba(255,224,142,.16);animation:spin 60s linear infinite}
.evo-page .ring.r3{width:min(120vw,470px);height:min(120vw,470px);border-color:rgba(255,224,142,.07)}
.evo-inner{position:relative;z-index:3;display:flex;flex-direction:column;min-height:100%}
.evo-top{display:flex;align-items:center;justify-content:space-between;flex:none}
.evo-top .tag{height:28px;padding:0 11px;border-radius:99px;background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;gap:6px;
  font-size:9.5px;font-weight:900;letter-spacing:1.6px;color:#E7DDBF}
.evo-top .close{width:34px;height:34px;border-radius:12px;background:rgba(255,255,255,.1);color:#F2E9D2;display:grid;place-items:center}
.evo-title{text-align:center;margin-top:clamp(10px,3vh,26px);flex:none}
.evo-title .en{font-size:10px;font-weight:900;letter-spacing:4.5px;color:#F2C860}
.evo-title h1{font-size:clamp(32px,6vw,42px);font-weight:900;color:#FFF8E6;letter-spacing:-.5px;margin-top:8px;
  text-shadow:0 4px 30px rgba(255,198,71,.35)}
.evo-title h1 em{font-style:normal;color:#FFD25A}
.evo-stage{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.evo-stage .st{height:30px;padding:0 12px;border-radius:99px;display:flex;align-items:center;gap:5px;
  font-size:11px;font-weight:800;color:#CFE9CB;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.evo-stage .st.new{background:rgba(255,210,90,.16);border-color:rgba(255,210,90,.4);color:#FFD868}
.evo-stage .arr{color:#F2C860;opacity:.8}
.evo-dino{position:relative;height:clamp(220px,32vh,320px);margin-top:2px;display:grid;place-items:center;flex:none}
.evo-dino .glow{position:absolute;width:min(74vw,290px);height:min(74vw,290px);border-radius:50%;
  background:radial-gradient(circle,rgba(255,216,104,.34) 0%,rgba(255,216,104,.1) 45%,rgba(255,216,104,0) 70%)}
.evo-dino .halo{position:absolute;width:min(64vw,246px);height:min(64vw,246px);border-radius:50%;border:1px solid rgba(255,226,150,.35)}
.evo-dino .dino{position:relative;width:min(66vw,278px);height:min(66vw,278px);
  filter:drop-shadow(0 16px 30px rgba(0,0,0,.32)) drop-shadow(0 0 26px rgba(255,210,90,.2));
  animation:evoFloat 4s ease-in-out infinite}
.evo-dino .spark{position:absolute;color:#FFE08A}
.evo-unlock{margin-top:auto;border-radius:26px;padding:16px;flex:none;
  background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.16);
  box-shadow:0 20px 40px rgba(0,0,0,.24);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.evo-unlock .u-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.evo-unlock .u-head .lb{font-size:9px;font-weight:900;letter-spacing:1.8px;color:#D9CB9E}
.evo-unlock .u-head .nv{font-size:9.5px;font-weight:800;color:#9FE3B7;background:rgba(93,208,139,.12);padding:3px 7px;border-radius:99px;white-space:nowrap}
.evo-unlock .u-main{display:flex;align-items:center;gap:12px;margin-top:10px}
.evo-unlock .u-ico{width:54px;height:54px;border-radius:17px;background:linear-gradient(160deg,#FFE6A9,#FFC65C);
  display:grid;place-items:center;flex:none;box-shadow:0 8px 18px rgba(255,181,61,.25)}
.evo-unlock .u-ico svg{width:44px;height:44px}
.evo-unlock .u-txt{flex:1;min-width:0}
.evo-unlock .u-txt b{display:block;font-size:16px;font-weight:900;color:#FFF7E4}
.evo-unlock .u-txt span{display:block;font-size:10.5px;font-weight:600;color:#B9C9B6;margin-top:3px;line-height:1.45}
.evo-unlock .u-skill{display:flex;align-items:center;gap:6px;margin-top:10px;padding-top:10px;
  border-top:1px dashed rgba(255,255,255,.14);font-size:11px;font-weight:700;color:#EADDB9}
.evo-unlock .u-skill b{color:#FFD25A}
.evo-unlock .btn{margin-top:13px;min-height:50px;font-size:16px;color:#4C3306}

.dex-card{border-radius:18px;background:#fff;border:1.5px solid var(--line);padding:7px;text-align:center;position:relative;

.dex-card .nm{font-size:11px;font-weight:800;margin-top:5px}

.dex-card .rare.r4{background:#A78BFA}

.dex-card.current{outline:2px solid rgba(46,139,87,.45);outline-offset:-2px}
.dex-card .now-tag{position:absolute;left:8px;top:8px;font-size:8px;font-weight:900;color:#fff;background:var(--green);
  padding:2px 5px;border-radius:5px;z-index:4}
.dex-reward{margin-top:14px;border-radius:20px;padding:10px 13px;display:flex;align-items:center;gap:11px;

/* ------------------------------------------------ shop */
.shop-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}
.shop-head .t{flex:1;min-width:0}
.shop-head h1{font-size:clamp(24px,4vw,30px);font-weight:900;letter-spacing:-.6px;line-height:1.1}

.shop-tabs{display:flex;align-items:center;gap:18px;padding:0 2px;height:44px;margin-top:4px}

.shop-tabs .tab.on{font-size:15px;color:var(--ink)}

.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:6px}

.shop-item{border-radius:22px;background:#fff;border:1.5px solid var(--line);padding:10px;position:relative;

.shop-item .sub{font-size:9.5px;font-weight:600;color:#9AA89B;margin-top:2px;min-height:12px}
.shop-item .foot{display:flex;align-items:center;justify-content:space-between;margin-top:7px}
.price{display:flex;align-items:center;gap:3px;font-size:12.5px;font-weight:900;color:#8A6415}

.bg-grid{display:grid;grid-template-columns:1fr;gap:11px;margin-top:6px}

.bg-item{display:flex;align-items:center;gap:11px;border-radius:20px;background:#fff;border:1.5px solid var(--line);

.bg-item .bg-info .price{margin-top:5px;display:inline-flex;width:fit-content}
.bg-item.using{outline:2px solid rgba(46,139,87,.35);outline-offset:-2px}
.bg-item .check-ico{width:26px;height:26px;border-radius:9px;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}
.dex-teaser{margin-top:6px;padding:16px;border-radius:22px}
.dex-teaser .dt-top{display:flex;align-items:center;gap:10px}
.dex-teaser .dt-top .t{flex:1}

  <script>
/* DinoGo · 音效、语音与关卡提示音（Web Audio 实时合成，无需音频素材） */

let audioCtx = null;

/* 音高表：音效、关卡提示音与背景音乐共用 */
const NOTE_FREQ = {
  C3: 130.81, D3: 146.83, E3: 164.81, F3: 174.61, G3: 196.0, A3: 220.0, B3: 246.94,
  C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.0, A4: 440.0, B4: 493.88,
  C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880.0, B5: 987.77,
  C6: 1046.5, D6: 1174.66, E6: 1318.5,
};

/* 首次交互时创建 / 唤醒音频上下文（iOS 要求） */
function ensureAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}

/* 播放一个音：类型、音量、延迟与输出目标均可配置 */
function tone(freq, dur = 0.12, type = "sine", vol = 0.05, delay = 0, dest = null) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(gain).connect(dest || audioCtx.destination);
  osc.start(t);
  osc.stop(t + dur + 0.02);
}

/* 界面音效 */
function sfx(name) {
  if (!state.sound) return;
  try {
    ensureAudio();
    if (name === "tap") tone(520, 0.05, "sine", 0.025);
    else if (name === "correct") { tone(660, 0.12, "sine", 0.05); tone(880, 0.16, "sine", 0.05, 0.1); }
    else if (name === "wrong") { tone(190, 0.2, "sawtooth", 0.035); tone(150, 0.24, "sawtooth", 0.03, 0.12); }
    else if (name === "coin") { tone(988, 0.08, "triangle", 0.05); tone(1318, 0.14, "triangle", 0.045, 0.07); }
    else if (name === "star") { tone(740, 0.1, "sine", 0.05); tone(1108, 0.14, "sine", 0.04, 0.09); }
    else if (name === "evolve") { [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, 0.24, "triangle", 0.05, i * 0.13)); }
    else if (name === "win") { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.3, "sine", 0.045, i * 0.1)); }
  } catch (e) { /* no audio */ }
}

/* 英文单词朗读 */
function speak(text) {
  try {
    if (!("speechSynthesis" in window)) {
      if (typeof toast === "function") toast("当前浏览器不支持发音");
      return;
    }
    const synth = window.speechSynthesis;
    const say = () => {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      u.rate = 0.82;
      u.pitch = 1.08;
      synth.speak(u);
    };
    /* 先停掉上一段朗读；连续点击时立即 speak 会被部分浏览器丢弃，稍作延迟 */
    if (synth.speaking || synth.pending) {

  },
  /* 美食街：热闹夜市，收银小铃点缀 */
  food: {
    bpm: 112, wave: "triangle", bassWave: "triangle", ambient: "bell",

      ["F5", 1], ["A5", 1], ["G5", 1], ["E5", 1], ["D5", 2], ["C5", 2],

  },
};

/* 环境点缀：鸟鸣 / 汽车喇叭 / 动物呼唤 / 店铺铃声 */
function birdChirp(delay, dest) {
  if (!audioCtx) return;
  for (let i = 0; i < 2; i++) {
    const t = audioCtx.currentTime + delay + i * 0.16;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(1900, t);
    osc.frequency.exponentialRampToValueAtTime(2700, t + 0.07);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.014, t + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
    osc.connect(gain).connect(dest || audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.13);
  }
}
function carHorn(delay, dest) {
  tone(392, 0.1, "square", 0.016, delay, dest);
  tone(392, 0.1, "square", 0.016, delay + 0.16, dest);
}
function animalCall(delay, dest) {
  tone(392, 0.18, "triangle", 0.018, delay, dest);
  tone(523.25, 0.24, "triangle", 0.016, delay + 0.2, dest);
}
function shopBell(delay, dest) {
  tone(1568, 0.5, "sine", 0.018, delay, dest);
  tone(2093, 0.4, "sine", 0.011, delay + 0.02, dest);
}

function stopMusic() {
  if (musicTimer) clearTimeout(musicTimer);
  musicTimer = null;
  musicId = null;
  if (musicGain && audioCtx) {
    /* 短暂淡出后断开，已排入队列的音符随节点一起静音 */
    const old = musicGain;
    musicGain = null;
    try {
      old.gain.setValueAtTime(old.gain.value || 1, audioCtx.currentTime);
      old.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 0.18);
      setTimeout(() => { try { old.disconnect(); } catch (e) { /* ignore */ } }, 320);
    } catch (e) { /* ignore */ }
  }
}

function playMusic(id) {
  if (!state.sound) { stopMusic(); return; }
  if (musicId === id && musicTimer) return;
  stopMusic();
  ensureAudio();
  if (!audioCtx) return;
  const cfg = THEME_MUSIC[id] || THEME_MUSIC.fruit;
  musicId = id;
  musicGain = audioCtx.createGain();
  musicGain.gain.value = 1;
  musicGain.connect(audioCtx.destination);
  const dest = musicGain;
  const beat = 60 / cfg.bpm;
  const run = () => {
    if (musicId !== id || !audioCtx || !dest) return;
    let mel = 0;
    cfg.melody.forEach(([note, beats]) => {
      if (note !== "R") tone(NOTE_FREQ[note], beat * beats * 0.9, cfg.wave, 0.02, mel, dest);
      mel += beat * beats;
    });
    let bass = 0;
    cfg.bass.forEach(([note, beats]) => {
      tone(NOTE_FREQ[note], beat * beats * 0.95, cfg.bassWave || "triangle", 0.015, bass, dest);
      bass += beat * beats;
    });
    if (cfg.ambient === "bird") birdChirp(beat * 6, dest);
    else if (cfg.ambient === "horn") carHorn(beat * 8, dest);
    else if (cfg.ambient === "call") animalCall(beat * 3, dest);
    else if (cfg.ambient === "bell") shopBell(beat * 10, dest);
    musicTimer = setTimeout(run, Math.max(mel, bass) * 1000);
  };
  run();
}

/* 页面与音乐同步：只在闯关地图里播放当前主题的 BGM */
function syncMusic(screen, themeId) {
  if (screen === "map") playMusic(themeId);
  else stopMusic();
}

/* ------------------------------------------------ theme words */
/* 主题词汇由 app/words/*.js 注册；有精绘 SVG 的用 art，其余用 emoji 插图 */
function emojiArt(ch) {
  return `<svg class="fruit" viewBox="0 0 120 120" aria-hidden="true">
    <text x="60" y="64" font-size="78" text-anchor="middle" dominant-baseline="middle">${ch}</text>
  </svg>`;
}
const WORD_SETS = (window.DINO_WORD_SETS || []).map((set) => ({
  ...set,
  words: set.words.map((w) => ({ ...w, art: w.art || (() => emojiArt(w.emoji || "❓")) })),
}));
const ALL_WORDS = WORD_SETS.flatMap((set) => set.words);
/* 每个主题 10 关；每关 5 题：答对 3 题 1 星、4 题 2 星、5 题 3 星，≥2 星才解锁下一关 */
const LEVELS_PER_THEME = 10;
const PASS_STARS = 2;
function currentTheme() {
  return WORD_SETS.find((set) => set.id === state.theme) || WORD_SETS[0];
}
function themeWords() {
  return currentTheme().words;
}
/* 每个主题独立关卡进度：{ level, stars }，互不影响 */
function themeProgress(id) {
  const key = id || (state && state.theme) || "fruit";
  if (!state.progress) state.progress = {};
  if (!state.progress[key]) state.progress[key] = { level: 1, stars: {} };
  return state.progress[key];
}
function themeStars(p) {
  return Object.values(p.stars).reduce((a, b) => a + b, 0);
}
function totalLevelsDone() {
  return WORD_SETS.reduce((n, t) => n + (state.progress && state.progress[t.id] ? state.progress[t.id].level - 1 : 0), 0);
}
/* 全新存档：零星星、零成长、零记录，所有主题从第 1 关开始 */
function initialState() {
  return {
    ...DEFAULT_STATE,
    tasks: { ...DEFAULT_STATE.tasks },
    equipped: { ...DEFAULT_STATE.equipped },
    progress: {},
    log: {},
    bgOwned: [...DEFAULT_STATE.bgOwned],
    dex: [...DEFAULT_STATE.dex],
    owned: [],
  };
}

/* ------------------------------------------------ state */
const STORE_KEY = "dinogo.v3";
try {
  if (new URLSearchParams(location.search).get("fresh") === "1") localStorage.removeItem(STORE_KEY);
} catch (e) { /* private mode */ }
const DEFAULT_STATE = {
  v: 3,
  name: "毛肚",
  stars: 0,
  growth: 0,
  stage: "egg",
  theme: "fruit",
  progress: {},
  log: {},
  words: 0,
  minutes: 0,
  threeStars: 0,
  tasks: { level: false },
  owned: [],
  equipped: { head: null, face: null, back: null },
  bg: "jungle",
  bgOwned: ["jungle"],
  dex: ["egg"],
  sound: true,
  starBonus: 0,
};

let state = loadState();
let current = "home";
let quiz = null;
let lastResult = null;
let evolutionInfo = null;
let timers = [];
let installDismissed = false;

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return initialState();
    const parsed = JSON.parse(raw);
    return {
      ...initialState(),
      ...parsed,
      tasks: { ...DEFAULT_STATE.tasks, ...(parsed.tasks || {}) },
      equipped: { ...DEFAULT_STATE.equipped, ...(parsed.equipped || {}) },
      progress: parsed.progress || {},
      log: parsed.log || {},
      bgOwned: Array.isArray(parsed.bgOwned) ? parsed.bgOwned : [...DEFAULT_STATE.bgOwned],
      dex: Array.isArray(parsed.dex) ? parsed.dex : [...DEFAULT_STATE.dex],
      owned: Array.isArray(parsed.owned) ? parsed.owned : [],
    };
  } catch (e) {
    return initialState();
  }
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* private mode */ }
}
function resetState() {
  state = initialState();
  lastResult = null;
  evolutionInfo = null;
  quiz = null;
  save();
}

/* ------------------------------------------------ study log */
function dateKey(d = new Date()) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function recordLevel(stars) {
  const k = dateKey();
  const rec = state.log[k] || { levels: 0, stars: 0 };
  state.log[k] = { levels: rec.levels + 1, stars: rec.stars + stars };
}

/* ------------------------------------------------ timers */
function setTimer(fn, ms) {
  const id = setTimeout(() => { timers = timers.filter((t) => t !== id); fn(); }, ms);
  timers.push(id);
  return id;
}
function clearTimers() { timers.forEach((t) => clearTimeout(t)); timers = []; }

/* ------------------------------------------------ router */
function go(name, opts = {}) {
  if (name === current && !opts.replace && !opts.force) { render(); return; }
  clearTimers();
  current = name;
  try {
    if (opts.replace) history.replaceState({ screen: name }, "");
    else history.pushState({ screen: name }, "");
  } catch (e) { /* local file / restricted history */ }
  render();
  requestAnimationFrame(() => {
    const sc = $(".scroll");
    if (sc) sc.scrollTop = 0;
  });
}
function back() {
  clearTimers();
  if (quiz && current === "quiz") { quiz = null; go("map", { replace: true }); return; }
  if (history.length > 1) history.back();
  else go("home", { replace: true });
}

/* ------------------------------------------------ toast */
function toast(msg) {
  const root = $("#toast-root");
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  root.appendChild(el);
  while (root.children.length > 3) root.removeChild(root.firstChild);
  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 260); }, 2100);
}

/* ------------------------------------------------ events */
document.addEventListener("click", (e) => {
  if (e.target.classList && e.target.classList.contains("overlay")) { closeOverlay(); return; }
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;

  if (action === "tab") {
    closeOverlay();
    go(el.dataset.screen, { replace: true });
    sfx("tap");
  } else if (action === "home") {
    closeOverlay();
    go("home", { replace: true });
  } else if (action === "profile") {
    go("profile");
    sfx("tap");
  } else if (action === "start-quiz") {
    closeOverlay();
    startQuiz(el.dataset.level);
  } else if (action === "review-level") {
    startQuiz(Number(el.dataset.level));
  } else if (action === "locked-level") {
    toast("先拿到两星通过前一关，才能解锁这一关");
  } else if (action === "select") {
    selectOption(el.dataset.word);
  } else if (action === "check") {
    checkAnswer();
  } else if (action === "match-word") {
    matchPickWord(el.dataset.word);
  } else if (action === "match-art") {
    matchPickArt(el.dataset.word);
  } else if (action === "repeat-done") {
    repeatDone();
  } else if (action === "next") {
    nextQuestion();
  } else if (action === "close-quiz") {
    quiz = null;
    go("map", { replace: true });
  } else if (action === "evolve") {
    beginEvolution();
  } else if (action === "shop-tab") {
    shopTab = el.dataset.tab;
    sfx("tap");
    render();
  } else if (action === "buy-item") {
    openBuyItem(el.dataset.id);
  } else if (action === "equip-item") {
    toggleItem(el.dataset.id);
  } else if (action === "locked-item") {
    const item = ITEMS.find((i) => i.id === el.dataset.id);
    if (item && item.unlockStage) toast(`进化到${stageMeta(item.unlockStage).name}即可解锁`);
  } else if (action === "buy-bg") {
    openBuyBg(el.dataset.id);
  } else if (action === "equip-bg") {
    equipBg(el.dataset.id);
  } else if (action === "confirm-buy") {
    confirmBuy();
  } else if (action === "dex-detail") {
    openDexDetail(el.dataset.key);
  } else if (action === "filter-dex") {
    dexFilter = el.dataset.filter;
    sfx("tap");
    render();
  } else if (action === "theme") {
    state.theme = el.dataset.theme;
    save();
    sfx("tap");
    render();
  } else if (action === "settings") {
    openSettings();
  } else if (action === "toggle-sound") {
    state.sound = !state.sound;
    save();
    if (state.sound) { ensureAudio(); sfx("tap"); }
    syncMusic(current, state.theme);
    openSettings();
    toast(state.sound ? "音效已开启" : "音效已关闭");
  } else if (action === "install-guide") {
    openInstallGuide();
  } else if (action === "reset-confirm") {
    openResetConfirm();
  } else if (action === "confirm-reset") {
    resetState();
    closeOverlay();
    go("home", { replace: true });
    toast("已重置演示进度");
  } else if (action === "close-overlay") {
    closeOverlay();
  } else if (action === "speak-word") {
    speak(el.dataset.word);
  } else if (action === "open-review") {
    openReview();
  } else if (action === "random-word") {
    openReview(true);
  } else if (action === "open-map") {
    go("map");
  }
});

window.addEventListener("popstate", (e) => {
  const s = (e.state && e.state.screen) || "home";
  if (s === "result" && !lastResult) { current = "home"; render(); return; }
  if (s === "evolution" && !evolutionInfo) { current = "home"; render(); return; }
  if (s === "quiz" && !quiz) { current = "map"; render(); return; }
  clearTimers();
  current = s;
  render();
});

document.addEventListener("gesturestart", (e) => e.preventDefault());

/* ------------------------------------------------ render */
/* 页面渲染表在 boot() 里装配，保证四个 Tab 文件都已加载 */
let SCREEN_FN = {};
function render() {
  const fn = SCREEN_FN[current] || screenHome;
  $("#view").innerHTML = fn();
  syncMusic(current, state.theme);
}

/* ------------------------------------------------ boot */
function boot() {
  SCREEN_FN = {
    home: screenHome,
    map: screenMap,
    quiz: screenQuiz,
    result: screenResult,
    evolution: screenEvolution,
    shop: screenShop,
    dex: screenDex,
    profile: screenProfile,
  };
  try {
    if (!history.state || !history.state.screen) history.replaceState({ screen: "home" }, "");
    else current = history.state.screen;
  } catch (e) { current = "home"; }

  // A result/evolution screen cannot be restored without runtime context.
  if (current === "result" && !lastResult) current = "home";
  if (current === "evolution" && !evolutionInfo) current = "home";
  if (current === "quiz" && !quiz) current = "home";

  render();

  // Warm up the audio graph on the first touch (iOS requirement).
  const wake = () => { ensureAudio(); syncMusic(current, state.theme); document.removeEventListener("touchstart", wake); document.removeEventListener("click", wake); };
  document.addEventListener("touchstart", wake, { passive: true });
  document.addEventListener("click", wake);

  // iOS install hint — only once, and only in Safari (not standalone).
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const standalone = window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
  let seen = false;
  try { seen = localStorage.getItem("dinogo.installHint") === "1"; } catch (e) {}
  if (isIOS && !standalone && !seen) {
    setTimeout(() => {
      if (current !== "home") return;
      try { localStorage.setItem("dinogo.installHint", "1"); } catch (e) {}
      toast("提示：分享 → 添加到主屏幕，可全屏离线玩");
    }, 2400);
  }
}

/* PWA: cache the app for offline use when served over http(s). */
if ("serviceWorker" in navigator && !window.__DINOGO_SINGLE__ && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}

/* 平滑路线：Catmull-Rom 转三次贝塞尔，节点与路线始终贴合 */
function routePath(pts, from = 0, to = pts.length - 1) {
  const d = [`M${pts[from][0]},${pts[from][1]}`];
  const t = 0.18;
  for (let i = from; i < to; i++) {
    const p0 = pts[i - 1] || pts[i];
    const p1 = pts[i];
    const p2 = pts[i + 1];
    const p3 = pts[i + 2] || p2;
    const c1x = (p1[0] + (p2[0] - p0[0]) * t).toFixed(1);
    const c1y = (p1[1] + (p2[1] - p0[1]) * t).toFixed(1);
    const c2x = (p2[0] - (p3[0] - p1[0]) * t).toFixed(1);
    const c2y = (p2[1] - (p3[1] - p1[1]) * t).toFixed(1);
    d.push(`C${c1x},${c1y} ${c2x},${c2y} ${p2[0]},${p2[1]}`);
  }
  return d.join(" ");
}
/* viewBox 350×402 → 百分比定位 */
function mapPoint(p) {
  return { left: ((p[0] / 350) * 100).toFixed(2), top: ((p[1] / 402) * 100).toFixed(2) };
}

/* 关卡难度递进：1-2 关简单单词，3-4 关加入连线，5-6 关加入跟读，7 关起加入情景对话 */
const TASK_LABEL = { pic: "看图选词", listen: "听音选图", match: "单词连线", repeat: "跟读练习", dialog: "情景对话" };
const TASK_TITLE = {
  pic: "看图，选出正确的单词",
  listen: "听单词，选出正确的图片",
  match: "把单词和图片连起来",
  repeat: "听发音，大声跟读这个单词",
  dialog: "读对话，选出正确的单词",
};
function levelPlan(level) {
  if (level <= 2) return ["pic", "listen", "pic", "listen", "pic"];
  if (level === 3) return ["pic", "listen", "match", "pic", "listen"];
  if (level === 4) return ["listen", "pic", "match", "listen", "pic"];
  if (level === 5) return ["pic", "match", "repeat", "listen", "pic"];
  if (level === 6) return ["listen", "repeat", "match", "pic", "listen"];
  if (level === 7) return ["pic", "match", "repeat", "dialog", "listen"];
  if (level === 8) return ["listen", "dialog", "match", "repeat", "pic"];
  if (level === 9) return ["dialog", "match", "listen", "dialog", "repeat"];
  return ["dialog", "listen", "dialog", "match", "repeat"];
}
function artOf(word) {
  const w = themeWords().find((x) => x.word === word);
  return w ? w.art : () => emojiArt("❓");
}
function buildTasks(level) {
  const pool = themeWords();
  const picks = shuffle(pool);
  const dlg = currentTheme().dialog || { q: "What's this?", a: "It's a {word}." };
  return levelPlan(level).map((type, i) => {
    const w = picks[i % picks.length];
    const task = { type, word: w.word, art: w.art, phon: w.phon, dlgQ: dlg.q, dlgA: dlg.a };
    if (type === "match") {
      const trio = shuffle(pool).slice(0, 3);
      task.pairs = trio.map((x) => ({ word: x.word, art: x.art }));
      task.words = shuffle(trio.map((x) => x.word));
      task.arts = shuffle(trio.map((x) => ({ word: x.word, art: x.art })));
    } else if (type !== "repeat") {
      const n = type === "dialog" ? 3 : 4;
      task.options = shuffle([w.word, ...shuffle(pool.filter((x) => x.word !== w.word)).slice(0, n - 1).map((x) => x.word)]);
    }
    return task;
  });
}
function startQuiz(level) {
  const lvl = Math.min(LEVELS_PER_THEME, Math.max(1, Number(level) || themeProgress().level));
  quiz = {

function speakTask() {
  const q = quiz && quiz.order[quiz.index];
  if (q && (q.type === "listen" || q.type === "repeat")) setTimer(() => speak(q.word), 450);
}
function selectOption(word) {
  if (!quiz) return;
  speak(word);
  if (quiz.revealed) return;
  quiz.selected = word;
  sfx("tap");
  render();
}
function matchPickWord(word) {
  if (!quiz || quiz.revealed) return;
  speak(word);
  quiz.pickWord = word;
  sfx("tap");
  render();
}
function matchPickArt(word) {
  if (!quiz || quiz.revealed || !quiz.pickWord) return;
  const q = quiz.order[quiz.index];
  if (word === quiz.pickWord) {
    quiz.matched.push(word);
    quiz.pickWord = null;
    sfx("correct");
    if (quiz.matched.length >= q.pairs.length) {
      quiz.revealed = true;
      quiz.choiceCorrect = quiz.matchWrong === 0;
      if (quiz.choiceCorrect) { quiz.correct++; quiz.combo++; q.pairs.forEach((p) => quiz.words.push(p.word)); }
      else quiz.combo = 0;
      render();
      setTimer(() => nextQuestion(), 1500);
      return;
    }
  } else {
    quiz.matchWrong++;
    quiz.pickWord = null;
    quiz.hearts = Math.max(0, quiz.hearts - 1);
    quiz.combo = 0;
    sfx("wrong");
    if (quiz.hearts <= 0) {
      quiz.revealed = true;
      quiz.choiceCorrect = false;
      render();
      setTimer(() => nextQuestion(), 1600);
      return;
    }
    toast("这两张不匹配，再试一次");
  }
  render();
}
function repeatDone() {
  if (!quiz || quiz.revealed) return;
  const q = quiz.order[quiz.index];
  quiz.revealed = true;
  quiz.choiceCorrect = true;
  quiz.correct++;
  quiz.combo++;
  quiz.words.push(q.word);
  sfx("correct");
  render();
  setTimer(() => nextQuestion(), 1400);
}
function checkAnswer() {
  if (!quiz || quiz.revealed || !quiz.selected) return;
  const q = quiz.order[quiz.index];
  const ok = quiz.selected === q.word;
  quiz.revealed = true;
  quiz.choiceCorrect = ok;
  if (ok) {
    quiz.correct++;
    quiz.combo++;
    quiz.words.push(q.word);
    sfx("correct");
  } else {
    quiz.hearts = Math.max(0, quiz.hearts - 1);
    quiz.combo = 0;
    sfx("wrong");
  }
  render();
  if (quiz && (quiz.index >= quiz.order.length - 1 || quiz.hearts <= 0)) {
    setTimer(() => nextQuestion(), 1800);
  } else {
    setTimer(() => nextQuestion(), 2200);
  }
}
function nextQuestion() {
  if (!quiz) return;
  clearTimers();
  if (quiz.index >= quiz.order.length - 1 || quiz.hearts <= 0) { finishQuiz(); return; }
  quiz.index++;
  quiz.selected = null;
  quiz.revealed = false;
  quiz.choiceCorrect = null;
  quiz.matched = [];
  quiz.pickWord = null;
  quiz.matchWrong = 0;
  render();
  speakTask();
}

function finishQuiz() {
  if (!quiz) return;
  const total = quiz.order.length;
  const accuracy = quiz.correct / total;
  /* 答对 3 题 1 星、4 题 2 星、5 题 3 星；2 星及以上才解锁下一关 */
  const stars = quiz.correct >= total ? 3 : quiz.correct >= total - 1 ? 2 : quiz.correct >= total - 2 ? 1 : 0;
  const passed = stars >= PASS_STARS;
  const growthGain = quiz.correct * 24;
  const prog = themeProgress();
  const completedLevel = quiz.level;
  const prevBest = prog.stars[completedLevel] || 0;
  const best = Math.max(prevBest, stars);
  /* 按最高星结算：重复复习只补发「刷新纪录」的差额星星 */
  const starGain = Math.round(Math.max(0, [0, 5, 10, 15][best] - [0, 5, 10, 15][prevBest]) * (1 + (state.starBonus || 0)));
  const isReplay = completedLevel < prog.level;
  const elapsed = Math.max(5, Math.round((Date.now() - quiz.startedAt) / 1000));
  state.growth += growthGain;
  state.stars += starGain;
  prog.stars[completedLevel] = best;
  /* 只有挑战当前关卡且达到 2 星才推进进度，复习旧关卡不影响进度 */
  if (passed && !isReplay) prog.level = Math.min(LEVELS_PER_THEME, completedLevel + 1);
  state.words += quiz.correct;
  state.minutes += Math.max(1, Math.round(elapsed / 60));
  state.threeStars += stars === 3 ? 1 : 0;
  state.tasks.level = true;
  recordLevel(stars);
  const target = stageForGrowth(state.growth);
  const canEvolve = stageIndex(target.key) > stageIndex(state.stage);
  lastResult = {
    level: completedLevel,
    replay: isReplay,
    prevBest,
    best,
    correct: quiz.correct,
    total,
    accuracy: Math.round(accuracy * 100),
    stars,
    passed,
    growthGain,
    starGain,
    seconds: elapsed,
    newWords: quiz.correct,
    canEvolve,
    targetStage: target.key,
    wordList: [...new Set(quiz.words)].slice(0, 3),
  };
  quiz = null;
  save();
  sfx(stars === 3 ? "win" : "coin");
  go("result", { replace: true });
}

/* ------------------------------------------------ result */
function screenResult() {
  if (!lastResult) {
    setTimeout(() => go("home", { replace: true }), 0);
    return `<section class="screen"></section>`;
  }
  const r = lastResult;
  const st = stageMeta(state.stage);
  const next = nextStage(st.key);
  const pending = r.canEvolve && r.targetStage;
  const target = pending ? stageMeta(r.targetStage) : null;
  const pct = next ? clamp((state.growth - st.min) / (next.min - st.min), 0, 1) : 1;
  const mm = String(Math.floor(r.seconds / 60)).padStart(1, "0");
  const ss = String(r.seconds % 60).padStart(2, "0");
  const starRow = [0, 1, 2].map((i) => star(i === 1 ? 80 : 62, i < r.best ? "#FFC94A" : "#F1E7D2", i < r.best ? "#E9A93C" : "#E5D7BC", i < r.best ? 1 : 0.55)).join("");

    const colors = ["#FFC94A", "#FF8A4C", "#5BC178", "#9FDCF2", "#B8A7FF", "#FF6F61"];

  return `<section class="screen result-page" data-screen="result">
    <div class="confetti">${confettiPieces}</div>
    <div class="result-scroll">
      <div class="result-head">

        <div class="result-sub">${r.replay && r.stars < r.prevBest ? `本次 ${r.stars} 星 · 保留最高 ${r.prevBest} 星成绩` : r.best === 3 ? "三星通关 · 今天的你超厉害" : r.best === 2 ? "两星通关 · 下一关已解锁" : r.best === 1 ? "一星通关 · 拿到两星才能解锁下一关" : "还差一点点，重新挑战这一关吧"}</div>
      </div>

      <div class="result-card">
        <div class="rc-top">
          <div class="rc-growth">
            <div class="g-ic">${I.leaf(28)}</div>

          </div>

        </div>
        <div class="rc-div"></div>
        <div class="rc-stats">
          <div class="rc-stat"><b class="num">${r.accuracy}%</b><span>正确率</span></div>

        </div>
        <div class="rc-words">

        </div>
      </div>

      <div class="evo-card">
        <div class="evo-row"><span class="evo-lb">EVOLUTION · 进化进度</span><span class="evo-val num">${state.growth} / ${next ? next.min : "MAX"}</span></div>
        <div class="evo-name">${pending ? `${st.name} <b>→</b> ${target.name} · <span style="color:#E2691F">可以进化啦！</span>` : next ? `再获得 ${Math.max(0, next.min - state.growth)} 成长值进化为 ${next.name}` : "已经达到最高形态"}</div>
        <div class="bar gold evo-bar"><i style="width:${pending ? 100 : Math.round(pct * 100)}%"></i></div>
        <div class="evo-tip">${pending ? `${spark(11, "#fff")} 点击见证小诺的成长时刻` : `${spark(11, "#fff")} 继续闯关，离进化更近一步`}</div>

    </div>
  </section>`;
}

/* ------------------------------------------------ evolution */
function beginEvolution() {
  const from = stageMeta(state.stage);
  const to = stageForGrowth(state.growth);
  if (stageIndex(to.key) <= stageIndex(from.key)) {
    toast("成长值还不够，再去闯一关吧");
    go("home", { replace: true });
    return;
  }
  const newDex = [...new Set([...state.dex, to.key])];
  const unlockItem = to.key === "adult" ? "hat" : to.key === "super" ? "crown" : to.key === "ultra" ? "wings" : null;
  const item = unlockItem ? ITEMS.find((it) => it.id === unlockItem) : null;
  const wasOwned = item ? state.owned.includes(item.id) : false;
  state.stage = to.key;
  state.dex = newDex;
  if (item && !wasOwned) {
    state.owned.push(item.id);
    if (!state.equipped[item.slot]) state.equipped[item.slot] = item.id;
  }
  if (stageIndex(to.key) >= 3) state.starBonus = 0.1;
  let dexReward = null;
  if (state.dex.length >= 4 && !state.bgOwned.includes("sunset")) {
    state.bgOwned.push("sunset");
    dexReward = "落日山谷";
  }
  if (state.dex.length >= 6 && !state.bgOwned.includes("night")) {
    state.bgOwned.push("night");
    dexReward = "星空营地";
  }
  save();
  evolutionInfo = { from, to, item, wasOwned, dexReward };
  sfx("evolve");
  go("evolution");
}

function screenEvolution() {
  if (!evolutionInfo) {
    setTimeout(() => go("home", { replace: true }), 0);

  }

  return `<section class="screen" data-screen="evolution" style="background:#0F2E24">

      <div class="bg"></div><div class="stars">${dots}</div>
      <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
      <div class="evo-inner">
        <div class="evo-top">
          <div class="tag">${spark(11, "#FFD25A")} MILESTONE ${String(stageIndex(info.to.key)).padStart(2, "0")} / 05</div>
          <button class="close" data-action="home" aria-label="回到乐园">${I.close(16)}</button>
        </div>
        <div class="evo-title">
          <div class="en">EVOLUTION COMPLETE</div>
          <h1>进化<em>成功</em>！</h1>
          <div class="evo-stage">
            <span class="st">${info.from.name} · LV.${stageIndex(info.from.key) + 1}</span>
            <span class="arr">${I.arrow(15, "#F2C860")}</span>
            <span class="st new">${I.crownMini(13, "#FFD25A")} ${info.to.name} · LV.${stageIndex(info.to.key) + 1}</span>
          </div>
        </div>
        <div class="evo-dino">
          <div class="glow"></div><div class="halo"></div>
          <span class="spark" style="left:8%;top:18%">${spark(22, "#FFE08A")}</span>
          <span class="spark" style="right:9%;top:10%">${spark(15, "#FFE08A")}</span>
          <span class="spark" style="right:14%;bottom:12%">${spark(11, "#FFE08A")}</span>
          <span class="spark" style="left:13%;bottom:16%">${spark(9, "#FFE08A")}</span>
          ${dino(info.to.key, { equipped: state.equipped })}
        </div>
        <div class="evo-unlock">
          <div class="u-head"><span class="lb">NEW UNLOCK · 成长奖励</span><span class="nv">+1 图鉴收录</span></div>
          <div class="u-main">
            <div class="u-ico">${item ? item.art() : I.crownMini(30, "#8A5B15")}</div>
            <div class="u-txt">
              <b>${item ? (info.wasOwned ? item.name + "（已拥有）" : item.name) : "成长礼包"}</b>
              <span>${item ? (info.wasOwned ? "这次进化没有新的装扮，但能力又变强了" : "已自动换上，也可以去小铺更换") : "解锁了新的成长阶段"}</span>
            </div>
            <div style="color:#FFD25A">${I.chevron(12)}</div>
          </div>
          <div class="u-skill">${spark(12, "#FFD25A")} 解锁被动技能：闯关获得的星星 <b>+10%</b></div>
          ${info.dexReward ? `<div class="u-skill" style="border-top:0;padding-top:2px">${I.gift(13)} 图鉴奖励：已解锁「${info.dexReward}」背景</div>` : ""}
          <button class="btn yellow" data-action="home">太棒了，继续冒险 ${I.arrow(18)}</button>
        </div>
      </div>
    </div>
  </section>`;
}

    <div class="dialog">
      <div class="d-ico">${item.art()}</div>
      <h3>解锁「${item.name}」？</h3>
      <p>将花费 ${item.price} 星星，解锁后可随时给小诺换上或取下。</p>
      <div class="d-actions">
        <button class="btn ghost" data-action="close-overlay">再想想</button>
        <button class="btn" data-action="confirm-buy">花 ${item.price} 星星解锁</button>
      </div>
    </div>
  </div>`);
}
function openBuyBg(id) {
  const bg = bgMeta(id);
  if (!bg || bg.price === 0) return;
  if (state.stars < bg.price) { toast("星星不够啦，再去闯一关吧"); return; }
  pendingBuy = { type: "bg", id };
  openOverlay(`<div class="overlay dialog-wrap">
    <div class="dialog">
      <div class="bg-thumb ${bg.cls}" style="width:100%;height:96px;border-radius:16px"><div class="s"></div><div class="h"></div></div>
      <h3>解锁「${bg.name}」？</h3>
      <p>将花费 ${bg.price} 星星，解锁后会立即应用到恐龙乐园和装饰小铺。</p>
      <div class="d-actions">
        <button class="btn ghost" data-action="close-overlay">再想想</button>
        <button class="btn" data-action="confirm-buy">花 ${bg.price} 星星解锁</button>
      </div>
    </div>
  </div>`);
}
function confirmBuy() {
  if (!pendingBuy) return;
  if (pendingBuy.type === "item") {
    const item = ITEMS.find((i) => i.id === pendingBuy.id);
    if (!item || state.owned.includes(item.id)) { pendingBuy = null; closeOverlay(); return; }
    if (state.stars < item.price) { toast("星星不够啦"); return; }
    state.stars -= item.price;
    state.owned.push(item.id);
    state.equipped[item.slot] = item.id;
    sfx("coin");
    toast(`已解锁「${item.name}」并换上`);
  } else {
    const bg = bgMeta(pendingBuy.id);
    if (state.bgOwned.includes(bg.id)) { state.bg = bg.id; pendingBuy = null; closeOverlay(); render(); return; }
    if (state.stars < bg.price) { toast("星星不够啦"); return; }
    state.stars -= bg.price;
    state.bgOwned.push(bg.id);
    state.bg = bg.id;
    sfx("coin");
    toast(`已解锁「${bg.name}」背景`);
  }
  pendingBuy = null;
  closeOverlay();
  save();
  render();
}
function toggleItem(id) {
  const item = ITEMS.find((i) => i.id === id);
  if (!item || !state.owned.includes(id)) return;
  if (state.equipped[item.slot] === id) {
    state.equipped[item.slot] = null;
    toast(`已取下「${item.name}」`);
  } else {
    state.equipped[item.slot] = id;
    toast(`已换上「${item.name}」`);
  }
  sfx("tap");
  save();
  render();
}
function equipBg(id) {
  if (!state.bgOwned.includes(id)) return;
  state.bg = id;
  sfx("tap");
  save();
  render();
  toast(`场景已切换为「${bgMeta(id).name}」`);
}

</script>
  <script>boot();</script>
</body>
</html>
