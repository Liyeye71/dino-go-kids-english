<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#FBF3E3">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DinoGo">
  <meta name="format-detection" content="telephone=no">
  <title>DinoGo · 恐龙英语</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="images/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="images/icons/icon-192.png">
  <!-- 样式按模块拆分，顺序与 build.mjs 的 CSS_FILES 保持一致 -->
  <style>
/* ============================================================
   DinoGo · 恐龙英语 — interactive iOS / iPad app
   ============================================================ */

:root{
  --ink:#1D3A2E;
  --ink-2:#4F665A;
  --muted:#87988D;
  --cream:#FBF3E3;
  --paper:#FFFFFF;
  --line:#EDDFC7;
  --green:#2E8B57;
  --green-d:#1E6B47;
  --green-l:#E9F7D9;
  --lime:#B8E05A;
  --yellow:#FFC94A;
  --orange:#FF8A4C;
  --coral:#FF6F61;
  --shadow:0 10px 24px rgba(94,70,30,.08);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  /* 字体系统：圆体优先 + 高字重标题 + 常规正文 */
  --font-round:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",
               "M PLUS Rounded 1c","PingFang SC","HarmonyOS Sans SC",
               "MiSans","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  --w-read:500;
  --w-mid:700;
  --w-bold:800;
  --w-black:900;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0;overscroll-behavior:none}
body{
  font-family:var(--font-round);
  font-synthesis:none;letter-spacing:.15px;text-rendering:optimizeLegibility;
  color:var(--ink);background:#EFE5D2;
  -webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,textarea{font:inherit}
svg{display:block}
h1,h2,h3,h4,p{margin:0}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ------------------------------------------------ app shell */
.app{
  position:relative;width:100%;max-width:820px;height:100vh;height:100dvh;
  margin:0 auto;background:var(--cream);overflow:hidden;isolation:isolate;
}
.view{position:absolute;inset:0}
.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;
  background:var(--cream);overflow:hidden;
  animation:screenIn .3s cubic-bezier(.22,.9,.3,1) both;
}
.scroll{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
  padding:calc(14px + var(--safe-top)) 20px calc(30px + var(--safe-bottom));
}
.scroll::-webkit-scrollbar{display:none}
.has-tab .scroll{padding-bottom:calc(104px + var(--safe-bottom))}

@media (min-width:700px) and (min-height:600px){
  body{
    background:
      radial-gradient(1200px 800px at 10% -10%,#E4F1D2 0%,rgba(228,241,210,0) 60%),
      radial-gradient(900px 700px at 110% 110%,#F8E3BE 0%,rgba(248,227,190,0) 60%),
      #EFE5D2;
    display:flex;align-items:center;justify-content:center;
  }
  .app{
    height:calc(100dvh - 48px);max-height:1120px;
    border-radius:36px;border:1px solid rgba(255,255,255,.65);
    box-shadow:0 40px 90px rgba(45,60,35,.22),0 2px 0 rgba(255,255,255,.8) inset;
  }
  .scroll{padding:calc(26px + var(--safe-top)) 32px calc(34px + var(--safe-bottom))}
  .has-tab .scroll{padding-bottom:calc(112px + var(--safe-bottom))}
}

@media (min-width:1000px){
  .app{max-width:880px}
}

/* ------------------------------------------------ status / tabbar */
.tabbar{
  position:absolute;left:0;right:0;bottom:0;z-index:40;
  height:calc(74px + var(--safe-bottom));
  padding:8px 12px calc(8px + var(--safe-bottom));
  display:flex;align-items:stretch;
  background:rgba(255,251,243,.95);
  border-top:1.5px solid #EFE2CB;
  box-shadow:0 -10px 24px rgba(94,70,30,.05);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
}
.tabbar .tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:12px;font-weight:var(--w-mid);color:#97A69B;letter-spacing:.5px;border-radius:14px;
}
.tabbar .tab .ic{width:40px;height:30px;border-radius:12px;display:grid;place-items:center;transition:background .18s ease}
.tabbar .tab.on{color:var(--green-d)}
.tabbar .tab.on .ic{background:#E4F6D5}
.tabbar .tab:active .ic{transform:scale(.94)}

/* ------------------------------------------------ shared atoms */
.eyebrow{font-size:11px;font-weight:var(--w-bold);letter-spacing:1.8px;color:var(--muted);text-transform:uppercase}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;
  padding:0 18px;border-radius:18px;
  background:linear-gradient(180deg,#3AA56B 0%,#28814F 100%);color:#fff;
  font-size:18px;font-weight:var(--w-bold);letter-spacing:.6px;
  box-shadow:0 5px 0 #1B6140,0 14px 24px rgba(32,110,70,.24);
  transition:transform .12s ease,box-shadow .12s ease;
}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1B6140,0 6px 14px rgba(32,110,70,.22)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn .hint{font-size:12.5px;font-weight:var(--w-mid);letter-spacing:.3px;opacity:.85;background:rgba(255,255,255,.18);padding:3px 8px;border-radius:99px}
.btn.yellow{background:linear-gradient(180deg,#FFD766,#F5B62F);color:#4C3306;box-shadow:0 5px 0 #D6971C,0 14px 24px rgba(214,151,28,.3)}
.btn.ghost{background:#fff;color:var(--green-d);border:2px solid #DDEBD2;box-shadow:0 4px 0 #E3EDD6}

.bar{height:12px;border-radius:99px;background:#EEE2CD;box-shadow:inset 0 2px 4px rgba(93,68,25,.08);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#A9D84B,#3AA56B);position:relative;transition:width .6s cubic-bezier(.22,.9,.3,1)}
.bar>i::after{content:"";position:absolute;left:5px;right:7px;top:2px;height:3px;border-radius:9px;background:rgba(255,255,255,.55)}
.bar.gold>i{background:linear-gradient(90deg,#FFD86B,#FFB13D)}

.star-pill{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 9px;border-radius:99px;
  background:#fff;border:1.5px solid #EFE1C8;box-shadow:0 4px 10px rgba(94,70,30,.07);
  font-size:16px;font-weight:var(--w-black);letter-spacing:.3px;white-space:nowrap;flex:none}
.circle-btn{width:38px;height:38px;border-radius:13px;background:#fff;border:1.5px solid var(--line);
  display:grid;place-items:center;flex:none;box-shadow:0 4px 10px rgba(94,70,30,.06);color:var(--ink)}
.circle-btn:active{transform:scale(.94)}

.avatar{width:46px;height:46px;border-radius:16px;background:#FFF6E2;border:2px solid #fff;
  box-shadow:0 5px 12px rgba(70,50,20,.14);overflow:hidden;position:relative;flex:none}
.avatar .crop{position:absolute;width:96px;height:96px;left:-39px;top:-7px}

/* ------------------------------------------------ animations */
@keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(6px)}}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-5px)}}
@keyframes evoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes starPop{0%{opacity:0;transform:scale(.4) rotate(-20deg)}70%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes confettiFall{0%{opacity:0;transform:translateY(-30px) rotate(0)}12%{opacity:.9}100%{opacity:.75;transform:translateY(160px) rotate(240deg)}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}

/* ============================================================
   DinoGo · 恐龙英语 — home：乐园首页 + 随机记单词 + 成长档案
   ============================================================ */

/* ------------------------------------------------ home */
.home-top{display:flex;align-items:center;gap:11px;margin-top:2px;margin-bottom:14px}
.home-top .greet{flex:1;min-width:0}
.home-top .hi{font-size:20px;font-weight:var(--w-black);letter-spacing:.2px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home-top .hi b{color:var(--green)}
.home-top .meta{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:var(--w-read);color:var(--muted);margin-top:3px;letter-spacing:.2px;white-space:nowrap;line-height:1;min-height:16px}
.home-top .meta .flame{color:var(--orange);display:flex;align-items:center;justify-content:center;height:16px;flex:none}

.hero{
  position:relative;height:clamp(332px,40vh,420px);border-radius:30px;overflow:hidden;
  border:1.5px solid #D9E8C2;
  background:linear-gradient(168deg,#DDF2CE 0%,#EFF8D6 48%,#FDF2D9 100%);
  transition:background .6s ease,border-color .6s ease;
}
.hero .scene{position:absolute;inset:0;transition:opacity .4s ease}
.hero .sun{position:absolute;right:34px;top:24px;width:62px;height:62px;border-radius:50%;
  background:radial-gradient(circle at 38% 34%,#FFF3B8,#FFD25E);
  box-shadow:0 0 0 12px rgba(255,218,112,.16);transition:all .5s ease}
.hero .moon{position:absolute;right:38px;top:28px;width:56px;height:56px;border-radius:50%;
  background:radial-gradient(circle at 38% 34%,#FFFCE8,#FFE9A8);box-shadow:0 0 26px rgba(255,236,170,.5)}
.hero .moon::after{content:"";position:absolute;left:-12px;top:4px;width:44px;height:44px;border-radius:50%;
  background:#1C4638;box-shadow:0 0 0 1px rgba(255,255,255,.02)}
.hero .stars i{position:absolute;background:#FFF6D8;border-radius:50%}
.hero .cloud{position:absolute;background:#fff;border-radius:99px;opacity:.62}
.hero .cloud.a{width:58px;height:18px;right:92px;top:32px}
.hero .cloud.b{width:40px;height:14px;right:118px;top:45px}
.hero .hill{position:absolute;left:-10%;right:-10%;border-radius:50% 50% 0 0;transition:background .6s ease}
.hero .hill.a{height:110px;bottom:-44px;background:#CDE9AC}
.hero .hill.b{height:86px;bottom:-40px;background:#B9DF92;left:34%;right:-24%}
.hero .leaves{position:absolute;pointer-events:none;opacity:.9}
.hero .leaves.l{left:-8px;bottom:66px;width:96px}
.hero .leaves.r{right:-12px;top:96px;width:86px;opacity:.75;transform:rotate(18deg)}
.hero .dino-wrap{
  position:absolute;left:calc(50% - 40px);bottom:82px;
  width:clamp(218px,28vh,300px);height:clamp(218px,28vh,300px);
  transform:translateX(-50%);
  filter:drop-shadow(0 14px 18px rgba(48,104,64,.18));
  animation:bob 4.2s ease-in-out infinite;
}
.hero .dino-wrap.ultra{filter:drop-shadow(0 0 26px rgba(255,210,90,.55)) drop-shadow(0 14px 18px rgba(48,104,64,.2))}
.hero .dino-wrap.with-hat{bottom:66px}
.hero .hero-id{position:absolute;left:14px;top:14px;z-index:4;display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.hero .stage-tag{position:static;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;
  border-radius:99px;background:rgba(255,255,255,.86);border:1.5px solid rgba(255,255,255,.92);
  font-size:12px;font-weight:var(--w-bold);color:var(--green-d);letter-spacing:.8px;backdrop-filter:blur(4px);
  box-shadow:0 3px 8px rgba(80,60,20,.08)}
.hero .name{position:static;display:flex;align-items:center;gap:6px}
.hero .name b{display:block;font-size:33px;font-weight:var(--w-black);letter-spacing:.2px;line-height:1.15;
  text-shadow:0 1px 0 rgba(255,255,255,.45)}
.hero .bubble{position:absolute;right:12px;top:138px;width:126px;padding:8px 10px;
  border-radius:12px 12px 12px 3px;background:#fff;font-size:11.5px;line-height:1.75;letter-spacing:.2px;
  font-weight:var(--w-read);color:#57705B;box-shadow:0 5px 12px rgba(70,50,20,.1)}
.hero .bubble b{color:var(--green);font-size:13px;font-weight:var(--w-black)}
.hero .bubble.max b{color:var(--orange)}

.growth-panel{
  position:absolute;left:12px;right:12px;bottom:12px;min-height:46px;border-radius:18px;
  background:rgba(255,255,255,.94);border:1.5px solid rgba(255,255,255,.9);
  box-shadow:0 8px 18px rgba(74,97,50,.12);backdrop-filter:blur(6px);
  display:flex;align-items:center;gap:9px;padding:2px 10px 2px 12px;
}
.growth-panel .g-main{flex:1;min-width:0}
.growth-panel .g-row{display:flex;align-items:baseline;gap:6px;line-height:1.1}
.growth-panel .lb{font-size:11.5px;font-weight:var(--w-bold);color:var(--muted);letter-spacing:1px}
.growth-panel .val{font-size:17px;font-weight:var(--w-black);color:var(--green-d);letter-spacing:.2px}
.growth-panel .val em{font-style:normal;font-size:11px;color:var(--muted);font-weight:var(--w-mid)}
.growth-panel .g-next{font-size:11px;line-height:1.2;font-weight:var(--w-read);color:#8A9B8D;margin-top:2px;letter-spacing:.2px;display:flex;justify-content:space-between}
.growth-panel .g-next b{color:var(--orange);font-weight:var(--w-black)}
.growth-panel .g-bar{height:7px;margin-top:2px}
.go-btn{width:40px;height:40px;border-radius:14px;flex:none;display:grid;place-items:center;color:#fff;
  background:linear-gradient(180deg,#3AA56B,#26804E);box-shadow:0 4px 0 #1A5E3D,0 8px 14px rgba(31,107,74,.28)}
.go-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #1A5E3D}
.go-btn.evolve{background:linear-gradient(180deg,#FFCF5C,#F0A92E);box-shadow:0 4px 0 #C98A1C,0 8px 14px rgba(201,138,28,.3);color:#4A3206}

.tasks{padding:13px 15px 12px;display:flex;flex-direction:column;gap:8px;margin-top:12px}
.tasks .head{display:flex;align-items:center;gap:8px}
.tasks .head h3{font-size:17px;font-weight:var(--w-black);letter-spacing:.3px}
.tasks .head .count{font-size:11px;font-weight:var(--w-black);color:var(--green-d);background:var(--green-l);padding:2px 7px;border-radius:99px;letter-spacing:.3px}
.tasks .head .more{margin-left:auto;font-size:11.5px;font-weight:var(--w-read);color:var(--muted);display:flex;align-items:center;gap:2px}
.task{display:flex;align-items:center;gap:9px;height:32px}
.task .ico{width:29px;height:29px;border-radius:10px;display:grid;place-items:center;flex:none}
.task .ico.orange{background:#FFF0D2;color:#E69523}
.task .ico.blue{background:#E6F4FF;color:#3D8FC4}
.task .ico.coral{background:#FFE7DE;color:#E96A4B}
.task .t-body{flex:1;min-width:0}
.task .t-title{font-size:13.5px;font-weight:var(--w-mid);line-height:1.35}
.task .t-sub{font-size:11px;font-weight:var(--w-read);color:#A0AFA3;margin-top:2px;line-height:1.4}
.task .reward{font-size:10.5px;font-weight:var(--w-black);color:#A98425;background:#FFF4CE;border-radius:99px;padding:3px 7px;letter-spacing:.2px;white-space:nowrap}
.task .check{width:20px;height:20px;border-radius:50%;border:2px solid #E3D6BF;flex:none;display:grid;place-items:center;color:#fff}
.task.done .check{background:var(--green);border-color:var(--green)}
.task.done .t-title{color:#809184;text-decoration:line-through;text-decoration-thickness:1.5px}

.word-card{min-height:140px;margin-top:12px;border-radius:24px;padding:12px 16px;display:flex;align-items:center;gap:14px;
  background:linear-gradient(120deg,#FFF4CF 0%,#FFE9B8 100%);border:1.5px solid #F3DFA6;
  box-shadow:0 10px 22px rgba(196,146,41,.12);position:relative;overflow:hidden;width:100%;text-align:left}
.word-card .ring{position:absolute;right:-26px;top:-30px;width:110px;height:110px;border-radius:50%;border:14px solid rgba(255,255,255,.35)}
.word-card .spk{width:58px;height:58px;border-radius:18px;background:#fff;display:grid;place-items:center;color:#B4811C;
  box-shadow:0 4px 10px rgba(180,129,28,.18);flex:none;position:relative}
.word-card .w-main{flex:1;position:relative;min-width:0;text-align:left}
.word-card .w-kicker{font-size:10px;font-weight:var(--w-black);letter-spacing:1.5px;color:#B58A2E;white-space:nowrap}
.word-card .w-word{font-size:36px;font-weight:var(--w-black);letter-spacing:.4px;line-height:1.2;color:#4A360F;white-space:nowrap}
.word-card .w-emoji{display:inline-block;margin-right:.25em;font-size:.95em;vertical-align:-.06em}
.word-card .w-pron-row{display:flex;align-items:center;flex-wrap:wrap;column-gap:18px;row-gap:4px;margin-top:4px}
.word-card .w-phon{font-size:12.5px;font-weight:var(--w-read);color:#A68A4E;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.word-card .w-example{font-size:12.5px;font-weight:var(--w-read);line-height:1.6;letter-spacing:.1px;color:#7A5A1A;white-space:nowrap}
.word-card .w-example-zh{font-size:11.5px;font-weight:var(--w-read);line-height:1.6;color:#A68A4E;white-space:nowrap}
@keyframes spk-shake{0%,100%{transform:rotate(0) scale(1)}30%{transform:rotate(-8deg) scale(.94)}65%{transform:rotate(8deg) scale(.94)}}
.word-card .spk:active{animation:spk-shake .24s ease}

.home-note{margin:12px 4px 0;font-size:11px;font-weight:var(--w-read);color:#AC9C80;text-align:center;line-height:1.7;letter-spacing:.2px}

/* hero background themes · 白天沿用已购背景，夜晚统一夜空 */
.hero.sky-day.bg-sunset{background:linear-gradient(170deg,#FFD9A8 0%,#FFC7A0 44%,#FFE4C0 100%);border-color:#F1CBA4}
.hero.sky-day.bg-sunset .sun{right:50px;top:70px;background:radial-gradient(circle at 38% 34%,#FFF3C4,#FF9E5C);
  box-shadow:0 0 0 16px rgba(255,158,92,.16),0 0 60px rgba(255,158,92,.4)}
.hero.sky-day.bg-sunset .hill.a{background:#E7B68C}
.hero.sky-day.bg-sunset .hill.b{background:#D49A76}
.hero.sky-night{background:linear-gradient(170deg,#183F38 0%,#1E4E40 45%,#2A5A46 100%);border-color:#2D5C4A}
.hero.sky-night .hill.a{background:#245845}
.hero.sky-night .hill.b{background:#1C4938}
.hero.sky-night .name b{color:#FFF6DE}
.hero.sky-night .bubble{background:rgba(255,255,255,.94);color:#57705B}
.hero.sky-night .stage-tag{background:rgba(255,255,255,.9)}
.hero.sky-night .leaves{opacity:.42;filter:brightness(.75)}

/* ------------------------------------------------ profile */
.profile-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.profile-head .t{flex:1;min-width:0}
.profile-head h1{font-size:clamp(22px,3.6vw,28px);font-weight:var(--w-black);letter-spacing:-.5px}
.profile-head p{font-size:11.5px;font-weight:var(--w-read);color:var(--muted);margin-top:2px}
.profile-card{border-radius:26px;padding:15px;display:flex;align-items:center;gap:12px;position:relative;overflow:hidden;
  background:linear-gradient(125deg,#FFF7E4,#F7EEDB);border:1.5px solid #EBDCC0}
.profile-card .pc-ava{width:62px;height:62px;border-radius:20px;background:#E6F5D3;border:2.5px solid #fff;overflow:hidden;
  position:relative;flex:none;box-shadow:0 6px 14px rgba(70,50,20,.12);z-index:1}
.profile-card .pc-ava .crop{position:absolute;width:110px;height:110px;left:-45px;top:-4px}
.profile-card .pc-main{flex:1;min-width:0;position:relative;z-index:1}
.profile-card .pc-main b{font-size:19px;font-weight:var(--w-black);letter-spacing:-.2px}
.profile-card .pc-main .lv{font-size:10px;font-weight:var(--w-black);color:#fff;background:var(--green);padding:2px 6px;border-radius:5px;margin-left:5px;vertical-align:2px}
.profile-card .pc-main p{font-size:11.5px;font-weight:var(--w-read);color:#8D7E62;margin-top:4px}
.profile-card .pc-stage{text-align:right;flex:none;position:relative;z-index:1}
.profile-card .pc-stage .chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:99px;
  background:#fff;font-size:10.5px;font-weight:var(--w-bold);color:var(--green-d);border:1px solid #DDEBD0;white-space:nowrap}
.profile-card .pc-stage p{font-size:10px;color:#A3927A;margin-top:5px;white-space:nowrap}
.profile-card .leaf{position:absolute;right:-16px;bottom:-22px;width:96px;opacity:.2;z-index:0}

.stat-row{display:flex;gap:9px;margin-top:12px}
.stat-card{flex:1;min-height:68px;border-radius:18px;background:#fff;border:1.5px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 5px 12px rgba(94,70,30,.05)}
.stat-card .v{font-size:18px;font-weight:var(--w-black);display:flex;align-items:center;gap:3px}
.stat-card .k{font-size:10px;font-weight:var(--w-mid);color:var(--muted);letter-spacing:.4px}

.chart-card{border-radius:24px;padding:14px 16px 12px;margin-top:12px;height:216px;display:flex;flex-direction:column}
@media (min-width:700px) and (min-height:600px){.chart-card{height:238px}}
.chart-card .ch-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.chart-card .ch-head .lb{font-size:11px;font-weight:var(--w-bold);letter-spacing:.8px;color:var(--muted)}
.chart-card .ch-head .v{font-size:23px;font-weight:var(--w-black);color:var(--green-d);margin-top:1px}
.chart-card .ch-head .v small{font-size:11px;font-weight:var(--w-mid);color:var(--muted)}
.chart-card .ch-head .goal{font-size:10px;font-weight:var(--w-bold);color:#8A6415;background:#FFF4CE;padding:3px 7px;border-radius:99px;white-space:nowrap}
.chart{flex:1;display:flex;align-items:flex-end;gap:9px;margin-top:8px;position:relative;padding-top:10px;min-height:110px}
.chart .gl{position:absolute;left:0;right:0;bottom:22px;border-top:1.5px dashed #E6D9C1}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end;position:relative;z-index:2}
.chart .col .b{width:22px;border-radius:7px;background:#DCEBCB;position:relative}
.chart .col .b::after{content:"";position:absolute;left:4px;right:4px;top:3px;height:3px;border-radius:9px;background:rgba(255,255,255,.6)}
.chart .col.today .b{background:linear-gradient(180deg,#FFD25A,#F2A93B);box-shadow:0 4px 8px rgba(242,169,59,.3)}
.chart .col .d{font-size:10px;font-weight:var(--w-mid);color:#A6B2A4}
.chart .col.today .d{color:#8A6415;font-weight:var(--w-black)}
.chart .col .tip{position:absolute;top:-14px;font-size:10px;font-weight:var(--w-black);color:#8A6415;background:#FFF4CE;padding:2px 5px;border-radius:5px;white-space:nowrap}

.ach-card{border-radius:24px;padding:14px 16px 16px;margin-top:12px}
.ach-card .ach-head{display:flex;align-items:center;justify-content:space-between}
.ach-card .ach-head b{font-size:14px;font-weight:var(--w-black)}
.ach-card .ach-head span{font-size:10.5px;font-weight:var(--w-mid);color:var(--muted)}
.ach-list{display:flex;gap:10px;margin-top:12px}
.ach{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.ach .medal{width:clamp(44px,9vw,54px);height:clamp(44px,9vw,54px);border-radius:50%;display:grid;place-items:center;position:relative}
.ach .medal.a1{background:linear-gradient(160deg,#FFE39B,#F5B641);color:#7A4E08;box-shadow:0 5px 12px rgba(245,182,65,.3)}
.ach .medal.a2{background:linear-gradient(160deg,#CFE9FF,#8EC7F2);color:#265A80;box-shadow:0 5px 12px rgba(142,199,242,.3)}
.ach .medal.a3{background:linear-gradient(160deg,#E2D6FF,#AE96F5);color:#4B3585;box-shadow:0 5px 12px rgba(174,150,245,.3)}
.ach .medal.lock{background:#F2ECDF;color:#C0B7A4;border:1.5px dashed #D9CFBB}
.ach .medal .dot{position:absolute;right:0;bottom:2px;width:14px;height:14px;border-radius:50%;background:var(--green);border:2px solid #fff;display:grid;place-items:center;color:#fff}
.ach b{font-size:10px;font-weight:var(--w-bold);color:#5E7263;text-align:center}
.ach span{font-size:9.5px;font-weight:var(--w-read);color:#AAB4A8;margin-top:-2px}

.quote-card{min-height:64px;border-radius:20px;margin-top:12px;background:linear-gradient(120deg,#EAF7D9,#F7FBE9);border:1.5px solid #D8E9C4;
  display:flex;align-items:center;gap:10px;padding:10px 14px}
.quote-card .q{font-size:11px;font-weight:var(--w-mid);color:#6D8464;line-height:1.5}
.quote-card .qi{width:32px;height:32px;border-radius:11px;background:#fff;display:grid;place-items:center;color:#E2A62E;flex:none}
.profile-cta{margin-top:12px}
.profile-scroll{display:flex;flex-direction:column}
.profile-scroll > *{flex:none}
/* 语录卡吸附底部时 auto 外边距会归零，用前一卡的下间距兜底保证最小间距 */
.profile-scroll .ach-card{margin-bottom:12px}
.profile-scroll .quote-card{margin-top:auto}

/* ============================================================
   DinoGo · 恐龙英语 — map：旅程进度 / 主题地图 / 下一关
   ============================================================ */

/* ------------------------------------------------ theme tabs */
/* 顶部主题切换：居中的分段控件，整体放大 */
.theme-tabs{display:flex;gap:5px;width:max-content;max-width:100%;margin:0 auto 18px;padding:5px;
  border-radius:99px;background:#F3EADA;border:1.5px solid #E7DAC3;
  box-shadow:inset 0 2px 5px rgba(120,90,40,.07);overflow-x:auto;scrollbar-width:none}
.theme-tabs::-webkit-scrollbar{display:none}
.theme-tabs .tt{flex:none;display:flex;align-items:center;justify-content:center;gap:7px;
  padding:13px 14px;border-radius:99px;white-space:nowrap;
  background:transparent;border:0;box-shadow:none;font-size:15px;font-weight:var(--w-bold);color:#8B7B5C;
  transition:background .18s ease,color .18s ease,box-shadow .18s ease,transform .12s ease}
.theme-tabs .tt:active{transform:scale(.97)}
.theme-tabs .tt b{font-size:19px;font-weight:400;line-height:1}
.theme-tabs .tt.on{background:linear-gradient(180deg,#4F9E62,#3F8851);color:#fff;
  box-shadow:0 2px 6px rgba(52,110,70,.28),inset 0 1px 0 rgba(255,255,255,.28)}

/* ------------------------------------------------ hero */
.map-hero{padding:2px 2px 12px}
.map-hero .eyebrow{display:inline-flex;align-items:center;gap:6px;color:var(--green);
  font-size:10.5px;font-weight:var(--w-black);letter-spacing:1.8px;text-transform:uppercase;margin-bottom:8px}
.map-hero .eyebrow i{width:6px;height:6px;border-radius:50%;background:#82A16C}
.map-hero h1{font-size:30px;line-height:1.2;font-weight:var(--w-black);letter-spacing:.4px}
.map-hero h1 span{background:linear-gradient(transparent 64%,#FFE08A 64%);padding:0 2px}
.map-hero p{font-size:12px;font-weight:var(--w-read);color:var(--muted);line-height:1.7;margin-top:7px}

/* ------------------------------------------------ journey */
.journey{display:flex;align-items:center;gap:10px;padding:11px 14px;margin-bottom:14px;
  background:#FFFDF7;border:1.5px solid var(--line);border-radius:18px;box-shadow:0 4px 0 #EADAC0}
.journey .j-lb{font-size:10px;font-weight:var(--w-black);color:#947B5A;letter-spacing:1.2px;white-space:nowrap}
.journey .j-val{font-size:16px;font-weight:var(--w-black);letter-spacing:.2px;white-space:nowrap}
.journey .j-val em{font-style:normal;font-size:10.5px;color:var(--muted);font-weight:var(--w-bold);margin-left:2px}
.journey .track{flex:1;height:7px;border-radius:99px;background:#EFE4CE;overflow:hidden}
.journey .track i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,#9CCB58,#2E8B57);transition:width .5s cubic-bezier(.22,.9,.3,1)}

/* ------------------------------------------------ map card */
.map-card{position:relative;height:clamp(388px,47vh,470px);border-radius:30px;overflow:hidden;isolation:isolate;
  border:1.5px solid var(--line)}
.map-card .deco{position:absolute;pointer-events:none;z-index:1}
.map-card .route{position:absolute;inset:0;width:100%;height:100%;z-index:2}

.map-tag{position:absolute;left:14px;top:14px;z-index:4;display:inline-flex;align-items:center;gap:5px;
  padding:6px 11px;border-radius:99px;font-size:10px;font-weight:var(--w-black);letter-spacing:1.2px;color:#8A7550;
  background:rgba(255,253,247,.88);border:1px solid rgba(214,198,166,.8);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}

/* ------------------------------------------------ nodes：贴纸三态 */
.mnode{position:absolute;z-index:3;width:60px;height:60px;transform:translate(-50%,-50%);border-radius:50%;
  background:#FFFDF7;border:3px solid #fff;display:grid;place-items:center;font-size:28px;line-height:1;
  box-shadow:0 5px 10px rgba(90,70,30,.18),0 0 0 2px rgba(214,198,166,.55);transition:transform .18s ease}
.mnode[data-action]{cursor:pointer}
.mnode:active{transform:translate(-50%,-50%) scale(.94)}
.mnode .disc{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;font-size:inherit;line-height:1}
.mnode .num{position:absolute;left:-7px;top:-7px;z-index:1;min-width:21px;height:21px;padding:0 4px;
  border-radius:99px;background:#FFF7DD;border:2px solid #EDD2A3;display:grid;place-items:center;
  font-size:11px;font-weight:var(--w-black);color:#8A6415;line-height:1;font-variant-numeric:tabular-nums}
.mnode .state{position:absolute;right:-6px;bottom:-6px;width:22px;height:22px;border-radius:50%;
  display:grid;place-items:center;background:var(--green);color:#fff;border:2px solid #fff;
  box-shadow:0 2px 4px rgba(30,90,60,.3);font-size:11px;font-weight:var(--w-black);line-height:1}
.mnode.done{border-color:#DFF2C8}
.mnode.locked{filter:grayscale(.55);opacity:.62;
  box-shadow:0 4px 8px rgba(90,70,30,.12),0 0 0 2px rgba(214,198,166,.55)}
.mnode.now{width:72px;height:72px;font-size:33px;border-color:#F4FFDC;
  box-shadow:0 0 0 7px rgba(184,224,90,.42),0 8px 16px rgba(70,110,40,.24)}
.mnode.now .ring{position:absolute;inset:-14px;border-radius:50%;border:2px dashed #9CC247;
  opacity:.75;animation:spin 22s linear infinite}
.mnode.now .go{position:absolute;left:50%;bottom:calc(100% + 12px);transform:translateX(-50%);
  padding:5px 10px;border-radius:99px;white-space:nowrap;
  background:var(--lime);color:#25401A;font-size:11px;font-weight:var(--w-black);letter-spacing:.6px;
  border:1.5px solid #fff;box-shadow:0 3px 0 #93BD3E}
.mnode.now .go:after{content:"";position:absolute;left:50%;bottom:-5px;width:8px;height:8px;
  background:var(--lime);border-right:1.5px solid #fff;border-bottom:1.5px solid #fff;
  transform:translateX(-50%) rotate(45deg)}
/* 靠近卡片顶部的当前节点：GO 气泡放到节点右侧，避免被裁切或压住下一站 */
.mnode.now.go-right .go{left:calc(100% + 8px);top:50%;bottom:auto;transform:translateY(-50%)}
.mnode.now.go-right .go:after{left:-5px;top:50%;bottom:auto;transform:translateY(-50%) rotate(45deg);
  border:0;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff}
.mnode.chest{width:48px;height:48px;background:linear-gradient(145deg,#FFF6DF,#FFD98A);border-color:#fff;
  box-shadow:0 5px 10px rgba(150,110,30,.24),0 0 0 2px rgba(230,196,120,.7)}
.mnode.chest .disc{font-size:22px}

/* ------------------------------------------------ caption */
.caption{position:absolute;z-index:4;left:8%;right:8%;bottom:14px;display:flex;align-items:center;gap:8px;
  padding:8px 12px;border-radius:14px;
  background:rgba(255,253,247,.9);border:1px solid rgba(214,198,166,.75);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.caption b{font-size:12px;font-weight:var(--w-black);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.caption span{font-size:10.5px;font-weight:var(--w-bold);color:#8A7550;margin-left:auto;white-space:nowrap}

/* ------------------------------------------------ next card */
.next-card{display:flex;align-items:center;gap:12px;margin-top:14px;padding:13px 14px;
  background:#FFFDF7;border:1.5px solid var(--line);border-radius:22px;box-shadow:0 4px 0 #EADAC0}
.nc-l{flex:1;min-width:0}
.nc-kicker{display:flex;align-items:center;gap:4px;font-size:9.5px;font-weight:var(--w-black);
  letter-spacing:1.5px;color:#B58A2E}
.nc-kicker svg{width:8px;height:8px}
.nc-l h3{font-size:17px;font-weight:var(--w-black);letter-spacing:.2px;margin-top:3px}
.nc-meta{font-size:10.5px;font-weight:var(--w-read);color:var(--muted);margin-top:3px}
.nc-btn{flex:none;display:inline-flex;align-items:center;gap:5px;padding:11px 15px;border-radius:15px;
  background:var(--green);color:#fff;font-size:13.5px;font-weight:var(--w-bold);letter-spacing:.3px;
  box-shadow:0 4px 0 var(--green-d);transition:transform .12s ease,box-shadow .12s ease}
.nc-btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--green-d)}
.nc-btn svg{width:14px;height:14px}

/* ------------------------------------------------ iPad */
@media (min-width:700px) and (min-height:600px){
  .map-hero h1{font-size:34px}
  .map-card{height:480px}
}

/* ============================================================
   DinoGo · 恐龙英语 — 游戏样式
   包含公共答题流程、结算和进化样式
   ============================================================ */

.quiz-page{display:flex;flex-direction:column;height:100%;padding-top:calc(8px + var(--safe-top))}
.quiz-top{display:flex;align-items:center;gap:10px;padding:6px 20px 0;flex:none}
.quiz-top .qbar{flex:1;height:12px}
.quiz-top .qcount{font-size:12px;font-weight:var(--w-black);color:var(--green-d);white-space:nowrap}
.quiz-top .qcount em{font-style:normal;color:#A5B2A7;font-weight:var(--w-mid)}
.hearts{display:flex;align-items:center;gap:3px;flex:none}
.quiz-body{flex:1;min-height:0;overflow:hidden;padding:8px 20px 2px;display:flex;flex-direction:column;scrollbar-width:none}
.quiz-body::-webkit-scrollbar{display:none}
.quiz-prompt{display:flex;flex-direction:column;gap:7px;margin-top:4px;flex:none}
.quiz-prompt .chip{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:7px;
  background:#E8F5D8;color:var(--green-d);font-size:10.5px;font-weight:var(--w-black);letter-spacing:1px}
.quiz-prompt h2{font-size:clamp(19px,3.2vw,23px);font-weight:var(--w-black);letter-spacing:-.4px}
.quiz-art{
  flex:1;min-height:0;max-height:470px;margin-top:12px;border-radius:28px;position:relative;overflow:hidden;
  background:radial-gradient(circle at 50% 42%,#FFFDF2 0%,#FFF3D6 55%,#FBE8BE 100%);
  border:1.5px solid #F2DFB2;display:grid;place-items:center
}
.quiz-art::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(190,150,60,.16) 1px,transparent 1px);background-size:22px 22px}
.quiz-art .blob{position:absolute;width:58%;max-width:250px;aspect-ratio:1;border-radius:48% 52% 55% 45%/50% 46% 54% 50%;
  background:#FFE6A9;opacity:.55}
.quiz-art .fruit{position:relative;width:100%;height:100%;max-width:100%;max-height:100%;padding:5% 4%;
  filter:drop-shadow(0 16px 18px rgba(160,98,24,.2));animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
.quiz-art .art-tag{position:absolute;left:14px;top:14px;font-size:10.5px;font-weight:var(--w-black);letter-spacing:1.3px;color:#C49A3E}
.quiz-art .art-spark{position:absolute;color:#E8C377;opacity:.8}
.quiz-art .s1{left:34px;top:76px}
.quiz-art .s2{right:38px;top:112px}
.quiz-art .s3{left:52px;bottom:88px}
.listen{height:34px;padding:0 12px;border-radius:99px;background:#fff;
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:var(--w-bold);color:#9B7620;
  box-shadow:0 5px 12px rgba(155,118,32,.16)}
.quiz-art .listen{position:absolute;right:14px;bottom:14px}
.listen-row{display:flex;justify-content:flex-end;margin-top:8px;flex:none}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:none;margin-top:14px}
.option{min-height:70px;border-radius:18px;background:#fff;border:2px solid #EFE2CB;display:flex;align-items:center;gap:9px;
  padding:0 12px;box-shadow:0 4px 10px rgba(94,70,30,.05);position:relative;text-align:left;transition:all .15s ease}
.option .key{width:26px;height:26px;border-radius:9px;background:#F3EFE4;display:grid;place-items:center;
  font-size:12px;font-weight:var(--w-black);color:#A6987B;flex:none;transition:all .15s ease}
.option .word{font-size:18px;font-weight:var(--w-bold);letter-spacing:-.1px;line-height:1.2}
.option .mark{margin-left:auto;width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}
.option .mark.radio{background:#fff;border:2px solid #3AA56B}
.option .mark.radio i{display:block;width:10px;height:10px;border-radius:50%;background:#3AA56B}
.option.sel{border-color:#3AA56B;background:#F4FBEC;box-shadow:0 4px 0 #D7EBC4,0 8px 16px rgba(58,165,107,.12)}
.option.sel .key{background:#DFF2CC;color:var(--green-d)}
.option.correct{border-color:#3AA56B;background:#EDF9E1}
.option.correct .key{background:#3AA56B;color:#fff}
.option.wrong{border-color:#F07A6A;background:#FFF0EC;animation:shake .4s ease}
.option.wrong .key{background:#F07A6A;color:#fff}
.option.dim{opacity:.55}
/* 听音选图：图片选项 + 听力按钮 + 连线 + 跟读 + 情景对话 */
.options.pic-grid{grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:9px;margin-top:12px;flex:1;min-height:0}
.option.pic{flex-direction:column;gap:2px;padding:6px;min-height:0;height:100%;position:relative;overflow:hidden}
.option.pic .key{position:absolute;left:8px;top:8px;width:22px;height:22px;font-size:11px}
.option.pic .pic{flex:1;min-height:0;min-width:0;width:100%;display:grid;place-items:center;overflow:hidden}
.option.pic .pic svg{width:100%;height:100%;display:block}
.option.pic .pic-word{font-size:14px;font-weight:var(--w-black);color:var(--green-d);letter-spacing:-.2px;flex:none}
.big-speaker{width:clamp(72px,14vh,96px);height:clamp(72px,14vh,96px);border-radius:50%;display:grid;place-items:center;color:#fff;
  background:linear-gradient(160deg,#57BE84,#2E8B57);box-shadow:0 10px 20px rgba(46,139,87,.28);position:relative}
.big-speaker:active{transform:scale(.95)}
.quiz-art .listen-tip{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:11.5px;font-weight:var(--w-bold);color:#A89A7E}
/* 听音选图：把空间让给 2×2 图片卡，喇叭区固定为小高度 */
.quiz-art.listen-art{flex:0 0 auto;height:clamp(146px,24vh,216px);max-height:216px;margin-top:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px 0}
.quiz-art.listen-art .big-speaker{width:clamp(64px,12vh,84px);height:clamp(64px,12vh,84px);flex:none}
.quiz-art.listen-art .listen-tip{position:static;bottom:auto;flex:none}
.match-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr);gap:12px;margin-top:14px;flex:1;min-height:0}
.match-col{display:flex;flex-direction:column;gap:9px;min-height:0}
.mcard{border-radius:16px;background:#fff;border:2px solid #EFE2CB;min-height:0;flex:1;display:flex;align-items:center;justify-content:center;
  font-size:16.5px;font-weight:var(--w-bold);color:#4B443A;padding:6px;transition:transform .12s ease;overflow:hidden}
.mcard:active{transform:scale(.97)}
.mcard.art svg{width:100%;height:100%;display:block}
.mcard.sel{border-color:#3AA56B;box-shadow:0 0 0 3px rgba(58,165,107,.16)}
.mcard.ok{border-color:#B9DDA1;background:#EFF8E4;opacity:.7}
.repeat-word{margin-top:12px;text-align:center;display:flex;flex-direction:column;gap:3px}
.repeat-word b{font-size:28px;font-weight:var(--w-black);color:var(--green-d);letter-spacing:-.4px}

.dialog-card{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.dlg{display:flex;gap:9px;align-items:center;background:#fff;border:2px solid #EFE2CB;border-radius:18px;padding:11px 13px}

.quiz-foot{flex:none;padding:10px 20px calc(18px + var(--safe-bottom));display:flex;flex-direction:column;gap:10px;background:var(--cream)}
.combo{min-height:44px;border-radius:15px;display:flex;align-items:center;justify-content:center;gap:6px;
  background:linear-gradient(90deg,#FFF0C9,#FFE4A6);border:1.5px solid #F5D48B;

.combo.bad{background:#FFF1ED;border-color:#F5BCAF;color:#B0553F}
.combo.bad b{color:#C04532}

/* ------------------------------------------------ 答题动态反馈 */
.qfx{position:absolute;inset:0;z-index:30;pointer-events:none;overflow:hidden}
.ok-fx::before{content:"";position:absolute;left:50%;top:40%;width:min(80vw,380px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(255,210,90,.5) 0%,rgba(255,210,90,0) 66%);
  transform:translate(-50%,-50%);animation:fxGlow .95s ease both}
.fx-confetti{position:absolute;inset:0}
.fx-confetti i{position:absolute;top:-8%;display:block;animation:fxFall linear both}
.fx-badge{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;padding:18px 30px 16px;border-radius:26px;
  background:linear-gradient(160deg,#FFFDF4,#FFF0C4);border:2px solid #FFDE8E;
  box-shadow:0 18px 40px rgba(120,80,10,.22),0 0 0 10px rgba(255,214,102,.16);
  animation:fxPop .45s cubic-bezier(.2,1.5,.4,1) both,fxOut .3s 1.45s ease both}
.fx-badge .fx-check{width:52px;height:52px;border-radius:50%;margin-bottom:7px;display:grid;place-items:center;
  background:linear-gradient(180deg,#5BC178,#2E8B57);box-shadow:0 6px 14px rgba(46,139,87,.3)}
.fx-badge b{font-size:24px;font-weight:var(--w-black);color:#7C5209;letter-spacing:1px;line-height:1.15}
.fx-badge .fx-sub{font-size:12px;font-weight:var(--w-bold);color:#A9852C;margin-top:3px;white-space:nowrap}

.bad-fx .fx-wrong{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);
  display:flex;align-items:center;gap:11px;padding:12px 18px;border-radius:20px;
  background:#FFF7F3;border:2px solid #F5B6A8;box-shadow:0 16px 34px rgba(150,50,30,.18);
  animation:fxPop .4s cubic-bezier(.2,1.4,.4,1) both,fxOut .3s 1.5s ease both}
.fx-wrong-ic{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:#F07A6A;color:#fff;font-size:18px;font-weight:var(--w-black);box-shadow:0 4px 10px rgba(200,70,50,.25)}
.fx-wrong-txt b{display:block;font-size:11px;font-weight:var(--w-black);letter-spacing:1.2px;color:#B0654F}
.fx-wrong-txt span{display:block;font-size:25px;font-weight:var(--w-black);color:#C04532;line-height:1.15;
  letter-spacing:-.3px;margin-top:1px;max-width:min(58vw,320px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

@keyframes fxPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}
  65%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1)}
}
@keyframes fxOut{to{opacity:0;transform:translate(-50%,-50%) scale(.94)}}
@keyframes fxFall{
  0%{opacity:0;transform:translateY(-20px) rotate(0)}
  10%{opacity:1}
  100%{opacity:.8;transform:translateY(108vh) rotate(560deg)}
}
@keyframes fxGlow{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}
  45%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.2)}
}

/* ------------------------------------------------ dex */

.dex-card .nm{font-size:11px;font-weight:var(--w-bold);margin-top:5px}

  <script>
/* ============================================================
   DinoGo · 恐龙英语 — 主题注册与默认玩法
   每个主题可独立覆盖关卡题序和题型实现
   ============================================================ */
(function () {
  "use strict";

  function defaultLevelGames() {
    return {
      1: ["pic", "listen", "pic", "listen", "pic"],
      2: ["pic", "listen", "pic", "listen", "pic"],
      3: ["pic", "listen", "match", "pic", "listen"],
      4: ["listen", "pic", "match", "listen", "pic"],
      5: ["pic", "match", "repeat", "listen", "pic"],
      6: ["listen", "repeat", "match", "pic", "listen"],
      7: ["pic", "match", "repeat", "dialog", "listen"],
      8: ["listen", "dialog", "match", "repeat", "pic"],
      9: ["dialog", "match", "listen", "dialog", "repeat"],
      10: ["dialog", "listen", "dialog", "match", "repeat"],
    };
  }

  function buildOptions(task, pool, count) {
    task.options = shuffle([
      task.word,
      ...shuffle(pool.filter((x) => x.word !== task.word)).slice(0, count - 1).map((x) => x.word),
    ]);
  }

  function defaultGames() {
    return {
      pic: {
        label: "看图选词",
        title: "看图，选出正确的单词",
        build(task, pool) {
          buildOptions(task, pool, 4);
        },
        render({ q, choiceButton, options }) {
          return {
            body: `<div class="quiz-art">
                <div class="blob"></div>
                <div class="art-tag">WHAT IS IT?</div>
                <span class="art-spark s1">${spark(15, "#E8C377")}</span>
                <span class="art-spark s2">${spark(11, "#E8C377")}</span>
                <span class="art-spark s3">${spark(8, "#E8C377")}</span>
                ${q.art()}
                ${listenPill()}
              </div>
              <div class="options">${options(q.options)}</div>`,
            btn: choiceButton("选一个答案"),
          };
        },
      },
      listen: {
        label: "听音选图",
        title: "听单词，选出正确的图片",
        autoSpeak: true,
        build(task, pool) {
          buildOptions(task, pool, 4);
        },
        render({ q, quiz, optionClass, choiceButton, letters, artOf }) {
          const revealed = quiz.revealed;
          return {
            body: `<div class="quiz-art listen-art">
                <div class="blob"></div>
                <div class="art-tag">LISTEN &amp; CHOOSE</div>
                <button class="big-speaker" data-action="speak-word" data-word="${q.word}" aria-label="再听一遍">${I.speaker(46)}</button>
                <div class="listen-tip">听发音，选出对应的图片</div>
                ${listenPill()}
              </div>
              <div class="options pic-grid">${q.options.map((opt, i) => {
                const cls = optionClass(opt, "option pic");
                const label = revealed && opt === q.word ? `<b class="pic-word">${opt}</b>` : "";
                return `<button class="${cls}" data-action="select" data-word="${opt}">
                  <span class="key">${letters[i]}</span><span class="pic">${artOf(opt)()}</span>${label}
                </button>`;
              }).join("")}</div>`,
            btn: choiceButton("选一张图片"),
          };
        },
      },
      match: {
        label: "单词连线",
        title: "把单词和图片连起来",
        build(task, pool) {
          const trio = shuffle(pool).slice(0, 3);
          task.pairs = trio.map((x) => ({ word: x.word, art: x.art }));
          task.words = shuffle(trio.map((x) => x.word));
          task.arts = shuffle(trio.map((x) => ({ word: x.word, art: x.art })));
        },
        render({ q, quiz }) {
          const solved = quiz.matched;
          const wordCol = q.words.map((w) => `<button class="mcard word ${solved.includes(w) ? "ok" : ""} ${quiz.pickWord === w ? "sel" : ""}"
              data-action="match-word" data-word="${w}">${w}</button>`).join("");
          const artCol = q.arts.map((p) => `<button class="mcard art ${solved.includes(p.word) ? "ok" : ""}"
              data-action="match-art" data-word="${p.word}">${p.art()}</button>`).join("");
          return {
            body: `<div class="match-grid"><div class="match-col">${wordCol}</div><div class="match-col">${artCol}</div></div>
              <div class="listen-row">${listenPill()}</div>`,
            btn: `<button class="btn" disabled>连对 3 组即可过关 ${I.arrow(18)}</button>`,
          };
        },
        onPickWord(word) {
          if (!quiz || quiz.revealed) return;
          quiz.pickWord = word;
          sfx("tap");
          render();
        },
        onPickArt(word) {
          if (!quiz || quiz.revealed || !quiz.pickWord) return;
          const q = quiz.order[quiz.index];
          if (word === quiz.pickWord) {
            quiz.matched.push(word);
            quiz.pickWord = null;
            sfx("correct");
            if (quiz.matched.length >= q.pairs.length) {
              quiz.revealed = true;
              quiz.choiceCorrect = quiz.matchWrong === 0;
              if (quiz.choiceCorrect) {
                quiz.correct++;
                quiz.combo++;
                q.pairs.forEach((p) => quiz.words.push(p.word));
              } else {
                quiz.combo = 0;
              }
              render();
              setTimer(() => nextQuestion(), 1500);
              return;
            }
          } else {
            quiz.matchWrong++;
            quiz.pickWord = null;
            quiz.hearts = Math.max(0, quiz.hearts - 1);
            quiz.combo = 0;
            sfx("wrong");
            if (quiz.hearts <= 0) {
              quiz.revealed = true;
              quiz.choiceCorrect = false;
              render();
              setTimer(() => nextQuestion(), 1600);
              return;
            }
            toast("这两张不匹配，再试一次");
          }
          render();
        },
      },
      repeat: {
        label: "跟读练习",
        title: "听发音，大声跟读这个单词",
        autoSpeak: true,
        render({ q, quiz, total }) {
          const revealed = quiz.revealed;
          return {
            body: `<div class="quiz-art">
                <div class="blob"></div>
                <div class="art-tag">READ IT OUT</div>
                ${q.art()}
                <button class="listen" data-action="speak-word" data-word="${q.word}">${I.speaker(14)} 点我听发音</button>
              </div>
              <div class="repeat-word"><b>${q.word}</b><span>${q.phon || ""}</span><i>大声读三遍，点下面完成</i></div>`,
            btn: revealed ? `<button class="btn" data-action="next">${quiz.index >= total - 1 || quiz.hearts <= 0 ? "查看成绩" : "下一题"} ${I.arrow(18)}</button>`
              : `<button class="btn" data-action="repeat-done">我读好了 ${I.arrow(18)}</button>`,
          };
        },
        onDone() {
          if (!quiz || quiz.revealed) return;
          const q = quiz.order[quiz.index];
          quiz.revealed = true;
          quiz.choiceCorrect = true;
          quiz.correct++;
          quiz.combo++;
          quiz.words.push(q.word);
          sfx("correct");
          render();
          setTimer(() => nextQuestion(), 1400);
        },
      },
      dialog: {
        label: "情景对话",
        title: "读对话，选出正确的单词",
        build(task, pool) {
          buildOptions(task, pool, 3);
        },
        render({ q, quiz, choiceButton, options }) {
          const revealed = quiz.revealed;
          return {
            body: `<div class="dialog-card">
                <div class="dlg"><span class="who">A</span><p>${q.dlgQ}</p><span class="dlg-pic">${q.art()}</span></div>
                <div class="dlg me"><span class="who">B</span><p>${q.dlgA.replace("{word}", `<b class="blank">${revealed ? q.word : "＿＿"}</b>`)}</p></div>
              </div>
              <div class="listen-row">${listenPill()}</div>
              <div class="options one-col">${options(q.options)}</div>`,
            btn: choiceButton("选一个单词"),
          };
        },
      },
    };
  }

  window.defineDinoTheme = function defineDinoTheme(config) {
    const levelGames = defaultLevelGames();
    Object.keys(config.levelGames || {}).forEach((level) => {
      const plan = config.levelGames[level];
      levelGames[level] = Array.isArray(plan) ? [...plan] : plan;
    });

    const games = defaultGames();
    Object.keys(config.games || {}).forEach((type) => {
      games[type] = { ...games[type], ...config.games[type] };
    });

    const theme = {
      isTheme: true,
      words: [],
      ...config,
      levelGames,
      games,
    };
    window.DINO_WORD_SETS = window.DINO_WORD_SETS || [];
    window.DINO_WORD_SETS.push(theme);
    return theme;
  };
})();

        ${nodes}
        <div class="mnode chest" style="left:${chestPos.left}%;top:${chestTop}%">

        <div class="mnode chest" style="left:${chestPos.left}%;top:${chestTop}%">
          <div class="disc">🎂</div></div>`;

  <script>
/* DinoGo · 音效、语音与关卡提示音（Web Audio 实时合成，无需音频素材） */

let audioCtx = null;

/* 音高表：音效、关卡提示音与背景音乐共用 */
const NOTE_FREQ = {
  C3: 130.81, D3: 146.83, E3: 164.81, F3: 174.61, G3: 196.0, A3: 220.0, B3: 246.94,
  C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.0, A4: 440.0, B4: 493.88,
  C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880.0, B5: 987.77,
  C6: 1046.5, D6: 1174.66, E6: 1318.5,
};

/* 首次交互时创建 / 唤醒音频上下文（iOS 要求） */
function ensureAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}

/* 播放一个音：类型、音量、延迟与输出目标均可配置 */
function tone(freq, dur = 0.12, type = "sine", vol = 0.05, delay = 0, dest = null) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(gain).connect(dest || audioCtx.destination);
  osc.start(t);
  osc.stop(t + dur + 0.02);
}

/* 界面音效 */
function sfx(name) {
  if (!state.sound) return;
  try {
    ensureAudio();
    if (name === "tap") tone(520, 0.05, "sine", 0.025);
    else if (name === "correct") { tone(660, 0.12, "sine", 0.05); tone(880, 0.16, "sine", 0.05, 0.1); }
    else if (name === "wrong") { tone(190, 0.2, "sawtooth", 0.035); tone(150, 0.24, "sawtooth", 0.03, 0.12); }
    else if (name === "coin") { tone(988, 0.08, "triangle", 0.05); tone(1318, 0.14, "triangle", 0.045, 0.07); }
    else if (name === "star") { tone(740, 0.1, "sine", 0.05); tone(1108, 0.14, "sine", 0.04, 0.09); }
    else if (name === "evolve") { [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, 0.24, "triangle", 0.05, i * 0.13)); }
    else if (name === "win") { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.3, "sine", 0.045, i * 0.1)); }
  } catch (e) { /* no audio */ }
}

/* 英文单词朗读：朗读期间暂停背景音乐，读完恢复 */
function speak(text) {
  try {
    if (!("speechSynthesis" in window)) {
      if (typeof toast === "function") toast("当前浏览器不支持发音");
      return;
    }
    const synth = window.speechSynthesis;
    const duck = typeof duckMusic === "function";
    if (duck) duckMusic();
    let released = false;
    const release = () => {
      if (released) return;
      released = true;
      if (duck) unduckMusic();
    };
    const say = () => {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      u.rate = 0.82;
      u.pitch = 1.08;
      u.onend = release;
      u.onerror = release;
      synth.speak(u);
    };
    /* 先停掉上一段朗读；连续点击时立即 speak 会被部分浏览器丢弃，稍作延迟 */
    if (synth.speaking || synth.pending) {
      synth.cancel();
      setTimeout(say, 60);
    } else {
      say();
    }
    /* 兜底：个别浏览器不触发 onend，避免背景音乐一直停着 */
    setTimeout(release, Math.min(15000, 4000 + text.length * 300));
  } catch (e) { /* ignore */ }
}

/* 关卡提示音：进入某主题关卡时播放的短旋律 */
const LEVEL_CUES = {
  food: [
    [NOTE_FREQ.E6, 0.1, "sine", 0.045, 0], [NOTE_FREQ.G5, 0.16, "sine", 0.04, 0.08],
    [NOTE_FREQ.C5, 0.14, "triangle", 0.045, 0.3], [NOTE_FREQ.E5, 0.14, "triangle", 0.045, 0.42],
    [NOTE_FREQ.G5, 0.14, "triangle", 0.045, 0.54], [NOTE_FREQ.C6, 0.32, "triangle", 0.045, 0.66],
  ],
  travel: [
    [392, 0.12, "square", 0.028, 0], [392, 0.12, "square", 0.028, 0.2],
    [NOTE_FREQ.C5, 0.14, "triangle", 0.05, 0.4], [NOTE_FREQ.E5, 0.14, "triangle", 0.05, 0.52],
    [NOTE_FREQ.G5, 0.3, "triangle", 0.05, 0.64],
  ],
  animal: [
    [110, 0.2, "triangle", 0.05, 0], [NOTE_FREQ.D5, 0.16, "triangle", 0.045, 0.18],
    [NOTE_FREQ.F5, 0.16, "triangle", 0.045, 0.3], [NOTE_FREQ.A5, 0.16, "triangle", 0.045, 0.42],
    [NOTE_FREQ.D6, 0.34, "triangle", 0.04, 0.54],
  ],
};

function levelCue(id) {
  if (!state.sound) return;
  try {
    ensureAudio();
    if (!audioCtx) return;
    (LEVEL_CUES[id] || LEVEL_CUES.fruit).forEach(([f, d, type, vol, delay]) => tone(f, d, type, vol, delay));
  } catch (e) { /* no audio */ }
}

function birdChirp(delay, dest) {

    const t = audioCtx.currentTime + delay + i * 0.16;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(1900, t);
    osc.frequency.exponentialRampToValueAtTime(2700, t + 0.07);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.008, t + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);

  tone(392, 0.18, "triangle", 0.01, delay, dest);
  tone(523.25, 0.24, "triangle", 0.009, delay + 0.2, dest);
}
function shopBell(delay, dest) {
  tone(1568, 0.4, "sine", 0.008, delay, dest);
  tone(2093, 0.32, "sine", 0.005, delay + 0.02, dest);
}

function stopMusic() {
  if (musicTimer) clearTimeout(musicTimer);
  musicTimer = null;
  musicId = null;
  musicPaused = false;
  duckCount = 0;
  if (musicGain && audioCtx) {
    /* 短暂淡出后断开，已排入队列的音符随节点一起静音 */
    const old = musicGain;
    musicGain = null;
    try {
      old.gain.setValueAtTime(old.gain.value || 1, audioCtx.currentTime);
      old.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 0.18);
      setTimeout(() => { try { old.disconnect(); } catch (e) { /* ignore */ } }, 320);
    } catch (e) { /* ignore */ }

  if (!state.sound) { stopMusic(); return; }
  if (musicId === id && musicTimer) return;
  const ducked = duckCount > 0;
  stopMusic();
  ensureAudio();
  if (!audioCtx) return;
  const cfg = THEME_MUSIC[id] || THEME_MUSIC.food;
  musicId = id;
  duckCount = ducked ? 1 : 0;
  musicGain = audioCtx.createGain();
  musicGain.gain.value = ducked ? 0.0001 : 1;
  musicPaused = ducked;

    if (musicId !== id || !audioCtx || !dest) return;

    let arpTime = 0;
    cfg.arp.forEach(([notes, beats]) => {
      const step = beat * 0.5;
      const steps = Math.round((beats * beat) / step);
      for (let i = 0; i < steps; i++) {
        const note = notes[i % notes.length];
        const vol = i % 4 === 0 ? 0.0065 : 0.0042;
        tone(NOTE_FREQ[note], step * 0.92, "sine", vol, arpTime + i * step, dest);

      arpTime += beats * beat;

    if (cfg.ambient === "bird") birdChirp(beat * cfg.ambientAt, dest);
    else if (cfg.ambient === "call") animalCall(beat * cfg.ambientAt, dest);

    musicTimer = setTimeout(run, Math.max(mel, bass) * 1000);

/* 背景音乐：只在乐园 / 词汇 / 小铺页面播放当前主题的 BGM */
const BGM_SCREENS = ["home", "words", "shop"];
function syncMusic(screen, themeId) {
  if (BGM_SCREENS.includes(screen)) playMusic(themeId);

/* 闯关相关页面：地图、答题、结算、进化全部保持静音 */
const LEVEL_SCREENS = ["map", "quiz", "result", "evolution"];

/* 按页面类型统一同步音乐：闯关流程不播放背景音乐，其它页面走背景音乐 */
function syncAudio(screen, themeId) {
  if (LEVEL_SCREENS.includes(screen)) stopMusic();
  else syncMusic(screen, themeId);
}

/* 朗读 / 跟读时临时暂停背景音乐：只在乐园、词汇、小铺页面生效 */
function pauseMusic() {
  if (!musicGain || !audioCtx || musicPaused) return;
  musicPaused = true;
  try {
    const t = audioCtx.currentTime;
    musicGain.gain.cancelScheduledValues(t);
    musicGain.gain.setValueAtTime(Math.max(0.0001, musicGain.gain.value), t);
    musicGain.gain.linearRampToValueAtTime(0.0001, t + 0.15);
  } catch (e) { /* ignore */ }
}
function resumeMusic() {
  if (!musicGain || !audioCtx || !musicPaused) return;
  musicPaused = false;
  try {
    const t = audioCtx.currentTime;
    musicGain.gain.cancelScheduledValues(t);
    musicGain.gain.setValueAtTime(Math.max(0.0001, musicGain.gain.value), t);
    musicGain.gain.linearRampToValueAtTime(1, t + 0.25);
  } catch (e) { /* ignore */ }
}
function duckMusic() {
  if (!BGM_SCREENS.includes(current)) return;
  duckCount++;
  if (duckCount === 1) pauseMusic();
}
function unduckMusic() {
  if (duckCount === 0) return;
  duckCount--;
  if (duckCount === 0) resumeMusic();
}

function isStandaloneMode() {

/* ============================================================

   ============================================================ */

/* ------------------------------------------------ render */
/* 页面渲染表在 boot() 里装配，保证四个 Tab 文件都已加载 */
let SCREEN_FN = {};
function render() {
  const fn = SCREEN_FN[current] || screenHome;
  $("#view").innerHTML = fn();
  if (current === "home") fitHomeWord();
  syncAudio(current, state.theme);
}

/* ------------------------------------------------ boot */
function boot() {
  SCREEN_FN = {
    home: screenHome,
    map: screenMap,
    quiz: screenQuiz,
    result: screenResult,
    evolution: screenEvolution,
    shop: screenShop,
    words: screenWords,
    profile: screenProfile,
  };
  try {
    if (!history.state || !history.state.screen) history.replaceState({ screen: "home" }, "");
    else current = history.state.screen;
  } catch (e) { current = "home"; }

  // Quiz, result and evolution screens require runtime context.
  if (!screenContextValid(current)) current = "home";
  /* 旧存档里的“图鉴”Tab 已并入小铺 → 图鉴 */
  if (current === "dex") { current = "shop"; shopTab = "dex"; }

  render();

  // Warm up the audio graph on the first touch (iOS requirement).
  const wake = () => { ensureAudio(); syncAudio(current, state.theme); document.removeEventListener("touchstart", wake); document.removeEventListener("click", wake); };
  document.addEventListener("touchstart", wake, { passive: true });
  document.addEventListener("click", wake);

  // iOS install hint — only once, and only in Safari (not standalone).
  const ios = isIOSDevice();
  const standalone = isStandaloneMode();
  let seen = false;
  try { seen = localStorage.getItem("dinogo.installHint") === "1"; } catch (e) {}
  if (ios && !standalone && !seen) {

      toast("提示：分享 → 添加到主屏幕，可全屏离线玩");
    }, 2400);
  }
}

/* PWA: cache the app for offline use when served over http(s). */
if ("serviceWorker" in navigator && !window.__DINOGO_SINGLE__ && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});

  <script>
/* ============================================================
   DinoGo · 恐龙英语 — 游戏流程
   包含公共答题流程、闯关结算和恐龙进化
   ============================================================ */

function levelPlan(level) {
  const plans = currentTheme().levelGames || {};
  return plans[level] || plans[10];
}

const UNKNOWN_ART = () => emojiArt("❓");
let artMap = null;
/* 当前主题的「单词 → 插图」索引，避免每个选项都线性查找 */
function artOf(word) {
  const theme = currentTheme();
  if (!artMap || artMap.id !== theme.id) {
    artMap = { id: theme.id, map: new Map(theme.words.map((w) => [w.word, w.art])) };
  }
  return artMap.map.get(word) || UNKNOWN_ART;
}

function buildTasks(level) {
  const theme = currentTheme();
  const pool = theme.words;
  const picks = shuffle(pool);
  const dlg = theme.dialog || { q: "What's this?", a: "It's a {word}." };
  return levelPlan(level).map((type, i) => {
    const w = picks[i % picks.length];
    const task = { type, word: w.word, art: w.art, phon: w.phon, dlgQ: dlg.q, dlgA: dlg.a };
    const game = theme.games[type];
    if (game.build) game.build(task, pool);
    return task;
  });
}

function startQuiz(level) {
  const lvl = Math.min(LEVELS_PER_THEME, Math.max(1, Number(level) || themeProgress().level));
  quiz = {
    level: lvl,
    index: 0,
    correct: 0,
    hearts: 3,
    combo: 0,
    selected: null,
    revealed: false,
    choiceCorrect: null,
    matched: [],
    pickWord: null,
    matchWrong: 0,
    startedAt: Date.now(),
    words: [],
    order: buildTasks(lvl),
  };
  lastResult = null;
  levelCue(currentTheme().id);
  go("quiz");
  speakTask();
}

const FX_COLORS = ["#FFC94A", "#FF8A4C", "#5BC178", "#5FBCDA", "#FF6F61", "#B8E05A"];
/* 答对：全屏庆祝特效 */
function correctFx(combo) {
  const confetti = Array.from({ length: 18 }, (_, i) => {
    const left = 5 + Math.round(Math.random() * 90);
    const delay = (Math.random() * 0.45).toFixed(2);
    const dur = (1.05 + Math.random() * 0.6).toFixed(2);

    const round = i % 3 === 0 ? "50%" : "2px";
    return `<i style="left:${left}%;width:${size}px;height:${size}px;background:${FX_COLORS[i % FX_COLORS.length]};border-radius:${round};animation-delay:${delay}s;animation-duration:${dur}s"></i>`;
  }).join("");
  return `<div class="qfx ok-fx" aria-hidden="true">
    <div class="fx-confetti">${confetti}</div>
    <div class="fx-badge">
      <span class="fx-check">${I.check(28)}</span>

}
/* 答错：醒目的正确答案提示 */
function wrongFx(word) {
  return `<div class="qfx bad-fx" aria-hidden="true">
    <div class="fx-wrong">
      <span class="fx-wrong-ic">✕</span>
      <div class="fx-wrong-txt">
        <b>${word ? "正确答案是" : "别灰心"}</b>
        <span>${word || "下一题继续加油"}</span>
      </div>
    </div>
  </div>`;
}

function screenQuiz() {
  if (!quiz) {
    setTimeout(() => go("home", { replace: true }), 0);
    return `<section class="screen"></section>`;
  }
  const total = quiz.order.length;
  const q = quiz.order[quiz.index];
  const game = currentTheme().games[q.type];
  const selected = quiz.selected;
  const revealed = quiz.revealed;
  const hearts = [0, 1, 2].map((i) => I.heart(16, "#FF6F61", i < quiz.hearts ? 1 : 0.22)).join("");
  const letters = ["A", "B", "C", "D"];
  const optionClass = (opt, base = "option") => {
    if (revealed) {
      if (opt === q.word) return `${base} correct`;
      if (opt === selected) return `${base} wrong`;
      return `${base} dim`;
    }
    return opt === selected ? `${base} sel` : base;
  };
  const choiceButton = (emptyLabel) => {
    const nextLabel = quiz.index >= total - 1 || quiz.hearts <= 0 ? "查看成绩" : "下一题";
    if (!selected) return `<button class="btn" disabled>${emptyLabel} ${I.arrow(18)}</button>`;
    if (!revealed) return `<button class="btn" data-action="check">检查答案 ${I.arrow(18)}</button>`;
    return `<button class="btn" data-action="next">${nextLabel} ${I.arrow(18)}</button>`;
  };
  const options = (list) => list.map((opt, i) => {
    const cls = optionClass(opt);
    const mark = revealed && opt === q.word ? `<span class="mark">${I.check(11)}</span>`
      : !revealed && opt === selected ? `<span class="mark radio"><i></i></span>` : "";
    return `<button class="${cls}" data-action="select" data-word="${opt}">
      <span class="key">${letters[i]}</span><span class="word">${opt}</span>${mark}

  }).join("");
  const view = game.render({ q, quiz, total, optionClass, choiceButton, options, letters, artOf });
  let combo;
  if (revealed) {
    combo = quiz.choiceCorrect
      ? `太棒了！连对 <b>${quiz.combo}</b> 题`
      : `答错啦，正确答案是 <b>${q.word}</b>`;
  } else if (quiz.combo >= 2) {
    combo = `连对 <b>${quiz.combo}</b> 题 · 保持节奏！`;
  } else {
    combo = `连续答对 3 题，可以拿到更多星星`;

  return `<section class="screen quiz-page" data-screen="quiz">
    ${fx}
    <div class="quiz-top">
      <button class="circle-btn" data-action="close-quiz" aria-label="退出闯关">${I.close(16)}</button>
      <div class="bar qbar"><i style="width:${Math.round((quiz.index / total) * 100)}%"></i></div>
      <div class="qcount num">${quiz.index + 1} <em>/ ${total}</em></div>
      <div class="hearts">${hearts}</div>
    </div>
    <div class="quiz-body">
      <div class="quiz-prompt">
        <div class="chip">LEVEL ${String(quiz.level).padStart(2, "0")} · ${game.label}</div>
        <h2>${game.title}</h2>
      </div>
      ${view.body}
    </div>
    <div class="quiz-foot">
      <div class="combo${revealed ? (quiz.choiceCorrect ? " good" : " bad") : ""}">${revealed ? (quiz.choiceCorrect ? star(15) : I.info(15)) : I.flame(13)} ${combo}</div>
      ${view.btn}
    </div>
  </section>`;
}

function speakTask() {
  const q = quiz && quiz.order[quiz.index];
  if (q && currentTheme().games[q.type].autoSpeak) setTimer(() => speak(q.word), 450);
}
function selectOption(word) {
  if (!quiz || quiz.revealed) return;
  quiz.selected = word;
  sfx("tap");
  render();
}
/* 听发音按钮：沿用原「答完听发音」的位置 */
function listenPill() {
  return `<button class="listen" data-action="listen-selected" aria-label="听发音">${I.speaker(14)} 听发音</button>`;
}
/* 听发音：需先点击选项，答题后朗读正确答案 */
function listenSelected() {
  if (!quiz) return;
  const q = quiz.order[quiz.index];
  const word = quiz.revealed ? q.word : quiz.selected || quiz.pickWord;
  if (!word) return;

}
function callGameAction(action, value) {
  const q = quiz && quiz.order[quiz.index];
  const game = q && currentTheme().games[q.type];
  if (game && game[action]) game[action](value);
}
function matchPickWord(word) { callGameAction("onPickWord", word); }
function matchPickArt(word) { callGameAction("onPickArt", word); }
function repeatDone() { callGameAction("onDone"); }
function checkAnswer() {
  if (!quiz || quiz.revealed || !quiz.selected) return;
  const q = quiz.order[quiz.index];
  const ok = quiz.selected === q.word;
  quiz.revealed = true;
  quiz.choiceCorrect = ok;
  if (ok) {
    quiz.correct++;
    quiz.combo++;
    quiz.words.push(q.word);
    sfx("correct");
  } else {
    quiz.hearts = Math.max(0, quiz.hearts - 1);
    quiz.combo = 0;
    sfx("wrong");
  }
  render();
  if (quiz && (quiz.index >= quiz.order.length - 1 || quiz.hearts <= 0)) {
    setTimer(() => nextQuestion(), 1800);
  } else {
    setTimer(() => nextQuestion(), 2200);

}
function nextQuestion() {
  if (!quiz) return;
  clearTimers();
  if (quiz.index >= quiz.order.length - 1 || quiz.hearts <= 0) { finishQuiz(); return; }
  quiz.index++;
  quiz.selected = null;
  quiz.revealed = false;
  quiz.choiceCorrect = null;
  quiz.matched = [];
  quiz.pickWord = null;
  quiz.matchWrong = 0;

}

function finishQuiz() {
  if (!quiz) return;
  const total = quiz.order.length;
  const accuracy = quiz.correct / total;
  /* 答对 3 题 1 星、4 题 2 星、5 题 3 星；2 星及以上才解锁下一关 */
  const stars = quiz.correct >= total ? 3 : quiz.correct >= total - 1 ? 2 : quiz.correct >= total - 2 ? 1 : 0;
  const passed = stars >= PASS_STARS;
  const growthGain = quiz.correct * 24;
  const prog = themeProgress();
  const completedLevel = quiz.level;
  const prevBest = prog.stars[completedLevel] || 0;
  const best = Math.max(prevBest, stars);
  /* 按最高星结算：重复复习只补发「刷新纪录」的差额星星 */
  const starGain = Math.max(0, best - prevBest);
  const isReplay = completedLevel < prog.level;
  const elapsed = Math.max(5, Math.round((Date.now() - quiz.startedAt) / 1000));
  state.growth += growthGain;
  state.stars += starGain;
  prog.stars[completedLevel] = best;
  /* 只有挑战当前关卡且达到 2 星才推进进度，复习旧关卡不影响进度 */
  if (passed && !isReplay) prog.level = Math.min(LEVELS_PER_THEME, completedLevel + 1);
  state.words += quiz.correct;
  state.minutes += Math.max(1, Math.round(elapsed / 60));
  state.threeStars += stars === 3 ? 1 : 0;
  state.tasks.level = true;
  recordLevel(stars);
  const target = stageForGrowth(state.growth);
  const canEvolve = stageIndex(target.key) > stageIndex(state.stage);
  lastResult = {
    level: completedLevel,
    replay: isReplay,
    prevBest,
    best,
    correct: quiz.correct,
    total,
    accuracy: Math.round(accuracy * 100),
    stars,
    passed,
    growthGain,
    starGain,
    seconds: elapsed,
    newWords: quiz.correct,
    canEvolve,
    targetStage: target.key,
    wordList: [...new Set(quiz.words)].slice(0, 3),

  save();

}

function screenResult() {
  if (!lastResult) {
    setTimeout(() => go("home", { replace: true }), 0);

  }
  const r = lastResult;
  const st = stageMeta(state.stage);
  const next = nextStage(st.key);

  const starRow = [0, 1, 2].map((i) => star(i === 1 ? 80 : 62, i < r.best ? "#FFC94A" : "#F1E7D2", i < r.best ? "#E9A93C" : "#E5D7BC", i < r.best ? 1 : 0.55)).join("");
  const confettiPieces = Array.from({ length: 26 }, (_, i) => {
    const colors = ["#FFC94A", "#FF8A4C", "#5BC178", "#9FDCF2", "#B8A7FF", "#FF6F61"];

    return `<i style="left:${(i * 37 + 13) % 100}%;top:${(i * 29 + 5) % 92}%;width:${w}px;height:${h}px;background:${colors[i % 6]};transform:rotate(${(i * 47) % 180 - 90}deg);opacity:${0.35 + (i % 5) * 0.1};border-radius:${i % 3 === 0 ? "50%" : "2px"};animation-delay:${(i % 8) * 0.05}s;animation-duration:${1.2 + (i % 5) * 0.18}s"></i>`;

            <div class="gc-title">${pending ? `${st.name} <b>→</b> ${target.name}<span><b>可以进化啦！</b></span>` : next ? `再获得 <b>${Math.max(0, next.min - state.growth)}</b> 成长值<span>进化为 <b>${next.name}</b></span>` : "已经达到最高形态"}</div>
            <div class="gc-bar"><i style="width:${pending ? 100 : Math.round(pct * 100)}%"></i></div>

    </div>

}

function beginEvolution() {
  const from = stageMeta(state.stage);
  const to = stageForGrowth(state.growth);
  if (stageIndex(to.key) <= stageIndex(from.key)) {

  <script>
/* ============================================================
   DinoGo · 恐龙英语 — 乐园（home）
   底部 Tab 1：首页 + 成长档案 + 随机记单词弹层
   ============================================================ */

/* ------------------------------------------------ home */
let reviewWord = null;
let voiceRec = null;
let voiceChunks = [];
let voiceUrl = "";
let voiceTimer = null;

function resetVoice() {
  if (voiceTimer) { clearInterval(voiceTimer); voiceTimer = null; }
  if (voiceRec && voiceRec.state !== "inactive") {
    try { voiceRec.stop(); } catch (e) {}
  }
  voiceRec = null;
  voiceChunks = [];
  if (voiceUrl) { URL.revokeObjectURL(voiceUrl); voiceUrl = ""; }
}

function setRecBtn(label, recording) {
  const btn = $('[data-action="record-say"]');
  if (!btn) return;
  btn.classList.toggle("recording", !!recording);
  btn.innerHTML = recording ? `<span class="rec-dot"></span>${label}` : `${I.speaker(18)} ${label}`;
}

async function recordSay() {
  if (voiceRec && voiceRec.state === "recording") {
    if (voiceTimer) { clearInterval(voiceTimer); voiceTimer = null; }
    voiceRec.stop();
    return;
  }
  if (!navigator.mediaDevices || !window.MediaRecorder) { toast("当前浏览器不支持录音"); return; }
  setRecBtn("准备录音…", true);
  /* 跟读期间暂停背景音乐，录完恢复 */
  const duck = typeof duckMusic === "function";
  if (duck) duckMusic();
  let released = false;
  const release = () => {
    if (released) return;
    released = true;
    if (duck) unduckMusic();
  };
  setTimeout(release, 12000);
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    voiceChunks = [];
    voiceRec = new MediaRecorder(stream);
    voiceRec.ondataavailable = (e) => { if (e.data && e.data.size) voiceChunks.push(e.data); };
    voiceRec.onstop = () => {
      stream.getTracks().forEach((t) => t.stop());
      if (voiceUrl) URL.revokeObjectURL(voiceUrl);
      const blob = new Blob(voiceChunks, voiceRec.mimeType ? { type: voiceRec.mimeType } : {});
      voiceUrl = URL.createObjectURL(blob);
      setRecBtn("重新跟读", false);
      if (voiceTimer) { clearInterval(voiceTimer); voiceTimer = null; }
      toast("录好啦，点「回放声音」听一听");
      release();
    };
    voiceRec.start();
    let left = 5;
    setRecBtn(`录音中 ${left}s · 点击结束`, true);
    voiceTimer = setInterval(() => {
      left -= 1;
      if (left <= 0) {
        clearInterval(voiceTimer); voiceTimer = null;
        if (voiceRec && voiceRec.state === "recording") voiceRec.stop();
        return;
      }
      setRecBtn(`录音中 ${left}s · 点击结束`, true);
    }, 1000);
  } catch (e) {
    setRecBtn("跟着读", false);
    release();
    toast("无法使用麦克风，请允许录音权限");
  }
}

function playVoice() {
  if (!voiceUrl) { toast("还没有录音，先跟着读一次吧"); return; }
  const audio = new Audio(voiceUrl);
  /* 回放录音期间暂停背景音乐，播完恢复 */
  const duck = typeof duckMusic === "function";
  if (duck) duckMusic();
  let released = false;
  const release = () => {
    if (released) return;
    released = true;
    if (duck) unduckMusic();
  };
  audio.addEventListener("ended", release, { once: true });
  audio.addEventListener("error", release, { once: true });
  setTimeout(release, 12000);
  audio.play().catch(() => { release(); toast("播放失败，请再试一次"); });
}

/* 每日随机学单词按当前恐龙时期的词汇难度抽取：蛋/幼龙/少年龙 basic，成年龙/霸王龙 advance，超级霸王龙 pro */
function randomWord() {
  const level = stageMeta(state.stage).vocab || "basic";
  const pool = REVIEW_WORDS.filter((w) => (w.attrs || []).includes(level));
  const list = pool.length ? pool : REVIEW_WORDS;
  return list[Math.floor(Math.random() * list.length)];
}
function wordPosLabel(w) { return w.pos === "verb" ? "phr." : "n."; }

/* -------- 例句直接从单词自带的 example 字段取 --------
   REVIEW_WORDS 里的单词全部有人工 example（noun.js / verb.js） */
function generateExample(word) {
  const en = (word.example || "").replace(/\{word\}/gi, word.word);
  return { en, zh: "" };
}


function todayLevels() {
  return (state.log[dateKey()] || {}).levels || 0;
}
function streakDays() {
  let n = 0;
  const d = new Date();
  if (!(state.log[dateKey(d)] || {}).levels) d.setDate(d.getDate() - 1);
  while ((state.log[dateKey(d)] || {}).levels) {
    n++;
    d.setDate(d.getDate() - 1);
  }
  return n;
}
function tasksData(lv, streak) {
  return [
    { done: !!state.tasks.level, color: "orange", icon: I.flag, title: "完成 1 次闯关", sub: state.tasks.level ? "今日目标已达成" : "还差 1 次，约 3 分钟", reward: "+60 成长值" },
    { done: lv >= 1, color: "blue", icon: I.book, title: "学会 5 个新单词", sub: `已掌握 ${Math.min(5, lv * 5)} / 5 个`, reward: "+40 成长值" },
    { done: streak >= 7, color: "coral", icon: I.flame, title: "连续学习 7 天", sub: streak ? `已连续 ${streak} 天` : "今天开始计数", reward: "+20 星星" },
  ];
}

/* 长单词自适应缩放，避免文案溢出卡片 */
function fitHomeWord() {
  const el = document.querySelector(".w-word");
  if (!el) return;
  const box = el.closest(".w-main");
  el.style.fontSize = "";
  const base = parseFloat(getComputedStyle(el).fontSize) || 36;
  const avail = box.clientWidth;
  const need = el.scrollWidth;
  if (avail > 0 && need > avail) {
    el.style.fontSize = `${Math.max(18, Math.floor((base * avail) / need) - 1)}px`;
  }
}

function screenHome() {

  const dinoCls = state.stage === "ultra" ? "ultra" : "";
  return `<section class="screen has-tab" data-screen="home">
    <div class="scroll">
